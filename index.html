<script>

/* ===== V54: proteção global carregada antes do sistema ===== */
window.vzSecure = window.vzSecure || { painel:false, extrato:false };

window.vzAdminSenhaAtual = function(){
  try{return String(window.state?.config?.adminSenha || state?.config?.adminSenha || '1234').trim();}catch(e){return '1234';}
};

window.vzOpenSenhaModal = function(opts){
  opts = opts || {};
  let id = 'vzSenhaModal';
  let old = document.getElementById(id);
  if(old) old.remove();

  let div = document.createElement('div');
  div.className = 'vz-modal-bg';
  div.id = id;
  div.innerHTML = `
    <div class="vz-modal">
      <h2>${opts.titulo || 'Área protegida'}</h2>
      <p>${opts.texto || 'Digite a senha do administrador para visualizar essas informações.'}</p>
      <div class="field">
        <label>Senha do administrador</label>
        <div class="vz-pass-wrap">
          <input id="vzModalSenhaInput" type="password" placeholder="Digite a senha">
          <button type="button" onclick="vzToggleModalSenha()" title="Mostrar/ocultar senha"><i class="ti ti-eye"></i></button>
        </div>
      </div>
      <div id="vzModalErro" class="vz-auth-error">Senha incorreta.</div>
      <div class="vz-modal-actions">
        <button class="btn" onclick="document.getElementById('vzSenhaModal')?.remove()">Cancelar</button>
        <button class="btn primary" onclick="vzConfirmarSenhaModal('${opts.tipo || 'painel'}')"><i class="ti ti-lock-open"></i> Liberar</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  setTimeout(()=>document.getElementById('vzModalSenhaInput')?.focus(),80);
  window.vzModalCallback = opts.callback || null;
};

window.vzToggleModalSenha = function(){
  let i = document.getElementById('vzModalSenhaInput');
  if(i) i.type = i.type === 'password' ? 'text' : 'password';
};

window.vzConfirmarSenhaModal = function(tipo){
  let input = document.getElementById('vzModalSenhaInput');
  let erro = document.getElementById('vzModalErro');
  let senha = String(input?.value || '').trim();
  if(senha !== vzAdminSenhaAtual()){
    if(erro) erro.style.display='block';
    return;
  }
  if(tipo === 'extrato') window.vzSecure.extrato = true;
  if(tipo === 'painel') window.vzSecure.painel = true;
  document.getElementById('vzSenhaModal')?.remove();

  if(typeof window.vzModalCallback === 'function'){
    let cb = window.vzModalCallback;
    window.vzModalCallback = null;
    cb();
  }else{
    try{ renderAll(); }catch(e){}
  }
};

window.vzBloqueioExtratoHTML = function(){
  return `<div class="vz-lock-card">
    <div class="lock-icon"><i class="ti ti-lock"></i></div>
    <h2>Extrato protegido</h2>
    <p class="muted">Para ver comissões, faturamento e histórico financeiro, libere com a senha do administrador.</p>
    <button class="btn primary" onclick="vzOpenSenhaModal({tipo:'extrato',titulo:'Liberar extrato',texto:'Digite a senha do administrador para abrir o extrato.',callback:function(){current='extrato';renderAll();}})">
      <i class="ti ti-eye"></i> Visualizar extrato
    </button>
  </div>`;
};

window.vzAbrirExtrato = function(){
  if(window.vzSecure.extrato){
    current='extrato';
    renderAll();
    return;
  }
  current='extrato';
  renderAll();
};

window.vzPainelValorProtegido = function(valor, label){
  if(window.vzSecure && window.vzSecure.painel){
    return `<div class="vz-secure-value"><b>${valor}</b></div><span>${label}</span>`;
  }
  return `<div class="vz-secure-value"><span class="vz-secure-mask">R$ ••••</span><button class="vz-eye-btn" onclick="vzOpenSenhaModal({tipo:'painel',titulo:'Visualizar faturamento',texto:'Digite a senha do administrador para liberar os valores de faturamento do painel.'})" title="Visualizar com senha"><i class="ti ti-eye"></i></button></div><span>${label}</span>`;
};

const SUPABASE_KEY='sb_publishable_KF5HCg_RbEchQ515dzU-uQ_Fnwrxc0s';

function clone(o){return JSON.parse(JSON.stringify(o))}function byId(id){return document.getElementById(id)}function show(el){if(el)el.classList.remove('hidden')}function hide(el){if(el)el.classList.add('hidden')}function uid(){state.seq=(state.seq||1)+1;return Date.now().toString(36)+state.seq.toString(36)}function today(){return new Date().toISOString().slice(0,10)}function nowHH(){return new Date().toTimeString().slice(0,5)}function num(v){return Number(v)||0}function brl(v){return 'R$ '+num(v).toFixed(2).replace('.',',')}function loadLocal(){try{return JSON.parse(localStorage.getItem('vz_state')||'null')}catch{return null}}function saveLocal(){localStorage.setItem('vz_state',JSON.stringify(state))}function normalize(){state={...clone(DEFAULT),...state};state.config={...DEFAULT.config,...(state.config||{})};state.horarios={...DEFAULT.horarios,...(state.horarios||{})};['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias','horariosEspeciais'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});if(!state.horariosEspeciais.length&&(state.horarios.premAlmocoIni||state.horarios.premNoiteIni)){state.horariosEspeciais=[{id:'almoco',nome:'Horário especial almoço',ini:state.horarios.premAlmocoIni||'11:30',fim:state.horarios.premAlmocoFim||'13:30',ativo:true},{id:'noite',nome:'Horário especial noite',ini:state.horarios.premNoiteIni||'19:00',fim:state.horarios.premNoiteFim||'22:00',ativo:true}].filter(x=>x.ini&&x.fim)}state.horariosEspeciais=state.horariosEspeciais.map(h=>({id:uid(),nome:'Horário especial',ini:'19:00',fim:'22:00',ativo:true,...h,ativo:h.ativo!==false}));state.profissionais=state.profissionais.map(p=>({id:uid(),nome:'',esp:'Barbeiro',telefone:'',foto:'',ativo:true,senha:'1234',comissao:60,...p,ativo:p.ativo!==false}));state.servicos=state.servicos.map(s=>({id:uid(),nome:'Serviço',precoFila:35,precoAgenda:40,precoPremium:50,durFila:20,durAgenda:30,durPremium:40,ativo:true,linkAtivo:true,...s,ativo:s.ativo!==false,linkAtivo:s.linkAtivo!==false}));state.clientes=state.clientes.map(c=>({id:uid(),nome:'',telefone:'',...c}));}
function hasRealData(s){return ['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias'].some(k=>Array.isArray(s?.[k])&&s[k].length>0)||!!s?.config?.logo}function toast(m){let d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
async function cloudGet(){const r=await fetch(REST,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw new Error(await r.text());const a=await r.json();return a[0]?.data||null}
async function cloudPut(){normalize();state.updatedAt=Date.now();saveLocal();const body={id:1,data:state,updated_at:new Date().toISOString()};let r=await fetch(REST,{method:'PATCH',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});if(!r.ok){r=await fetch(SUPABASE_URL+'/rest/v1/vizzarty_state',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text())}lastCloud=state.updatedAt;syncStatus.textContent='salvo na nuvem '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
async function syncNow(force=false){if(editing&&!force)return;if(dirty||force){try{await cloudPut();dirty=false;toast('Sincronizado')}catch(e){syncStatus.textContent='erro nuvem';toast('Erro de nuvem, salvo local')}}else{try{const c=await cloudGet();if(c&&num(c.updatedAt)>num(state.updatedAt)){state=c;normalize();saveLocal();renderAll()}syncStatus.textContent='nuvem ok'}catch(e){syncStatus.textContent='sem nuvem'}}}

function showLoginMsg(msg){
  let box=document.getElementById('loginMsg');
  if(box){
    box.textContent=msg;
    box.classList.remove('hidden');
  }else{
    toast(msg);
  }
}
function clearLoginMsg(){
  let box=document.getElementById('loginMsg');
  if(box){
    box.textContent='';
    box.classList.add('hidden');
  }
}
function doLogin(){
  try{
    clearLoginMsg();
    normalize();
    saveLocal();

    const role=(byId('loginRole')?.value||'admin');
    const pass=(byId('loginPass')?.value||'').trim();

    if(!pass){showLoginMsg('Digite a senha para entrar.');return;}

    if(role==='admin'){
      const adminPass=String(state.config?.adminSenha || '1234').trim();
      if(pass!==adminPass){showLoginMsg('Senha do administrador incorreta.');return;}
      session={role:'admin',nome:'Administrador',loginAt:Date.now()};
    }else{
      const profId=byId('loginProf')?.value||'';
      if(!profId){showLoginMsg('Selecione o profissional.');return;}
      const p=state.profissionais.find(x=>String(x.id)===String(profId));
      if(!p){showLoginMsg('Profissional não encontrado. Entre como admin e confira o cadastro.');return;}
      if(p.ativo===false){showLoginMsg('Esse profissional está desativado pelo administrador.');return;}
      const profPass=String(p.senha || '1234').trim();
      if(pass!==profPass){showLoginMsg('Senha do profissional incorreta.');return;}
      session={role:'prof',profId:p.id,nome:p.nome||'Profissional',loginAt:Date.now()};
    }

    localStorage.setItem('vz_session',JSON.stringify(session));
    hide(byId('loginBox'));
    show(byId('app'));
    renderAll();
    toast('Login realizado com sucesso');
  }catch(e){
    console.error('ERRO LOGIN:',e);
    showLoginMsg('Erro ao entrar: '+String(e.message||e));
  }
}
function logout(){
  localStorage.removeItem('vz_session');
  location.reload();
}
function renderLoginProfs(){
  try{
    const roleEl=byId('loginRole'), wrap=byId('loginProfWrap'), sel=byId('loginProf');
    if(!roleEl||!wrap||!sel)return;
    const isProf=roleEl.value==='prof';
    wrap.style.display=isProf?'block':'none';
    if(!isProf){sel.innerHTML='';clearLoginMsg();return;}
    normalize();
    const ativos=state.profissionais.filter(p=>p.ativo!==false);
    if(!ativos.length){
      sel.innerHTML='<option value="">Nenhum profissional ativo cadastrado</option>';
      showLoginMsg('Nenhum profissional ativo cadastrado. Entre como admin, cadastre o profissional, defina a senha e salve.');
      return;
    }
    sel.innerHTML='<option value="">Selecione o profissional</option>'+ativos.map(p=>`<option value="${p.id}">${p.nome||'Profissional sem nome'}</option>`).join('');
    clearLoginMsg();
  }catch(e){console.error('ERRO LISTA PROFISSIONAIS LOGIN:',e);}
}

function inRange(h,a,b){if(!a||!b)return true;return h>=a&&h<=b}function specialInfo(h){return (state.horariosEspeciais||[]).find(x=>x.ativo!==false&&inRange(h,x.ini,x.fim))||null}function isSpecialTime(h){return !!specialInfo(h)}function isEspecialTime(h){return isSpecialTime(h)}function tipoPreco(mode,h){if(mode==='especial'||mode==='especial')return 'especial';if(mode==='agendamento'&&isSpecialTime(h))return 'especial';return mode==='agendamento'?'agendamento':'fila'}function servicePrice(s,t){return (t==='especial'||t==='especial')?num(s.precoPremium):t==='agendamento'?num(s.precoAgenda):num(s.precoFila)}function serviceDur(s,t){return (t==='especial'||t==='especial')?num(s.durPremium):t==='agendamento'?num(s.durAgenda):num(s.durFila)}function servicosAtivos(){return state.servicos.filter(s=>s.ativo!==false)}function servicosLink(){return servicosAtivos().filter(s=>s.linkAtivo!==false)}function profsDisponiveis(data=today(),hora=''){return state.profissionais.filter(p=>p.ativo!==false&&!state.bloqueios.some(b=>String(b.profId)===String(p.id)&&b.data===data&&(!hora||inRange(hora,b.ini,b.fim))))}function waitMin(){return state.fila.filter(a=>a.tipo==='fila'&&a.status!=='concluido').reduce((s,a)=>s+num(a.tempoMin||20),0)}
function minNow(){let d=new Date();return d.getHours()*60+d.getMinutes()}
function overlapMin(aIni,aFim,bIni,bFim){return aIni<bFim&&bIni<aFim}

function busyIntervals(data,profId=''){
  let out=[];
  let hoje=today();
  let filaAberta=state.fila.filter(a=>a.tipo==='fila'&&a.status!=='concluido'&&(!a.data||a.data===hoje));
  if(data===hoje&&filaAberta.length){
    let ini=minNow(),dur=filaAberta.reduce((s,a)=>s+num(a.tempoMin||20),0);
    out.push({ini,fim:ini+dur,motivo:'ordem de chegada'});
  }
  state.fila.filter(a=>a.status!=='concluido'&&a.tipo!=='fila'&&a.data===data&&sameProfSlot(a,profId)).forEach(a=>{
    let ini=toMin(a.hora||'00:00'),dur=num(a.tempoMin||20)||20;
    out.push({ini,fim:ini+dur,motivo:'agendamento'});
  });
  return out;
}
function isSlotLivre(data,hora,dur=20,profId=''){
  if(!data||!hora)return false;
  let ini=toMin(hora),fim=ini+(num(dur)||20);
  if(data===today()&&ini<minNow())return false;
  return !busyIntervals(data,profId).some(b=>overlapMin(ini,fim,b.ini,b.fim));
}
function freeSlotsFor(data,servId,profId=''){
  let s=state.servicos.find(x=>String(x.id)===String(servId));
  return agendaSlots().filter(h=>isSlotLivre(data,h,serviceDur(s||{},tipoPreco('agendamento',h))||20,profId));
}

ass="card"><h2>Horários especiais</h2><p class="muted">Crie vários horários especiais com nomes diferentes. Quando estiver ativo, aparece no link do cliente e usa o valor/duração de horário especial.</p><div class="grid g3"><div class="field"><label>Nome</label><input id="heNome" placeholder="Ex: Especial feriado"></div><div class="field"><label>Início</label><input id="heIni" type="time" value="19:00"></div><div class="field"><label>Fim</label><input id="heFim" type="time" value="22:00"></div></div><button class="btn primary" onclick="addHorarioEspecial()"><i class="ti ti-plus"></i>Adicionar horário especial</button>${(state.horariosEspeciais||[]).map(x=>`<div class="item"><div class="grid g4"><div class="field"><label>Nome</label><input id="he_nome_${x.id}" value="${String(x.nome||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Início</label><input id="he_ini_${x.id}" type="time" value="${x.ini||''}"></div><div class="field"><label>Fim</label><input id="he_fim_${x.id}" type="time" value="${x.fim||''}"></div><div class="field"><label>Status</label><select id="he_ativo_${x.id}"><option value="true" ${x.ativo!==false?'selected':''}>Ativo no link</option><option value="false" ${x.ativo===false?'selected':''}>Desativado</option></select></div></div><div class="row"><button class="btn small blue" onclick="saveHorarioEspecial('${x.id}')">Salvar</button><button class="btn small ${x.ativo===false?'good':'bad'}" onclick="toggleHorarioEspecial('${x.id}')">${x.ativo===false?'Ativar':'Desativar'}</button><button class="btn small bad" onclick="deleteHorarioEspecial('${x.id}')">Excluir</button></div></div>`).join('')}</div></div><div class="card"><h2>Senhas dos profissionais</h2><p class="muted">As senhas ficam ocultas. Para visualizar, clique no olho e confirme a senha do admin.</p>${state.profissionais.length?state.profissionais.map(p=>`<div class="config-prof-pass"><div><b>${p.nome||'Sem nome'}</b><div class="muted">${p.ativo===false?'Desativado':'Ativo'} ${p.telefone?'• '+p.telefone:''}</div></div><div class="field" style="margin:0"><label>Senha</label><div class="pass-wrap"><input id="cfg_prof_senha_${p.id}" type="password" value="${String(p.senha||'1234').replace(/"/g,'&quot;')}"><button class="btn small blue eye-btn" onclick="requestShowProfSenha('${p.id}')" title="Visualizar com senha admin"><i class="ti ti-eye"></i></button></div></div><button class="btn small primary" onclick="saveProfPassFromConfig('${p.id}')">Salvar senha</button></div>`).join(''):'<div class="muted">Nenhum profissional cadastrado.</div>'}</div><div class="card"><h2>Manutenção</h2><button class="btn blue" onclick="syncNow(true)">Forçar salvar na nuvem</button> <button class="btn bad" onclick="if(confirm('Limpar dados locais?')){localStorage.removeItem('vz_state');location.reload()}">Limpar local</button></div>`}async function saveConfig(){state.config.nome=cfgNome.value;state.config.telefone=cfgTel.value;state.config.endereco=cfgEnd.value;state.config.adminSenha=cfgSenha.value||'1234';let l=await fileData(cfgLogo.files[0]);if(l)state.config.logo=l;markDirty()}function saveLinkPublico(){state.config.linkFilaAtiva=linkFila.value==='true';state.config.linkAgendaAtiva=linkAgenda.value==='true';markDirty();toast('Link público atualizado')}function saveHorarios(){Object.assign(state.horarios,{filaIni:hf1.value,filaFim:hf2.value,agendaIni:ha1.value,agendaFim:ha2.value});markDirty()}function addHorarioEspecial(){let nome=heNome.value.trim(),ini=heIni.value,fim=heFim.value;if(!nome||!ini||!fim)return toast('Preencha nome, início e fim');state.horariosEspeciais.push({id:uid(),nome,ini,fim,ativo:true});markDirty()}function saveHorarioEspecial(id){let x=state.horariosEspeciais.find(h=>String(h.id)===String(id));if(!x)return;x.nome=document.getElementById('he_nome_'+id).value.trim()||'Horário especial';x.ini=document.getElementById('he_ini_'+id).value;x.fim=document.getElementById('he_fim_'+id).value;x.ativo=document.getElementById('he_ativo_'+id).value==='true';markDirty();toast('Horário especial salvo')}function toggleHorarioEspecial(id){let x=state.horariosEspeciais.find(h=>String(h.id)===String(id));if(!x)return;x.ativo=x.ativo===false;markDirty()}function deleteHorarioEspecial(id){if(!confirm('Excluir este horário especial?'))return;state.horariosEspeciais=state.horariosEspeciais.filter(h=>String(h.id)!==String(id));markDirty()}function bindForms(){document.querySelectorAll('.selCliente').forEach(sel=>sel.onchange=()=>{let c=state.clientes.find(c=>String(c.id)===sel.value),box=sel.closest('.card');if(c&&box){box.querySelector('.nomeAt').value=c.nome;box.querySelector('.telAt').value=c.telefone||''}});document.querySelectorAll('.tipoAt,.horaAt,.servAt').forEach(el=>el.onchange=()=>updatePreview(el.closest('.card')));document.querySelectorAll('.card').forEach(updatePreview)}function updatePreview(box){if(!box)return;let s=state.servicos.find(s=>String(s.id)===box.querySelector('.servAt')?.value);let tipo=tipoPreco(box.querySelector('.tipoAt')?.value||'fila',box.querySelector('.horaAt')?.value||nowHH());let pv=box.querySelector('.pricePreview'),tm=box.querySelector('.tempoAt');if(s&&pv)pv.textContent=`Valor: ${brl(servicePrice(s,tipo))} • Duração: ${serviceDur(s,tipo)} min`;if(s&&tm&&!document.activeElement.isSameNode(tm))tm.value=serviceDur(s,tipo)||20}
function toMin(h){let [a,b]=(h||'00:00').split(':').map(Number);return a*60+b}function toHH(m){m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function addSlots(arr,ini,fim,step=15){let a=toMin(ini),b=toMin(fim);if(!ini||!fim||b<a)return arr;for(let m=a;m<=b;m+=step){let h=toHH(m);if(!arr.includes(h))arr.push(h)}return arr.sort()}function agendaSlots(){let h=state.horarios||{},slots=[];if(state.config.linkAgendaAtiva!==false)addSlots(slots,h.agendaIni,h.agendaFim,15);(state.horariosEspeciais||[]).filter(x=>x.ativo!==false).forEach(x=>addSlots(slots,x.ini,x.fim,15));return slots}function publicServiceLabel(s,mode,h=nowHH()){if(mode==='fila')return `${s.nome} — fila ${brl(s.precoFila)}`;let sp=specialInfo(h);return `${s.nome} — ${sp?sp.nome+' '+brl(s.precoPremium):'agenda '+brl(s.precoAgenda)}`}function renderClient(){document.body.classList.add('client-mode');let opts=[];if(state.config.linkFilaAtiva!==false)opts.push(`<button id="btnFila" class="btn primary" onclick="clientForm('fila')">Ordem de chegada</button>`);if(state.config.linkAgendaAtiva!==false)opts.push(`<button id="btnAgenda" class="btn blue" onclick="clientForm('agendamento')">Agendamento</button>`);clientWrap.innerHTML=`<div class="brand"><div class="logo">${state.config.logo?`<img src="${state.config.logo}">`:'V'}</div><b>${state.config.nome}</b><small>Escolha seu atendimento</small></div><div class="card client-choice"><div class="grid g2">${opts.join('')||'<div class="muted">Atendimento pelo link temporariamente desativado.</div>'}</div></div><div id="cf"></div>`;if(state.config.linkFilaAtiva!==false)clientForm('fila');else if(state.config.linkAgendaAtiva!==false)clientForm('agendamento')}
function clientForm(mode){let slots=agendaSlots(),h=slots.includes(nowHH())?nowHH():(slots[0]||nowHH());let filaAberta=state.config.linkFilaAtiva!==false&&inRange(nowHH(),state.horarios.filaIni,state.horarios.filaFim);let desc=mode==='fila'?(filaAberta?'Ordem de chegada aberta agora • espera estimada: '+waitMin()+' min':'Ordem de chegada fechada agora. Horário: '+state.horarios.filaIni+' até '+state.horarios.filaFim):'Escolha apenas horários liberados nas configurações. Horário especial aparece automaticamente quando estiver ativo.';cf.innerHTML=`<div class="client-form-grid"><div class="card"><h2>${mode==='fila'?'Entrar por ordem de chegada':'Agendar horário'}</h2><p class="muted">${desc}</p><div class="field"><label>Nome</label><input id="pubNome" autocomplete="name"></div><div class="field"><label>WhatsApp</label><input id="pubTel" autocomplete="tel"></div><div class="grid g2"><div class="field"><label>Data</label><input id="pubData" type="date" value="${today()}" onchange="clientRefreshOptions('${mode}')"></div>${mode==='fila'?`<div class="field"><label>Horário</label><input value="Agora (${nowHH()})" disabled></div>`:`<div class="field"><label>Horário disponível</label><select id="pubHora" onchange="clientRefreshOptions('${mode}')">${slots.length?slots.map(x=>`<option value="${x}" ${x===h?'selected':''}>${x}${specialInfo(x)?' • '+specialInfo(x).nome:''}</option>`).join(''):'<option value="">Sem horários</option>'}</select></div>`}</div></div><div class="card"><h2>Serviço e profissional</h2><div class="field"><label>Serviço</label><select id="pubServ" onchange="clientPrice('${mode}')">${servicosLink().map(s=>`<option value="${s.id}">${publicServiceLabel(s,mode,h)}</option>`).join('')}</select><div class="muted" id="pubPrice"></div></div><div class="field"><label>Profissional</label><select id="pubProf"></select><div class="muted" id="profMsg"></div></div><div class="field"><label>Voucher</label><input id="pubVoucher" placeholder="Código se tiver"></div><button class="btn primary" style="width:100%;justify-content:center" onclick="clientAdd('${mode}')">Confirmar atendimento</button></div></div>`;clientRefreshOptions(mode)}
function clientRefreshOptions(mode){
  let data=pubData?.value||today(),oldProf=pubProf?.value||'',oldServ=pubServ?.value||'';
  let servSel=document.getElementById('pubServ');
  let horaAtual=mode==='fila'?nowHH():(pubHora?.value||nowHH());

  if(servSel){
    servSel.innerHTML=servicosLink().map(s=>`<option value="${s.id}" ${String(s.id)===oldServ?'selected':''}>${publicServiceLabel(s,mode,horaAtual)}</option>`).join('');
    if(oldServ&&[...servSel.options].some(o=>o.value===oldServ))servSel.value=oldServ;
  }

  let servId=servSel?.value||'';
  let horaBase=mode==='fila'?nowHH():(pubHora?.value||'');
  let list=profsDisponiveis(data,horaBase||nowHH());

  if(pubProf){
    pubProf.innerHTML='<option value="">Qualquer profissional</option>'+list.map(p=>`<option value="${p.id}" ${String(p.id)===oldProf?'selected':''}>${p.nome}</option>`).join('');
    if(oldProf&&[...pubProf.options].some(o=>o.value===oldProf))pubProf.value=oldProf;
  }

  if(mode!=='fila'&&pubHora){
    let slots=freeSlotsFor(data,servId,pubProf?.value||'');
    pubHora.innerHTML=slots.length?slots.map(x=>`<option value="${x}">${x}${specialInfo(x)?' • '+specialInfo(x).nome:''}</option>`).join(''):'<option value="">Sem horários livres</option>';
    if(slots.includes(horaBase))pubHora.value=horaBase;
  }

  let qtdSlots=mode==='fila'?'':` • ${freeSlotsFor(data,servId,pubProf?.value||'').length} horário(s) livre(s)`;
  if(profMsg)profMsg.textContent=list.length?`${list.length} profissional(is) disponível(is)${qtdSlots}`:'Nenhum profissional disponível neste horário';
  clientPrice(mode);

function profModeAllowed(p,mode){
  if(!p||p.ativo===false)return false;
  if(mode==='fila')return p.atendeFila!==false;
  if(mode==='agendamento')return p.atendeAgenda!==false;
  if(mode==='especial')return p.atendeEspecial!==false;
  return true;
}
function profHorarioOk(p,hora){
  if(!p||!hora)return true;
  return inRange(hora,p.atendeIni||'08:00',p.atendeFim||'18:30');
}
function modalidadeDisponivel(mode,hora=nowHH(),data=today()){
  if(mode==='fila'&&state.config.linkFilaAtiva===false)return false;
  if((mode==='agendamento'||mode==='especial')&&state.config.linkAgendaAtiva===false)return false;
  if(mode==='especial'&&!specialInfo(hora))return (state.horariosEspeciais||[]).some(h=>h.ativo!==false);
  return state.profissionais.some(p=>profModeAllowed(p,mode)&&profHorarioOk(p,hora)&&!state.bloqueios.some(b=>String(b.profId)===String(p.id)&&b.data===data&&(!hora||inRange(hora,b.ini,b.fim))));
}

function agendaSlots(mode='todos'){

function pctAtendimento(a){
  let p=state.profissionais.find(p=>String(p.id)===String(a.profId));

  if(a.comissaoPctAtendimento!==undefined && a.comissaoPctAtendimento!==null && a.comissaoPctAtendimento!=='')return num(a.comissaoPctAtendimento);

function mesAtualKey(){ return today().slice(0,7); }
function dataMesKey(d){ return String(d || today()).slice(0,7); }
function sindicatoQtdUsadaMes(mes=mesAtualKey()){
  let filaQtd = (state.fila||[]).filter(a=>a.sindicato===true && dataMesKey(a.data)===mes).length;
  let histQtd = (state.historico||[]).filter(a=>a.sindicato===true && dataMesKey(a.data)===mes).length;
  let vendasQtd = (state.vendasProdutos||[]).filter(v=>v.tipoVenda==='sindicato' && dataMesKey(v.data)===mes).reduce((s,v)=>s+(num(v.qtd)||1),0);
  return filaQtd + histQtd + vendasQtd;
}
function sindicatoLimiteRestante(){

/* ===== V42: saldo único do benefício mensal =====
   Regra: produto, serviço comum, corte pelo sindicato e link do cliente consomem a mesma quantidade disponível. */
function beneficioMesKey(d){return (d||today()).slice(0,7)}
function beneficioQtdItem(a){return Math.max(1,num(a?.beneficioQtd||1)||1)}
function beneficioQtdVenda(v){return Math.max(1,num(v?.qtd)||1)}
function beneficioUsaSaldo(x){return !!(x && (x.beneficioUsado===true || x.sindicato===true || x.tipoVenda==='sindicato'))}
function beneficioQtdUsadaMes(mes=beneficioMesKey(today())){
  let atendimentos=[...(state.fila||[]),...(state.historico||[]),...(state.pendencias||[])];
  let qtdAt=atendimentos.filter(a=>beneficioUsaSaldo(a) && beneficioMesKey(a.data)===mes).reduce((s,a)=>s+beneficioQtdItem(a),0);
  let qtdProd=(state.vendasProdutos||[]).filter(v=>beneficioUsaSaldo(v) && beneficioMesKey(v.data)===mes).reduce((s,v)=>s+beneficioQtdVenda(v),0);
  return qtdAt+qtdProd;
}

sindicatoQtdUsadaMes = function(mes=beneficioMesKey(today())){return beneficioQtdUsadaMes(mes)};
sindicatoLimiteRestante = function(){let limite=num(state.config.sindicatoLimiteMensal||0); if(!limite)return 999999; return Math.max(0,limite-beneficioQtdUsadaMes())};

function beneficioPodeUsar(qtd=1){return sindicatoLimiteRestante()>=Math.max(1,num(qtd)||1)}
function marcarBeneficio(obj,qtd=1){obj.beneficioUsado=true; obj.beneficioQtd=Math.max(1,num(qtd)||1); return obj;}

/* ===== V48: exclusão real do extrato + recálculo imediato de comissão/saldo ===== */
function v48Js(v){return JSON.stringify(String(v||''));}
function v48Q(x){return Math.max(1,num(x?.beneficioQtd||x?.qtd)||1);}
function v48RecalcularLancamentoVenda(v){
  if(!v)return v;
  v.qtd=v48Q(v);
  v.precoUnit=num(v.precoUnit);
  v.total=num(v.total)||v.precoUnit*v.qtd;
  v.comissaoPct=num(v.comissaoPct);
  v.comissaoValor=num(v.comissaoValor)||v.total*v.comissaoPct/100;
  if(beneficioUsaSaldo(v))v.beneficioQtd=v.qtd;
  return v;
}
function v48PersistirRecalcular(msg){
  try{ normalize(); }catch(e){}
  (state.vendasProdutos||[]).forEach(v48RecalcularLancamentoVenda);
  state.updatedAt=Date.now();
  dirty=true;
  saveLocal();
  try{ renderAll(); }catch(e){ console.error('Erro ao redesenhar após exclusão',e); }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>syncNow(true),250);
  toast(msg||'Excluído e recalculado.');
}
function excluirAtendimentoFinalizado(id){
  if(!canAdmin())return;
  id=String(id||'');
  let antes=(state.historico||[]).length;
  let a=(state.historico||[]).find(x=>String(x.id)===id);
  if(!a)return toast('Atendimento finalizado não encontrado no extrato.');
  let msg=`Excluir este serviço finalizado do extrato?\n\nCliente: ${a.nome||''}\nServiço: ${a.servNome||''}\nProfissional: ${a.profNome||''}\nData: ${a.data||''}\n\nA comissão e o saldo do benefício serão recalculados na hora.`;
  if(!confirm(msg))return;

   Regra: somente consome/diminui quantidade do sindicato quando for:
   1) atendimento com serviço realmente vinculado ao sindicato;
   2) produto/lançamento do tipo sindicato;
   3) pedido feito pelo link usando serviço do sindicato.
   Serviços/produtos normais nunca reduzem o saldo do sindicato.

    try{
      if(String(id||'')===String(typeof SIND_ID!=='undefined'?SIND_ID:'__sindicato_corte__')) return true;
      return !!(state.servicos||[]).find(s=>String(s.id)===String(id) && s.isSindicato===true);
    }catch(e){ return false; }

          a.beneficioUsado=true;
          a.beneficioQtd=q(a);

          delete a.beneficioUsado;
          delete a.beneficioQtd;
          if(a.sindicato!==true) a.sindicato=false;

/* ===== V58: extrato do profissional separado por sindicato, atendimentos/serviços e produtos ===== */
(function(){
  const V58='vizzarty_v58_extrato_profissional_separado';
  if(window[V58]) return;
  window[V58]=true;

  function ehAdminLogado(){ try{return typeof isAdmin==='function' && isAdmin();}catch(e){return false;} }
  function n(v){ return (typeof num==='function') ? num(v) : (Number(v)||0); }
  function dinheiro(v){ return (typeof brl==='function') ? brl(v) : ('R$ '+n(v).toFixed(2).replace('.',',')); }
  function q(v){ return Math.max(1,n(v?.beneficioQtd||v?.qtd)||1); }
  function atendimentoEhSindicato(a){
    try{ if(typeof window.v55AtendimentoSindicato==='function') return window.v55AtendimentoSindicato(a); }catch(e){}
    try{ if(typeof beneficioUsaSaldo==='function' && beneficioUsaSaldo(a)) return true; }catch(e){}
    return !!(a && (a.sindicato===true || a.beneficioUsado===true || String(a.servId)==='__sindicato_corte__'));
  }
  function vendaEhSindicato(v){
    try{ if(typeof window.v55VendaSindicato==='function') return window.v55VendaSindicato(v); }catch(e){}
    try{ if(typeof beneficioUsaSaldo==='function' && beneficioUsaSaldo(v)) return true; }catch(e){}
    return !!(v && (v.tipoVenda==='sindicato' || v.beneficioUsado===true || String(v.produtoId)==='__sindicato_corte__'));
  }
  function comAt(a){ try{return calcComissaoAtendimento(a);}catch(e){return n(a.valorFinal)*n(a.comissaoPctAtendimento||0)/100;} }
  function comVenda(v){ try{return calcComissaoVenda(v);}catch(e){return v.comissaoValor!==undefined?n(v.comissaoValor):n(v.total)*n(v.comissaoPct)/100;} }
  function pctAt(a){
    try{ if(typeof pctAtendimento==='function') return n(pctAtendimento(a)); }catch(e){}
    return n(a.comissaoPctAtendimento||0);
  }
  function resumoCard(titulo, qtdLabel, qtd, valor, comissao){
    return `<div class="stat"><b>${qtd}</b><span>${qtdLabel}</span></div><div class="stat"><b>${dinheiro(valor)}</b><span>Valor final ${titulo}</span></div><div class="stat"><b>${dinheiro(comissao)}</b><span>Comissão ${titulo}</span></div>`;
  }
  function tabelaAtendimentos(lista, titulo, vazio){
    const total=lista.reduce((s,a)=>s+n(a.valorFinal),0);
    const com=lista.reduce((s,a)=>s+comAt(a),0);
    const rows=lista.length?lista.slice().reverse().map(a=>`<tr><td>${a.data||''}</td><td>${a.nome||''}</td><td>${a.servNome||'Serviço'}</td><td>${dinheiro(a.valorFinal)}</td><td>${pctAt(a)||''}${pctAt(a)?'%':''}</td><td>${dinheiro(comAt(a))}</td></tr>`).join(''):`<tr><td colspan="6" class="muted">${vazio}</td></tr>`;
    return `<div class="card"><h2>${titulo}</h2><div class="statgrid" style="margin-bottom:10px"><div class="stat"><b>${lista.length}</b><span>Quantidade</span></div><div class="stat"><b>${dinheiro(total)}</b><span>Valor final</span></div><div class="stat"><b>${dinheiro(com)}</b><span>Comissão</span></div></div><table><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Valor final</th><th>%</th><th>Sua comissão</th></tr>${rows}</table></div>`;
  }
  function tabelaProdutos(lista, titulo, vazio){
    const qtd=lista.reduce((s,v)=>s+q(v),0);
    const total=lista.reduce((s,v)=>s+n(v.total),0);
    const com=lista.reduce((s,v)=>s+comVenda(v),0);
    const rows=lista.length?lista.slice().reverse().map(v=>`<tr><td>${v.data||''}</td><td>${v.produtoNome||'Produto'}</td><td>${q(v)}</td><td>${dinheiro(v.total)}</td><td>${n(v.comissaoPct)||''}${n(v.comissaoPct)?'%':''}</td><td>${dinheiro(comVenda(v))}</td></tr>`).join(''):`<tr><td colspan="6" class="muted">${vazio}</td></tr>`;
    return `<div class="card"><h2>${titulo}</h2><div class="statgrid" style="margin-bottom:10px"><div class="stat"><b>${qtd}</b><span>Quantidade</span></div><div class="stat"><b>${dinheiro(total)}</b><span>Valor final</span></div><div class="stat"><b>${dinheiro(com)}</b><span>Comissão</span></div></div><table><tr><th>Data</th><th>Item</th><th>Qtd</th><th>Valor final</th><th>%</th><th>Sua comissão</th></tr>${rows}</table></div>`;
  }

  const baseExtratoV58=window.extratoHTML;
  window.extratoHTML=function(){
    if(ehAdminLogado()) return (typeof baseExtratoV58==='function') ? baseExtratoV58() : '';
    const profId=window.session?.profId;
    const hist=(state.historico||[]).filter(a=>String(a.profId)===String(profId));
    const vendas=(state.vendasProdutos||[]).filter(v=>String(v.profId)===String(profId));

    const atendSind=hist.filter(atendimentoEhSindicato);
    const atendNormais=hist.filter(a=>!atendimentoEhSindicato(a));
    const vendaSind=vendas.filter(vendaEhSindicato);
    const prodNormais=vendas.filter(v=>!vendaEhSindicato(v));

    const sindicatoValor=atendSind.reduce((s,a)=>s+n(a.valorFinal),0)+vendaSind.reduce((s,v)=>s+n(v.total),0);
    const sindicatoCom=atendSind.reduce((s,a)=>s+comAt(a),0)+vendaSind.reduce((s,v)=>s+comVenda(v),0);
    const sindicatoQtd=atendSind.reduce((s,a)=>s+q(a),0)+vendaSind.reduce((s,v)=>s+q(v),0);

    const atendValor=atendNormais.reduce((s,a)=>s+n(a.valorFinal),0);
    const atendCom=atendNormais.reduce((s,a)=>s+comAt(a),0);
    const prodValor=prodNormais.reduce((s,v)=>s+n(v.total),0);
    const prodCom=prodNormais.reduce((s,v)=>s+comVenda(v),0);
    const prodQtd=prodNormais.reduce((s,v)=>s+q(v),0);

    const totalValor=sindicatoValor+atendValor+prodValor;
    const totalCom=sindicatoCom+atendCom+prodCom;

    return `<div class="statgrid"><div class="stat"><b>${dinheiro(totalValor)}</b><span>Valor final movimentado</span></div><div class="stat"><b>${dinheiro(totalCom)}</b><span>Total da sua comissão</span></div><div class="stat"><b>${sindicatoQtd}</b><span>Quantidade sindicato</span></div><div class="stat"><b>${prodQtd}</b><span>Produtos vendidos</span></div></div>
    <div class="card"><h2>Resumo do colaborador</h2><p class="muted">Este extrato mostra somente a sua parte: valor final registrado e comissão calculada por categoria. Valores da barbearia continuam restritos ao admin.</p><div class="statgrid">${resumoCard('sindicato','Qtd. sindicato',sindicatoQtd,sindicatoValor,sindicatoCom)}${resumoCard('atendimentos','Atendimentos',atendNormais.length,atendValor,atendCom)}${resumoCard('produtos','Produtos',prodQtd,prodValor,prodCom)}</div><div class="stat" style="margin-top:10px"><b>${dinheiro(totalCom)}</b><span>Soma total que ficou para o colaborador</span></div></div>
    ${tabelaAtendimentos(atendSind,'Sindicato: serviços/agendamentos vinculados','Nenhum atendimento sindicato encontrado.')}
    ${tabelaProdutos(vendaSind,'Sindicato: produtos/quantidade lançada','Nenhum produto ou quantidade sindicato lançada.')}
    ${tabelaAtendimentos(atendNormais,'Atendimentos e serviços normais','Nenhum atendimento normal encontrado.')}
    ${tabelaProdutos(prodNormais,'Produtos vendidos','Nenhum produto normal vendido.')}`;
  };
  try{ extratoHTML=window.extratoHTML; }catch(e){}

  const basePageV58=window.pageHTML;
  window.pageHTML=function(p){
    if(p==='extrato' && !ehAdminLogado()) return window.extratoHTML();
    return (typeof basePageV58==='function') ? basePageV58(p) : '';
  };
  try{ pageHTML=window.pageHTML; }catch(e){}

  try{ if(window.session && typeof renderAll==='function') renderAll(); }catch(e){}
  console.log('V58: extrato profissional separado por sindicato, atendimentos e produtos carregado.');
})();
// ===== FIM V58 =====


/* ===== V59: painel profissional sem contabilidade + extrato do profissional recalculado pelo histórico real ===== */
(function(){
  const V59='vizzarty_v59_painel_prof_extrato_corrigido';
  if(window[V59]) return;
  window[V59]=true;

  function ehAdmin(){ try{return typeof isAdmin==='function' && isAdmin();}catch(e){return false;} }
  function n(v){ try{return (typeof num==='function') ? num(v) : (Number(v)||0);}catch(e){return Number(v)||0;} }
  function dinheiro(v){ try{return (typeof brl==='function') ? brl(v) : ('R$ '+n(v).toFixed(2).replace('.',','));}catch(e){return 'R$ '+n(v).toFixed(2).replace('.',',');} }
  function profAtual(){ try{return (typeof currentProf==='function' && currentProf()) || (state.profissionais||[]).find(p=>String(p.id)===String(session?.profId));}catch(e){return null;} }
  function profIdAtual(){ return String((window.session&&session.profId)||''); }
  function mesmoProf(item){
    const p=profAtual();
    const pid=profIdAtual();
    if(!item) return false;
    if(pid && String(item.profId||'')===pid) return true;
    if(p && p.nome && String(item.profNome||'').trim().toLowerCase()===String(p.nome).trim().toLowerCase()) return true;
    return false;
  }
  function qtdItem(v){ return Math.max(1,n(v?.beneficioQtd||v?.qtd)||1); }
  function ehSindAt(a){
    try{ if(typeof window.v55AtendimentoSindicato==='function') return window.v55AtendimentoSindicato(a); }catch(e){}
    return !!(a && (a.sindicato===true || a.beneficioUsado===true || String(a.servId)==='__sindicato_corte__'));
  }
  function ehSindVenda(v){

/* ===== V62: contagem do sindicato 100% por palavra "sindicato" =====
   Regra pedida: só entra na contagem do sindicato quando o lançamento tiver a palavra
   "sindicato" escrita no serviço, produto, tipo, origem/link ou identificador.
   Produto comum, serviço comum e venda comum nunca consomem essa quantidade.
*/
(function(){
  const V62='vizzarty_v62_sindicato_por_texto';
  if(window[V62]) return;
  window[V62]=true;

  function n(v){ try{return (typeof num==='function')?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function mes(d){ return String(d || (typeof today==='function'?today():new Date().toISOString().slice(0,10))).slice(0,7); }
  function norm(v){ return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
  function temSindicatoTexto(x){
    if(!x) return false;
    const campos=[
      x.nome,x.servNome,x.produtoNome,x.tipoVenda,x.tipo,x.origem,x.categoria,x.obs,x.observacao,
      x.servId,x.produtoId,x.link,x.url,x.modalidade,x.descricao
    ];
    return campos.some(c=>norm(c).includes('sindicato'));
  }
  function qtd(x){ return Math.max(1,n(x?.beneficioQtd || x?.qtd || 1)||1); }
  function atSind(a){ return temSindicatoTexto(a); }
  function vendaSind(v){ return temSindicatoTexto(v); }
  function todosAtendimentos(){ return [...(state.fila||[]), ...(state.historico||[]), ...(state.pendencias||[])]; }

  function limparFlagsErradas(){
    try{
      todosAtendimentos().forEach(a=>{
        if(atSind(a)){
          a.sindicato=true;
          a.beneficioUsado=true;
          a.beneficioQtd=qtd(a);
        }else{
          a.sindicato=false;
          delete a.beneficioUsado;
          delete a.beneficioQtd;
          if(String(a.servId||'')==='__sindicato_corte__' && !temSindicatoTexto(a)) a.servId='';
        }
      });
      (state.vendasProdutos||[]).forEach(v=>{
        if(vendaSind(v)){
          v.tipoVenda='sindicato';
          v.beneficioUsado=true;
          v.beneficioQtd=qtd(v);
        }else{
          if(v.tipoVenda==='sindicato') v.tipoVenda='produto';
          delete v.beneficioUsado;
          delete v.beneficioQtd;
        }
      });
    }catch(e){ console.warn('V62 limpeza sindicato:',e); }
  }

  window.v62TemSindicatoTexto = temSindicatoTexto;
  window.v55AtendimentoSindicato = atSind;
  window.v55VendaSindicato = vendaSind;
  window.v49IsBeneficioLancamento = function(x){ return temSindicatoTexto(x); };
  window.beneficioUsaSaldo = function(x){ return temSindicatoTexto(x); };
  try{ beneficioUsaSaldo = window.beneficioUsaSaldo; }catch(e){}

  window.beneficioQtdUsadaMes = function(mesAlvo){
    mesAlvo = mesAlvo || mes();
    limparFlagsErradas();
    const qtdAt=todosAtendimentos().filter(a=>atSind(a) && mes(a.data)===mesAlvo).reduce((s,a)=>s+qtd(a),0);
    const qtdV=(state.vendasProdutos||[]).filter(v=>vendaSind(v) && mes(v.data)===mesAlvo).reduce((s,v)=>s+qtd(v),0);
    return qtdAt+qtdV;
  };
  window.sindicatoQtdUsadaMes = function(mesAlvo){ return window.beneficioQtdUsadaMes(mesAlvo); };
  window.sindicatoLimiteRestante = function(){
    const limite=n(state?.config?.sindicatoLimiteMensal||0);
    if(!limite) return 999999;
    return Math.max(0, limite-window.beneficioQtdUsadaMes());
  };
  window.beneficioPodeUsar = function(qtdNecessaria){ return window.sindicatoLimiteRestante() >= Math.max(1,n(qtdNecessaria)||1); };
  window.marcarBeneficio = function(obj,qtdNecessaria){
    if(obj && temSindicatoTexto(obj)){
      obj.sindicato = obj.servNome || obj.nome ? true : obj.sindicato;
      obj.tipoVenda = obj.produtoNome ? 'sindicato' : obj.tipoVenda;
      obj.beneficioUsado=true;
      obj.beneficioQtd=Math.max(1,n(qtdNecessaria)||1);
    }
    return obj;
  };

  window.sindicatoVendas = function(profId=''){
    return (state.vendasProdutos||[]).filter(v=>vendaSind(v) && (!profId || String(v.profId)===String(profId)));
  };
  window.vendasProdutoNormais = function(profId=''){
    return (state.vendasProdutos||[]).filter(v=>!vendaSind(v) && (!profId || String(v.profId)===String(profId)));
  };

  window.sindicatoStatusHTML = function(){
    const limite=n(state?.config?.sindicatoLimiteMensal||0), usado=window.beneficioQtdUsadaMes(), restante=window.sindicatoLimiteRestante();
    const status=state?.config?.sindicatoAtivo===false?'desativado no painel':(limite&&restante<=0?'limite mensal esgotado':'disponível');
    return `<div class="item"><b>Controle do sindicato mensal</b><div class="muted">Usado: ${usado} ${limite?'de '+limite:'• sem limite'} • Restante: ${restante===999999?'sem limite':restante} • Status: ${status}</div><p class="muted" style="margin:8px 0 0">Contagem corrigida: só soma lançamentos onde estiver escrito <b>sindicato</b>. Serviços e produtos comuns ficam fora.</p></div>`;
  };

  const baseRegistrarVendaProdutoV62 = window.registrarVendaProduto;
  window.registrarVendaProduto = function(btn){
    const box=(btn&&btn.closest)?(btn.closest('.v61-sale-box')||btn.closest('.card')):document;
    const rows=[...(box?.querySelectorAll?.('.v61-sale-row')||[])];
    let qtdSind=0;
    rows.forEach(row=>{
      const prod=(state.produtos||[]).find(p=>String(p.id)===String(row.querySelector('.vpProdutoItem')?.value));
      const q=Math.max(1,n(row.querySelector('.vpQtdItem')?.value)||1);
      if(prod && temSindicatoTexto({produtoNome:prod.nome,produtoId:prod.id,tipoVenda:prod.tipo})) qtdSind+=q;
    });
    if(qtdSind>0 && !window.beneficioPodeUsar(qtdSind)) return toast(typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.');
    const antes=(state.vendasProdutos||[]).length;
    const r=(typeof baseRegistrarVendaProdutoV62==='function') ? baseRegistrarVendaProdutoV62(btn) : undefined;
    const novos=(state.vendasProdutos||[]).slice(antes);
    novos.forEach(v=>{
      if(vendaSind(v)) window.marcarBeneficio(v, v.qtd||1);
      else{ if(v.tipoVenda==='sindicato') v.tipoVenda='produto'; delete v.beneficioUsado; delete v.beneficioQtd; }
    });
    if(novos.length){ try{markDirty();}catch(e){} }
    return r;
  };
  try{ registrarVendaProduto=window.registrarVendaProduto; }catch(e){}

  const baseRegistrarCortesSindicatoV62 = window.registrarCortesSindicato;
  if(typeof baseRegistrarCortesSindicatoV62==='function'){
    window.registrarCortesSindicato = function(){
      const q=Math.max(1,n(document.getElementById('csQtd')?.value)||1);
      if(!window.beneficioPodeUsar(q)) return toast(typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.');
      const antes=(state.vendasProdutos||[]).length;
      const r=baseRegistrarCortesSindicatoV62();
      const v=(state.vendasProdutos||[])[(state.vendasProdutos||[]).length-1];
      if((state.vendasProdutos||[]).length>antes && v){ v.produtoNome = v.produtoNome || 'Sindicato'; v.tipoVenda='sindicato'; window.marcarBeneficio(v,q); try{markDirty();}catch(e){} }
      return r;
    };
    try{ registrarCortesSindicato=window.registrarCortesSindicato; }catch(e){}
  }

  const baseAddAtV62 = window.addAt || (typeof addAt==='function'?addAt:null);
  window.addAt = function(btn){
    const box=btn?.closest?.('.card');
    const servId=box?.querySelector?.('.servAt')?.value;
    let serv=null;
    try{ serv=typeof getServicoByFormId==='function'?getServicoByFormId(servId):(state.servicos||[]).find(s=>String(s.id)===String(servId)); }catch(e){}
    const vaiSind=temSindicatoTexto({servNome:serv?.nome,servId:serv?.id,tipo:serv?.tipo});
    if(vaiSind && !window.beneficioPodeUsar(1)) return toast(typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.');
    const fAntes=(state.fila||[]).length, pAntes=(state.pendencias||[]).length;
    const r=baseAddAtV62?baseAddAtV62(btn):undefined;
    let novo=null;
    if((state.fila||[]).length>fAntes) novo=state.fila[state.fila.length-1];
    if((state.pendencias||[]).length>pAntes) novo=state.pendencias[state.pendencias.length-1];
    if(novo){ if(atSind(novo)) window.marcarBeneficio(novo,1); else{novo.sindicato=false; delete novo.beneficioUsado; delete novo.beneficioQtd;} try{markDirty();}catch(e){} }
    return r;
  };
  try{ addAt=window.addAt; }catch(e){}

  const baseClientAddV62 = window.clientAdd || (typeof clientAdd==='function'?clientAdd:null);
  window.clientAdd = function(mode){
    let s=null; try{s=typeof getServicoByFormId==='function'?getServicoByFormId(document.getElementById('pubServ')?.value):null;}catch(e){}
    const vaiSind=temSindicatoTexto({servNome:s?.nome,servId:s?.id,tipo:s?.tipo,origem:'link'});
    if(vaiSind && !window.beneficioPodeUsar(1)) return toast(typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.');
    const antes=(state.fila||[]).length;
    const r=baseClientAddV62?baseClientAddV62(mode):undefined;
    if((state.fila||[]).length>antes){
      const a=state.fila[state.fila.length-1];
      if(atSind(a)) window.marcarBeneficio(a,1); else{a.sindicato=false; delete a.beneficioUsado; delete a.beneficioQtd;}
      try{markDirty();}catch(e){}
    }
    return r;
  };
  try{ clientAdd=window.clientAdd; }catch(e){}

  const baseExcluirVendaV62 = window.excluirVendaFinalizada;
  window.excluirVendaFinalizada = function(id){
    if(!canAdmin()) return;
    const v=(state.vendasProdutos||[]).find(x=>String(x.id)===String(id));
    if(v && v.vendaGrupoId){
      const grupo=(state.vendasProdutos||[]).filter(x=>String(x.vendaGrupoId)===String(v.vendaGrupoId));
      if(grupo.length>1 && confirm(`Essa venda tem ${grupo.length} produtos no mesmo fechamento. Deseja excluir a venda inteira?\n\nOK = venda inteira\nCancelar = somente este produto`)){
        grupo.forEach(item=>{
          try{ if(typeof v47RegistrarExclusao==='function') v47RegistrarExclusao(vendaSind(item)?'sindicato_produto':'produto_finalizado',item,'Exclusão de venda múltipla'); }catch(e){}
          const prod=(state.produtos||[]).find(p=>String(p.id)===String(item.produtoId));
          if(prod && !vendaSind(item)) prod.estoque=n(prod.estoque)+Math.max(1,n(item.qtd)||1);
        });
        state.vendasProdutos=(state.vendasProdutos||[]).filter(x=>String(x.vendaGrupoId)!==String(v.vendaGrupoId));
        try{markDirty();}catch(e){}
        return toast('Venda inteira excluída. Produtos comuns voltaram para o estoque.');

    return (typeof baseExcluirVendaV62==='function') ? baseExcluirVendaV62(id) : undefined;

/* ===== V63: valor editável na hora da venda, exceto sindicato =====

(function(){

  function produtoById(id){ return (state.produtos||[]).find(p=>String(p.id)===String(id)); }
  function servicoById(id){ try{ if(typeof getServicoByFormId==='function') return getServicoByFormId(id); }catch(e){} return (state.servicos||[]).find(s=>String(s.id)===String(id)); }
  function produtosAtivosV63(){ try{normalize();}catch(e){} return (state.produtos||[]).filter(p=>p.ativo!==false); }
  function produtoOptionsV63(){
    let ps=produtosAtivosV63();
    if(!ps.length) return '<option value="">Nenhum produto cadastrado</option>';

        <b>Adicionar produto novo na hora</b>
        <p class="muted" style="margin:6px 0 10px">Depois de cadastrar, ele já entra na venda e o preço pode ser ajustado no campo acima, exceto se for sindicato.</p>
        <div class="grid g4">
          <div class="field"><label>Produto</label><input class="v61NovoNome" placeholder="Ex: Pomada modeladora"></div>

<script id="vz-redline-popup-script">
(function(){

function isPromoLink(){
  try{
    var params = new URLSearchParams(window.location.search);
    return params.has('promo');
  }catch(e){
    return false;
  }
}

function createPopup(){
  if(!isPromoLink()) return;
  if(document.getElementById('vzRedlinePopup')) return;

  var popup=document.createElement('div');
  popup.id='vzRedlinePopup';
  popup.innerHTML='GARANTIR AGORA <small>Oferta expira em <span id="vzTimer">05:00</span></small>';
  document.body.appendChild(popup);
}

function startPersistentTimer(){
  if(!isPromoLink()) return;

  var KEY='vz_redline_promo_endtime';
  var endTime=localStorage.getItem(KEY);

  if(!endTime){
    endTime=Date.now()+(5*60*1000);
    localStorage.setItem(KEY,endTime);
  }else{
    endTime=parseInt(endTime);
  }

  function update(){
    var diff=Math.max(0,Math.floor((endTime-Date.now())/1000));

    var m=String(Math.floor(diff/60)).padStart(2,'0');
    var s=String(diff%60).padStart(2,'0');

    var timer=document.getElementById('vzTimer');
    if(timer){
      timer.textContent=m+':'+s;
    }

    if(diff<=0){
      endTime=Date.now()+(5*60*1000);
      localStorage.setItem(KEY,endTime);
    }
  }

  update();
  setInterval(update,1000);
}

window.addEventListener('load',function(){
  createPopup();
  startPersistentTimer();
});

})();
</script>

<script id="vz79-recorrencia-pote-comissoes">
(function(){
  var FLAG='vizzarty_v79_recorrencia_pote_comissoes';
  if(window[FLAG]) return;
  window[FLAG]=true;

  function esc79(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }
  function n79(v){
    try{ if(typeof num==='function') return num(v); }catch(e){}
    return Number(v)||0;
  }
  function money79(v){
    try{ if(typeof brl==='function') return brl(v); }catch(e){}
    return 'R$ '+n79(v).toFixed(2).replace('.',',');
  }
  function uid79(){
    try{ if(typeof uid==='function') return uid(); }catch(e){}
    return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  }
  function today79(){
    try{ if(typeof today==='function') return today(); }catch(e){}
    return new Date().toISOString().slice(0,10);
  }
  function month79(){
    return today79().slice(0,7);
  }
  function save79(msg){
    try{ markDirty(); }catch(e){ try{ saveLocal(); if(typeof renderAll==='function') renderAll(); }catch(_){} }
    if(msg){ try{ toast(msg); }catch(e){} }
  }
  function admin79(){
    try{ return typeof isAdmin==='function' && isAdmin(); }catch(e){ return true; }
  }
  function canAdmin79(){
    if(admin79()) return true;
    try{ toast('Somente admin'); }catch(e){}
    return false;
  }
  function ensure79(){
    state.config=state.config||{};
    if(!Array.isArray(state.planosRecorrencia)) state.planosRecorrencia=[];
    if(!Array.isArray(state.assinantesRecorrencia)) state.assinantesRecorrencia=[];
    if(!Array.isArray(state.atendimentosRecorrencia)) state.atendimentosRecorrencia=[];
    if(!state.config.recorrenciaMesAnalise) state.config.recorrenciaMesAnalise=month79();
    state.planosRecorrencia=state.planosRecorrencia.map(function(p){
      return Object.assign({id:uid79(),nome:'Plano recorrente',mensalidade:149,cortesMes:4,potePct:50,ativo:true,obs:''},p,{ativo:p.ativo!==false});
    });
    state.assinantesRecorrencia=state.assinantesRecorrencia.map(function(a){
      return Object.assign({id:uid79(),nome:'',telefone:'',planoId:'',valorMensal:0,diaVencimento:5,inicio:today79(),status:'ativo'},a);
    });
    state.atendimentosRecorrencia=state.atendimentosRecorrencia.map(function(a){
      return Object.assign({id:uid79(),assinanteId:'',planoId:'',profId:'',profNome:'',servId:'',servNome:'',data:today79(),peso:1,obs:'',createdAt:Date.now()},a);
    });
  }
  function plano79(id){ ensure79(); return (state.planosRecorrencia||[]).find(function(p){return String(p.id)===String(id);}); }
  function assinante79(id){ ensure79(); return (state.assinantesRecorrencia||[]).find(function(a){return String(a.id)===String(id);}); }
  function prof79(id){ return (state.profissionais||[]).find(function(p){return String(p.id)===String(id);}); }
  function serv79(id){ return (state.servicos||[]).find(function(s){return String(s.id)===String(id);}); }
  function activeAssinantes79(mes){
    ensure79();
    return (state.assinantesRecorrencia||[]).filter(function(a){
      if(a.status==='cancelado' || a.ativo===false) return false;
      if(a.inicio && String(a.inicio).slice(0,7)>mes) return false;
      if(a.canceladoEm && String(a.canceladoEm).slice(0,7)<mes) return false;
      return true;
    });
  }
  function valorAss79(a){
    var p=plano79(a.planoId);
    return n79(a.valorMensal || p?.mensalidade || 0);
  }
  function potePctAss79(a){
    var p=plano79(a.planoId);
    return Math.max(0,Math.min(100,n79(a.potePct ?? p?.potePct ?? 50)));
  }
  function atendMes79(mes){
    ensure79();
    return (state.atendimentosRecorrencia||[]).filter(function(a){return String(a.data||'').slice(0,7)===mes;});
  }
  function resumo79(mes){
    ensure79();
    var assinantes=activeAssinantes79(mes);
    var atend=atendMes79(mes);
    var receita=assinantes.reduce(function(s,a){return s+valorAss79(a);},0);
    var pote=assinantes.reduce(function(s,a){return s+(valorAss79(a)*potePctAss79(a)/100);},0);
    var casa=receita-pote;
    var profs={};
    atend.forEach(function(a){
      var id=a.profId||'sem_prof';
      if(!profs[id]) profs[id]={id:id,nome:a.profNome || prof79(id)?.nome || 'Sem profissional',qtd:0,peso:0,comissao:0};
      profs[id].qtd+=1;
      profs[id].peso+=Math.max(0.01,n79(a.peso)||1);
    });
    var pesoTotal=Object.values(profs).reduce(function(s,p){return s+p.peso;},0);
    Object.values(profs).forEach(function(p){ p.comissao=pesoTotal>0 ? pote*(p.peso/pesoTotal) : 0; });
    var creditos=assinantes.reduce(function(s,a){return s+n79(plano79(a.planoId)?.cortesMes||0);},0);
    return {mes:mes,assinantes:assinantes,atend:atend,receita:receita,pote:pote,casa:casa,profs:Object.values(profs),pesoTotal:pesoTotal,creditos:creditos};
  }
  function planOpts79(selected){
    ensure79();
    return (state.planosRecorrencia||[]).filter(function(p){return p.ativo!==false;}).map(function(p){
      return '<option value="'+esc79(p.id)+'" '+(String(selected)===String(p.id)?'selected':'')+'>'+esc79(p.nome)+' - '+money79(p.mensalidade)+'</option>';
    }).join('');
  }
  function assinanteOpts79(selected){
    ensure79();
    return (state.assinantesRecorrencia||[]).filter(function(a){return a.status!=='cancelado' && a.ativo!==false;}).map(function(a){
      var p=plano79(a.planoId);
      return '<option value="'+esc79(a.id)+'" '+(String(selected)===String(a.id)?'selected':'')+'>'+esc79(a.nome||'Assinante')+' - '+esc79(p?.nome||'sem plano')+'</option>';
    }).join('');
  }
  function profOpts79(selected){
    return (state.profissionais||[]).filter(function(p){return p.ativo!==false;}).map(function(p){
      return '<option value="'+esc79(p.id)+'" '+(String(selected)===String(p.id)?'selected':'')+'>'+esc79(p.nome||'Profissional')+'</option>';
    }).join('');
  }
  function servOpts79(selected){
    return (state.servicos||[]).filter(function(s){return s.ativo!==false;}).map(function(s){
      return '<option value="'+esc79(s.id)+'" '+(String(selected)===String(s.id)?'selected':'')+'>'+esc79(s.nome||'Servico')+'</option>';
    }).join('');
  }
  function planosRows79(){
    ensure79();
    if(!state.planosRecorrencia.length) return '<div class="muted">Nenhum plano criado ainda.</div>';
    return state.planosRecorrencia.map(function(p){
      return '<div class="item vz79-row"><div class="item-head"><div style="flex:1">'+
        '<b>'+esc79(p.nome)+'</b><div class="muted">Mensalidade '+money79(p.mensalidade)+' - '+n79(p.cortesMes)+' atendimentos/mes - '+n79(p.potePct)+'% para pote</div>'+
        '<div class="grid g4" style="margin-top:10px">'+
          '<div class="field"><label>Nome</label><input id="v79_pl_nome_'+esc79(p.id)+'" value="'+esc79(p.nome)+'"></div>'+
          '<div class="field"><label>Mensalidade R$</label><input id="v79_pl_valor_'+esc79(p.id)+'" type="number" step="0.01" value="'+n79(p.mensalidade)+'"></div>'+
          '<div class="field"><label>Atendimentos/mes</label><input id="v79_pl_cortes_'+esc79(p.id)+'" type="number" min="0" value="'+n79(p.cortesMes)+'"></div>'+
          '<div class="field"><label>% para pote</label><input id="v79_pl_pote_'+esc79(p.id)+'" type="number" min="0" max="100" value="'+n79(p.potePct)+'"></div>'+
        '</div></div><div class="row">'+
          '<button class="btn small blue" onclick="v79SalvarPlano(\''+esc79(p.id)+'\')">Salvar</button>'+
          '<button class="btn small '+(p.ativo===false?'good':'bad')+'" onclick="v79TogglePlano(\''+esc79(p.id)+'\')">'+(p.ativo===false?'Ativar':'Pausar')+'</button>'+
          '<button class="btn small bad" onclick="v79ExcluirPlano(\''+esc79(p.id)+'\')">Excluir</button>'+
        '</div></div></div>';
    }).join('');
  }
  function assinantesRows79(){
    ensure79();
    if(!state.assinantesRecorrencia.length) return '<div class="muted">Nenhum assinante cadastrado.</div>';
    return state.assinantesRecorrencia.map(function(a){
      var p=plano79(a.planoId);
      return '<div class="item vz79-row"><div class="item-head"><div><b>'+esc79(a.nome||'Assinante')+'</b>'+
        '<div class="muted">'+esc79(a.telefone||'sem telefone')+' - '+esc79(p?.nome||'sem plano')+' - '+money79(valorAss79(a))+' - venc. dia '+esc79(a.diaVencimento||'')+'</div>'+
        '<div class="row" style="margin-top:7px"><span class="badge '+(a.status==='cancelado'?'b-off':'b-ok')+'">'+esc79(a.status||'ativo')+'</span><span class="badge">inicio '+esc79(a.inicio||'')+'</span></div></div><div class="row">'+
        '<button class="btn small '+(a.status==='cancelado'?'good':'bad')+'" onclick="v79ToggleAssinante(\''+esc79(a.id)+'\')">'+(a.status==='cancelado'?'Reativar':'Cancelar')+'</button>'+
        '<button class="btn small bad" onclick="v79ExcluirAssinante(\''+esc79(a.id)+'\')">Excluir</button>'+
        '</div></div></div>';
    }).join('');
  }
  function atendRows79(mes){
    var list=atendMes79(mes).slice().reverse();
    if(!list.length) return '<div class="muted">Nenhum atendimento de recorrencia neste mes.</div>';
    return '<table><tr><th>Data</th><th>Assinante</th><th>Profissional</th><th>Servico</th><th>Peso</th><th></th></tr>'+list.map(function(a){
      return '<tr><td>'+esc79(a.data||'')+'</td><td>'+esc79(assinante79(a.assinanteId)?.nome||'')+'</td><td>'+esc79(a.profNome||prof79(a.profId)?.nome||'')+'</td><td>'+esc79(a.servNome||serv79(a.servId)?.nome||'')+'</td><td>'+n79(a.peso||1)+'</td><td><button class="btn small bad" onclick="v79ExcluirAtendimento(\''+esc79(a.id)+'\')">Excluir</button></td></tr>';
    }).join('')+'</table>';
  }
  function analiseHTML79(mes){
    var r=resumo79(mes);
    var profRows=r.profs.length?r.profs.sort(function(a,b){return b.comissao-a.comissao;}).map(function(p){
      return '<tr><td>'+esc79(p.nome)+'</td><td>'+p.qtd+'</td><td>'+p.peso.toFixed(2).replace('.',',')+'</td><td>'+money79(p.comissao)+'</td></tr>';
    }).join(''):'<tr><td colspan="4" class="muted">Sem atendimento registrado. O pote ainda nao tem divisao.</td></tr>';
    var uso=r.creditos?Math.round((r.atend.length/r.creditos)*100):0;
    return '<div class="card vz79-analysis"><h2>Analise mensal do pote</h2>'+
      '<div class="grid g4">'+
        '<div class="field"><label>Mes de analise</label><input id="v79Mes" type="month" value="'+esc79(mes)+'" onchange="v79SalvarMes()"></div>'+
        '<div class="stat"><b>'+money79(r.receita)+'</b><span>Receita recorrente</span></div>'+
        '<div class="stat"><b>'+money79(r.pote)+'</b><span>Pote dos barbeiros</span></div>'+
        '<div class="stat"><b>'+money79(r.casa)+'</b><span>Casa / margem</span></div>'+
      '</div>'+
      '<div class="statgrid" style="margin-top:10px"><div class="stat"><b>'+r.assinantes.length+'</b><span>Assinantes ativos</span></div><div class="stat"><b>'+r.atend.length+'</b><span>Atendimentos usados</span></div><div class="stat"><b>'+r.creditos+'</b><span>Creditos contratados</span></div><div class="stat"><b>'+uso+'%</b><span>Uso dos planos</span></div></div>'+
      '<div class="item" style="margin-top:12px"><b>Regra do pote</b><div class="muted">A mensalidade de cada assinante entra na receita recorrente. O percentual do plano vai para o pote. No fechamento, o pote e dividido entre barbeiros pelo peso dos atendimentos feitos no mes.</div></div>'+
      '<h3 style="margin:16px 0 8px">Divisao por barbeiro</h3><table><tr><th>Barbeiro</th><th>Atendimentos</th><th>Peso</th><th>Comissao do pote</th></tr>'+profRows+'</table>'+
    '</div>';
  }
  function recorrenciaHTML79(){
    ensure79();
    if(!admin79()) return '<div class="card"><h2>Recorrencia</h2><p class="muted">Somente o administrador pode analisar planos de recorrencia.</p></div>';
    var mes=state.config.recorrenciaMesAnalise || month79();
    return '<div class="card vz79-hero"><h2>Recorrencia e pote de comissoes</h2><p class="muted">Modelo de recorrencia com pote: venda mensalidade, acompanhe uso dos assinantes e divida a parte dos barbeiros conforme quem realmente atendeu.</p><div class="row"><span class="badge b-ok">MRR</span><span class="badge">Pote por atendimento</span><span class="badge">Fechamento mensal</span></div></div>'+
      analiseHTML79(mes)+
      '<div class="grid g2"><div class="card"><h2>Criar plano</h2><div class="grid g2"><div class="field"><label>Nome do plano</label><input id="v79PlanoNome" placeholder="Ex: Clube Corte Mensal"></div><div class="field"><label>Mensalidade R$</label><input id="v79PlanoValor" type="number" step="0.01" value="149"></div><div class="field"><label>Atendimentos/mes</label><input id="v79PlanoCortes" type="number" value="4"></div><div class="field"><label>% para pote</label><input id="v79PlanoPote" type="number" value="50"></div></div><button class="btn primary" onclick="v79CriarPlano()"><i class="ti ti-plus"></i>Criar plano</button></div>'+
      '<div class="card"><h2>Novo assinante</h2><div class="grid g2"><div class="field"><label>Nome</label><input id="v79AssNome"></div><div class="field"><label>WhatsApp</label><input id="v79AssTel"></div><div class="field"><label>Plano</label><select id="v79AssPlano">'+planOpts79('')+'</select></div><div class="field"><label>Valor combinado R$</label><input id="v79AssValor" type="number" step="0.01" placeholder="Vazio usa valor do plano"></div><div class="field"><label>Vencimento dia</label><input id="v79AssDia" type="number" min="1" max="31" value="5"></div><div class="field"><label>Inicio</label><input id="v79AssInicio" type="date" value="'+today79()+'"></div></div><button class="btn primary" onclick="v79AddAssinante()"><i class="ti ti-user-plus"></i>Cadastrar assinante</button></div></div>'+
      '<div class="card"><h2>Registrar atendimento de assinante</h2><div class="grid g4"><div class="field"><label>Assinante</label><select id="v79AtAss">'+assinanteOpts79('')+'</select></div><div class="field"><label>Barbeiro que atendeu</label><select id="v79AtProf">'+profOpts79('')+'</select></div><div class="field"><label>Servico</label><select id="v79AtServ">'+servOpts79('')+'</select></div><div class="field"><label>Data</label><input id="v79AtData" type="date" value="'+today79()+'"></div><div class="field"><label>Peso no pote</label><input id="v79AtPeso" type="number" step="0.1" value="1"></div><div class="field"><label>Observacao</label><input id="v79AtObs" placeholder="Opcional"></div></div><button class="btn good" onclick="v79RegistrarAtendimento()"><i class="ti ti-scissors"></i>Registrar atendimento</button></div>'+
      '<div class="grid g2"><div class="card"><h2>Planos</h2>'+planosRows79()+'</div><div class="card"><h2>Assinantes</h2>'+assinantesRows79()+'</div></div>'+
      '<div class="card"><h2>Atendimentos do mes</h2>'+atendRows79(mes)+'</div>';
  }

  window.v79SalvarMes=function(){
    ensure79();
    state.config.recorrenciaMesAnalise=document.getElementById('v79Mes')?.value || month79();
    save79();
  };
  window.v79CriarPlano=function(){
    if(!canAdmin79()) return;
    ensure79();
    var nome=(document.getElementById('v79PlanoNome')?.value||'').trim();
    if(!nome) return toast('Informe o nome do plano.');
    state.planosRecorrencia.push({id:uid79(),nome:nome,mensalidade:n79(document.getElementById('v79PlanoValor')?.value),cortesMes:n79(document.getElementById('v79PlanoCortes')?.value)||0,potePct:n79(document.getElementById('v79PlanoPote')?.value)||0,ativo:true,createdAt:Date.now()});
    save79('Plano de recorrencia criado.');
  };
  window.v79SalvarPlano=function(id){
    if(!canAdmin79()) return;
    var p=plano79(id);
    if(!p) return;
    p.nome=(document.getElementById('v79_pl_nome_'+id)?.value||p.nome).trim()||p.nome;
    p.mensalidade=n79(document.getElementById('v79_pl_valor_'+id)?.value);
    p.cortesMes=n79(document.getElementById('v79_pl_cortes_'+id)?.value)||0;
    p.potePct=Math.max(0,Math.min(100,n79(document.getElementById('v79_pl_pote_'+id)?.value)));

  window.v79TogglePlano=function(id){
    if(!canAdmin79()) return;

    p.ativo=p.ativo===false;

    state.planosRecorrencia=(state.planosRecorrencia||[]).filter(function(p){return String(p.id)!==String(id);});

  };
  window.v79AddAssinante=function(){
    if(!canAdmin79()) return;

    var nome=(document.getElementById('v79AssNome')?.value||'').trim();

  const baseNormalize79=window.normalize || (typeof normalize==='function'?normalize:null);
  if(baseNormalize79){
    window.normalize=function(){
      var r=baseNormalize79.apply(this,arguments);
      ensure79();
      return r;
    };
    try{ normalize=window.normalize; }catch(e){}
  }
  const baseNav79=window.navItems || (typeof navItems==='function'?navItems:null);
  if(baseNav79){
    window.navItems=function(){
      var items=baseNav79.apply(this,arguments);
      try{
        if(admin79() && !items.some(function(x){return x[0]==='recorrencia';})){
          var idx=items.findIndex(function(x){return x[0]==='extrato';});
          items.splice(idx>=0?idx:items.length,0,['recorrencia','ti-repeat','Recorrencia']);
        }
      }catch(e){}
      return items;
    };
    try{ navItems=window.navItems; }catch(e){}
  }
  const basePage79=window.pageHTML || (typeof pageHTML==='function'?pageHTML:null);
  if(basePage79){
    window.pageHTML=function(p){
      if(p==='recorrencia') return recorrenciaHTML79();
      return basePage79.apply(this,arguments);
    };
    try{ pageHTML=window.pageHTML; }catch(e){}
  }
  function addStyle79(){
    if(document.getElementById('vz79Style')) return;
    var st=document.createElement('style');
    st.id='vz79Style';
    st.textContent='.vz79-hero{border-color:rgba(59,194,125,.28);background:linear-gradient(180deg,#142017,#100c09)}.vz79-hero h2,.vz79-analysis h2{color:var(--gold)}.vz79-row input{min-width:0}.vz79-analysis .grid.g4{align-items:stretch}.vz79-analysis .field{margin-bottom:0}.vz79-analysis h3{color:var(--txt)}@media(max-width:900px){.vz79-analysis .grid.g4{grid-template-columns:1fr}.vz79-row .item-head{display:block}}';
    document.head.appendChild(st);
  }
  try{
    addStyle79();
    ensure79();
    if(window.session && typeof renderAll==='function') renderAll();
    console.log('V79: recorrencia e pote de comissoes carregados.');
  }catch(e){ console.error('V79 init erro:',e); }
})();
</script>

<script>
/* ===== V80: aprovação de produtos e vendas de produtos lançados pelo profissional ===== */
(function(){

  /* --- Intercepta addProduto: profissional envia para aprovação --- */
  const _v80AddProdutoBase = window.addProduto;
  window.addProduto = function(){
    if(typeof isAdmin==='function' && isAdmin()) return _v80AddProdutoBase.apply(this,arguments);
    /* profissional: monta objeto do produto e coloca em pendências */
    let nome=(document.getElementById('pdNome')?.value||'').trim();
    if(!nome)return (typeof toast==='function'?toast:alert)('Nome do produto obrigatório');
    let produto={
      id:(typeof uid==='function'?uid():Date.now().toString(36)),
      nome,
      preco:(typeof num==='function'?num(document.getElementById('pdPreco')?.value):Number(document.getElementById('pdPreco')?.value)||0),
      estoque:(typeof num==='function'?num(document.getElementById('pdEstoque')?.value):Number(document.getElementById('pdEstoque')?.value)||0),
      comissaoPct:(typeof num==='function'?num(document.getElementById('pdCom')?.value):Number(document.getElementById('pdCom')?.value)||0),
      ativo:true
    };
    let prof=typeof currentProf==='function'?currentProf():null;
    if(!Array.isArray(state.pendencias))state.pendencias=[];
    state.pendencias.push({
      id:produto.id,
      tipo:'produto',
      produto:produto,
      profId:window.session?.profId||'',
      profNome:prof?.nome||'',
      resumo:'Novo produto: '+produto.nome,
      criadoEm:Date.now()
    });
    if(typeof markDirty==='function')markDirty();
    (typeof toast==='function'?toast:alert)('Produto enviado para aprovação do admin');
    /* limpa campos */
    ['pdNome','pdPreco','pdEstoque','pdCom'].forEach(function(id){let el=document.getElementById(id);if(el)el.value=id==='pdPreco'||id==='pdEstoque'?'0':(id==='pdCom'?'10':'');});
  };
  try{ addProduto=window.addProduto; }catch(e){}

  /* --- Intercepta registrarVendaProduto: profissional envia para aprovação --- */
  const _v80RegistrarVendaBase = window.registrarVendaProduto;
  window.registrarVendaProduto = function(){
    if(typeof isAdmin==='function' && isAdmin()) return _v80RegistrarVendaBase.apply(this,arguments);
    /* profissional: monta venda e coloca em pendências */
    let prod=(state.produtos||[]).find(function(p){return String(p.id)===String(document.getElementById('vpProduto')?.value);});
    if(!prod)return (typeof toast==='function'?toast:alert)('Cadastre um produto ativo');
    let prof=typeof currentProf==='function'?currentProf():null;
    if(!prof)return (typeof toast==='function'?toast:alert)('Profissional não identificado');
    let qtd=Math.max(1,(typeof num==='function'?num(document.getElementById('vpQtd')?.value):Number(document.getElementById('vpQtd')?.value))||1);
    let total=(typeof num==='function'?num(prod.preco):Number(prod.preco)||0)*qtd;
    let pct=(typeof num==='function'?num(prod.comissaoPct):Number(prod.comissaoPct)||0);
    let com=total*pct/100;
    let venda={
      id:(typeof uid==='function'?uid():Date.now().toString(36)),
      produtoId:prod.id,
      produtoNome:prod.nome,
      profId:prof.id,
      profNome:prof.nome,
      clienteNome:(document.getElementById('vpCliente')?.value||''),
      qtd:qtd,
      precoUnit:(typeof num==='function'?num(prod.preco):Number(prod.preco)||0),
      total:total,
      comissaoPct:pct,
      comissaoValor:com,
      data:(document.getElementById('vpData')?.value||(typeof today==='function'?today():'')),
      hora:(typeof nowHH==='function'?nowHH():''),
      createdAt:Date.now()
    };
    if(!Array.isArray(state.pendencias))state.pendencias=[];
    state.pendencias.push({
      id:venda.id,
      tipo:'venda_produto',
      venda:venda,
      profId:prof.id,
      profNome:prof.nome,
      resumo:'Venda: '+prod.nome+' (x'+qtd+') — '+(typeof brl==='function'?brl(total):('R$ '+total.toFixed(2))),
      criadoEm:Date.now()
    });
    if(typeof markDirty==='function')markDirty();
    (typeof toast==='function'?toast:alert)('Venda enviada para aprovação do admin');
    /* limpa campos */
    let qEl=document.getElementById('vpQtd'); if(qEl)qEl.value='1';
    let cEl=document.getElementById('vpCliente'); if(cEl)cEl.value='';
  };
  try{ registrarVendaProduto=window.registrarVendaProduto; }catch(e){}

  /* --- Estende approve para produto e venda_produto --- */
  const _v80ApproveBase = window.approve;
  window.approve = function(i){
    let p=(state.pendencias||[])[i];
    if(!p)return;
    if(p.tipo==='produto'){
      if(!Array.isArray(state.produtos))state.produtos=[];
      state.produtos.push(p.produto);
      state.pendencias.splice(i,1);
      if(typeof markDirty==='function')markDirty();
      (typeof toast==='function'?toast:alert)('Produto aprovado e cadastrado.');
      if(typeof renderAll==='function')renderAll();
      return;
    }
    if(p.tipo==='venda_produto'){
      if(!Array.isArray(state.vendasProdutos))state.vendasProdutos=[];
      /* desconta estoque */
      let prod=(state.produtos||[]).find(function(x){return String(x.id)===String(p.venda.produtoId);});
      if(prod)prod.estoque=Math.max(0,(typeof num==='function'?num(prod.estoque):Number(prod.estoque)||0)-p.venda.qtd);
      state.vendasProdutos.push(p.venda);
      state.pendencias.splice(i,1);
      if(typeof markDirty==='function')markDirty();
      (typeof toast==='function'?toast:alert)('Venda aprovada e registrada.');
      if(typeof renderAll==='function')renderAll();
      return;
    }
    return _v80ApproveBase.apply(this,arguments);
  };
  try{ approve=window.approve; }catch(e){}

  /* --- Estende reject para produto e venda_produto --- */
  const _v80RejectBase = window.reject;
  window.reject = function(i){
    let p=(state.pendencias||[])[i];
    if(!p)return;
    if(p.tipo==='produto'||p.tipo==='venda_produto'){
      state.pendencias.splice(i,1);
      if(typeof markDirty==='function')markDirty();
      (typeof toast==='function'?toast:alert)('Solicitação recusada.');
      if(typeof renderAll==='function')renderAll();
      return;
    }
    return _v80RejectBase.apply(this,arguments);
  };
  try{ reject=window.reject; }catch(e){}

  /* --- Exibe fila de aprovações pendentes de produto/venda no painel do profissional --- */
  const _v80ProfResumoBase = window.profissionalResumoHTML;
  if(typeof _v80ProfResumoBase==='function'){
    window.profissionalResumoHTML = function(){
      let html=_v80ProfResumoBase.apply(this,arguments);
      let pid=window.session?.profId||'';
      let minhas=(state.pendencias||[]).filter(function(p){return String(p.profId)===String(pid)&&(p.tipo==='produto'||p.tipo==='venda_produto');});
      if(!minhas.length)return html;
      let rows=minhas.map(function(p){
        return '<div class="item"><span class="badge b-fila">Aguardando aprovação</span> <b>'+
          (p.tipo==='produto'?'<i class="ti ti-box"></i> Produto':'<i class="ti ti-shopping-cart"></i> Venda')+'</b>'+
          '<div class="muted">'+p.resumo+'</div></div>';
      }).join('');
      return html+'<div class="card"><h2>Meus lançamentos aguardando aprovação</h2>'+rows+'</div>';
    };
    try{ profissionalResumoHTML=window.profissionalResumoHTML; }catch(e){}
  }

  /* --- Adiciona label correto na tela de aprovações do admin (v45PendenciasAdminHTML) --- */
  const _v80PendenciasBase = window.v45PendenciasAdminHTML;
  if(typeof _v80PendenciasBase==='function'){
    window.v45PendenciasAdminHTML = function(){
      if(typeof isAdmin==='function' && !isAdmin())return '';
      if(!(state.pendencias||[]).length)return '';
      let rows=(state.pendencias||[]).map(function(p,i){
        let titulo=p.resumo||(p.tipo==='produto'?'Novo produto: '+(p.produto?.nome||''):(p.tipo==='venda_produto'?'Venda: '+(p.venda?.produtoNome||''):(p.tipo==='servico'?'Novo serviço: '+(p.servico?.nome||''):p.nome||'Pendência')));
        let prof=p.profNome||(state.profissionais||[]).find(function(x){return String(x.id)===String(p.profId);})?.nome||'';
        let detalhe='';
        if(p.tipo==='produto'){
          let pd=p.produto||{};
          detalhe='<div class="muted">Preço: '+(typeof brl==='function'?brl(pd.preco):('R$ '+(pd.preco||0)))+' • Estoque: '+(pd.estoque||0)+' • Comissão: '+(pd.comissaoPct||0)+'%</div>';
        }
        if(p.tipo==='venda_produto'){
          let v=p.venda||{};
          detalhe='<div class="muted">Produto: '+v.produtoNome+' • Qtd: '+v.qtd+' • Total: '+(typeof brl==='function'?brl(v.total):('R$ '+(v.total||0)))+' • Comissão: '+(typeof brl==='function'?brl(v.comissaoValor):('R$ '+(v.comissaoValor||0)))+(v.clienteNome?' • Cliente: '+v.clienteNome:'')+' • Data: '+(v.data||'')+'</div>';
        }
        let tipoLabel=p.tipo==='produto'?'<span class="badge b-fila"><i class="ti ti-box"></i> Produto</span>':p.tipo==='venda_produto'?'<span class="badge b-blue"><i class="ti ti-shopping-cart"></i> Venda de produto</span>':p.tipo==='servico'?'<span class="badge"><i class="ti ti-scissors"></i> Serviço</span>':'<span class="badge"><i class="ti ti-clock"></i> '+( p.tipo||'pendência')+'</span>';
        return '<div class="item"><div class="item-head"><div>'+tipoLabel+' <b>'+titulo+'</b><div class="muted">Solicitado por: '+(prof||'Profissional')+'</div>'+detalhe+'</div><div class="row"><button class="btn small good" onclick="approve('+i+')"><i class="ti ti-check"></i>Aprovar</button><button class="btn small bad" onclick="reject('+i+')"><i class="ti ti-x"></i>Recusar</button></div></div></div>';
      }).join('');
      return '<div class="card"><h2>Aprovações do administrador</h2><p class="muted">Produtos e vendas lançados pelo profissional ficam aqui até você aprovar.</p>'+rows+'</div>';
    };
    try{ v45PendenciasAdminHTML=window.v45PendenciasAdminHTML; }catch(e){}
  }

  /* --- Badge de pendências no nav do admin --- */
  const _v80NavBase = window.navItems;
  if(typeof _v80NavBase==='function'){
    window.navItems = function(){
      let items=_v80NavBase.apply(this,arguments);
      try{
        if(typeof isAdmin==='function' && isAdmin()){
          let qtd=(state.pendencias||[]).length;
          items=items.map(function(x){
            if(x[0]==='painel') return [x[0],x[1],x[2],(qtd||undefined)];
            return x;
          });
        }
      }catch(e){}
      return items;
    };
    try{ navItems=window.navItems; }catch(e){}
  }

  try{
    if(window.session && typeof renderAll==='function') renderAll();
    console.log('V80: aprovação de produtos e vendas carregada.');
  }catch(e){ console.error('V80 init erro:',e); }
})();
</script>
