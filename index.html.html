      }
    });
    if(keep.length !== (state.pendencias||[]).length) state.pendencias=keep;
    state.creditRequests.forEach(function(r){
      if(!r) return;
      var old=r.status;
      normalizeReq86(r);
      if(isPendingStatus86(old) && old!=='pendente'){ r.status='pendente'; changed=true; }
    });
    if(changed){ try{ saveLocal(); }catch(e){} try{ dirty=true; }catch(e){} }
    return changed;
  }
  function pending86(){
    migrate86();
    return (state.creditRequests||[]).filter(function(r){return looksCredit86(r) && isPendingStatus86(r.status);});
  }
  function recent86(){
    migrate86();
    return (state.creditRequests||[]).filter(function(r){return looksCredit86(r) && !isPendingStatus86(r.status);}).slice().reverse().slice(0,12);
  }
  function approvalRows86(list){
    if(!list.length) return '<div class="muted">Nenhum uso de credito pendente.</div>';
    return list.map(function(r){
      return '<div class="item vz81-approval"><div class="item-head"><div><b>'+esc(r.clienteNome||'Cliente')+'</b>'+
        '<div class="muted">Barbeiro: '+esc(r.profNome||'')+' - Servico: '+esc(r.servNome||'')+' - Quem usou: '+esc(r.quemUsou||'')+' '+(r.vinculo?'('+esc(r.vinculo)+')':'')+'</div>'+
        '<div class="row" style="margin-top:7px"><span class="badge">'+n(r.creditos)+' credito(s)</span><span class="badge">'+money(r.comissao)+' comissao</span><span class="badge">'+esc(r.data||'')+' '+esc(r.hora||'')+'</span><span class="badge b-fila">pendente</span></div></div>'+
        '<div class="row"><button class="btn small good" onclick="v86AprovarCredito(\''+esc(r.id)+'\')"><i class="ti ti-check"></i>Aprovar</button><button class="btn small bad" onclick="v86RecusarCredito(\''+esc(r.id)+'\')"><i class="ti ti-x"></i>Recusar</button></div></div></div>';
    }).join('');
  }
  function recentRows86(list){
    if(!list.length) return '<div class="muted">Sem aprovacoes recentes.</div>';
    return '<table><tr><th>Data</th><th>Cliente</th><th>Servico</th><th>Creditos</th><th>Status</th></tr>'+list.map(function(r){
      return '<tr><td>'+esc(r.data||'')+'</td><td>'+esc(r.clienteNome||'')+'</td><td>'+esc(r.servNome||'')+'</td><td>'+n(r.creditos)+'</td><td>'+esc(r.status||'')+'</td></tr>';
    }).join('')+'</table>';
  }
  function aprovacoesHTML86(){
    migrate86();
    if(!admin86()) return '<div class="card"><h2>Aprovacoes de Creditos</h2><p class="muted">Somente o administrador aprova uso de creditos.</p></div>';
    var pend= pending86();
    return '<div class="card vz81-hero"><h2>Aprovacoes de Creditos</h2><p class="muted">Todo uso solicitado pelo profissional fica aqui ate o admin aprovar ou recusar.</p></div>'+
      '<div class="card"><h2>Pendentes</h2>'+approvalRows86(pend)+'</div>'+
      '<div class="card"><h2>Historico de decisoes</h2>'+recentRows86(recent86())+'</div>';
  }

  window.v86AprovarCredito=function(id){
    migrate86();
    var req=(state.creditRequests||[]).find(function(r){return String(r.id)===String(id);});
    if(req && isPendingStatus86(req.status)) req.status='pendente';
    if(typeof window.v81AprovarCredito==='function') return window.v81AprovarCredito(id);
    toast86('Aprovacao de creditos indisponivel.');
  };
  window.v86RecusarCredito=function(id){
    migrate86();
    var req=(state.creditRequests||[]).find(function(r){return String(r.id)===String(id);});
    if(req && isPendingStatus86(req.status)) req.status='pendente';
    if(typeof window.v81RecusarCredito==='function') return window.v81RecusarCredito(id);
    toast86('Recusa de creditos indisponivel.');
  };

  var baseSolicitar86=window.v81SolicitarUsoCredito;
  if(typeof baseSolicitar86==='function'){
    window.v81SolicitarUsoCredito=function(){
      var before=(state.creditRequests||[]).length;
      var r=baseSolicitar86.apply(this,arguments);
      migrate86();
      var novo=(state.creditRequests||[])[state.creditRequests.length-1];
      if((state.creditRequests||[]).length>before && novo && isPendingStatus86(novo.status)) novo.status='pendente';
      try{ saveLocal(); }catch(e){}
      return r;
    };
  }

  var basePage86=window.pageHTML || (typeof pageHTML==='function'?pageHTML:null);
  if(typeof basePage86==='function'){
    window.pageHTML=function(p){
      if(p==='aprovacoesCreditos') return aprovacoesHTML86();
      return basePage86.apply(this,arguments);
    };
    try{ pageHTML=window.pageHTML; }catch(e){}
  }

  var baseNav86=window.navItems || (typeof navItems==='function'?navItems:null);
  if(typeof baseNav86==='function'){
    window.navItems=function(){
      var items=baseNav86.apply(this,arguments);
      try{
        var qtd=pending86().length;
        var exists=items.some(function(x){return x[0]==='aprovacoesCreditos';});
        if(admin86()){
          var idx=items.findIndex(function(x){return x[0]==='extrato';});
          if(!exists) items.splice(idx>=0?idx:items.length,0,['aprovacoesCreditos','ti-shield-check','Aprovacoes de Creditos',qtd||'']);
          items=items.map(function(x){return x[0]==='aprovacoesCreditos'?[x[0],x[1],x[2],qtd||'']:x;});
        }else{
          var pid=(typeof session!=='undefined' && session?.profId)||'';
          var mine=(state.creditRequests||[]).filter(function(r){return String(r.profId)===String(pid) && isPendingStatus86(r.status);}).length;
          items=items.map(function(x){return x[0]==='clubCreditos'?[x[0],x[1],x[2],mine||x[3]||'']:x;});
        }
      }catch(e){}
      return items;
    };
    try{ navItems=window.navItems; }catch(e){}
  }

  try{
    migrate86();
    if((window.session || (typeof session!=='undefined' && session)) && typeof renderAll==='function') renderAll();
    console.log('V86: aprovacoes de creditos pendentes corrigidas.');
  }catch(e){ console.error('V86 erro:',e); }
})();
</script>


/* ===== V87: Filtros de data no extrato (por data, mês completo, por profissional) ===== */
<script>
(function(){
  const V87 = 'vz_v87_extrato_filtros';
  if(window[V87]) return;
  window[V87] = true;

  /* Estado dos filtros */
  window.vzExtFiltros = window.vzExtFiltros || {
    modo: 'todos',       // 'todos' | 'dataExata' | 'data' | 'mes'
    dataExata: '',
    dataIni: '',
    dataFim: '',
    mes: '',             // 'YYYY-MM'
    profId: ''           // '' = todos
  };

  /* Helpers */
  function v87Num(v){ return Number(v)||0; }
  function v87Brl(v){
    try{ if(typeof brl==='function') return brl(v); }catch(e){}
    return 'R$ '+v87Num(v).toFixed(2).replace('.',',');
  }
  function v87Today(){
    try{ if(typeof today==='function') return today(); }catch(e){}
    return new Date().toISOString().slice(0,10);
  }
  function v87IsAdmin(){
    try{ return typeof isAdmin==='function' && isAdmin(); }catch(e){ return false; }
  }
  function v87MesAtual(){
    return new Date().toISOString().slice(0,7);
  }
  function v87State(){
    try{ if(typeof state!=='undefined' && state) return state; }catch(e){}
    try{ return window.state || {}; }catch(e){ return {}; }
  }
  function v87Esc(v){
    return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function v87Norm(v){
    return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
  }
  function v87ProfId(item){
    return String(item?.profId || item?.vendedorId || item?.profissionalId || '').trim();
  }
  function v87ProfNome(item){
    return String(item?.profNome || item?.vendedorNome || item?.profissionalNome || item?.profissional || '').trim();
  }
  function v87ProfMatch(item,filtro){
    filtro=String(filtro||'').trim();
    if(!filtro) return true;
    const id=v87ProfId(item), nome=v87Norm(v87ProfNome(item));
    if(filtro==='sem') return !id && (!nome || nome==='qualquer' || nome==='sem profissional');
    if(filtro.startsWith('nome:')){
      try{ return nome===v87Norm(decodeURIComponent(filtro.slice(5))); }catch(e){ return false; }
    }
    if(String(id)===String(filtro)) return true;
    const p=(v87State().profissionais||[]).find(x=>String(x.id)===String(filtro));
    return !!(p && nome && nome===v87Norm(p.nome));
  }
  function v87ProfOptionsHTML(filtro){
    const st=v87State(), opts=[], vistosId=new Set(), vistosNome=new Set();
    (st.profissionais||[]).forEach(p=>{
      const id=String(p.id||'').trim(), nome=String(p.nome||'').trim();
      if(!id && !nome) return;
      if(id && vistosId.has(id)) return;
      if(id) vistosId.add(id);
      if(nome) vistosNome.add(v87Norm(nome));
      opts.push([id, (nome||'Profissional')+(p.ativo===false?' (desativado)':'')]);
    });
    let temSem=false;
    [...(st.historico||[]), ...(st.vendasProdutos||[]), ...(st.creditHistory||[])].forEach(item=>{
      const id=v87ProfId(item), nome=v87ProfNome(item), nomeN=v87Norm(nome);
      if(!id && (!nomeN || nomeN==='qualquer' || nomeN==='sem profissional')) temSem=true;
      if(id && !vistosId.has(id)){
        vistosId.add(id);
        if(nomeN) vistosNome.add(nomeN);
        opts.push([id, (nome||'Profissional')+' (histórico)']);
      }else if(!id && nomeN && nomeN!=='qualquer' && !vistosNome.has(nomeN)){
        vistosNome.add(nomeN);
        opts.push(['nome:'+encodeURIComponent(nome), nome+' (histórico)']);
      }
    });
    if(temSem) opts.push(['sem','Sem profissional informado']);
    return opts.map(([valor,label])=>`<option value="${v87Esc(valor)}" ${String(valor)===String(filtro)?'selected':''}>${v87Esc(label)}</option>`).join('');
  }

  /* Aplica filtros sobre uma lista de lançamentos */
  function v87FiltrarLista(list){
    const f = window.vzExtFiltros;

    /* Filtro por profissional */
    let out = f.profId
      ? list.filter(a => v87ProfMatch(a, f.profId))
      : list;

    /* Filtro de data */
    if(f.modo === 'dataExata' && f.dataExata){
      out = out.filter(a => {
        const d = String(a.dataFechamento || a.data || '').slice(0,10);
        return d === f.dataExata;
      });
    } else if(f.modo === 'data' && (f.dataIni || f.dataFim)){
      out = out.filter(a => {
        const d = (a.data||'').trim();
        if(!d) return false;
        if(f.dataIni && d < f.dataIni) return false;
        if(f.dataFim && d > f.dataFim) return false;
        return true;
      });
    } else if(f.modo === 'mes' && f.mes){
      out = out.filter(a => (a.data||'').startsWith(f.mes));
    }
    // modo 'todos' => sem filtro de data

    return out;
  }

  /* Gera o HTML do painel de filtros */
  function v87FiltroBarHTML(){
    const f = window.vzExtFiltros;
    const st = v87State();

    /* Meses disponíveis a partir do histórico */
    const allDatas = (st.historico||[]).map(a=>(a.data||'').slice(0,7)).filter(Boolean);
    const mesesSet = [...new Set(allDatas)].sort().reverse();

    const mesesOpts = mesesSet.map(m=>{
      const [y,mo]=m.split('-');
      const label=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(mo)-1]||mo;
      return `<option value="${m}" ${f.mes===m?'selected':''}>${label}/${y}</option>`;
    }).join('');

    const profOpts = v87IsAdmin() ? v87ProfOptionsHTML(f.profId) : '';

    return `
    <div class="card" id="vzExtFiltroBar" style="margin-bottom:12px">
      <div class="row" style="margin-bottom:10px;align-items:center;gap:8px;flex-wrap:wrap">
        <b style="font-size:15px;color:var(--gold)"><i class="ti ti-filter"></i> Filtros do extrato</b>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          <button class="btn small ${f.modo==='todos'?'primary':''}" onclick="vzExtSetModo('todos')">Todos</button>
          <button class="btn small ${f.modo==='dataExata'?'primary':''}" onclick="vzExtSetModo('dataExata')">Data exata</button>
          <button class="btn small ${f.modo==='mes'?'primary':''}" onclick="vzExtSetModo('mes')">Por mês</button>
          <button class="btn small ${f.modo==='data'?'primary':''}" onclick="vzExtSetModo('data')">Por período</button>
        </div>
      </div>

      ${f.modo==='mes' ? `
      <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="min-width:160px;margin:0">
          <label>Mês</label>
          <select onchange="vzExtFiltros.mes=this.value;vzExtAplicar()">
            <option value="${v87MesAtual()}" ${!f.mes||f.mes===v87MesAtual()?'selected':''}>Mês atual</option>
            ${mesesOpts}
          </select>
        </div>
        ${v87IsAdmin() ? `<div class="field" style="min-width:160px;margin:0">
          <label>Profissional</label>
          <select onchange="vzExtFiltros.profId=this.value;vzExtAplicar()">
            <option value="">Todos</option>${profOpts}
          </select>
        </div>` : ''}
        <button class="btn small good" onclick="vzExtAplicar()"><i class="ti ti-check"></i>Filtrar</button>
      </div>` : ''}

      ${f.modo==='dataExata' ? `
      <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="min-width:150px;margin:0">
          <label>Data exata</label>
          <input type="date" value="${f.dataExata||v87Today()}" onchange="vzExtFiltros.dataExata=this.value;vzExtAplicar()">
        </div>
        ${v87IsAdmin() ? `<div class="field" style="min-width:160px;margin:0">
          <label>Profissional</label>
          <select onchange="vzExtFiltros.profId=this.value;vzExtAplicar()">
            <option value="">Todos</option>${profOpts}
          </select>
        </div>` : ''}
        <button class="btn small good" onclick="vzExtAplicar()"><i class="ti ti-check"></i>Filtrar</button>
      </div>` : ''}

      ${f.modo==='data' ? `
      <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="min-width:150px;margin:0">
          <label>De</label>
          <input type="date" value="${f.dataIni||v87Today()}" onchange="vzExtFiltros.dataIni=this.value">
        </div>
        <div class="field" style="min-width:150px;margin:0">
          <label>Até</label>
          <input type="date" value="${f.dataFim||v87Today()}" onchange="vzExtFiltros.dataFim=this.value">
        </div>
        ${v87IsAdmin() ? `<div class="field" style="min-width:160px;margin:0">
          <label>Profissional</label>
          <select onchange="vzExtFiltros.profId=this.value">
            <option value="">Todos</option>${profOpts}
          </select>
        </div>` : ''}
        <button class="btn small good" onclick="vzExtAplicar()"><i class="ti ti-check"></i>Filtrar</button>
      </div>` : ''}

      ${f.modo==='todos' && v87IsAdmin() ? `
      <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="min-width:160px;margin:0">
          <label>Profissional</label>
          <select onchange="vzExtFiltros.profId=this.value;vzExtAplicar()">
            <option value="">Todos</option>${profOpts}
          </select>
        </div>
        <button class="btn small good" onclick="vzExtAplicar()"><i class="ti ti-check"></i>Filtrar</button>
      </div>` : ''}

    </div>`;
  }

  /* Ações globais */
  window.vzExtSetModo = function(modo){
    window.vzExtFiltros.modo = modo;
    if(modo==='mes' && !window.vzExtFiltros.mes) window.vzExtFiltros.mes = v87MesAtual();
    if(modo==='dataExata'){
      if(!window.vzExtFiltros.dataExata) window.vzExtFiltros.dataExata = v87Today();
      window.vzExtFiltros.dataIni = window.vzExtFiltros.dataExata;
      window.vzExtFiltros.dataFim = window.vzExtFiltros.dataExata;
    }
    if(modo==='data'){
      if(!window.vzExtFiltros.dataIni) window.vzExtFiltros.dataIni = v87Today();
      if(!window.vzExtFiltros.dataFim) window.vzExtFiltros.dataFim = v87Today();
    }
    try{ renderAll(); }catch(e){}
  };

  window.vzExtAplicar = function(){
    /* Ler campos de data manualmente (pode não ter sofrido onchange ainda) */
    const barEl = document.getElementById('vzExtFiltroBar');
    if(barEl){
      const inputs = barEl.querySelectorAll('input[type=date]');
      if(window.vzExtFiltros.modo === 'dataExata'){
        if(inputs[0]){
          window.vzExtFiltros.dataExata = inputs[0].value;
          window.vzExtFiltros.dataIni = inputs[0].value;
          window.vzExtFiltros.dataFim = inputs[0].value;
          window.v88ExtratoDia = window.v88ExtratoDia || {};
          window.v88ExtratoDia.data = inputs[0].value;
          window.v88ExtratoDia.profId = window.vzExtFiltros.profId || '';
          try{sessionStorage.setItem('v88_extrato_dia',JSON.stringify({data:window.v88ExtratoDia.data,profId:window.v88ExtratoDia.profId||''}));}catch(e){}
        }
      }else{
        if(inputs[0]) window.vzExtFiltros.dataIni = inputs[0].value;
        if(inputs[1]) window.vzExtFiltros.dataFim = inputs[1].value;
      }
    }
    try{ renderAll(); }catch(e){}
  };

  /* Wrap do extratoHTML base que injeta filtro de stats + barra */
  const v87BaseExtratoHTML = window.extratoHTML;

  if(typeof v87BaseExtratoHTML === 'function'){
    window.extratoHTML = function(){
      /* Verifica proteção de senha */
      if(window.vzSecure && !window.vzSecure.extrato){
        try{ return v87BaseExtratoHTML(); }catch(e){ return ''; }
      }

      const f = window.vzExtFiltros;

      /* Lista completa do histórico (respeita papel) */
      const stAtual = v87State();
      let fullList = v87IsAdmin()
        ? (stAtual.historico||[])
        : (stAtual.historico||[]).filter(a=>String(v87ProfId(a))===String(window.session?.profId));

      /* Lista filtrada para stats */
      let filtrado = v87FiltrarLista(fullList);

      /* Calcula stats sobre lista filtrada */
      let total = filtrado.reduce((s,a)=>s+v87Num(a.valorFinal),0);
      let com = filtrado.reduce((s,a)=>{
        const p = (stAtual.profissionais||[]).find(p=>String(p.id)===String(v87ProfId(a)));
        return s + v87Num(a.valorFinal)*(v87Num(p?.comissao||0)/100);
      },0);

      /* Descrição do período ativo */
      let periodoDesc = '';
      if(f.modo==='mes' && f.mes){
        const [y,mo]=f.mes.split('-');
        const nomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        periodoDesc = ` • ${nomes[parseInt(mo)-1]}/${y}`;
      } else if(f.modo==='dataExata'){
        periodoDesc = ` • ${f.dataExata||'?'}`;
      } else if(f.modo==='data'){
        periodoDesc = ` • ${f.dataIni||'?'} a ${f.dataFim||'?'}`;
      }
      const profNome = f.profId
        ? ((stAtual.profissionais||[]).find(p=>String(p.id)===String(f.profId))?.nome||'')
        : '';
      if(profNome) periodoDesc += ` • ${profNome}`;

      /* Stats filtrados no topo */
      const statsHTML = `
      <div class="statgrid" style="margin-bottom:12px">
        <div class="stat"><b>${filtrado.length}</b><span>Atendimentos${periodoDesc}</span></div>
        <div class="stat"><b>${v87Brl(total)}</b><span>Total${periodoDesc}</span></div>
        <div class="stat"><b>${v87Brl(com)}</b><span>Comissão${periodoDesc}</span></div>
        <div class="stat"><b>${v87Brl(total-com)}</b><span>Casa${periodoDesc}</span></div>
      </div>`;

      /* HTML base (que já tem seus próprios stats + tabela) */
      let base = '';
      try{ base = v87BaseExtratoHTML(); }catch(e){ base=''; }

      /* Remove o statgrid do base para não duplicar */
      base = base.replace(/<div class="statgrid">[\s\S]*?<\/div>\s*<\/div>\s*<\/div>\s*<\/div>\s*<\/div>/, '');

      /* Filtra a tabela histórico no base — reinjeta apenas linhas filtradas */
      /* Estratégia: gerar nova tabela com lista filtrada usando a função lista() do sistema */
      let tabelaFiltrada = '';
      try{
        if(typeof lista === 'function'){
          tabelaFiltrada = `<div class="card"><h2>Histórico${periodoDesc}</h2>${lista(filtrado.slice().reverse())}</div>`;
        }
      }catch(e){}

      /* Se conseguimos gerar tabela filtrada, usamos; senão cai no base */
      if(tabelaFiltrada){
        /* Remover card de Histórico do base para substituir pelo filtrado */
        base = base.replace(/<div class="card"><h2>Histórico<\/h2>[\s\S]*?(?=<div class="card">|$)/, '');
        return v87FiltroBarHTML() + statsHTML + tabelaFiltrada + base;
      }

      return v87FiltroBarHTML() + statsHTML + base;
    };
  }

  try{
    if(window.session && document.getElementById('app') && !document.getElementById('app').classList.contains('hidden')){
      if(typeof renderAll==='function') renderAll();
    }
    console.log('V87: filtros de data/mês/profissional no extrato carregados.');
  }catch(e){ console.error('V87 erro:',e); }
})();
</script>

<script id="vz88-extrato-dia-fechados">
/* ===== V88: extrato por dia com geral/profissional, produtos e planos ===== */
(function(){
  var FLAG='vizzarty_v88_extrato_dia_fechados';
  if(window[FLAG]) return;
  window[FLAG]=true;

<script id="vz89-leitura-camera-caderno">

(function(){

  function esc89(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function dataAtual89(){ return document.getElementById('v88DiaData')?.value || window.v88ExtratoDia?.data || window.vzExtFiltros?.dataExata || today89(); }
  function profs89(){ try{return Array.isArray(state.profissionais)?state.profissionais:[];}catch(e){return [];} }

      (state.servicos||[]).forEach(function(s){
        [['fila',s.precoFila],['agenda',s.precoAgenda],['especial',s.precoPremium]].forEach(function(p){
          var preco=n89(p[1]), qtd=preco?Math.round(valor/preco):0;

  function renderPreview89(){

  window.v89IdentificarCaderno=function(){

    setStatus89(valores.length?('Identifiquei '+valores.length+' valor(es). Confira antes de adicionar.'):'Não encontrei valores. Você pode digitar manualmente, exemplo: 35+70+30');
  };
  function loadTesseract89(){
    if(window.Tesseract) return Promise.resolve(window.Tesseract);
    if(window.__v89TessPromise) return window.__v89TessPromise;
    window.__v89TessPromise=new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload=function(){resolve(window.Tesseract);};
      s.onerror=function(){reject(new Error('Não consegui carregar a leitura automática. Digite os valores no campo de texto.'));};

  window.v89LerFotoCaderno=async function(){

        state.vendasProdutos=state.vendasProdutos||[];
        state.vendasProdutos.push({id:uid89(),produtoId:i.produtoId||'',produtoNome:i.produtoNome||i.label||'Produto',profId:prof.id,profNome:prof.nome,clienteNome:nome,qtd:n89(i.qtd)||1,precoUnit:total/(n89(i.qtd)||1),total:total,comissaoPct:pct,comissaoValor:total*pct/100,data:data,hora:now89(),createdAt:Date.now(),origem:'camera_caderno'});
      }else{
        state.historico=state.historico||[];
        state.historico.push({id:uid89(),clienteId:'',nome:nome,tel:'',tipo:'caderno',data:data,hora:now89(),servId:i.servId||'',servNome:i.servNome||i.label||'Lançamento do caderno',profId:prof.id,profNome:prof.nome,tempoMin:0,valorOriginal:n89(i.valor),valorFinal:n89(i.valor),qtd:n89(i.qtd)||1,status:'concluido',origem:'camera_caderno',createdAt:Date.now()});
      }

    window.v89Caderno.itens=[];
    window.v89Caderno.texto='';
    try{ if(typeof markDirty==='function') markDirty(); else {saveLocal(); renderAll();} }catch(e){ try{renderAll();}catch(_e){} }
    toast89('Lançamentos do caderno adicionados ao extrato.');
  };
  function profOptions89(){

      var meu=profAtual89();

    }).join('');

  function cardHTML89(){

    return '<div class="card vz89-card"><h2>Leitura do caderno por foto</h2><div class="grid g3">'+
      '<div class="field"><label>Data do lançamento</label><input id="v89CadernoData" type="date" value="'+esc89(dataAtual89())+'"></div>'+

      '<div class="field"><label>Cliente / observação</label><input id="v89CadernoCliente" value="Caderno"></div>'+
      '</div><div class="grid g2"><div class="field"><label>Foto do caderno</label><input id="v89FotoCaderno" type="file" accept="image/*" capture="environment"></div><div class="field" style="align-self:end"><button class="btn blue" type="button" onclick="v89LerFotoCaderno()"><i class="ti ti-camera"></i>Ler foto</button> <button class="btn" type="button" onclick="v89IdentificarCaderno()"><i class="ti ti-list-search"></i>Identificar valores</button></div></div>'+
      '<div class="field"><label>Texto lido ou digitado</label><textarea id="v89CadernoTexto" placeholder="Ex: 35+70+30">'+esc89(window.v89Caderno.texto||'')+'</textarea></div>'+
      '<div id="v89CadernoStatus" class="muted"></div><div id="v89CadernoPreview" class="vz89-preview"></div>'+

<script id="vz90-extrato-central">
/* ===== V90: Central de Extrato e Relatórios — substitui completamente o extratoHTML ===== */
(function(){
  var FLAG='vizzarty_v90_extrato_central_v1';
  if(window[FLAG]) return;
  window[FLAG]=true;

  /* ── helpers seguros ── */
  function n(v){ try{return (typeof num==='function')?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function money(v){ try{return (typeof brl==='function')?brl(v):('R$ '+n(v).toFixed(2).replace('.',','));}catch(e){return 'R$ '+n(v).toFixed(2).replace('.',',');} }
  function todayStr(){ try{return (typeof today==='function')?today():new Date().toISOString().slice(0,10);}catch(e){return new Date().toISOString().slice(0,10);} }
  function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function norm(v){ return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(); }
  function isAdm(){ try{return typeof isAdmin==='function' && isAdmin();}catch(e){return false;} }
  function st(){ try{return (typeof state!=='undefined'&&state)?state:(window.state||{});}catch(e){return {};} }
  function profList(){ return st().profissionais||[]; }
  function profById(id){ return profList().find(function(p){return String(p.id)===String(id);}); }
  function itemProfId(item){ return String((item&&item.profId)||(item&&item.vendedorId)||(item&&item.profissionalId)||'').trim(); }
  function itemProfNome(item){
    var id=itemProfId(item), p=id?profById(id):null;
    return String((item&&item.profNome)||(item&&item.vendedorNome)||(item&&item.profissionalNome)||(p&&p.nome)||'').trim();
  }
  function itemData(item){
    if(item&&item.dataFechamento) return String(item.dataFechamento).slice(0,10);
    if(item&&item.finalizadoEm){ try{return new Date(item.finalizadoEm).toISOString().slice(0,10);}catch(e){} }
    if(item&&item.fechadoEm){ try{return new Date(item.fechadoEm).toISOString().slice(0,10);}catch(e){} }
    if(item&&item.createdAt&&!item.data){ try{return new Date(item.createdAt).toISOString().slice(0,10);}catch(e){} }
    return String((item&&item.data)||'').slice(0,10);
  }
  function fmtData(iso){
    var p=String(iso||'').slice(0,10).split('-');
    return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):(iso||'');
  }
  function comissaoAt(a){
    try{return n(calcComissaoAtendimento(a));}catch(e){
      return n(a.valorFinal)*n(a.comissaoPctAtendimento||0)/100;
    }
  }
  function comissaoVenda(v){
    try{return n(calcComissaoVenda(v));}catch(e){
      return (v.comissaoValor!==undefined)?n(v.comissaoValor):n(v.total)*n(v.comissaoPct)/100;
    }
  }
  function valorAt(a){ return n(a.valorFinal!==undefined?a.valorFinal:a.valorOriginal); }
  function valorVenda(v){ return n(v.total!==undefined?v.total:v.valorFinal); }
  function ehSind(item){
    try{if(typeof beneficioUsaSaldo==='function'&&beneficioUsaSaldo(item))return true;}catch(e){}
    return !!(item&&(item.sindicato===true||item.beneficioUsado===true||String(item.tipoVenda||'').toLowerCase()==='sindicato'||String(item.produtoId||'')==='__sindicato_corte__'||String(item.servId||'')==='__sindicato_corte__'||norm(String(item.servNome||item.produtoNome||'')).indexOf('sindicato')>=0));
  }
  function ehPromoRelampago(v){ return String(v&&v.tipoVenda||'').toLowerCase()==='promocao_relampago'||String(v&&v.origem||'').toLowerCase().indexOf('relampago')>=0; }
  function ehPlanoVenda(h){
    var t=String((h&&h.tipo)||'').toLowerCase();
    return t==='fechamento'||t==='renovacao'||t==='renovacao_rapida'||(!!(h&&h.planoNome)&&h.valorTotal!==undefined&&t!=='uso');
  }
  function valorPlano(h){ return n((h&&h.valorTotal)!==undefined?h.valorTotal:(h&&h.total)); }

  /* ── estado dos filtros ── */
  window.vz90F = window.vz90F || {
    periodo: 'hoje',    // 'hoje'|'ontem'|'7d'|'15d'|'30d'|'mes'|'mesant'|'custom'|'todos'
    dataIni: todayStr(),
    dataFim: todayStr(),
    profId: ''
  };

  /* ── cálculo de período ── */
  function calcPeriodo(periodo){
    var today=todayStr();
    function addDays(iso,d){
      var dt=new Date(iso+'T00:00:00');
      dt.setDate(dt.getDate()+d);
      return dt.toISOString().slice(0,10);
    }
    function mesAtual(){
      var now=new Date();
      var y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0');
      return {ini:y+'-'+m+'-01', fim:today};
    }
    function mesAnterior(){
      var now=new Date();
      now.setDate(1); now.setMonth(now.getMonth()-1);
      var y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0');
      var lastDay=new Date(y,now.getMonth()+1,0).getDate();
      return {ini:y+'-'+m+'-01', fim:y+'-'+m+'-'+String(lastDay).padStart(2,'0')};
    }
    if(periodo==='hoje') return {ini:today, fim:today};
    if(periodo==='ontem') return {ini:addDays(today,-1), fim:addDays(today,-1)};
    if(periodo==='7d') return {ini:addDays(today,-6), fim:today};
    if(periodo==='15d') return {ini:addDays(today,-14), fim:today};
    if(periodo==='30d') return {ini:addDays(today,-29), fim:today};
    if(periodo==='mes') return mesAtual();
    if(periodo==='mesant') return mesAnterior();
    if(periodo==='custom') return {ini:window.vz90F.dataIni||today, fim:window.vz90F.dataFim||today};
    return null; // 'todos'
  }

  /* ── filtragem ── */
  function meuProfId(){
    try{ var s=window.session||(typeof session!=='undefined'?session:null); return String(s&&s.profId||'').trim(); }catch(e){ return ''; }
  }
  function filtrarItem(item){
    var f=window.vz90F;
    var admin=isAdm();
    // REGRA DE ISOLAMENTO: profissional SEMPRE vê apenas os próprios dados, sem exceção
    if(!admin){
      var myId=meuProfId();
      var itemId=String(itemProfId(item)||'').trim();
      // se myId vazio (sessão não carregada) ou ids diferentes: bloqueia
      if(!myId || itemId!==myId) return false;
    } else if(f.profId){
      // admin com filtro de profissional selecionado
      var pId=itemProfId(item), pNome=norm(itemProfNome(item));
      var matchId=String(pId)===String(f.profId);
      var pRef=profById(f.profId);
      var matchNome=pRef&&pNome===norm(pRef.nome||'');
      if(!matchId&&!matchNome) return false;
    }
    // filtro data
    var range=calcPeriodo(f.periodo);
    if(range){
      var d=itemData(item);
      if(!d) return false;
      if(d<range.ini||d>range.fim) return false;
    }
    return true;
  }

  /* ── coleta todos os lançamentos ── */
  function coletarTudo(){
    var s=st();
    var hist=(s.historico||[]);
    var vendas=(s.vendasProdutos||[]);
    var planos=(s.creditHistory||[]).filter(ehPlanoVenda);
    return {hist:hist, vendas:vendas, planos:planos};
  }

  /* ── label do tipo do lançamento ── */
  function labelTipo(item, categoria){
    if(categoria==='plano') return 'Plano/Clube';
    if(categoria==='venda'){
      if(ehSind(item)) return 'Sindicato';
      if(ehPromoRelampago(item)) return 'Promo Relâmpago';
      return 'Produto';
    }
    // atendimento
    var tipo=String(item.tipo||'').toLowerCase();
    if(tipo==='especial'||tipo==='premium') return 'Hor. Especial';
    if(tipo==='agendamento') return 'Agendamento';
    if(item.sindicato) return 'Sindicato';
    if(item.origem==='camera_caderno'||item.origem==='caderno') return 'Caderno';
    return 'Serviço';
  }

  /* ── cálculo de totais ── */
  function calcTotais(histF, vendasF, planosF){
    var totalAt=histF.reduce(function(s,a){return s+valorAt(a);},0);
    var comAt=histF.reduce(function(s,a){return s+comissaoAt(a);},0);
    var totalV=vendasF.reduce(function(s,v){return s+valorVenda(v);},0);
    var comV=vendasF.reduce(function(s,v){return s+comissaoVenda(v);},0);
    var totalP=planosF.reduce(function(s,h){return s+valorPlano(h);},0);
    var total=totalAt+totalV+totalP;
    var comissao=comAt+comV;
    return {totalAt:totalAt,comAt:comAt,totalV:totalV,comV:comV,totalP:totalP,total:total,comissao:comissao,casa:total-comissao,qtdAt:histF.length,qtdV:vendasF.length,qtdP:planosF.length};
  }

  /* ── HTML da barra de filtros ── */
  function filtroBarHTML(){
    var f=window.vz90F;
    var admin=isAdm();
    var periodos=[
      ['hoje','Hoje'],['ontem','Ontem'],['7d','7 dias'],['15d','15 dias'],['30d','30 dias'],
      ['mes','Este mês'],['mesant','Mês anterior'],['custom','Personalizado'],['todos','Tudo']
    ];
    var btns=periodos.map(function(p){
      return '<button class="btn small '+(f.periodo===p[0]?'primary':'')+'" type="button" onclick="vz90SetPeriodo(\''+p[0]+'\')">'+p[1]+'</button>';
    }).join('');

    var customFields='';
    if(f.periodo==='custom'){
      customFields='<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">'+
        '<div class="field" style="min-width:140px;margin:0"><label>De</label><input type="date" value="'+esc(f.dataIni||todayStr())+'" onchange="vz90F.dataIni=this.value"></div>'+
        '<div class="field" style="min-width:140px;margin:0"><label>Até</label><input type="date" value="'+esc(f.dataFim||todayStr())+'" onchange="vz90F.dataFim=this.value"></div>'+
        '<button class="btn small good" type="button" onclick="vz90Aplicar()"><i class="ti ti-check"></i> Filtrar</button>'+
        '</div>';
    }

    var profOpts='';
    if(admin){
      var opts='<option value="">Todos os profissionais</option>';
      var vistos={};
      profList().forEach(function(p){
        if(!p.id) return;
        vistos[String(p.id)]=true;
        opts+='<option value="'+esc(p.id)+'" '+(String(f.profId)===String(p.id)?'selected':'')+'>'+esc(p.nome||'Profissional')+(p.ativo===false?' (desativado)':'')+'</option>';
      });
      // profissionais que aparecem apenas no histórico
      var s=st();
      var allItems=[].concat(s.historico||[],s.vendasProdutos||[],s.creditHistory||[]);
      allItems.forEach(function(item){
        var id=itemProfId(item), nome=itemProfNome(item);
        if(id && !vistos[String(id)]){
          vistos[String(id)]=true;
          opts+='<option value="'+esc(id)+'" '+(String(f.profId)===String(id)?'selected':'')+'>'+esc((nome||'Profissional')+' (histórico)')+'</option>';
        }
      });
      profOpts='<div class="field" style="min-width:180px;margin:0"><label>Profissional</label><select onchange="vz90F.profId=this.value;vz90Aplicar()">'+opts+'</select></div>';
    }

    var range=calcPeriodo(f.periodo);
    var descPeriodo='';
    if(range&&range.ini===range.fim) descPeriodo=fmtData(range.ini);
    else if(range) descPeriodo=fmtData(range.ini)+' a '+fmtData(range.fim);
    else descPeriodo='Todo o histórico';
    if(f.profId){
      var pRef=profById(f.profId);
      if(pRef) descPeriodo+=' — '+esc(pRef.nome||'');
    }

    return '<div class="card" id="vz90FilterBar" style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px">'+
      '<b style="font-size:15px;color:var(--gold)"><i class="ti ti-report-analytics"></i> Extrato &amp; Relatórios</b>'+
      (descPeriodo?'<span class="muted" style="font-size:13px">'+esc(descPeriodo)+'</span>':'')+
      '</div>'+
      '<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:6px">'+btns+'</div>'+
      (profOpts?'<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">'+profOpts+'</div>':'')+
      customFields+

  /* ── HTML do resumo de stats ── */
  function statsHTML(t, admin){

      return '<div class="statgrid" style="margin-bottom:12px">'+
        '<div class="stat"><b>'+t.qtdAt+'</b><span>Atendimentos</span></div>'+

  /* ── HTML da tabela de atendimentos ── */
  function tabelaAtHTML(histF, admin){
    if(!histF.length){
      return '<div class="card"><h2>Atendimentos</h2><p class="muted">Nenhum atendimento no período.</p></div>';

    var rows=histF.slice().reverse().map(function(a){
      var tipo=labelTipo(a,'at');

      if(admin){
        return '<tr><td>'+esc(fmtData(itemData(a)))+'</td><td>'+esc(a.hora||'')+'</td>'+
          '<td>'+esc(a.nome||a.clienteNome||'—')+'</td>'+
          '<td>'+esc(a.servNome||'Atendimento')+' '+badge+'</td>'+
          '<td>'+esc(itemProfNome(a)||'—')+'</td>'+
          '<td>'+money(valorAt(a))+'</td>'+
          '<td>'+money(comissaoAt(a))+'</td></tr>';
      } else {
        return '<tr><td>'+esc(fmtData(itemData(a)))+'</td><td>'+esc(a.hora||'')+'</td>'+
          '<td>'+esc(a.nome||a.clienteNome||'—')+'</td>'+
          '<td>'+esc(a.servNome||'Atendimento')+' '+badge+'</td>'+
          '<td>'+money(comissaoAt(a))+'</td></tr>';
      }
    }).join('');
    var heads=admin
      ? ['Data','Hora','Cliente','Serviço','Profissional','Valor','Comissão']
      : ['Data','Hora','Cliente','Serviço','Comissão'];
    return '<div class="card"><h2>Atendimentos ('+histF.length+')</h2>'+
      '<div style="overflow:auto"><table style="min-width:700px"><tr>'+
      heads.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>'+rows+'</table></div></div>';
  }

  /* ── HTML da tabela de produtos/benefícios ── */
  function tabelaVendasHTML(vendasF, admin){
    if(!vendasF.length){
      return '<div class="card"><h2>Produtos &amp; Benefícios</h2><p class="muted">Nenhum lançamento no período.</p></div>';
    }
    var rows=vendasF.slice().reverse().map(function(v){
      var tipo=labelTipo(v,'venda');
      var badge='<span class="badge '+(ehSind(v)?'b-premium':ehPromoRelampago(v)?'b-agendamento':'b-ok')+'">'+esc(tipo)+'</span>';
      if(admin){
        return '<tr><td>'+esc(fmtData(itemData(v)))+'</td><td>'+esc(v.hora||'')+'</td>'+
          '<td>'+esc(v.clienteNome||'—')+'</td>'+
          '<td>'+esc(v.produtoNome||v.nome||'Produto')+' '+badge+'</td>'+
          '<td>'+n(v.qtd||1)+'</td>'+
          '<td>'+esc(itemProfNome(v)||'—')+'</td>'+
          '<td>'+money(valorVenda(v))+'</td>'+
          '<td>'+money(comissaoVenda(v))+'</td></tr>';
      } else {
        return '<tr><td>'+esc(fmtData(itemData(v)))+'</td><td>'+esc(v.hora||'')+'</td>'+
          '<td>'+esc(v.produtoNome||v.nome||'Produto')+' '+badge+'</td>'+
          '<td>'+n(v.qtd||1)+'</td>'+
          '<td>'+money(comissaoVenda(v))+'</td></tr>';
      }
    }).join('');
    var heads=admin
      ? ['Data','Hora','Cliente','Item','Qtd','Profissional','Valor','Comissão']
      : ['Data','Hora','Item','Qtd','Comissão'];
    return '<div class="card"><h2>Produtos &amp; Benefícios ('+vendasF.length+')</h2>'+
      '<div style="overflow:auto"><table style="min-width:700px"><tr>'+
      heads.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>'+rows+'</table></div></div>';
