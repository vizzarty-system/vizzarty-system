<script>

/* ===== V54: proteção global carregada antes do sistema ===== */
window.vzSecure = window.vzSecure || { painel:false, extrato:false };

window.vzAdminSenhaAtual = function(){
  try{return String(window.state?.config?.adminSenha || state?.config?.adminSenha || '1234').trim();}catch(e){return '1234';}
};

window.vzOpenSenhaModal = function(opts){
  opts = opts || {};
  let id = 'vzSenhaModal';
  let old = document.getElementById(id);
  if(old) old.remove();

  let div = document.createElement('div');
  div.className = 'vz-modal-bg';
  div.id = id;
  div.innerHTML = `
    <div class="vz-modal">
      <h2>${opts.titulo || 'Área protegida'}</h2>
      <p>${opts.texto || 'Digite a senha do administrador para visualizar essas informações.'}</p>
      <div class="field">
        <label>Senha do administrador</label>
        <div class="vz-pass-wrap">
          <input id="vzModalSenhaInput" type="password" placeholder="Digite a senha">
          <button type="button" onclick="vzToggleModalSenha()" title="Mostrar/ocultar senha"><i class="ti ti-eye"></i></button>
        </div>
      </div>
      <div id="vzModalErro" class="vz-auth-error">Senha incorreta.</div>
      <div class="vz-modal-actions">
        <button class="btn" onclick="document.getElementById('vzSenhaModal')?.remove()">Cancelar</button>
        <button class="btn primary" onclick="vzConfirmarSenhaModal('${opts.tipo || 'painel'}')"><i class="ti ti-lock-open"></i> Liberar</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  setTimeout(()=>document.getElementById('vzModalSenhaInput')?.focus(),80);
  window.vzModalCallback = opts.callback || null;
};

window.vzToggleModalSenha = function(){
  let i = document.getElementById('vzModalSenhaInput');
  if(i) i.type = i.type === 'password' ? 'text' : 'password';
};

window.vzConfirmarSenhaModal = function(tipo){
  let input = document.getElementById('vzModalSenhaInput');
  let erro = document.getElementById('vzModalErro');
  let senha = String(input?.value || '').trim();
  if(senha !== vzAdminSenhaAtual()){
    if(erro) erro.style.display='block';
    return;
  }
  if(tipo === 'extrato') window.vzSecure.extrato = true;
  if(tipo === 'painel') window.vzSecure.painel = true;
  document.getElementById('vzSenhaModal')?.remove();

  if(typeof window.vzModalCallback === 'function'){
    let cb = window.vzModalCallback;
    window.vzModalCallback = null;
    cb();
  }else{
    try{ renderAll(); }catch(e){}
  }
};

window.vzBloqueioExtratoHTML = function(){
  return `<div class="vz-lock-card">
    <div class="lock-icon"><i class="ti ti-lock"></i></div>
    <h2>Extrato protegido</h2>
    <p class="muted">Para ver comissões, faturamento e histórico financeiro, libere com a senha do administrador.</p>
    <button class="btn primary" onclick="vzOpenSenhaModal({tipo:'extrato',titulo:'Liberar extrato',texto:'Digite a senha do administrador para abrir o extrato.',callback:function(){current='extrato';renderAll();}})">
      <i class="ti ti-eye"></i> Visualizar extrato
    </button>
  </div>`;
};

window.vzAbrirExtrato = function(){
  if(window.vzSecure.extrato){
    current='extrato';
    renderAll();
    return;
  }
  current='extrato';
  renderAll();
};

window.vzPainelValorProtegido = function(valor, label){
  if(window.vzSecure && window.vzSecure.painel){
    return `<div class="vz-secure-value"><b>${valor}</b></div><span>${label}</span>`;
  }
  return `<div class="vz-secure-value"><span class="vz-secure-mask">R$ ••••</span><button class="vz-eye-btn" onclick="vzOpenSenhaModal({tipo:'painel',titulo:'Visualizar faturamento',texto:'Digite a senha do administrador para liberar os valores de faturamento do painel.'})" title="Visualizar com senha"><i class="ti ti-eye"></i></button></div><span>${label}</span>`;
};

function showLoginMsg(msg){
  let box=document.getElementById('loginMsg');
  if(box){
    box.textContent=msg;
    box.classList.remove('hidden');
  }else{
    toast(msg);
  }
}
function clearLoginMsg(){
  let box=document.getElementById('loginMsg');
  if(box){
    box.textContent='';
    box.classList.add('hidden');
  }
}
function doLogin(){
  try{
    clearLoginMsg();
    normalize();
    saveLocal();

    const role=(byId('loginRole')?.value||'admin');
    const pass=(byId('loginPass')?.value||'').trim();

    if(!pass){showLoginMsg('Digite a senha para entrar.');return;}

    if(role==='admin'){
      const adminPass=String(state.config?.adminSenha || '1234').trim();
      if(pass!==adminPass){showLoginMsg('Senha do administrador incorreta.');return;}
      session={role:'admin',nome:'Administrador',loginAt:Date.now()};
    }else{
      const profId=byId('loginProf')?.value||'';
      if(!profId){showLoginMsg('Selecione o profissional.');return;}
      const p=state.profissionais.find(x=>String(x.id)===String(profId));
      if(!p){showLoginMsg('Profissional não encontrado. Entre como admin e confira o cadastro.');return;}
      if(p.ativo===false){showLoginMsg('Esse profissional está desativado pelo administrador.');return;}
      const profPass=String(p.senha || '1234').trim();
      if(pass!==profPass){showLoginMsg('Senha do profissional incorreta.');return;}
      session={role:'prof',profId:p.id,nome:p.nome||'Profissional',loginAt:Date.now()};
    }

    localStorage.setItem('vz_session',JSON.stringify(session));
    hide(byId('loginBox'));
    show(byId('app'));
    renderAll();
    toast('Login realizado com sucesso');
  }catch(e){
    console.error('ERRO LOGIN:',e);
    showLoginMsg('Erro ao entrar: '+String(e.message||e));
  }
}
function logout(){
  localStorage.removeItem('vz_session');
  location.reload();
}
function renderLoginProfs(){
  try{
    const roleEl=byId('loginRole'), wrap=byId('loginProfWrap'), sel=byId('loginProf');
    if(!roleEl||!wrap||!sel)return;
    const isProf=roleEl.value==='prof';
    wrap.style.display=isProf?'block':'none';
    if(!isProf){sel.innerHTML='';clearLoginMsg();return;}
    normalize();
    const ativos=state.profissionais.filter(p=>p.ativo!==false);
    if(!ativos.length){
      sel.innerHTML='<option value="">Nenhum profissional ativo cadastrado</option>';
      showLoginMsg('Nenhum profissional ativo cadastrado. Entre como admin, cadastre o profissional, defina a senha e salve.');

    sel.innerHTML='<option value="">Selecione o profissional</option>'+ativos.map(p=>`<option value="${p.id}">${p.nome||'Profissional sem nome'}</option>`).join('');
    clearLoginMsg();

}

function servicosHTML(){
  return `<div class="card"><h2>Serviços e valores</h2><p class="muted">Cadastre valores diferentes para fila, agendamento normal e especial. A edição acontece direto nesta tela.</p><div class="grid g4"><div class="field"><label>Serviço</label><input id="svNome"></div><div class="field"><label>Fila R$</label><input id="svFila" type="number" value="35"></div><div class="field"><label>Agendamento R$</label><input id="svAg" type="number" value="40"></div><div class="field"><label>Horário especial R$</label><input id="svPr" type="number" value="50"></div></div><div class="grid g3"><div class="field"><label>Duração fila</label><input id="duFila" type="number" value="20"></div><div class="field"><label>Duração agenda</label><input id="duAg" type="number" value="30"></div><div class="field"><label>Duração horário especial</label><input id="duPr" type="number" value="40"></div></div><button class="btn primary" onclick="addServico()"><i class="ti ti-plus"></i>Adicionar serviço</button></div><div class="card"><h2>Lista de serviços</h2>${state.servicos.length?state.servicos.map(s=>`<div class="item"><div class="item-head"><div style="flex:1"><div class="grid g4"><div class="field"><label>Nome</label><input id="svc_nome_${s.id}" value="${String(s.nome||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Fila R$</label><input id="svc_fila_${s.id}" type="number" value="${num(s.precoFila)}"></div><div class="field"><label>Agenda R$</label><input id="svc_ag_${s.id}" type="number" value="${num(s.precoAgenda)}"></div><div class="field"><label>Horário especial R$</label><input id="svc_pr_${s.id}" type="number" value="${num(s.precoPremium)}"></div></div><div class="grid g3"><div class="field"><label>Duração fila</label><input id="svc_duf_${s.id}" type="number" value="${num(s.durFila)||20}"></div><div class="field"><label>Duração agenda</label><input id="svc_dua_${s.id}" type="number" value="${num(s.durAgenda)||30}"></div><div class="field"><label>Duração horário especial</label><input id="svc_dup_${s.id}" type="number" value="${num(s.durPremium)||40}"></div></div>${s.ativo===false?'<span class="badge b-off">desativado</span>':'<span class="badge b-ok">ativo</span>'} ${s.linkAtivo===false?'<span class="badge b-off">fora do link</span>':'<span class="badge b-ok">no link</span>'}</div><div class="row"><button class="btn small blue" onclick="saveServico('${s.id}')"><i class="ti ti-device-floppy"></i>Salvar</button><button class="btn small ${s.ativo===false?'good':'bad'}" onclick="toggleServico('${s.id}')">${s.ativo===false?'Ativar':'Desativar'}</button><button class="btn small ${s.linkAtivo===false?'good':'blue'}" onclick="toggleServicoLink('${s.id}')">${s.linkAtivo===false?'Mostrar no link':'Ocultar do link'}</button><button class="btn small bad" onclick="deleteServico('${s.id}')"><i class="ti ti-trash"></i>Excluir</button></div></div></div>`).join(''):'<div class="muted">Nenhum serviço.</div>'}</div>${pendenciasHTML()}`
}
function addServico(){let s={id:uid(),nome:svNome.value.trim(),precoFila:num(svFila.value),precoAgenda:num(svAg.value),precoPremium:num(svPr.value),durFila:num(duFila.value)||20,durAgenda:num(duAg.value)||30,durPremium:num(duPr.value)||40,ativo:true};if(!s.nome)return toast('Nome obrigatório');if(!isAdmin()){state.pendencias.push({tipo:'servico',servico:s,profId:session.profId});toast('Serviço enviado para aprovação')}else state.servicos.push(s);markDirty()}
function saveServico(id){if(!canAdmin())return;let s=state.servicos.find(s=>String(s.id)===String(id));if(!s)return;let nome=document.getElementById('svc_nome_'+id)?.value.trim();if(!nome)return toast('Nome obrigatório');Object.assign(s,{nome,precoFila:num(document.getElementById('svc_fila_'+id)?.value),precoAgenda:num(document.getElementById('svc_ag_'+id)?.value),precoPremium:num(document.getElementById('svc_pr_'+id)?.value),durFila:num(document.getElementById('svc_duf_'+id)?.value)||20,durAgenda:num(document.getElementById('svc_dua_'+id)?.value)||30,durPremium:num(document.getElementById('svc_dup_'+id)?.value)||40});markDirty();toast('Serviço salvo')}
function editServico(id){saveServico(id)}
function toggleServico(id){if(!canAdmin())return;let s=state.servicos.find(s=>String(s.id)===String(id));if(!s)return;s.ativo=s.ativo===false;markDirty()}
function deleteServico(id){if(!canAdmin())return;if(!confirm('Excluir este serviço? Histórico antigo continuará salvo pelo nome/valor do atendimento.'))return;state.servicos=state.servicos.filter(s=>String(s.id)!==String(id));markDirty()}
function profissionaisHTML(){
  return `<div class="card"><h2>Profissionais</h2><p class="muted">Edite, desative ou exclua direto no card. Desativado não aparece no link do cliente nem em novos atendimentos.</p><div class="grid g4"><div class="field"><label>Nome</label><input id="pfNome"></div><div class="field"><label>Telefone</label><input id="pfTel"></div><div class="field"><label>Comissão %</label><input id="pfCom" type="number" value="60"></div><div class="field"><label>Senha</label><input id="pfSenha" type="password" value="1234"></div></div><div class="field"><label>Foto</label><input id="pfFoto" type="file" accept="image/*"></div><button class="btn primary" onclick="addProf()"><i class="ti ti-plus"></i>Adicionar profissional</button></div><div class="card"><h2>Lista de profissionais</h2>${state.profissionais.length?state.profissionais.map(p=>`<div class="item"><div class="item-head"><div class="row">${p.foto?`<img class="prof-photo" src="${p.foto}">`:''}<div style="flex:1"><div class="grid g4"><div class="field"><label>Nome</label><input id="pf_nome_${p.id}" value="${String(p.nome||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Telefone</label><input id="pf_tel_${p.id}" value="${String(p.telefone||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Comissão %</label><input id="pf_com_${p.id}" type="number" value="${num(p.comissao)||60}"></div><div class="field"><label>Senha</label><div class="pass-wrap"><input id="pf_senha_${p.id}" type="password" value="${String(p.senha||'1234').replace(/"/g,'&quot;')}"><button class="btn small blue eye-btn" onclick="requestShowProfSenha('${p.id}')" title="Visualizar com senha admin"><i class="ti ti-eye"></i></button></div></div></div><div class="field"><label>Trocar foto</label><input id="pf_foto_${p.id}" type="file" accept="image/*"></div>${p.ativo===false?'<span class="badge b-off">desativado</span>':'<span class="badge b-ok">ativo</span>'}</div></div><div class="row"><button class="btn small blue" onclick="saveProf('${p.id}')"><i class="ti ti-device-floppy"></i>Salvar</button><button class="btn small ${p.ativo===false?'good':'bad'}" onclick="toggleProf('${p.id}')">${p.ativo===false?'Ativar':'Desativar'}</button><button class="btn small bad" onclick="deleteProf('${p.id}')"><i class="ti ti-trash"></i>Excluir</button>${p.telefone?`<button class="btn small good" onclick="openWhats('${p.telefone}','Olá ${p.nome}')">WhatsApp</button>`:''}</div></div></div>`).join(''):'<div class="muted">Nenhum profissional cadastrado.</div>'}</div><div class="card"><h2>Bloquear profissional em data</h2><div class="grid g4"><div class="field"><label>Profissional</label><select id="blProf">${state.profissionais.filter(p=>p.ativo!==false).map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="blData" type="date" value="${today()}"></div><div class="field"><label>Início</label><input id="blIni" type="time" value="08:00"></div><div class="field"><label>Fim</label><input id="blFim" type="time" value="18:00"></div></div><button class="btn primary" onclick="addBloqueio()">Bloquear</button>${state.bloqueios.map((b,i)=>`<div class="item">${state.profissionais.find(p=>String(p.id)===String(b.profId))?.nome||''} • ${b.data} ${b.ini}-${b.fim} <button class="btn small bad" onclick="state.bloqueios.splice(${i},1);markDirty()">Remover</button></div>`).join('')}</div>`
}
async function fileData(f){if(!f)return '';return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
async function addProf(){if(!pfNome.value.trim())return toast('Nome obrigatório');state.profissionais.push({id:uid(),nome:pfNome.value.trim(),telefone:pfTel.value.trim(),comissao:num(pfCom.value)||60,senha:pfSenha.value||'1234',foto:await fileData(pfFoto.files[0]),ativo:true,esp:'Barbeiro'});markDirty()}
async function saveProf(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===String(id));if(!p)return;let nome=document.getElementById('pf_nome_'+id)?.value.trim();if(!nome)return toast('Nome obrigatório');p.nome=nome;p.telefone=document.getElementById('pf_tel_'+id)?.value.trim()||'';p.comissao=num(document.getElementById('pf_com_'+id)?.value)||60;p.senha=document.getElementById('pf_senha_'+id)?.value||'1234';let foto=await fileData(document.getElementById('pf_foto_'+id)?.files?.[0]);if(foto)p.foto=foto;markDirty();toast('Profissional salvo')}
function editProf(id){saveProf(id)}
function toggleProf(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===String(id));if(!p)return;p.ativo=!p.ativo;markDirty()}
function deleteProf(id){if(!canAdmin())return;if(!confirm('Excluir este profissional? Atendimentos antigos continuam no histórico com nome/valor já registrados.'))return;state.profissionais=state.profissionais.filter(p=>String(p.id)!==String(id));state.bloqueios=state.bloqueios.filter(b=>String(b.profId)!==String(id));markDirty()}
function addBloqueio(){if(!blProf.value)return toast('Selecione um profissional');state.bloqueios.push({profId:blProf.value,data:blData.value,ini:blIni.value,fim:blFim.value});markDirty()}
function pendenciasHTML(){if(!isAdmin()||!state.pendencias.length)return '';return `<div class="card"><h2>Aprovações pendentes</h2>${state.pendencias.map((p,i)=>`<div class="item"><b>${p.tipo==='servico'?'Serviço':'Atendimento'}</b><div class="muted">${p.servico?.nome||p.nome||''}</div><button class="btn small good" onclick="approve(${i})">Aprovar</button> <button class="btn small bad" onclick="reject(${i})">Recusar</button></div>`).join('')}</div>`}function approve(i){let p=state.pendencias[i];if(p.tipo==='servico')state.servicos.push(p.servico);else state.fila.push({...p,pendenteAdmin:false});state.pendencias.splice(i,1);markDirty()}function reject(i){state.pendencias.splice(i,1);markDirty()}
function vouchersHTML(){return `<div class="card"><h2>Vouchers</h2><div class="grid g3"><div class="field"><label>Quantidade</label><input id="vcQtd" type="number" value="1"></div><div class="field"><label>Desconto %</label><input id="vcPct" type="number" value="10"></div><div class="field"><label>Validade</label><input id="vcVal" type="date" value="${today()}"></div></div><button class="btn primary" onclick="gerarVouchers()">Gerar</button></div><div class="card"><h2>Lista</h2>${state.vouchers.map(v=>`<div class="item"><b>${v.codigo}</b> • ${v.percentual}% • validade ${v.validade} ${v.usado?'<span class="badge b-off">usado</span>':'<span class="badge b-ok">livre</span>'}<div class="row" style="margin-top:8px"><button class="btn small good" onclick="openWhats('', 'Você ganhou uma cortesia Vizzarty: use o voucher ${v.codigo} e ganhe ${v.percentual}% de desconto. Link: ${clientLink()}')">Enviar WhatsApp</button></div></div>`).join('')}</div>`}function gerarVouchers(){for(let i=0;i<(num(vcQtd.value)||1);i++)state.vouchers.push({id:uid(),codigo:'VIZ'+Math.random().toString(36).slice(2,8).toUpperCase(),percentual:num(vcPct.value)||10,validade:vcVal.value||today(),usado:false});markDirty()}
function extratoHTMLBaseV53(){let list=(isAdmin()?state.historico:state.historico.filter(a=>String(a.profId)===String(session.profId)));let total=list.reduce((s,a)=>s+num(a.valorFinal),0),com=list.reduce((s,a)=>{let p=state.profissionais.find(p=>String(p.id)===String(a.profId));return s+num(a.valorFinal)*(num(p?.comissao||0)/100)},0);return `<div class="statgrid"><div class="stat"><b>${list.length}</b><span>Atendimentos</span></div><div class="stat"><b>${brl(total)}</b><span>Total</span></div><div class="stat"><b>${brl(com)}</b><span>Comissão</span></div><div class="stat"><b>${brl(total-com)}</b><span>Casa</span></div></div><div class="card"><h2>Histórico</h2>${lista(list.slice().reverse())}</div>`}

function extratoHTML(){
  if(!window.vzSecure || !window.vzSecure.extrato){

function clientLink(){return location.origin+location.pathname+'?cliente=1'}function linkHTML(){return `<div class="card"><h2>Link único do cliente</h2><p class="muted">Cliente escolhe fila ou agendamento no mesmo link.</p><input value="${clientLink()}" readonly onclick="this.select()"><div class="row" style="margin-top:10px"><button class="btn primary" onclick="navigator.clipboard.writeText('${clientLink()}');toast('Copiado')">Copiar</button><button class="btn good" onclick="openWhats('', 'Agende ou entre na fila: ${clientLink()}')">Enviar WhatsApp</button></div></div>`}
function configHTML(){let h=state.horarios,c=state.config;return `<div class="grid g2"><div class="card"><h2>Dados da barbearia</h2><div class="field"><label>Nome</label><input id="cfgNome" value="${c.nome}"></div><div class="field"><label>Telefone</label><input id="cfgTel" value="${c.telefone||''}"></div><div class="field"><label>Endereço</label><input id="cfgEnd" value="${c.endereco||''}"></div><div class="field"><label>Senha admin</label><input id="cfgSenha" value="${c.adminSenha||'1234'}"></div><div class="field"><label>Logo</label><input id="cfgLogo" type="file" accept="image/*"></div><button class="btn primary" onclick="saveConfig()">Salvar</button></div><div class="card"><h2>Link do cliente</h2><p class="muted">Ative/desative o que aparece no link público.</p><div class="grid g2"><div class="field"><label>Fila no link</label><select id="linkFila"><option value="true" ${c.linkFilaAtiva!==false?'selected':''}>Ativa</option><option value="false" ${c.linkFilaAtiva===false?'selected':''}>Desativada</option></select></div><div class="field"><label>Agendamento no link</label><select id="linkAgenda"><option value="true" ${c.linkAgendaAtiva!==false?'selected':''}>Ativo</option><option value="false" ${c.linkAgendaAtiva===false?'selected':''}>Desativado</option></select></div></div><button class="btn primary" onclick="saveLinkPublico()">Salvar link público</button></div></div><div class="grid g2"><div class="card"><h2>Horários normais</h2><div class="grid g2"><div class="field"><label>Fila início</label><input id="hf1" type="time" value="${h.filaIni}"></div><div class="field"><label>Fila fim</label><input id="hf2" type="time" value="${h.filaFim}"></div><div class="field"><label>Agenda normal início</label><input id="ha1" type="time" value="${h.agendaIni}"></div><div class="field"><label>Agenda normal fim</label><input id="ha2" type="time" value="${h.agendaFim}"></div></div><button class="btn primary" onclick="saveHorarios()">Salvar horários normais</button></div><div class="card"><h2>Horários especiais</h2><p class="muted">Crie vários horários especiais com nomes diferentes. Quando estiver ativo, aparece no link do cliente e usa o valor/duração de horário especial.</p><div class="grid g3"><div class="field"><label>Nome</label><input id="heNome" placeholder="Ex: Especial feriado"></div><div class="field"><label>Início</label><input id="heIni" type="time" value="19:00"></div><div class="field"><label>Fim</label><input id="heFim" type="time" value="22:00"></div></div><button class="btn primary" onclick="addHorarioEspecial()"><i class="ti ti-plus"></i>Adicionar horário especial</button>${(state.horariosEspeciais||[]).map(x=>`<div class="item"><div class="grid g4"><div class="field"><label>Nome</label><input id="he_nome_${x.id}" value="${String(x.nome||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Início</label><input id="he_ini_${x.id}" type="time" value="${x.ini||''}"></div><div class="field"><label>Fim</label><input id="he_fim_${x.id}" type="time" value="${x.fim||''}"></div><div class="field"><label>Status</label><select id="he_ativo_${x.id}"><option value="true" ${x.ativo!==false?'selected':''}>Ativo no link</option><option value="false" ${x.ativo===false?'selected':''}>Desativado</option></select></div></div><div class="row"><button class="btn small blue" onclick="saveHorarioEspecial('${x.id}')">Salvar</button><button class="btn small ${x.ativo===false?'good':'bad'}" onclick="toggleHorarioEspecial('${x.id}')">${x.ativo===false?'Ativar':'Desativar'}</button><button class="btn small bad" onclick="deleteHorarioEspecial('${x.id}')">Excluir</button></div></div>`).join('')}</div></div><div class="card"><h2>Senhas dos profissionais</h2><p class="muted">As senhas ficam ocultas. Para visualizar, clique no olho e confirme a senha do admin.</p>${state.profissionais.length?state.profissionais.map(p=>`<div class="config-prof-pass"><div><b>${p.nome||'Sem nome'}</b><div class="muted">${p.ativo===false?'Desativado':'Ativo'} ${p.telefone?'• '+p.telefone:''}</div></div><div class="field" style="margin:0"><label>Senha</label><div class="pass-wrap"><input id="cfg_prof_senha_${p.id}" type="password" value="${String(p.senha||'1234').replace(/"/g,'&quot;')}"><button class="btn small blue eye-btn" onclick="requestShowProfSenha('${p.id}')" title="Visualizar com senha admin"><i class="ti ti-eye"></i></button></div></div><button class="btn small primary" onclick="saveProfPassFromConfig('${p.id}')">Salvar senha</button></div>`).join(''):'<div class="muted">Nenhum profissional cadastrado.</div>'}</div><div class="card"><h2>Manutenção</h2><button class="btn blue" onclick="syncNow(true)">Forçar salvar na nuvem</button> <button class="btn bad" onclick="if(confirm('Limpar dados locais?')){localStorage.removeItem('vz_state');location.reload()}">Limpar local</button></div>`}async function saveConfig(){state.config.nome=cfgNome.value;state.config.telefone=cfgTel.value;state.config.endereco=cfgEnd.value;state.config.adminSenha=cfgSenha.value||'1234';let l=await fileData(cfgLogo.files[0]);if(l)state.config.logo=l;markDirty()}function saveLinkPublico(){state.config.linkFilaAtiva=linkFila.value==='true';state.config.linkAgendaAtiva=linkAgenda.value==='true';markDirty();toast('Link público atualizado')}function saveHorarios(){Object.assign(state.horarios,{filaIni:hf1.value,filaFim:hf2.value,agendaIni:ha1.value,agendaFim:ha2.value});markDirty()}function addHorarioEspecial(){let nome=heNome.value.trim(),ini=heIni.value,fim=heFim.value;if(!nome||!ini||!fim)return toast('Preencha nome, início e fim');state.horariosEspeciais.push({id:uid(),nome,ini,fim,ativo:true});markDirty()}function saveHorarioEspecial(id){let x=state.horariosEspeciais.find(h=>String(h.id)===String(id));if(!x)return;x.nome=document.getElementById('he_nome_'+id).value.trim()||'Horário especial';x.ini=document.getElementById('he_ini_'+id).value;x.fim=document.getElementById('he_fim_'+id).value;x.ativo=document.getElementById('he_ativo_'+id).value==='true function profModeAllowed(p,mode){
  if(!p||p.ativo===false)return false;
  if(mode==='fila')return p.atendeFila!==false;
  if(mode==='agendamento')return p.atendeAgenda!==false;
  if(mode==='especial')return p.atendeEspecial!==false;
  return true;
}
function profHorarioOk(p,hora){
  if(!p||!hora)return true;
  return inRange(hora,p.atendeIni||'08:00',p.atendeFim||'18:30');
}
function modalidadeDisponivel(mode,hora=nowHH(),data=today()){
  if(mode==='fila'&&state.config.linkFilaAtiva===false)return false;
  if((mode==='agendamento'||mode==='especial')&&state.config.linkAgendaAtiva===false)return false;
  if(mode==='especial'&&!specialInfo(hora))return (state.horariosEspeciais||[]).some(h=>h.ativo!==false);
  return state.profissionais.some(p=>profModeAllowed(p,mode)&&profHorarioOk(p,hora)&&!state.bloqueios.some(b=>String(b.profId)===String(p.id)&&b.data===data&&(!hora||inRange(hora,b.ini,b.fim))));
}

function profsDisponiveis(data=today(),hora='',mode=''){

function agendaSlots(mode='todos'){

function freeSlotsFor(data,servId,profId='',mode='agendamento'){

/* ===== V42: saldo único do benefício mensal =====
   Regra: produto, serviço comum, corte pelo sindicato e link do cliente consomem a mesma quantidade disponível. */
function beneficioMesKey(d){return (d||today()).slice(0,7)}
function beneficioQtdItem(a){return Math.max(1,num(a?.beneficioQtd||1)||1)}
function beneficioQtdVenda(v){return Math.max(1,num(v?.qtd)||1)}
function beneficioUsaSaldo(x){return !!(x && (x.beneficioUsado===true || x.sindicato===true || x.tipoVenda==='sindicato'))}
function beneficioQtdUsadaMes(mes=beneficioMesKey(today())){
  let atendimentos=[...(state.fila||[]),...(state.historico||[]),...(state.pendencias||[])];
  let qtdAt=atendimentos.filter(a=>beneficioUsaSaldo(a) && beneficioMesKey(a.data)===mes).reduce((s,a)=>s+beneficioQtdItem(a),0);
  let qtdProd=(state.vendasProdutos||[]).filter(v=>beneficioUsaSaldo(v) && beneficioMesKey(v.data)===mes).reduce((s,v)=>s+beneficioQtdVenda(v),0);
  return qtdAt+qtdProd;
}
// Mantém compatibilidade com as telas antigas do sindicato, mas agora a contagem é do benefício total.
sindicatoQtdUsadaMes = function(mes=beneficioMesKey(today())){return beneficioQtdUsadaMes(mes)};
sindicatoLimiteRestante = function(){let limite=num(state.config.sindicatoLimiteMensal||0); if(!limite)return 999999; return Math.max(0,limite-beneficioQtdUsadaMes())};
sindicatoIndisponivelMsg = function(){return 'Este benefício acabou e só estará disponível no próximo mês.'};
sindicatoDisponivelParaCliente = function(){return state.config.sindicatoAtivo!==false && state.config.sindicatoLinkAtivo!==false && sindicatoLimiteRestante()>0};
function beneficioRestanteTexto(){let r=sindicatoLimiteRestante(); return r===999999?'Sem limite mensal':`${r} disponível(is) neste mês`;}
function beneficioPodeUsar(qtd=1){return sindicatoLimiteRestante()>=Math.max(1,num(qtd)||1)}
function marcarBeneficio(obj,qtd=1){obj.beneficioUsado=true; obj.beneficioQtd=Math.max(1,num(qtd)||1); return obj;}
const _v42SindicatoStatusBase = sindicatoStatusHTML;
sindicatoStatusHTML = function(){
  let limite=num(state.config.sindicatoLimiteMensal||0), usado=beneficioQtdUsadaMes(), restante=sindicatoLimiteRestante();

};

// ===== V43: profissional ativo obrigatório para finalizar =====
function profissionalAtivoPorId(id){
  return (state.profissionais||[]).find(p=>String(p.id)===String(id) && p.ativo!==false) || null;
}
function escolherProfissionalAtivo(idAtendimento){
  let a=(state.fila||[]).find(x=>String(x.id)===String(idAtendimento));
  if(!a)return toast('Atendimento não encontrado.');
  let ativos=(state.profissionais||[]).filter(p=>p.ativo!==false);
  if(!ativos.length)return toast('Cadastre e ative pelo menos um profissional antes de finalizar.');
  let msg='Digite o número do profissional:\n\n'+ativos.map((p,i)=>`${i+1} - ${p.nome}`).join('\n');
  let escolha=prompt(msg, '1');
  if(escolha===null)return;
  let idx=(Number(escolha)||0)-1;
  let p=ativos[idx];
  if(!p)return toast('Profissional inválido. Escolha um profissional ativo.');
  a.profId=p.id;
  a.profNome=p.nome;
  markDirty();
  toast('Profissional definido: '+p.nome);
}

function v45AddAtProfissional(btn){
  let p=v45CurrentProfAtivo();
  if(!p)return toast('Seu usuário profissional está desativado. Fale com o administrador.');
  if(!beneficioPodeUsar(1))return toast(sindicatoIndisponivelMsg());
  let box=btn.closest('.card'), tipo=box.querySelector('.tipoAt')?.value||'fila';
  let data=box.querySelector('.dataAt')?.value||today(), hora=box.querySelector('.horaAt')?.value||nowHH();
  let cid=box.querySelector('.selCliente')?.value||'novo', nome=box.querySelector('.nomeAt')?.value.trim()||'', tel=box.querySelector('.telAt')?.value.trim()||'';
  if(cid!=='novo'){let c0=state.clientes.find(c=>String(c.id)===cid); if(c0){nome=c0.nome; tel=c0.telefone||tel;}}
  if(!nome)return toast('Informe o cliente');
  let servId=box.querySelector('.servAt')?.value;
  let isSind=servId===SIND_ID;
  let s=isSind?sindicatoServiceObj():state.servicos.find(s=>String(s.id)===String(servId));
  if(!s)return toast('Cadastre serviço');
  if(isSind && tipo!=='fila')return toast('Corte pelo sindicato é somente ordem de chegada.');
  if(tipo==='especial'&&!specialInfo(hora))return toast('Horário especial só pode ser usado dentro dos horários especiais definidos.');
  if(!profModeAllowed(p,tipo))return toast('Seu usuário não está liberado para essa modalidade.');
  if(!profHorarioOk(p,hora))return toast('Seu usuário não está liberado para esse horário.');
  let tp=isSind?'fila':tipoPreco(tipo,hora);
  if(tipo!=='fila'&&!isSlotLivre(data,hora,serviceDur(s,tp)||20,p.id))return toast('Esse horário já está ocupado. Escolha um horário livre.');
  let c=state.clientes.find(x=>tel&&x.telefone===tel)||state.clientes.find(x=>x.nome.toLowerCase()===nome.toLowerCase());
  if(!c){c={id:uid(),nome,telefone:tel};state.clientes.push(c)}else{c.nome=nome;c.telefone=tel||c.telefone}
  let valor=isSind?num(state.config.sindicatoPreco||0):servicePrice(s,tp);
  let v=validVoucher(box.querySelector('.voucherAt')?.value.trim().toUpperCase()||'');
  if(v&&!isSind){valor*=1-num(v.percentual)/100;v.usado=true;v.cliente=nome;v.usadoEm=new Date().toISOString()}
  let item={id:uid(),clienteId:c.id,nome,tel,tipo:isSind?'fila':(tipo==='fila'?'fila':tp),data,hora,servId:isSind?SIND_ID:s.id,servNome:s.nome,profId:p.id,profNome:p.nome,tempoMin:num(box.querySelector('.tempoAt')?.value)||serviceDur(s,tp)||state.config.sindicatoDuracao||20,valorOriginal:valor,valorFinal:Math.max(0,valor),voucher:v?.codigo||'',status:'aguardando',origem:'prof',createdAt:Date.now(),sindicato:isSind,comissaoPctAtendimento:isSind?num(state.config.sindicatoComissaoPct||0):undefined};
  marcarBeneficio(item,1);
  state.fila.push(item);
  markDirty();
  toast('Serviço adicionado no seu nome. Alterações futuras precisam do admin.');
}

const _v45ApproveBase = approve;
approve = function(i){
  let p=state.pendencias?.[i];
  if(!p)return;
  if(p.tipo==='alteracao_atendimento'){
    let a=(state.fila||[]).find(x=>String(x.id)===String(p.atendimentoId));
    if(a && p.acao==='tempo')a.tempoMin=p.depois.tempoMin;
    state.pendencias.splice(i,1); markDirty(); toast('Alteração aprovada.'); return;
  }
  if(p.tipo==='exclusao_atendimento'){
    state.fila=(state.fila||[]).filter(x=>String(x.id)!==String(p.atendimentoId));
    state.pendencias.splice(i,1); markDirty(); toast('Exclusão aprovada.'); return;
  }
  if(p.tipo==='alteracao_venda'){
    let v=(state.vendasProdutos||[]).find(x=>String(x.id)===String(p.vendaId));
    if(v && p.acao==='quantidade_beneficio'){
      v.qtd=p.depois.qtd; v.total=num(v.precoUnit)*v.qtd; v.comissaoValor=v.total*num(v.comissaoPct)/100; v.beneficioQtd=v.qtd; v.editedAt=Date.now();
    }
    state.pendencias.splice(i,1); markDirty(); toast('Alteração aprovada.'); return;
  }
  if(p.tipo==='alteracao_historico'){
    let a=(state.historico||[]).find(x=>String(x.id)===String(p.atendimentoId));
    if(a && p.acao==='quantidade_beneficio'){a.beneficioQtd=p.depois.beneficioQtd; a.beneficioUsado=true; a.editedAt=Date.now();}
    state.pendencias.splice(i,1); markDirty(); toast('Alteração aprovada.'); return;
  }
  return _v45ApproveBase(i);
};
const _v45RejectBase = reject;
reject = function(i){let p=state.pendencias?.[i]; if(p&&String(p.tipo||'').startsWith('alteracao')||p?.tipo==='exclusao_atendimento'){state.pendencias.splice(i,1); markDirty(); toast('Solicitação recusada.'); return;} return _v45RejectBase(i);};

/* ===== V46: trava definitiva de profissional ativo na finalização ===== */
function v46ProfissionalAtivoPorId(id){
  return (state.profissionais||[]).find(p=>String(p.id)===String(id) && p.ativo!==false) || null;
}
function v46ProfOptions(selected=''){
  let ativos=(state.profissionais||[]).filter(p=>p.ativo!==false);
  return ativos.map(p=>`<option value="${p.id}" ${String(p.id)===String(selected)?'selected':''}>${p.nome}</option>`).join('');
}
function v46AbrirFinalizacaoProfissional(idAtendimento){
  let a=(state.fila||[]).find(x=>String(x.id)===String(idAtendimento));
  if(!a)return toast('Atendimento não encontrado.');
  let ativos=(state.profissionais||[]).filter(p=>p.ativo!==false);
  if(!ativos.length)return toast('Cadastre e ative pelo menos um profissional antes de finalizar.');
  if(typeof v44OpenModal==='function'){
    v44OpenModal(`<h2>Finalizar atendimento</h2><p class="muted">Escolha o profissional ativo que realizou este serviço. O sistema não finaliza como "Qualquer".</p><div class="field"><label>Profissional responsável</label><select id="v46ProfFinalizar">${v46ProfOptions(a.profId)}</select></div><div class="v44-actions"><button class="btn" onclick="v44CloseModal()">Cancelar</button><button class="btn primary" onclick="v46SalvarProfEFinalizar('${idAtendimento}')">Salvar e finalizar</button></div>`);
  }else{
    toast('Selecione um profissional ativo antes de finalizar.');
  }
}
function v46SalvarProfEFinalizar(idAtendimento){
  let a=(state.fila||[]).find(x=>String(x.id)===String(idAtendimento));
  let p=v46ProfissionalAtivoPorId(document.getElementById('v46ProfFinalizar')?.value);
  if(!a)return toast('Atendimento não encontrado.');
  if(!p)return toast('Escolha um profissional ativo.');
  a.profId=p.id;
  a.profNome=p.nome;
  if(typeof v44CloseModal==='function')v44CloseModal();
  v46FinalizarAtendimentoSeguro(idAtendimento);
}
function v46FinalizarAtendimentoSeguro(id){
  let i=(state.fila||[]).findIndex(x=>String(x.id)===String(id));
  if(i<0)return toast('Atendimento não encontrado.');
  let a=state.fila[i];

  if(!isAdmin()){
    let p=(state.profissionais||[]).find(x=>String(x.id)===String(session?.profId) && x.ativo!==false);
    if(!p)return toast('Seu usuário profissional está desativado.');
    if(String(a.profId)!==String(p.id))return toast('Você só pode finalizar atendimento feito por você.');
    a.profId=p.id;
    a.profNome=p.nome;
  }

  let p=v46ProfissionalAtivoPorId(a.profId);
  if(!p){
    v46AbrirFinalizacaoProfissional(id);
    return;
  }

  a.profId=p.id;
  a.profNome=p.nome;
  a.status='concluido';
  a.horaFim=nowHH();
  a.finalizadoEm=Date.now();
  if((a.sindicato || a.beneficioUsado) && !a.beneficioQtd)a.beneficioQtd=1;
  state.historico.push(a);
  state.fila.splice(i,1);
  markDirty();
  toast('Atendimento finalizado com profissional: '+p.nome);
}
doneAt = function(id){
  return v46FinalizarAtendimentoSeguro(id);
};


/* ===== V47: admin pode excluir lançamentos finalizados errados (serviços, benefício e produtos) ===== */
function v47Clone(obj){try{return JSON.parse(JSON.stringify(obj))}catch(e){return obj}}
function v47EnsureExclusoes(){ if(!Array.isArray(state.exclusoesCorrigidas)) state.exclusoesCorrigidas=[]; }
function v47ItemBeneficioTxt(x){return beneficioUsaSaldo(x)?` • benefício: ${Math.max(1,num(x.beneficioQtd||x.qtd)||1)} un.`:'';}

  v47EnsureExclusoes();
  state.exclusoesCorrigidas.push({id:uid(),tipo,motivo,item:v47Clone(item),data:today(),hora:nowHH(),deletedAt:Date.now(),admin:session?.nome||'Administrador'});
}
function excluirAtendimentoFinalizado(id){
  if(!canAdmin())return;
  let idx=(state.historico||[]).findIndex(x=>String(x.id)===String(id));
  if(idx<0)return toast('Atendimento finalizado não encontrado.');
  let a=state.historico[idx];
  let msg=`Excluir este serviço finalizado?\n\nCliente: ${a.nome||''}\nServiço: ${a.servNome||''}\nProfissional: ${a.profNome||''}\nData: ${a.data||''}\n\nSe ele consumiu benefício/sindicato, a quantidade volta automaticamente porque o lançamento sai do histórico.`;
  if(!confirm(msg))return;
  v47RegistrarExclusao('servico_finalizado',a);
  state.historico.splice(idx,1);
  markDirty();
  toast('Serviço finalizado excluído e controle recalculado.');
}
function excluirVendaFinalizada(id){
  if(!canAdmin())return;
  let idx=(state.vendasProdutos||[]).findIndex(x=>String(x.id)===String(id));
  if(idx<0)return toast('Venda/produto não encontrado.');
  let v=state.vendasProdutos[idx];
  let msg=`Excluir este lançamento?\n\nItem: ${v.produtoNome||'Produto/benefício'}\nQtd: ${v.qtd||1}\nVendedor: ${v.profNome||''}\nData: ${v.data||''}\n\nSe for benefício/sindicato, a quantidade volta automaticamente. Se for produto cadastrado, o estoque será devolvido.`;
  if(!confirm(msg))return;

function v48Js(v){return JSON.stringify(String(v||''));}
function v48Q(x){return Math.max(1,num(x?.beneficioQtd||x?.qtd)||1);}
function v48RecalcularLancamentoVenda(v){

/* ===== V49: exclusão blindada do sindicato/benefício =====
   Regra explícita: se excluir atendimento, produto ou sindicato que consumiu benefício,
   a quantidade volta automaticamente porque o lançamento é removido da base usada no cálculo mensal.
*/
function v49IsBeneficioLancamento(x){
  if(!x)return false;
  let nome=String(x.servNome||x.produtoNome||x.nome||'').toLowerCase();
  return !!(x.beneficioUsado===true || x.sindicato===true || x.tipoVenda==='sindicato' || nome.includes('sindicato') || nome.includes('benefício') || nome.includes('beneficio'));
}
function v49QtdBeneficio(x){return Math.max(1,num(x?.beneficioQtd||x?.qtd)||1);}
function v49SaldoResumo(){
  let limite=num(state.config?.sindicatoLimiteMensal||0), usado=typeof beneficioQtdUsadaMes==='function'?beneficioQtdUsadaMes():0;
  let restante=limite?Math.max(0,limite-usado):999999;
  return {limite,usado,restante};
}
function v49RegistrarExclusaoBlindada(tipo,item,qtdDevolvida){
  state.exclusoesCorrigidas=state.exclusoesCorrigidas||[];
  let saldoAntes=v49SaldoResumo();
  state.exclusoesCorrigidas.push({
    id:uid(),
    tipo,
    item:clone(item||{}),
    qtdBeneficioDevolvida:qtdDevolvida||0,
    saldoAntes,
    admin:session?.nome||'Admin',
    data:today(),
    hora:nowHH(),
    createdAt:Date.now(),
    obs:qtdDevolvida?`Exclusão devolveu ${qtdDevolvida} unidade(s) ao saldo do benefício/sindicato.`:'Exclusão sem uso de benefício.'
  });
}
function v49PersistirAposExclusao(msg){

  (state.vendasProdutos||[]).forEach(v=>{ if(v49IsBeneficioLancamento(v)){v.beneficioUsado=true; v.beneficioQtd=v49QtdBeneficio(v);} if(typeof v48RecalcularLancamentoVenda==='function')v48RecalcularLancamentoVenda(v); });

function v50SafeId(prefix){
  try{return (prefix||'vz')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);}catch(e){return (prefix||'vz')+'_'+String(Math.random()).slice(2);}

function v50EnsureFinalizadosIds(){
  state.historico=Array.isArray(state.historico)?state.historico:[];

  let changed=false;
  state.historico.forEach((a,i)=>{ if(!a.id){a.id=v50SafeId('hist_'+i); changed=true;} });
  state.vendasProdutos.forEach((v,i)=>{ if(!v.id){v.id=v50SafeId('vend_'+i); changed=true;} });
  if(changed){ state.updatedAt=Date.now(); try{saveLocal();}catch(e){} }
}
function v50PersistirExclusao(msg){
  try{v50EnsureFinalizadosIds();}catch(e){}

  try{v50EnsureFinalizadosIds();}catch(e){}
  try{ if(Array.isArray(state.vendasProdutos) && typeof v48RecalcularLancamentoVenda==='function') state.vendasProdutos.forEach(v48RecalcularLancamentoVenda); }catch(e){}

      return !!(state.servicos||[]).find(s=>String(s.id)===String(id) && s.isSindicato===true);

  function atendimentoSindicato(a){

          a.beneficioQtd=q(a);

    const qtdAt = atendimentos.filter(a=>atendimentoSindicato(a) && mes(a.data)===mesAlvo).reduce((s,a)=>s+q(a),0);
    const qtdProd = (state.vendasProdutos||[]).filter(v=>vendaSindicato(v) && mes(v.data)===mesAlvo).reduce((s,v)=>s+q(v),0);
    return qtdAt + qtdProd;

  window.sindicatoLimiteRestante = function(){

(function(){

  function dinheiro(v){ try{return (typeof brl==='function') ? brl(v) : ('R$ '+n(v).toFixed(2).replace('.',','));}catch(e){return 'R$ '+n(v).toFixed(2).replace('.',',');} }

  function mesmoProf(item){

  }
  function qtdItem(v){ return Math.max(1,n(v?.beneficioQtd||v?.qtd)||1); }
  function ehSindAt(a){
    try{ if(typeof window.v55AtendimentoSindicato==='function') return window.v55AtendimentoSindicato(a); }catch(e){}
    return !!(a && (a.sindicato===true || a.beneficioUsado===true || String(a.servId)==='__sindicato_corte__'));
  }
  function ehSindVenda(v){
    try{ if(typeof window.v55VendaSindicato==='function') return window.v55VendaSindicato(v); }catch(e){}
    return !!(v && (v.tipoVenda==='sindicato' || v.sindicato===true || v.beneficioUsado===true || String(v.produtoId)==='__sindicato_corte__'));

  function tabelaAt(lista,titulo,vazio){

/* ===== V62: contagem do sindicato 100% por palavra "sindicato" =====

   "sindicato" escrita no serviço, produto, tipo, origem/link ou identificador.

(function(){
  const V62='vizzarty_v62_sindicato_por_texto';
  if(window[V62]) return;
  window[V62]=true;

  function n(v){ try{return (typeof num==='function')?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function mes(d){ return String(d || (typeof today==='function'?today():new Date().toISOString().slice(0,10))).slice(0,7); }
  function norm(v){ return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
  function temSindicatoTexto(x){
    if(!x) return false;
    const campos=[
      x.nome,x.servNome,x.produtoNome,x.tipoVenda,x.tipo,x.origem,x.categoria,x.obs,x.observacao,
      x.servId,x.produtoId,x.link,x.url,x.modalidade,x.descricao
    ];

  function qtd(x){ return Math.max(1,n(x?.beneficioQtd || x?.qtd || 1)||1); }

  function vendaSind(v){ return temSindicatoTexto(v); }
  function todosAtendimentos(){ return [...(state.fila||[]), ...(state.historico||[]), ...(state.pendencias||[])]; }

  function limparFlagsErradas(){
    try{
      todosAtendimentos().forEach(a=>{
        if(atSind(a)){
          a.sindicato=true;
          a.beneficioUsado=true;
          a.beneficioQtd=qtd(a);
        }else{
          a.sindicato=false;
          delete a.beneficioUsado;
          delete a.beneficioQtd;
          if(String(a.servId||'')==='__sindicato_corte__' && !temSindicatoTexto(a)) a.servId='';
        }
      });
      (state.vendasProdutos||[]).forEach(v=>{
        if(vendaSind(v)){
          v.tipoVenda='sindicato';
          v.beneficioUsado=true;
          v.beneficioQtd=qtd(v);
        }else{
          if(v.tipoVenda==='sindicato') v.tipoVenda='produto';
          delete v.beneficioUsado;
          delete v.beneficioQtd;
        }
      });
    }catch(e){ console.warn('V62 limpeza sindicato:',e); }
  }

  window.v62TemSindicatoTexto = temSindicatoTexto;
  window.v55AtendimentoSindicato = atSind;
  window.v55VendaSindicato = vendaSind;
  window.v49IsBeneficioLancamento = function(x){ return temSindicatoTexto(x); };
  window.beneficioUsaSaldo = function(x){ return temSindicatoTexto(x); };
  try{ beneficioUsaSaldo = window.beneficioUsaSaldo; }catch(e){}

  window.beneficioQtdUsadaMes = function(mesAlvo){
    mesAlvo = mesAlvo || mes();
    limparFlagsErradas();
    const qtdAt=todosAtendimentos().filter(a=>atSind(a) && mes(a.data)===mesAlvo).reduce((s,a)=>s+qtd(a),0);
    const qtdV=(state.vendasProdutos||[]).filter(v=>vendaSind(v) && mes(v.data)===mesAlvo).reduce((s,v)=>s+qtd(v),0);
    return qtdAt+qtdV;
  };
  window.sindicatoQtdUsadaMes = function(mesAlvo){ return window.beneficioQtdUsadaMes(mesAlvo); };
  window.sindicatoLimiteRestante = function(){
    const limite=n(state?.config?.sindicatoLimiteMensal||0);
    if(!limite) return 999999;
    return Math.max(0, limite-window.beneficioQtdUsadaMes());
  };
  window.beneficioPodeUsar = function(qtdNecessaria){ return window.sindicatoLimiteRestante() >= Math.max(1,n(qtdNecessaria)||1); };
  window.marcarBeneficio = function(obj,qtdNecessaria){
    if(obj && temSindicatoTexto(obj)){
      obj.sindicato = obj.servNome || obj.nome ? true : obj.sindicato;
      obj.tipoVenda = obj.produtoNome ? 'sindicato' : obj.tipoVenda;
      obj.beneficioUsado=true;
      obj.beneficioQtd=Math.max(1,n(qtdNecessaria)||1);
    }
    return obj;
  };

  window.sindicatoVendas = function(profId=''){
    return (state.vendasProdutos||[]).filter(v=>vendaSind(v) && (!profId || String(v.profId)===String(profId)));
  };
  window.vendasProdutoNormais = function(profId=''){
    return (state.vendasProdutos||[]).filter(v=>!vendaSind(v) && (!profId || String(v.profId)===String(profId)));
  };

  window.sindicatoStatusHTML = function(){
    const limite=n(state?.config?.sindicatoLimiteMensal||0), usado=window.beneficioQtdUsadaMes(), restante=window.sindicatoLimiteRestante();
    const status=state?.config?.sindicatoAtivo===false?'desativado no painel':(limite&&restante<=0?'limite mensal esgotado':'disponível');
    return `<div class="item"><b>Controle do sindicato mensal</b><div class="muted">Usado: ${usado} ${limite?'de '+limite:'• sem limite'} • Restante: ${restante===999999?'sem limite':restante} • Status: ${status}</div><p class="muted" style="margin:8px 0 0">Contagem corrigida: só soma lançamentos onde estiver escrito <b>sindicato</b>. Serviços e produtos comuns ficam fora.</p></div>`;
  };

  const baseRegistrarVendaProdutoV62 = window.registrarVendaProduto;
  window.registrarVendaProduto = function(btn){
    const box=(btn&&btn.closest)?(btn.closest('.v61-sale-box')||btn.closest('.card')):document;
    const rows=[...(box?.querySelectorAll?.('.v61-sale-row')||[])];
    let qtdSind=0;
    rows.forEach(row=>{
      const prod=(state.produtos||[]).find(p=>String(p.id)===String(row.querySelector('.vpProdutoItem')?.value));
      const q=Math.max(1,n(row.querySelector('.vpQtdItem')?.value)||1);
      if(prod && temSindicatoTexto({produtoNome:prod.nome,produtoId:prod.id,tipoVenda:prod.tipo})) qtdSind+=q;
    });
    if(qtdSind>0 && !window.beneficioPodeUsar(qtdSind)) return toast(typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.');
    const antes=(state.vendasProdutos||[]).length;
    const r=(typeof baseRegistrarVendaProdutoV62==='function') ? baseRegistrarVendaProdutoV62(btn) : undefined;
    const novos=(state.vendasProdutos||[]).slice(antes);
    novos.forEach(v=>{
      if(vendaSind(v)) window.marcarBeneficio(v, v.qtd||1);
      else{ if(v.tipoVenda==='sindicato') v.tipoVenda='produto'; delete v.beneficioUsado; delete v.beneficioQtd; }
    });
    if(novos.length){ try{markDirty();}catch(e){} }
    return r;
  };
  try{ registrarVendaProduto=window.registrarVendaProduto; }catch(e){}

  const baseRegistrarCortesSindicatoV62 = window.registrarCortesSindicato;
  if(typeof baseRegistrarCortesSindicatoV62==='function'){
    window.registrarCortesSindicato = function(){
      const q=Math.max(1,n(document.getElementById('csQtd')?.value)||1);
      if(!window.beneficioPodeUsar(q)) return toast(typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.');
      const antes=(state.vendasProdutos||[]).length;
      const r=baseRegistrarCortesSindicatoV62();
      const v=(state.vendasProdutos||[])[(state.vendasProdutos||[]).length-1];
      if((state.vendasProdutos||[]).length>antes && v){ v.produtoNome = v.produtoNome || 'Sindicato'; v.tipoVenda='sindicato'; window.marcarBeneficio(v,q); try{markDirty();}catch(e){} }
      return r;
    };
    try{ registrarCortesSindicato=window.registrarCortesSindicato; }catch(e){}
  }

  const baseAddAtV62 = window.addAt || (typeof addAt==='function'?addAt:null);
  window.addAt = function(btn){
    const box=btn?.closest?.('.card');
    const servId=box?.querySelector?.('.servAt')?.value;
    let serv=null;
    try{ serv=typeof getServicoByFormId==='function'?getServicoByFormId(servId):(state.servicos||[]).find(s=>String(s.id)===String(servId)); }catch(e){}
    const vaiSind=temSindicatoTexto({servNome:serv?.nome,servId:serv?.id,tipo:serv?.tipo});
    if(vaiSind && !window.beneficioPodeUsar(1)) return toast(typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.');
    const fAntes=(state.fila||[]).length, pAntes=(state.pendencias||[]).length;
    const r=baseAddAtV62?baseAddAtV62(btn):undefined;
    let novo=null;
    if((state.fila||[]).length>fAntes) novo=state.fila[state.fila.length-1];
    if((state.pendencias||[]).length>pAntes) novo=state.pendencias[state.pendencias.length-1];
    if(novo){ if(atSind(novo)) window.marcarBeneficio(novo,1); else{novo.sindicato=false; delete novo.beneficioUsado; delete novo.beneficioQtd;} try{markDirty();}catch(e){} }
    return r;
  };
  try{ addAt=window.addAt; }catch(e){}

  const baseClientAddV62 = window.clientAdd || (typeof clientAdd==='function'?clientAdd:null);
  window.clientAdd = function(mode){

    const vaiSind=temSindicatoTexto({servNome:s?.nome,servId:s?.id,tipo:s?.tipo,origem:'link'});
    if(vaiSind && !window.beneficioPodeUsar(1)) return toast(typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.');
    const antes=(state.fila||[]).length;
    const r=baseClientAddV62?baseClientAddV62(mode):undefined;
    if((state.fila||[]).length>antes){
      const a=state.fila[state.fila.length-1];

      try{markDirty();}catch(e){}
    }
    return r;
  };
  try{ clientAdd=window.clientAdd; }catch(e){}

  const baseExcluirVendaV62 = window.excluirVendaFinalizada;
  window.excluirVendaFinalizada = function(id){
    if(!canAdmin()) return;

    if(v && v.vendaGrupoId){
      const grupo=(state.vendasProdutos||[]).filter(x=>String(x.vendaGrupoId)===String(v.vendaGrupoId));
      if(grupo.length>1 && confirm(`Essa venda tem ${grupo.length} produtos no mesmo fechamento. Deseja excluir a venda inteira?\n\nOK = venda inteira\nCancelar = somente este produto`)){

(function(){

      const pid=filtro.slice(3);

      const p=(state.profissionais||[]).find(x=>String(x.id)===String(pid));

      return p?.nome || 'Profissional';

(function(){

      document.head.appendChild(st);

(function(){

  function esc74(v){

    });
  }
  function n74(v){
    try{ if(typeof num==='function') return num(v); }catch(e){}
    return Number(v)||0;
  }
  function money74(v){
    try{ if(typeof brl==='function') return brl(v); }catch(e){}
    return 'R$ '+n74(v).toFixed(2).replace('.',',');
  }
  function today74(){
    try{ if(typeof today==='function') return today(); }catch(e){}
    return new Date().toISOString().slice(0,10);
  }
  function now74(){
    try{ if(typeof nowHH==='function') return nowHH(); }catch(e){}
    return new Date().toTimeString().slice(0,5);
  }
  function modeKey74(mode){
    mode=String(mode||'fila');
    if(mode==='especial' || mode==='premium') return 'especial';
    if(mode==='agendamento' || mode==='agenda') return 'agendamento';
    return 'fila';
  }
  function modeLabel74(mode){
    mode=modeKey74(mode);
    if(mode==='fila') return 'Fila de espera';
    if(mode==='agendamento') return 'Agendamento comum';
    return 'Horario especial';
  }
  function toMin74(h){
    const p=String(h||'00:00').split(':').map(Number);
    return (p[0]||0)*60+(p[1]||0);
  }
  function toHH74(m){
    m=Math.max(0,Math.min(1439,Number(m)||0));
    return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  }
  function addSlots74(arr,ini,fim,step){
    const a=toMin74(ini), b=toMin74(fim);
    if(!ini || !fim || b<a) return arr;
    for(let m=a;m<=b;m+=step||15){
      const h=toHH74(m);
      if(!arr.includes(h)) arr.push(h);
    }
    return arr.sort();
  }
  function inRange74(h,a,b){
    if(!h || !a || !b) return true;
    return String(h)>=String(a) && String(h)<=String(b);
  }
  function overlap74(h,dur,ini,fim){
    if(!h || !ini || !fim) return false;
    const a=toMin74(h), b=a+(n74(dur)||1), c=toMin74(ini), d=toMin74(fim);

<script id="vz-redline-popup-script">
(function(){

function isPromoLink(){
  try{
    var params = new URLSearchParams(window.location.search);
    return params.has('promo');
  }catch(e){
    return false;
  }
}

function createPopup(){
  if(!isPromoLink()) return;
  if(document.getElementById('vzRedlinePopup')) return;

  var popup=document.createElement('div');
  popup.id='vzRedlinePopup';
  popup.innerHTML='GARANTIR AGORA <small>Oferta expira em <span id="vzTimer">05:00</span></small>';
  document.body.appendChild(popup);
}

function startPersistentTimer(){
  if(!isPromoLink()) return;

  var KEY='vz_redline_promo_endtime';
  var endTime=localStorage.getItem(KEY);

  if(!endTime){
    endTime=Date.now()+(5*60*1000);
    localStorage.setItem(KEY,endTime);
  }else{
    endTime=parseInt(endTime);
  }

  function update(){
    var diff=Math.max(0,Math.floor((endTime-Date.now())/1000));

    var m=String(Math.floor(diff/60)).padStart(2,'0');
    var s=String(diff%60).padStart(2,'0');

    var timer=document.getElementById('vzTimer');
    if(timer){
      timer.textContent=m+':'+s;
    }

    if(diff<=0){
      endTime=Date.now()+(5*60*1000);
      localStorage.setItem(KEY,endTime);
    }
  }

  update();
  setInterval(update,1000);
}

window.addEventListener('load',function(){
  createPopup();
  startPersistentTimer();
});

})();
</script>

<script id="vz79-recorrencia-pote-comissoes" type="text/plain" data-substituido-por="clube-creditos-vizzarty">
(function(){

  }
  function n79(v){

    return Number(v)||0;

    return 'R$ '+n79(v).toFixed(2).replace('.',',');

  function ensure79(){

  }
  function plano79(id){ ensure79(); return (state.planosRecorrencia||[]).find(function(p){return String(p.id)===String(id);}); }
  function assinante79(id){ ensure79(); return (state.assinantesRecorrencia||[]).find(function(a){return String(a.id)===String(id);}); }

  function activeAssinantes79(mes){
    ensure79();
    return (state.assinantesRecorrencia||[]).filter(function(a){
      if(a.status==='cancelado' || a.ativo===false) return false;
      if(a.inicio && String(a.inicio).slice(0,7)>mes) return false;

  function valorAss79(a){
    var p=plano79(a.planoId);

  function potePctAss79(a){
    var p=plano79(a.planoId);
    return Math.max(0,Math.min(100,n79(a.potePct ?? p?.potePct ?? 50)));

  function atendMes79(mes){
    ensure79();
    return (state.atendimentosRecorrencia||[]).filter(function(a){return String(a.data||'').slice(0,7)===mes;});
  }
  function resumo79(mes){
    ensure79();
    var assinantes=activeAssinantes79(mes);
    var atend=atendMes79(mes);
    var receita=assinantes.reduce(function(s,a){return s+valorAss79(a);},0);
    var pote=assinantes.reduce(function(s,a){return s+(valorAss79(a)*potePctAss79(a)/100);},0);
    var casa=receita-pote;
    var profs={};
    atend.forEach(function(a){
      var id=a.profId||'sem_prof';

      profs[id].qtd+=1;
      profs[id].peso+=Math.max(0.01,n79(a.peso)||1);

  function planosRows79(){

        '<div class="grid g4" style="margin-top:10px">'+
          '<div class="field"><label>Nome</label><input id="v79_pl_nome_'+esc79(p.id)+'" value="'+esc79(p.nome)+'"></div>'+
          '<div class="field"><label>Mensalidade R$</label><input id="v79_pl_valor_'+esc79(p.id)+'" type="number" step="0.01" value="'+n79(p.mensalidade)+'"></div>'+
          '<div class="field"><label>Atendimentos/mes</label><input id="v79_pl_cortes_'+esc79(p.id)+'" type="number" min="0" value="'+n79(p.cortesMes)+'"></div>'+
          '<div class="field"><label>% para pote</label><input id="v79_pl_pote_'+esc79(p.id)+'" type="number" min="0" max="100" value="'+n79(p.potePct)+'"></div>'+
        '</div></div><div class="row">'+

(function(){

  /* --- Intercepta addProduto: profissional envia para aprovação --- */
  const _v80AddProdutoBase = window.addProduto;
  window.addProduto = function(){
    if(typeof isAdmin==='function' && isAdmin()) return _v80AddProdutoBase.apply(this,arguments);

    let nome=(document.getElementById('pdNome')?.value||'').trim();

      id:(typeof uid==='function'?uid():Date.now().toString(36)),
      nome,
      preco:(typeof num==='function'?num(document.getElementById('pdPreco')?.value):Number(document.getElementById('pdPreco')?.value)||0),
      estoque:(typeof num==='function'?num(document.getElementById('pdEstoque')?.value):Number(document.getElementById('pdEstoque')?.value)||0),
      comissaoPct:(typeof num==='function'?num(document.getElementById('pdCom')?.value):Number(document.getElementById('pdCom')?.value)||0),
      ativo:true
    };

    if(!Array.isArray(state.pendencias))state.pendencias=[];
    state.pendencias.push({
      id:produto.id,

    ['pdNome','pdPreco','pdEstoque','pdCom'].forEach(function(id){let el=document.getElementById(id);if(el)el.value=id==='pdPreco'||id==='pdEstoque'?'0':(id==='pdCom'?'10':'');});

      id:(typeof uid==='function'?uid():Date.now().toString(36)),
      produtoId:prod.id,
      produtoNome:prod.nome,
      profId:prof.id,

      id:venda.id,

  try{

<script id="vz83-lembrete-vencimento-clube">
(function(){
  var FLAG='vizzarty_v83_lembrete_vencimento_clube';
  if(window[FLAG]) return;
  window[FLAG]=true;

  function esc83(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }
  function n83(v){
    try{ if(typeof num==='function') return num(v); }catch(e){}
    return Number(v)||0;
  }
  function today83(){
    try{ if(typeof today==='function') return today(); }catch(e){}
    return new Date().toISOString().slice(0,10);
  }
  function date83(v){
    var d=new Date(String(v||today83())+'T12:00:00');
    if(isNaN(d.getTime())) d=new Date();
    return d;
  }
  function daysLeft83(v){
    return Math.ceil((date83(v).getTime()-date83(today83()).getTime())/86400000);
  }
  function isAdmin83(){
    try{ return typeof isAdmin==='function' && isAdmin(); }catch(e){ return false; }
  }
  function clientById83(id){
    return (state.clientes||[]).find(function(c){return String(c.id)===String(id);});
  }
  function noticeDays83(){
    state.config=state.config||{};
    var d=Math.max(0,Math.floor(n83(state.config.diasAvisoClube)));
    if(!d && state.config.diasAvisoClube!==0) d=3;
    return d;
  }

    if(!isAdmin83()) return;

    state.config.diasAvisoClube=val;
    try{ markDirty(); }catch(e){ try{ saveLocal(); renderAll(); }catch(_){} }
    try{ toast('Aviso do Clube ajustado para '+val+' dia'+(val===1?'':'s')+' antes do vencimento.'); }catch(e){}
  };
  function expiringAccounts83(){
    if(!Array.isArray(state.creditAccounts)) return [];
    var limit=noticeDays83();
    return state.creditAccounts.filter(function(a){
      var d=daysLeft83(a.validadeAte);
      return a && a.status==='ativo' && d>=0 && d<=limit;
    }).sort(function(a,b){return daysLeft83(a.validadeAte)-daysLeft83(b.validadeAte);});
  }
  function warningMessage83(id){
    var a=(state.creditAccounts||[]).find(function(x){return String(x.id)===String(id);});

      var dias=daysLeft83(a.validadeAte);
      var prazo=dias===0?'vence hoje':('vence em '+dias+' dia'+(dias===1?'':'s'));
      var c=clientById83(a.clienteId);
      var tel=a.telefone || c?.telefone || '';
      return '<div class="item vz83-exp-row"><div class="item-head"><div><b>'+esc83(a.clienteNome||'Cliente')+'</b><div class="muted">'+esc83(a.planoNome||'Plano')+' • '+esc83(prazo)+' • validade '+esc83(a.validadeAte||'')+'</div><div class="row" style="margin-top:7px"><span class="badge b-fila">'+esc83(prazo)+'</span><span class="badge">'+n83(a.saldo)+' crédito(s)</span><span class="badge">'+(tel?'WhatsApp cadastrado':'sem telefone')+'</span></div></div><div class="row"><button class="btn small good" onclick="v83AvisarVencimentoClube(\''+esc83(a.id)+'\')"><i class="ti ti-brand-whatsapp"></i>Avisar no WhatsApp</button></div></div></div>';
    }).join(''):'<div class="muted">Nenhum vencimento dentro do prazo configurado.</div>';
    return '<div class="card vz83-exp-card"><div class="item-head"><div><h2><i class="ti ti-alert-circle"></i> Vencimentos do Clube</h2><p class="muted">Clientes com Clube Vizzarty vencendo em até '+diasAviso+' dia'+(diasAviso===1?'':'s')+'. Envie o aviso e puxe a renovação antes de expirar.</p></div><span class="badge b-fila">'+list.length+' aviso(s)</span></div>'+configBox+rows+'</div>';
  }
  function inject83(html){

    var marker='</div><div class="grid g2">';

    window.painelHTML=function(){
      return inject83(basePainel83.apply(this,arguments));
    };
    try{ painelHTML=window.painelHTML; }catch(e){}
  }
  function addStyle83(){
    if(document.getElementById('vz83Style')) return;
    var st=document.createElement('style');
    st.id='vz83Style';
    st.textContent='.vz83-exp-card{border-color:rgba(45,179,106,.48)!important;background:linear-gradient(180deg,#f5fff8,#f5f7f2)!important}.vz83-exp-card h2{display:flex;align-items:center;gap:8px;color:var(--gold);margin:0 0 6px}.vz83-exp-card h2 i{font-size:22px}.vz83-exp-row{border-color:rgba(45,179,106,.28)}.vz83-exp-row .btn.good{background:linear-gradient(135deg,#0c7d43,#25d366)!important;color:#052011!important;font-weight:900}.vz83-config{display:grid;grid-template-columns:minmax(160px,220px) auto;gap:8px;align-items:end;margin:10px 0 12px;padding:10px;border:1px solid rgba(45,179,106,.24);border-radius:12px;background:#f9fbf7}.vz83-config .field{margin:0}.vz83-config .btn{justify-content:center}@media(max-width:760px){.vz83-exp-card .item-head,.vz83-exp-row .item-head{display:block}.vz83-exp-card .row,.vz83-exp-row .row{margin-top:8px}.vz83-config{grid-template-columns:1fr}.vz83-config .btn{width:100%}}';
    document.head.appendChild(st);
  }
  try{
    addStyle83();
    if((typeof session!=='undefined' && session) && typeof renderAll==='function') renderAll();
    console.log('V83: lembrete de vencimento do clube carregado.');
  }catch(e){ console.error('V83 erro:',e); }

<script id="vz85-comissao-produto-salva-venda">
(function(){
  var FLAG='vizzarty_v85_comissao_produto_salva_venda';
  if(window[FLAG]) return;
  window[FLAG]=true;

  function n(v){ try{return typeof num==='function'?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function qtd(v){ return Math.max(1,n(v?.qtd)||1); }
  function produtoDaVenda(v){
    try{return (state.produtos||[]).find(function(p){return String(p.id)===String(v?.produtoId);});}
    catch(e){return null;}
  }
  function pctSalva(v, produto){
    if(v && v.comissaoPctProdutoSalvo!==undefined && v.comissaoPctProdutoSalvo!==null && v.comissaoPctProdutoSalvo!=='') return n(v.comissaoPctProdutoSalvo);
    if(v && v.comissaoPct!==undefined && v.comissaoPct!==null && v.comissaoPct!=='') return n(v.comissaoPct);
    return n(produto?.comissaoPct||0);
  }
  function gravarPctProdutoNaVenda(v, produto){
    if(!v) return false;
    var prod=produto || produtoDaVenda(v);
    var pct=pctSalva(v, prod);
    var total=n(v.total) || n(v.precoUnit)*qtd(v);
    var mudou=false;
    if(v.comissaoPctProdutoSalvo!==pct){ v.comissaoPctProdutoSalvo=pct; mudou=true; }
    if(v.comissaoPct!==pct){ v.comissaoPct=pct; mudou=true; }
    if(v.comissaoFonte!=='produto_no_momento_da_venda'){ v.comissaoFonte='produto_no_momento_da_venda'; mudou=true; }
    if(v.total!==total){ v.total=total; mudou=true; }
    var com=total*pct/100;
    if(v.comissaoValor!==com){ v.comissaoValor=com; mudou=true; }
    return mudou;
  }
  function gravarPctPendencia(p){
    if(p && p.tipo==='venda_produto' && p.venda) return gravarPctProdutoNaVenda(p.venda);
    return false;
  }
  function salvarSeMudou(mudou){
    if(!mudou) return;
    try{ saveLocal(); }catch(e){}
    try{ dirty=true; }catch(e){}
  }

  var baseNormalize85=window.normalize || (typeof normalize==='function'?normalize:null);
  if(typeof baseNormalize85==='function'){
    window.normalize=function(){
      var r=baseNormalize85.apply(this,arguments);
      try{
        (state.vendasProdutos||[]).forEach(function(v){gravarPctProdutoNaVenda(v);});
        (state.pendencias||[]).forEach(function(p){gravarPctPendencia(p);});
      }catch(e){}
      return r;
    };
    try{ normalize=window.normalize; }catch(e){}
  }

  var baseCalcVenda85=window.calcComissaoVenda || (typeof calcComissaoVenda==='function'?calcComissaoVenda:null);
  window.calcComissaoVenda=function(v){
    if(v && v.comissaoPctProdutoSalvo!==undefined && v.comissaoPctProdutoSalvo!==null && v.comissaoPctProdutoSalvo!==''){
      return (n(v.total) || n(v.precoUnit)*qtd(v))*n(v.comissaoPctProdutoSalvo)/100;
    }
    if(typeof baseCalcVenda85==='function') return baseCalcVenda85.apply(this,arguments);
    return (n(v?.total) || n(v?.precoUnit)*qtd(v))*n(v?.comissaoPct||0)/100;
  };
  try{ calcComissaoVenda=window.calcComissaoVenda; }catch(e){}

  var baseRegistrar85=window.registrarVendaProduto || (typeof registrarVendaProduto==='function'?registrarVendaProduto:null);
  if(typeof baseRegistrar85==='function'){
    window.registrarVendaProduto=function(btn){
      var vendasAntes=(state.vendasProdutos||[]).length;
      var pendAntes=(state.pendencias||[]).length;
      var r=baseRegistrar85.apply(this,arguments);
      var mudou=false;
      try{
        (state.vendasProdutos||[]).slice(vendasAntes).forEach(function(v){ if(gravarPctProdutoNaVenda(v)) mudou=true; });
        (state.pendencias||[]).slice(pendAntes).forEach(function(p){ if(gravarPctPendencia(p)) mudou=true; });
      }catch(e){}
      salvarSeMudou(mudou);
      return r;
    };
    try{ registrarVendaProduto=window.registrarVendaProduto; }catch(e){}
  }

  var baseApprove85=window.approve || (typeof approve==='function'?approve:null);
  if(typeof baseApprove85==='function'){
    window.approve=function(i){
      var p=(state.pendencias||[])[i];
      var mudou=gravarPctPendencia(p);
      var vendasAntes=(state.vendasProdutos||[]).length;
      var r=baseApprove85.apply(this,arguments);
      try{
        (state.vendasProdutos||[]).slice(vendasAntes).forEach(function(v){ if(gravarPctProdutoNaVenda(v)) mudou=true; });
      }catch(e){}
      salvarSeMudou(mudou);
      return r;
    };
    try{ approve=window.approve; }catch(e){}
  }

  try{
    if(typeof normalize==='function') normalize();
    if((window.session || (typeof session!=='undefined' && session)) && typeof renderAll==='function') renderAll();
    console.log('V85: porcentagem do produto congelada na venda.');
  }catch(e){ console.error('V85 erro:',e); }
})();
</script>
