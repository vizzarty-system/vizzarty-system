<script>
(function(){
  var DARK_KEY='vzDarkMode';
  function applyDark(on){
    document.documentElement.classList.toggle('dark',on);
    var btn=document.getElementById('vzDarkToggle');
    if(btn) btn.innerHTML=on?'<i class="ti ti-sun"></i>':'<i class="ti ti-moon"></i>';
    if(window.vzDrawChart) setTimeout(vzDrawChart,50);
  }
  window.vzToggleDark=function(){
    var on=!document.documentElement.classList.contains('dark');
    localStorage.setItem(DARK_KEY,on?'1':'0');
    applyDark(on);
  };
  document.addEventListener('DOMContentLoaded',function(){
    applyDark(localStorage.getItem(DARK_KEY)==='1');
  });
})();
</script>

<script>
(function(){

  /* ══════════════════════════════════════════════
     CORES POR CATEGORIA
  ══════════════════════════════════════════════ */
  var CAT_CORES = {
    servicos:   { cor:'#2db36a', label:'Serviços' },
    sindicato:  { cor:'#e8a800', label:'Sindicato' },
    produtos:   { cor:'#2e80d8', label:'Produtos' },
    creditos:   { cor:'#8b5cf6', label:'Créditos/Planos' }
  };

  /* Cores por profissional */
  var PROF_CORES = ['#e84040','#f97316','#06b6d4','#ec4899','#84cc16',
                    '#f59e0b','#10b981','#3b82f6','#a855f7','#14b8a6'];

  /* ── Gerar chave YYYY-MM igual ao today() do sistema ── */
  function mesKey(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }
  function mesLabel(key){
    var p=key.split('-');
    var d=new Date(Number(p[0]),Number(p[1])-1,1);
    return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','').toUpperCase()+'/'+String(d.getFullYear()).slice(2);
  }

  /* ── HTML do card compacto ── */
  function vzChartCardHTML(){
    var meses=[];
    var hoje=new Date();
    for(var i=5;i>=0;i--){
      var d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
      var k=mesKey(d);
      meses.push({label:mesLabel(k), key:k});
    }
    var opts=meses.map(function(m,i){
      return '<option value="'+m.key+'"'+(i===meses.length-1?' selected':'')+'>'+m.label+'</option>';
    }).join('');

    return '<div class="card vz-chart-card" style="margin-bottom:12px;padding:14px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px">'+
        '<span style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px">'+
          '<i class="ti ti-chart-donut-3" style="color:var(--green)"></i> Faturamento por categoria'+
        '</span>'+
        '<select id="vzChartMes" onchange="vzDrawChart()" style="max-width:120px;padding:6px 8px;font-size:12px">'+opts+'</select>'+
      '</div>'+
      /* Linha 1: donut categorias | legenda | donut por profissional */
      '<div style="display:grid;grid-template-columns:130px 1fr 130px;gap:12px;align-items:start" id="vzChartGrid">'+
        '<div style="text-align:center">'+
          '<div style="font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:700;margin-bottom:4px;letter-spacing:.5px">Por categoria</div>'+
          '<canvas id="vzDonutCat" width="120" height="120" style="max-width:120px"></canvas>'+
        '</div>'+
        '<div id="vzChartLegendCat" style="font-size:12px;line-height:1.5;min-width:0"></div>'+
        '<div style="text-align:center">'+
          '<div style="font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:700;margin-bottom:4px;letter-spacing:.5px">Por profissional</div>'+
          '<canvas id="vzDonutProf" width="120" height="120" style="max-width:120px"></canvas>'+
          '<div id="vzChartLegendProf" style="font-size:11px;margin-top:6px;text-align:left"></div>'+
        '</div>'+
      '</div>'+
      /* Linha 2: resumo campeões */
      '<div id="vzChartDestaque" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"></div>'+
    '</div>';
  }

  /* ── Calcular dados do mês ── */
  function calcMes(mesKey){
    var n=function(v){return Number(v)||0;};
    var profs = state.profissionais||[];
    var hist   = state.historico||[];
    var vprod  = state.vendasProdutos||[];
    var credH  = state.creditHistory||[];

    /* Por categoria global */
    var cat = {servicos:0, sindicato:0, produtos:0, creditos:0};

    /* Por profissional */
    var profMap = {};
    profs.forEach(function(p){
      profMap[String(p.id)] = {nome:p.nome||'Prof', total:0};
    });

    /* 1. Historico de atendimentos */
    hist.filter(function(h){ return String(h.data||'').slice(0,7)===mesKey; })
      .forEach(function(h){
        var v = n(h.valorFinal);
        if(h.sindicato) cat.sindicato += v;
        else            cat.servicos  += v;
        var pid = String(h.profId||'');
        if(profMap[pid]) profMap[pid].total += v;
        else { /* prof não encontrado, ignora ou cria */ }
      });

    /* 2. Vendas de produtos */
    vprod.filter(function(v){ return String(v.data||'').slice(0,7)===mesKey; })
      .forEach(function(v){
        var val = n(v.total);
        if(v.tipoVenda==='sindicato') cat.sindicato += val;
        else                          cat.produtos   += val;
        var pid = String(v.profId||'');
        if(profMap[pid]) profMap[pid].total += val;
      });

    /* 3. Créditos/Planos (fechamento ou renovacao) */
    credH.filter(function(h){
      return (h.tipo==='fechamento'||h.tipo==='renovacao') && String(h.data||'').slice(0,7)===mesKey;
    }).forEach(function(h){
      cat.creditos += n(h.valorTotal);
      /* créditos não têm profissional direto — não soma no prof */
    });

    var totalGeral = cat.servicos+cat.sindicato+cat.produtos+cat.creditos;

    /* Ordenar profs */
    var profArr = Object.values(profMap).filter(function(p){return p.total>0;})
      .sort(function(a,b){return b.total-a.total;});

    return {cat:cat, totalGeral:totalGeral, profArr:profArr};
  }

  /* ── Helpers ── */
  function brlFmt(v){
    return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function pct(v,t){ return t>0?((v/t)*100).toFixed(1):'0.0'; }

  var _donutCat=null, _donutProf=null;

  window.vzDrawChart=function(){
    var mes=document.getElementById('vzChartMes');
    if(!mes) return;
    var mesVal=mes.value;

    function doRender(){
      var isDark=document.documentElement.classList.contains('dark');
      var borderCol=isDark?'#1b2419':'#ffffff';
      var d=calcMes(mesVal);

      /* ── Donut 1: categorias ── */
      var catKeys=['servicos','sindicato','produtos','creditos'];
      var catLabels=catKeys.map(function(k){return CAT_CORES[k].label;});
      var catVals=catKeys.map(function(k){return d.cat[k];});
      var catCores=catKeys.map(function(k){return CAT_CORES[k].cor;});
      /* Remove zeros para não poluir */
      var catFilt=[],catLFilt=[],catCFilt=[];
      catVals.forEach(function(v,i){
        if(v>0){catFilt.push(v);catLFilt.push(catLabels[i]);catCFilt.push(catCores[i]);}
      });
      if(catFilt.length===0){catFilt=[1];catLFilt=['Sem dados'];catCFilt=['#dde8d5'];}

      var ctx1=document.getElementById('vzDonutCat');
      if(!ctx1) return;
      if(_donutCat){_donutCat.destroy();_donutCat=null;}
      _donutCat=new Chart(ctx1,{
        type:'doughnut',
        data:{labels:catLFilt,datasets:[{data:catFilt,backgroundColor:catCFilt,borderColor:borderCol,borderWidth:2,hoverOffset:4}]},
        options:{cutout:'70%',maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){
          var v=c.raw||0; return ' '+brlFmt(v)+' ('+pct(v,catFilt.reduce(function(a,b){return a+b;},0))+'%)';
        }}}}}
      });

      /* Legenda categorias */
      var legCat=document.getElementById('vzChartLegendCat');
      if(legCat){
        var t=d.totalGeral;
        if(t===0){
          legCat.innerHTML='<span style="color:var(--mut)">Sem lançamentos neste mês</span>';
        } else {
          /* Qual categoria mais faturou */
          var maxCatKey=catKeys.reduce(function(a,b){return d.cat[a]>=d.cat[b]?a:b;});
          var rows=catKeys.filter(function(k){return d.cat[k]>0;}).map(function(k){
            var v=d.cat[k], c=CAT_CORES[k];
            var isMax=k===maxCatKey;
            return '<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">'+
              '<span style="width:9px;height:9px;border-radius:2px;background:'+c.cor+';flex:0 0 9px;display:inline-block"></span>'+
              '<span style="font-size:12px;font-weight:'+(isMax?'700':'500')+';color:var(--txt)">'+c.label+'</span>'+
              (isMax?'<span style="font-size:10px;background:'+c.cor+'22;color:'+c.cor+';border-radius:4px;padding:1px 5px;margin-left:2px">🏆</span>':'')+
              '<span style="margin-left:auto;font-size:11px;color:var(--mut)">'+pct(v,t)+'%</span>'+
              '</div>'+
              '<div style="font-size:11px;color:'+c.cor+';font-weight:600;margin:-1px 0 5px 14px">'+brlFmt(v)+'</div>';
          }).join('');
          legCat.innerHTML=rows+
            '<div style="border-top:1px solid var(--line);padding-top:5px;margin-top:2px;display:flex;justify-content:space-between">'+
              '<span style="font-size:11px;color:var(--mut)">Total</span>'+
              '<b style="font-size:12px;color:var(--green)">'+brlFmt(t)+'</b>'+
            '</div>';
        }
      }

      /* ── Donut 2: por profissional ── */
      var ctx2=document.getElementById('vzDonutProf');
      if(!ctx2) return;
      if(_donutProf){_donutProf.destroy();_donutProf=null;}
      var profVals=d.profArr.map(function(p){return p.total;});
      var profLabels=d.profArr.map(function(p){return p.nome;});
      var profCores=d.profArr.map(function(_,i){return PROF_CORES[i%PROF_CORES.length];});
      if(profVals.length===0){profVals=[1];profLabels=['Sem dados'];profCores=['#dde8d5'];}

      _donutProf=new Chart(ctx2,{
        type:'doughnut',
        data:{labels:profLabels,datasets:[{data:profVals,backgroundColor:profCores,borderColor:borderCol,borderWidth:2,hoverOffset:4}]},
        options:{cutout:'70%',maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){
          var v=c.raw||0; return ' '+brlFmt(v)+' ('+pct(v,profVals.reduce(function(a,b){return a+b;},0))+'%)';
        }}}}}
      });

      /* Legenda profissionais */
      var legProf=document.getElementById('vzChartLegendProf');
      if(legProf){
        var pt=profVals.reduce(function(a,b){return a+b;},0);
        legProf.innerHTML=(d.profArr.length===0?'<span style="color:var(--mut)">—</span>':
          d.profArr.map(function(p,i){
            var isMax=i===0;
            return '<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">'+
              '<span style="width:7px;height:7px;border-radius:2px;background:'+profCores[i]+';flex:0 0 7px;display:inline-block"></span>'+
              '<span style="font-size:10px;font-weight:'+(isMax?700:500)+';color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75px">'+p.nome+'</span>'+
              '<span style="margin-left:auto;font-size:10px;color:var(--mut)">'+pct(p.total,pt)+'%</span>'+
              '</div>';
          }).join('')
        );
      }

      /* ── Destaques: campeão categoria + campeão profissional ── */
      var dest=document.getElementById('vzChartDestaque');
      if(dest){
        var html='';
        if(d.totalGeral>0){
          /* Campeão categoria */
          var maxCK=catKeys.reduce(function(a,b){return d.cat[a]>=d.cat[b]?a:b;});
          var maxCC=CAT_CORES[maxCK];
          html+='<div style="display:flex;align-items:center;gap:7px;background:'+maxCC.cor+'18;border:1px solid '+maxCC.cor+'44;border-radius:10px;padding:7px 10px;flex:1;min-width:150px">'+
            '<span style="font-size:18px">🏆</span>'+
            '<div><div style="font-size:10px;color:var(--mut);font-weight:600">Categoria top</div>'+
            '<b style="font-size:13px;color:'+maxCC.cor+'">'+maxCC.label+'</b>'+
            '<div style="font-size:11px;color:var(--mut)">'+brlFmt(d.cat[maxCK])+'</div></div>'+
          '</div>';
          /* Campeão profissional */
          if(d.profArr.length>0){
            var topProf=d.profArr[0];
            html+='<div style="display:flex;align-items:center;gap:7px;background:#e84040\18;border:1px solid #e8404044;border-radius:10px;padding:7px 10px;flex:1;min-width:150px">'+
              '<span style="font-size:18px">⭐</span>'+
              '<div><div style="font-size:10px;color:var(--mut);font-weight:600">Profissional top</div>'+
              '<b style="font-size:13px;color:#e84040">'+topProf.nome+'</b>'+
              '<div style="font-size:11px;color:var(--mut)">'+brlFmt(topProf.total)+'</div></div>'+
            '</div>';
          }
          /* Total geral */
          html+='<div style="display:flex;align-items:center;gap:7px;background:var(--green)18;border:1px solid var(--green)44;border-radius:10px;padding:7px 10px;flex:1;min-width:150px">'+
            '<span style="font-size:18px">💰</span>'+
            '<div><div style="font-size:10px;color:var(--mut);font-weight:600">Total do mês</div>'+
            '<b style="font-size:13px;color:var(--green)">'+brlFmt(d.totalGeral)+'</b></div>'+
          '</div>';
        } else {
          html='<span style="font-size:12px;color:var(--mut)">Sem lançamentos neste mês.</span>';
        }
        dest.innerHTML=html;
      }
    }

    /* Carregar Chart.js se necessário */
    if(window.Chart){ doRender(); return; }
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    s.onload=doRender;
    document.head.appendChild(s);
  };

  /* ── Interceptar painelHTML ── */
  function injectChart(){
    var _base=window.painelHTML||(typeof painelHTML==='function'?painelHTML:null);
    if(typeof _base!=='function') return;
    window.painelHTML=function(){
      var html=_base.apply(this,arguments);
      if(typeof isAdmin==='function'&&!isAdmin()) return html;
      return vzChartCardHTML()+html;
    };
    try{painelHTML=window.painelHTML;}catch(e){}

    var _baseRA=window.renderAll||(typeof renderAll==='function'?renderAll:null);
    if(typeof _baseRA==='function'){
      window.renderAll=function(){
        _baseRA.apply(this,arguments);
        setTimeout(function(){
          if(document.getElementById('vzDonutCat')) vzDrawChart();
        },100);
      };
      try{renderAll=window.renderAll;}catch(e){}
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',injectChart);
  } else {
    injectChart();
  }

  console.log('VZ-CHART v2: categorias + profissional + destaque.');
})();
</script>

<script id="vz100-auditoria-blindagem-lancamentos-aprovacoes">
/* ===== V100: Auditoria + blindagem final de lançamentos/aprovações =====
   Objetivo: garantir que mudanças visuais, gráficos e cores não afetem regras de negócio.
   - Profissional: pendências exibem somente comissão possível.
   - Admin: aprovações exibem total da venda + comissão do profissional.
   - Aprovar/recusar funciona para serviço, atendimento, produto, venda de produto e sindicato.
   - Venda de produto do profissional sempre vai para aprovação.
   - Admin registra direto.
   - Corrige toggle de mostrar/ocultar serviço no link, caso não exista.
*/
(function(){
  var FLAG='vizzarty_v100_auditoria_blindagem_lancamentos_aprovacoes';
  if(window[FLAG]) return;
  window[FLAG]=true;

  function n(v){ try{return typeof num==='function'?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function money(v){ try{return typeof brl==='function'?brl(n(v)):('R$ '+n(v).toFixed(2).replace('.',','));}catch(e){return 'R$ '+n(v).toFixed(2).replace('.',',');} }
  function id(){ try{return typeof uid==='function'?uid():('v100_'+Date.now().toString(36)+Math.random().toString(36).slice(2));}catch(e){return 'v100_'+Date.now().toString(36)+Math.random().toString(36).slice(2);} }
  function hoje(){ try{return typeof today==='function'?today():new Date().toISOString().slice(0,10);}catch(e){return new Date().toISOString().slice(0,10);} }
  function hora(){ try{return typeof nowHH==='function'?nowHH():new Date().toTimeString().slice(0,5);}catch(e){return new Date().toTimeString().slice(0,5);} }
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}
  function toastSafe(msg){ try{ if(typeof toast==='function') return toast(msg); }catch(e){} alert(msg); }
  function isAdm(){ try{return typeof isAdmin==='function'&&isAdmin();}catch(e){return !!(window.session&&session.role==='admin');} }
  function profAtual(){ try{return typeof currentProf==='function'?currentProf():null;}catch(e){return null;} }
  function profById(pid){ return (state.profissionais||[]).find(function(p){return String(p.id)===String(pid);}); }
  function pctProf(pid){ var p=profById(pid); return n(p&&p.comissao); }
  function save(render){
    try{ if(typeof normalize==='function') normalize(); }catch(e){}
    try{ state.updatedAt=Date.now(); }catch(e){}
    try{ window.dirty=true; dirty=true; }catch(e){}
    try{ if(typeof saveLocal==='function') saveLocal(); else localStorage.setItem('vz_state',JSON.stringify(state)); }catch(e){}
    if(render!==false){ try{ if(typeof renderAll==='function') renderAll(); }catch(e){} }
    try{ clearTimeout(window.vz100SyncTimer); window.vz100SyncTimer=setTimeout(function(){ try{ if(typeof syncNow==='function') syncNow(true); }catch(e){} },700); }catch(e){}
  }
  function ensureArrays(){
    state.pendencias=Array.isArray(state.pendencias)?state.pendencias:[];
    state.fila=Array.isArray(state.fila)?state.fila:[];
    state.historico=Array.isArray(state.historico)?state.historico:[];
    state.servicos=Array.isArray(state.servicos)?state.servicos:[];
    state.produtos=Array.isArray(state.produtos)?state.produtos:[];
    state.vendasProdutos=Array.isArray(state.vendasProdutos)?state.vendasProdutos:[];
  }
  function ehSind(x){
    var nome=String((x&&x.servNome)||(x&&x.produtoNome)||(x&&x.nome)||'').toLowerCase();
    return !!(x&&(x.sindicato===true||x.beneficioUsado===true||String(x.tipoVenda||'').toLowerCase()==='sindicato'||String(x.tipo||'').toLowerCase()==='sindicato_qtd'||String(x.produtoId||'')==='__sindicato_corte__'||String(x.servId||'')==='__sindicato_corte__'||nome.indexOf('sindicato')>=0));
  }
  function valorAt(a){ return n((a&&a.valorFinal)!==undefined?a.valorFinal:(a&&a.total)!==undefined?a.total:0); }
  function valorVenda(v){ return n((v&&v.total)!==undefined?v.total:(v&&v.valorFinal)!==undefined?v.valorFinal:0); }
  function comAt(a){
    try{ if(typeof calcComissaoAtendimento==='function') return n(calcComissaoAtendimento(a)); }catch(e){}
    var pct=(a&&a.comissaoPctAtendimento!==undefined)?n(a.comissaoPctAtendimento):(ehSind(a)?n(state&&state.config&&state.config.sindicatoComissaoPct):pctProf(a&&a.profId));
    return valorAt(a)*pct/100;
  }
  function comVenda(v){
    try{ if(typeof calcComissaoVenda==='function') return n(calcComissaoVenda(v)); }catch(e){}
    if(v&&v.comissaoValor!==undefined&&v.comissaoValor!==null) return n(v.comissaoValor);
    return valorVenda(v)*n(v&&v.comissaoPct)/100;
  }
  function comPend(p){
    if(!p) return 0;
    if(p.tipo==='sindicato_qtd') return n(p.comissaoValor);
    if(p.tipo==='venda_produto') return comVenda(p.venda||p);
    if(p.tipo==='produto'||p.tipo==='servico') return 0;
    return comAt(p);
  }
  function totalPend(p){
    if(!p) return 0;
    if(p.tipo==='sindicato_qtd') return n(p.total);
    if(p.tipo==='venda_produto') return valorVenda(p.venda||p);
    if(p.tipo==='produto'||p.tipo==='servico') return 0;
    return valorAt(p);
  }
  function tipoPend(p){
    if(!p) return 'Lançamento';
    if(p.tipo==='sindicato_qtd'||ehSind(p)) return 'Sindicato';
    if(p.tipo==='venda_produto') return 'Venda de produto';
    if(p.tipo==='produto') return 'Cadastro de produto';
    if(p.tipo==='servico') return 'Cadastro de serviço';
    return 'Serviço';
  }
  function nomePend(p){
    if(!p) return 'Aguardando aprovação';
    if(p.tipo==='sindicato_qtd'||ehSind(p)) return p.resumo||p.produtoNome||p.servNome||'Corte do sindicato';
    if(p.tipo==='venda_produto') return (p.venda&&p.venda.produtoNome)||p.produtoNome||'Produto aguardando aprovação';
    if(p.tipo==='produto') return (p.produto&&p.produto.nome)||p.resumo||'Novo produto';
    if(p.tipo==='servico') return (p.servico&&p.servico.nome)||p.resumo||'Novo serviço';
    return p.servNome||p.nome||'Serviço aguardando aprovação';
  }
  function dataPend(p){ var v=(p&&p.venda)||{}; return [p&&p.data||v.data||'',p&&p.hora||v.hora||''].filter(Boolean).join(' '); }
  function podeUsarBeneficio(qtd){ try{return typeof beneficioPodeUsar==='function'?beneficioPodeUsar(qtd):true;}catch(e){return true;} }
  function msgBeneficio(){ try{return typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite do sindicato esgotado.';}catch(e){return 'Limite do sindicato esgotado.';} }
  function marcarBen(v,qtd){ try{ if(typeof marcarBeneficio==='function') marcarBeneficio(v,qtd); }catch(e){} }

  if(typeof window.toggleServicoLink!=='function'){
    window.toggleServicoLink=function(sid){
      if(!isAdm()) return toastSafe('Somente admin');
      ensureArrays();
      var s=(state.servicos||[]).find(function(x){return String(x.id)===String(sid);});
      if(!s) return toastSafe('Serviço não encontrado.');
      s.linkAtivo = s.linkAtivo===false;
      save(true);
      toastSafe(s.linkAtivo===false?'Serviço ocultado do link.':'Serviço liberado no link.');
    };
    try{ toggleServicoLink=window.toggleServicoLink; }catch(e){}
  }

  function montarVendaSindicato(p){
    var qtd=Math.max(1,n(p.qtd)||1), preco=n(p.precoUnit||state?.config?.sindicatoPreco||0), pct=n(p.comissaoPct||state?.config?.sindicatoComissaoPct||0), total=preco*qtd;
    return {id:id(),tipoVenda:'sindicato',produtoId:'__sindicato_corte__',produtoNome:p.produtoNome||p.nome||'Corte de cabelo pelo sindicato',profId:p.profId||'',profNome:p.profNome||'',clienteNome:p.clienteNome||'',qtd:qtd,precoUnit:preco,total:total,comissaoPct:pct,comissaoValor:n(p.comissaoValor)||total*pct/100,data:p.data||hoje(),hora:p.hora||hora(),obs:p.obs||'',createdAt:Date.now(),aprovadoAdmin:true,pendenciaOrigemId:p.id||''};
  }

  var approveAnterior=window.approve || (typeof approve==='function'?approve:null);
  window.approve=function(i){
    ensureArrays();
    if(!isAdm()) return toastSafe('Somente o administrador pode aprovar.');
    i=Number(i);
    var p=state.pendencias[i];
    if(!p) return toastSafe('Pendência não encontrada. Atualize a tela.');

    if(p.tipo==='sindicato_qtd'){
      var qtd=Math.max(1,n(p.qtd)||1);
      if(!podeUsarBeneficio(qtd)) return toastSafe(msgBeneficio());
      var venda=montarVendaSindicato(p);
      state.vendasProdutos.push(venda);
      marcarBen(venda,qtd);
      state.pendencias.splice(i,1);
      save(true);
      return toastSafe('Sindicato aprovado e registrado no extrato.');
    }
    if(p.tipo==='venda_produto'){
      var v=p.venda||p;
      if(!v.id) v.id=id();
      if(!v.tipoVenda) v.tipoVenda='produto';
      var prod=(state.produtos||[]).find(function(x){return String(x.id)===String(v.produtoId);});
      if(prod && !v._estoqueDescontado){ prod.estoque=Math.max(0,n(prod.estoque)-Math.max(1,n(v.qtd)||1)); v._estoqueDescontado=true; }
      state.vendasProdutos.push(v);
      state.pendencias.splice(i,1);
      save(true);
      return toastSafe('Venda de produto aprovada e registrada.');
    }
    if(p.tipo==='produto'){
      if(p.produto){ state.produtos.push(p.produto); }
      state.pendencias.splice(i,1);
      save(true);
      return toastSafe('Produto aprovado e cadastrado.');
    }
    if(p.tipo==='servico'){
      if(p.servico){ state.servicos.push(p.servico); }
      state.pendencias.splice(i,1);
      save(true);
      return toastSafe('Serviço aprovado e cadastrado.');
    }

    var atendimento=Object.assign({},p,{pendenteAdmin:false,status:p.status&&p.status!=='pendente_admin'?p.status:'aguardando',aprovadoAdmin:true});
    state.fila.push(atendimento);
    state.pendencias.splice(i,1);
    save(true);
    toastSafe('Atendimento aprovado e enviado para a fila/agendamentos.');
  };
  try{ approve=window.approve; }catch(e){}

  window.reject=function(i){
    ensureArrays();
    if(!isAdm()) return toastSafe('Somente o administrador pode recusar.');
    i=Number(i);
    if(!state.pendencias[i]) return toastSafe('Pendência não encontrada.');
    state.pendencias.splice(i,1);
    save(true);
    toastSafe('Solicitação recusada.');
  };
  try{ reject=window.reject; }catch(e){}

  function produtoById(pid){ return (state.produtos||[]).find(function(p){return String(p.id)===String(pid);}); }
  function rowVendaToObj(row,prof,cliente,data){
    var prod=produtoById(row.querySelector('.vpProdutoItem,.vpProduto')?.value);
    if(!prod) return null;
    var qtd=Math.max(1,n(row.querySelector('.vpQtdItem,.vpQtd')?.value)||1);
    var total=n(prod.preco)*qtd, pct=n(prod.comissaoPct), com=total*pct/100;
    return {id:id(),vendaGrupoId:id(),tipoVenda:'produto',produtoId:prod.id,produtoNome:prod.nome,profId:prof.id,profNome:prof.nome,clienteNome:cliente||'',qtd:qtd,precoUnit:n(prod.preco),total:total,comissaoPct:pct,comissaoValor:com,data:data||hoje(),hora:hora(),createdAt:Date.now()};
  }
  function vendasDoFormulario(btn){
    ensureArrays();
    var box=(btn&&btn.closest)?(btn.closest('.v61-sale-box')||btn.closest('.card')):document;
    var prof=isAdm() ? (state.profissionais||[]).find(function(p){return String(p.id)===String(box.querySelector('.vpProf,#vpProf')?.value);}) : profAtual();
    if(!prof) return {erro:'Selecione o colaborador que vendeu.'};
    var cliente=box.querySelector('.vpCliente,#vpCliente')?.value||'';
    var data=box.querySelector('.vpData,#vpData')?.value||hoje();
    var rows=[].slice.call(box.querySelectorAll('.v61-sale-row'));
    var vendas=[];
    if(rows.length){
      rows.forEach(function(row){ var v=rowVendaToObj(row,prof,cliente,data); if(v) vendas.push(v); });
    }else{
      var prodId=box.querySelector('.vpProduto,#vpProduto')?.value || document.getElementById('vpProduto')?.value;
      var prod=produtoById(prodId);
      if(!prod) return {erro:'Cadastre ou selecione um produto ativo.'};
      var qtd=Math.max(1,n((box.querySelector('.vpQtd,#vpQtd')||document.getElementById('vpQtd'))?.value)||1);
      var total=n(prod.preco)*qtd, pct=n(prod.comissaoPct), com=total*pct/100;
      vendas.push({id:id(),tipoVenda:'produto',produtoId:prod.id,produtoNome:prod.nome,profId:prof.id,profNome:prof.nome,clienteNome:cliente,qtd:qtd,precoUnit:n(prod.preco),total:total,comissaoPct:pct,comissaoValor:com,data:data,hora:hora(),createdAt:Date.now()});
    }
    if(!vendas.length) return {erro:'Adicione pelo menos 1 produto.'};
    return {vendas:vendas,box:box};
  }

  window.registrarVendaProduto=function(btn){
    var r=vendasDoFormulario(btn);
    if(r.erro) return toastSafe(r.erro);
    if(isAdm()){
      r.vendas.forEach(function(v){
        var prod=produtoById(v.produtoId);
        if(prod) prod.estoque=Math.max(0,n(prod.estoque)-Math.max(1,n(v.qtd)||1));
        v._estoqueDescontado=true;
        state.vendasProdutos.push(v);
      });
      save(true);
      return toastSafe('Venda registrada.');
    }
    r.vendas.forEach(function(v){
      state.pendencias.push({id:v.id,tipo:'venda_produto',venda:v,profId:v.profId,profNome:v.profNome,resumo:'Venda de produto aguardando aprovação',criadoEm:Date.now()});
    });
    save(true);
    toastSafe(r.vendas.length>1?'Vendas enviadas para aprovação do admin.':'Venda enviada para aprovação do admin.');
  };
  try{ registrarVendaProduto=window.registrarVendaProduto; }catch(e){}

  window.pendenciasHTML=function(){
    ensureArrays();
    if(!isAdm() || !state.pendencias.length) return '';
    var rows=state.pendencias.map(function(p,i){
      var prof=p.profNome||(profById(p.profId)||{}).nome||'Profissional';
      return '<div class="item"><div class="item-head"><div style="flex:1"><b>'+esc(nomePend(p))+'</b>'+ 
        '<div class="muted">Solicitado por: '+esc(prof)+' • Tipo: '+esc(tipoPend(p))+(dataPend(p)?' • '+esc(dataPend(p)):'')+' • Total venda: '+money(totalPend(p))+' • Comissão profissional: '+money(comPend(p))+'</div>'+ 
        '</div><div class="row"><button class="btn small good" onclick="approve('+i+')">Aprovar</button><button class="btn small bad" onclick="reject('+i+')">Recusar</button></div></div></div>';
    }).join('');
    return '<div class="card"><h2>Aprovações pendentes</h2><p class="muted">Admin vê total da venda e comissão. O profissional vê somente a comissão possível.</p>'+rows+'</div>';
  };
  try{ pendenciasHTML=window.pendenciasHTML; }catch(e){}

  window.vz100CardPendenciasProf=function(){
    ensureArrays();
    var pid=String((window.session||session||{}).profId||'');
    if(!pid || isAdm()) return '';
    var lista=state.pendencias.filter(function(p){return String(p.profId)===pid;});
    if(!lista.length) return '';
    var totalCom=lista.reduce(function(s,p){return s+comPend(p);},0);
    var rows=lista.map(function(p){
      return '<div class="item" style="border-left:3px solid var(--gold);padding-left:10px"><div class="item-head"><div style="flex:1">'+
        '<span class="badge b-fila"><i class="ti ti-hourglass"></i> Aguardando aprovação</span> <b>'+esc(nomePend(p))+'</b>'+
        '<div class="muted" style="font-size:12px;margin-top:4px">'+esc(tipoPend(p))+(dataPend(p)?' • '+esc(dataPend(p)):'')+'</div>'+
        '<div class="row" style="margin-top:7px"><span class="badge b-ok">Comissão possível: '+money(comPend(p))+'</span></div>'+
        '</div></div></div>';
    }).join('');
    return '<div class="card vz100-pend-card" style="border-color:rgba(45,179,106,.4)"><h2 style="color:var(--gold);display:flex;align-items:center;gap:8px"><i class="ti ti-hourglass"></i> Meus lançamentos pendentes ('+lista.length+')</h2><p class="muted" style="font-size:12px;margin:-4px 0 12px">Mostra somente sua comissão possível. Total da venda fica oculto para profissional.</p><div class="statgrid" style="margin-bottom:12px"><div class="stat"><b>'+lista.length+'</b><span>Aguardando</span></div><div class="stat"><b>'+money(totalCom)+'</b><span>Comissão possível</span></div></div>'+rows+'</div>';
  };

  function removeCardsPendentesProf(html){
    if(isAdm()) return html;
    try{
      var wrap=document.createElement('div'); wrap.innerHTML=String(html||'');
      [].slice.call(wrap.querySelectorAll('.card')).forEach(function(card){
        var t=(card.textContent||'').toLowerCase();
        if(t.indexOf('meus lançamentos pendentes')>=0 || t.indexOf('meus lançamentos aguardando aprovação')>=0) card.remove();
      });
      return wrap.innerHTML;
    }catch(e){return String(html||'');}
  }

  var basePainel=window.painelHTML || (typeof painelHTML==='function'?painelHTML:null);
  if(typeof basePainel==='function'){
    window.painelHTML=function(){
      var html=basePainel.apply(this,arguments);
      if(isAdm()) return html;
      return window.vz100CardPendenciasProf()+removeCardsPendentesProf(html);
    };
    try{ painelHTML=window.painelHTML; }catch(e){}
  }
  var baseExtrato=window.extratoHTML || (typeof extratoHTML==='function'?extratoHTML:null);
  if(typeof baseExtrato==='function'){
    window.extratoHTML=function(){
      var html=baseExtrato.apply(this,arguments);
      if(isAdm()) return html;
      return window.vz100CardPendenciasProf()+removeCardsPendentesProf(html);
    };
    try{ extratoHTML=window.extratoHTML; }catch(e){}
  }

  var drawBase=window.vzDrawChart;
  if(typeof drawBase==='function'){
    window.vzDrawChart=function(){
      try{ return drawBase.apply(this,arguments); }
      catch(e){ console.warn('Gráfico ignorado para não afetar lançamentos/aprovações:',e); }
    };
  }

  window.vz100AuditoriaSistema=function(){
    var profCard=String(window.vz100CardPendenciasProf?window.vz100CardPendenciasProf():'').toLowerCase();
    return {
      versao:'V100',
      graficos_sao_visuais:true,
      toggle_servico_link_ok: typeof window.toggleServicoLink==='function',
      approve_blindado: String(window.approve).indexOf('venda_produto')>=0 && String(window.approve).indexOf('sindicato_qtd')>=0,
      reject_blindado: typeof window.reject==='function',
      venda_produto_profissional_vai_para_aprovacao: String(window.registrarVendaProduto).indexOf('state.pendencias.push')>=0,
      profissional_oculta_total_pendente: !(/total venda|valor total|total vendido|total:|valor:/.test(profCard)),
      profissional_mostra_comissao_pendente: /comiss/.test(profCard)
    };
  };

  try{ if(window.session && typeof renderAll==='function' && document.getElementById('pages')) renderAll(); }catch(e){}
  console.log('V100: auditoria e blindagem final de lançamentos/aprovações aplicada.', window.vz100AuditoriaSistema());
})();
</script>

</body>
</html>
