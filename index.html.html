<body>
<div id="clientPage" class="client-page"><div class="client-wrap" id="clientWrap"></div></div>
<div id="loginBox" class="login card">
  <div class="brand"><div class="logo" id="loginLogo">V</div><b>Vizzarty System</b><small>Sistema de gestão</small></div>
  <div class="field"><label>Entrar como</label><select id="loginRole" onchange="clearLoginMsg();renderLoginProfs()"><option value="admin">Administrador</option><option value="prof">Profissional</option></select></div>
  <div class="field" id="loginProfWrap" style="display:none"><label>Profissional</label><select id="loginProf"></select></div>
  <div class="field"><label>Senha</label><input id="loginPass" type="password" placeholder="Senha"></div>
  <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()">Entrar</button>
  <div id="loginMsg" class="danger-note hidden" style="margin-top:10px;text-align:center"></div>
  <p class="muted">Senha admin padrão: 1234</p>
</div>
<div id="app" class="app hidden">
  <aside class="side" id="side"><div class="brand"><div class="logo" id="logoBox">V</div><b id="brandName">Vizzarty</b><small>gestão online</small></div><div class="nav" id="nav"></div></aside>
  <main class="main"><div class="top"><div class="row"><button class="btn menu" onclick="side.classList.toggle('open')"><i class="ti ti-menu-2"></i></button><b id="pageTitle">Painel</b></div><div class="row"><span class="sync" id="syncStatus">offline</span><button class="btn small blue" onclick="syncNow(true)"><i class="ti ti-cloud-upload"></i>Sincronizar</button></div></div><div class="content" id="pages"></div></main>
</div>
<script>

/* ===== V54: proteção global carregada antes do sistema ===== */
window.vzSecure = window.vzSecure || { painel:false, extrato:false };

window.vzAdminSenhaAtual = function(){
  try{return String(window.state?.config?.adminSenha || state?.config?.adminSenha || '1234').trim();}catch(e){return '1234';}
};

window.vzOpenSenhaModal = function(opts){
  opts = opts || {};
  let id = 'vzSenhaModal';
  let old = document.getElementById(id);
  if(old) old.remove();

  let div = document.createElement('div');
  div.className = 'vz-modal-bg';
  div.id = id;
  div.innerHTML = `
    <div class="vz-modal">
      <h2>${opts.titulo || 'Área protegida'}</h2>
      <p>${opts.texto || 'Digite a senha do administrador para visualizar essas informações.'}</p>
      <div class="field">
        <label>Senha do administrador</label>
        <div class="vz-pass-wrap">
          <input id="vzModalSenhaInput" type="password" placeholder="Digite a senha">
          <button type="button" onclick="vzToggleModalSenha()" title="Mostrar/ocultar senha"><i class="ti ti-eye"></i></button>
        </div>
      </div>
      <div id="vzModalErro" class="vz-auth-error">Senha incorreta.</div>
      <div class="vz-modal-actions">
        <button class="btn" onclick="document.getElementById('vzSenhaModal')?.remove()">Cancelar</button>
        <button class="btn primary" onclick="vzConfirmarSenhaModal('${opts.tipo || 'painel'}')"><i class="ti ti-lock-open"></i> Liberar</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  setTimeout(()=>document.getElementById('vzModalSenhaInput')?.focus(),80);
  window.vzModalCallback = opts.callback || null;
};

window.vzToggleModalSenha = function(){
  let i = document.getElementById('vzModalSenhaInput');
  if(i) i.type = i.type === 'password' ? 'text' : 'password';
};

window.vzConfirmarSenhaModal = function(tipo){
  let input = document.getElementById('vzModalSenhaInput');
  let erro = document.getElementById('vzModalErro');
  let senha = String(input?.value || '').trim();
  if(senha !== vzAdminSenhaAtual()){
    if(erro) erro.style.display='block';
    return;
  }
  if(tipo === 'extrato') window.vzSecure.extrato = true;
  if(tipo === 'painel') window.vzSecure.painel = true;
  document.getElementById('vzSenhaModal')?.remove();

  if(typeof window.vzModalCallback === 'function'){
    let cb = window.vzModalCallback;
    window.vzModalCallback = null;
    cb();
  }else{
    try{ renderAll(); }catch(e){}
  }
};

window.vzBloqueioExtratoHTML = function(){
  return `<div class="vz-lock-card">
    <div class="lock-icon"><i class="ti ti-lock"></i></div>
    <h2>Extrato protegido</h2>
    <p class="muted">Para ver comissões, faturamento e histórico financeiro, libere com a senha do administrador.</p>
    <button class="btn primary" onclick="vzOpenSenhaModal({tipo:'extrato',titulo:'Liberar extrato',texto:'Digite a senha do administrador para abrir o extrato.',callback:function(){current='extrato';renderAll();}})">
      <i class="ti ti-eye"></i> Visualizar extrato
    </button>
  </div>`;
};

window.vzAbrirExtrato = function(){
  if(window.vzSecure.extrato){
    current='extrato';
    renderAll();
    return;
  }
  current='extrato';
  renderAll();
};

window.vzPainelValorProtegido = function(valor, label){
  if(window.vzSecure && window.vzSecure.painel){
    return `<div class="vz-secure-value"><b>${valor}</b></div><span>${label}</span>`;
  }
  return `<div class="vz-secure-value"><span class="vz-secure-mask">R$ ••••</span><button class="vz-eye-btn" onclick="vzOpenSenhaModal({tipo:'painel',titulo:'Visualizar faturamento',texto:'Digite a senha do administrador para liberar os valores de faturamento do painel.'})" title="Visualizar com senha"><i class="ti ti-eye"></i></button></div><span>${label}</span>`;
};


const SUPABASE_URL='https://vtrqebzafhsqjsshvklx.supabase.co';
const SUPABASE_KEY='sb_publishable_KF5HCg_RbEchQ515dzU-uQ_Fnwrxc0s';
const REST=SUPABASE_URL+'/rest/v1/vizzarty_state?id=eq.1';
const DEFAULT={version:32,config:{nome:'Vizzarty Barbearia',telefone:'',endereco:'',adminSenha:'1234',logo:'',linkFilaAtiva:true,linkAgendaAtiva:true},horarios:{filaIni:'08:00',filaFim:'18:30',agendaIni:'08:00',agendaFim:'18:30'},horariosEspeciais:[{id:'almoco',nome:'Horário especial almoço',ini:'11:30',fim:'13:30',ativo:true},{id:'noite',nome:'Horário especial noite',ini:'19:00',fim:'22:00',ativo:true}],profissionais:[],servicos:[],clientes:[],fila:[],historico:[],vouchers:[],bloqueios:[],pendencias:[],updatedAt:0,seq:1};
let state=loadLocal()||structuredClone(DEFAULT), session=JSON.parse(localStorage.getItem('vz_session')||'null'), current='painel', dirty=false, editing=false, saveTimer=null, lastCloud=0;
function clone(o){return JSON.parse(JSON.stringify(o))}function byId(id){return document.getElementById(id)}function show(el){if(el)el.classList.remove('hidden')}function hide(el){if(el)el.classList.add('hidden')}function uid(){state.seq=(state.seq||1)+1;return Date.now().toString(36)+state.seq.toString(36)}function today(){return new Date().toISOString().slice(0,10)}function nowHH(){return new Date().toTimeString().slice(0,5)}function num(v){return Number(v)||0}function brl(v){return 'R$ '+num(v).toFixed(2).replace('.',',')}function loadLocal(){try{return JSON.parse(localStorage.getItem('vz_state')||'null')}catch{return null}}function saveLocal(){localStorage.setItem('vz_state',JSON.stringify(state))}function normalize(){state={...clone(DEFAULT),...state};state.config={...DEFAULT.config,...(state.config||{})};state.horarios={...DEFAULT.horarios,...(state.horarios||{})};['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias','horariosEspeciais'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});if(!state.horariosEspeciais.length&&(state.horarios.premAlmocoIni||state.horarios.premNoiteIni)){state.horariosEspeciais=[{id:'almoco',nome:'Horário especial almoço',ini:state.horarios.premAlmocoIni||'11:30',fim:state.horarios.premAlmocoFim||'13:30',ativo:true},{id:'noite',nome:'Horário especial noite',ini:state.horarios.premNoiteIni||'19:00',fim:state.horarios.premNoiteFim||'22:00',ativo:true}].filter(x=>x.ini&&x.fim)}state.horariosEspeciais=state.horariosEspeciais.map(h=>({id:uid(),nome:'Horário especial',ini:'19:00',fim:'22:00',ativo:true,...h,ativo:h.ativo!==false}));state.profissionais=state.profissionais.map(p=>({id:uid(),nome:'',esp:'Barbeiro',telefone:'',foto:'',ativo:true,senha:'1234',comissao:60,...p,ativo:p.ativo!==false}));state.servicos=state.servicos.map(s=>({id:uid(),nome:'Serviço',precoFila:35,precoAgenda:40,precoPremium:50,durFila:20,durAgenda:30,durPremium:40,ativo:true,linkAtivo:true,...s,ativo:s.ativo!==false,linkAtivo:s.linkAtivo!==false}));state.clientes=state.clientes.map(c=>({id:uid(),nome:'',telefone:'',...c}));}
function hasRealData(s){return ['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias'].some(k=>Array.isArray(s?.[k])&&s[k].length>0)||!!s?.config?.logo}function toast(m){let d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
async function cloudGet(){const r=await fetch(REST,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw new Error(await r.text());const a=await r.json();return a[0]?.data||null}
async function cloudPut(){normalize();state.updatedAt=Date.now();saveLocal();const body={id:1,data:state,updated_at:new Date().toISOString()};let r=await fetch(REST,{method:'PATCH',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});if(!r.ok){r=await fetch(SUPABASE_URL+'/rest/v1/vizzarty_state',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text())}lastCloud=state.updatedAt;syncStatus.textContent='salvo na nuvem '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
async function syncNow(force=false){if(editing&&!force)return;if(dirty||force){try{await cloudPut();dirty=false;toast('Sincronizado')}catch(e){syncStatus.textContent='erro nuvem';toast('Erro de nuvem, salvo local')}}else{try{const c=await cloudGet();if(c&&num(c.updatedAt)>num(state.updatedAt)){state=c;normalize();saveLocal();renderAll()}syncStatus.textContent='nuvem ok'}catch(e){syncStatus.textContent='sem nuvem'}}}
function markDirty(){normalize();state.updatedAt=Date.now();dirty=true;saveLocal();renderAll();clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncNow(true),1200)}
setInterval(()=>{if(!dirty&&!editing)syncNow(false)},18000);
document.addEventListener('focusin',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))editing=true});document.addEventListener('focusout',()=>setTimeout(()=>editing=false,300));
function isClient(){return new URLSearchParams(location.search).has('cliente')}function isAdmin(){return session&&session.role==='admin'}function currentProf(){return session?state.profissionais.find(p=>String(p.id)===String(session.profId)):null}function canAdmin(){if(!isAdmin()){toast('Somente admin');return false}return true}
function checkAdminPassword(){let s=prompt('Digite a senha do admin para visualizar a senha do colaborador:'); if(s===null)return false; if(s!==(state.config.adminSenha||'1234')){toast('Senha admin incorreta'); return false;} return true}
function requestShowProfSenha(id){if(!checkAdminPassword())return;let inp=document.getElementById('pf_senha_'+id)||document.getElementById('cfg_prof_senha_'+id);if(!inp)return;inp.type='text';toast('Senha liberada por 15 segundos');setTimeout(()=>{if(inp)inp.type='password'},15000)}
function saveProfPassFromConfig(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===String(id));let inp=document.getElementById('cfg_prof_senha_'+id);if(!p||!inp)return;p.senha=inp.value||'1234';markDirty();toast('Senha do profissional atualizada')}


function showLoginMsg(msg){
  let box=document.getElementById('loginMsg');
  if(box){
    box.textContent=msg;
    box.classList.remove('hidden');
  }else{
    toast(msg);
  }
}
function clearLoginMsg(){
  let box=document.getElementById('loginMsg');
  if(box){
    box.textContent='';
    box.classList.add('hidden');
  }
}
function doLogin(){
  try{
    clearLoginMsg();
    normalize();
    saveLocal();

    const role=(byId('loginRole')?.value||'admin');
    const pass=(byId('loginPass')?.value||'').trim();

    if(!pass){showLoginMsg('Digite a senha para entrar.');return;}

    if(role==='admin'){
      const adminPass=String(state.config?.adminSenha || '1234').trim();
      if(pass!==adminPass){showLoginMsg('Senha do administrador incorreta.');return;}
      session={role:'admin',nome:'Administrador',loginAt:Date.now()};
    }else{
      const profId=byId('loginProf')?.value||'';
      if(!profId){showLoginMsg('Selecione o profissional.');return;}
      const p=state.profissionais.find(x=>String(x.id)===String(profId));

><i class="ti ti-device-floppy"></i>Salvar</button><button class="btn small ${p.ativo===false?'good':'bad'}" onclick="toggleProf('${p.id}')">${p.ativo===false?'Ativar':'Desativar'}</button><button class="btn small bad" onclick="deleteProf('${p.id}')"><i class="ti ti-trash"></i>Excluir</button>${p.telefone?`<button class="btn small good" onclick="openWhats('${p.telefone}','Olá ${p.nome}')">WhatsApp</button>`:''}</div></div></div>`).join(''):'<div class="muted">Nenhum profissional cadastrado.</div>'}</div><div class="card"><h2>Bloquear profissional em data</h2><div class="grid g4"><div class="field"><label>Profissional</label><select id="blProf">${state.profissionais.filter(p=>p.ativo!==false).map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="blData" type="date" value="${today()}"></div><div class="field"><label>Início</label><input id="blIni" type="time" value="08:00"></div><div class="field"><label>Fim</label><input id="blFim" type="time" value="18:00"></div></div><button class="btn primary" onclick="addBloqueio()">Bloquear</button>${state.bloqueios.map((b,i)=>`<div class="item">${state.profissionais.find(p=>String(p.id)===String(b.profId))?.nome||''} • ${b.data} ${b.ini}-${b.fim} <button class="btn small bad" onclick="state.bloqueios.splice(${i},1);markDirty()">Remover</button></div>`).join('')}</div>`
}
async function fileData(f){if(!f)return '';return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
async function addProf(){if(!pfNome.value.trim())return toast('Nome obrigatório');state.profissionais.push({id:uid(),nome:pfNome.value.trim(),telefone:pfTel.value.trim(),comissao:num(pfCom.value)||60,senha:pfSenha.value||'1234',foto:await fileData(pfFoto.files[0]),ativo:true,esp:'Barbeiro'});markDirty()}
async function saveProf(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===String(id));if(!p)return;let nome=document.getElementById('pf_nome_'+id)?.value.trim();if(!nome)return toast('Nome obrigatório');p.nome=nome;p.telefone=document.getElementById('pf_tel_'+id)?.value.trim()||'';p.comissao=num(document.getElementById('pf_com_'+id)?.value)||60;p.senha=document.getElementById('pf_senha_'+id)?.value||'1234';let foto=await fileData(document.getElementById('pf_foto_'+id)?.files?.[0]);if(foto)p.foto=foto;markDirty();toast('Profissional salvo')}
function editProf(id){saveProf(id)}
function toggleProf(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===String(id));if(!p)return;p.ativo=!p.ativo;markDirty()}
function deleteProf(id){if(!canAdmin())return;if(!confirm('Excluir este profissional? Atendimentos antigos continuam no histórico com nome/valor já registrados.'))return;state.profissionais=state.profissionais.filter(p=>String(p.id)!==String(id));state.bloqueios=state.bloqueios.filter(b=>String(b.profId)!==String(id));markDirty()}
function addBloqueio(){if(!blProf.value)return toast('Selecione um profissional');state.bloqueios.push({profId:blProf.value,data:blData.value,ini:blIni.value,fim:blFim.value});markDirty()}
function pendenciasHTML(){if(!isAdmin()||!state.pendencias.length)return '';return `<div class="card"><h2>Aprovações pendentes</h2>${state.pendencias.map((p,i)=>`<div class="item"><b>${p.tipo==='servico'?'Serviço':'Atendimento'}</b><div class="muted">${p.servico?.nome||p.nome||''}</div><button class="btn small good" onclick="approve(${i})">Aprovar</button> <button class="btn small bad" onclick="reject(${i})">Recusar</button></div>`).join('')}</div>`}function approve(i){let p=state.pendencias[i];if(p.tipo==='servico')state.servicos.push(p.servico);else state.fila.push({...p,pendenteAdmin:false});state.pendencias.splice(i,1);markDirty()}function reject(i){state.pendencias.splice(i,1);markDirty()}
function vouchersHTML(){return `<div class="card"><h2>Vouchers</h2><div class="grid g3"><div class="field"><label>Quantidade</label><input id="vcQtd" type="number" value="1"></div><div class="field"><label>Desconto %</label><input id="vcPct" type="number" value="10"></div><div class="field"><label>Validade</label><input id="vcVal" type="date" value="${today()}"></div></div><button class="btn primary" onclick="gerarVouchers()">Gerar</button></div><div class="card"><h2>Lista</h2>${state.vouchers.map(v=>`<div class="item"><b>${v.codigo}</b> • ${v.percentual}% • validade ${v.validade} ${v.usado?'<span class="badge b-off">usado</span>':'<span class="badge b-ok">livre</span>'}<div class="row" style="margin-top:8px"><button class="btn small good" onclick="openWhats('', 'Você ganhou uma cortesia Vizzarty: use o voucher ${v.codigo} e ganhe ${v.percentual}% de desconto. Link: ${clientLink()}')">Enviar WhatsApp</button></div></div>`).join('')}</div>`}function gerarVouchers(){for(let i=0;i<(num(vcQtd.value)||1);i++)state.vouchers.push({id:uid(),codigo:'VIZ'+Math.random().toString(36).slice(2,8).toUpperCase(),percentual:num(vcPct.value)||10,validade:vcVal.value||today(),usado:false});markDirty()}
function extratoHTMLBaseV53(){let list=(isAdmin()?state.historico:state.historico.filter(a=>String(a.profId)===String(session.profId)));let total=list.reduce((s,a)=>s+num(a.valorFinal),0),com=list.reduce((s,a)=>{let p=state.profissionais.find(p=>String(p.id)===String(a.profId));return s+num(a.valorFinal)*(num(p?.comissao||0)/100)},0);return `<div class="statgrid"><div class="stat"><b>${list.length}</b><span>Atendimentos</span></div><div class="stat"><b>${brl(total)}</b><span>Total</span></div><div class="stat"><b>${brl(com)}</b><span>Comissão</span></div><div class="stat"><b>${brl(total-com)}</b><span>Casa</span></div></div><div class="card"><h2>Histórico</h2>${lista(list.slice().reverse())}</div>`}

function configHTML(){let h=state.horarios,c=state.config;return `<div class="grid g2"><div class="card"><h2>Dados da barbearia</h2><div class="field"><label>Nome</label><input id="cfgNome" value="${c.nome}"></div><div class="field"><label>Telefone</label><input id="cfgTel" value="${c.telefone||''}"></div><div class="field"><label>Endereço</label><input id="cfgEnd" value="${c.endereco||''}"></div><div class="field"><label>Senha admin</label><input id="cfgSenha" value="${c.adminSenha||'1234'}"></div><div class="field"><label>Logo</label><input id="cfgLogo" type="file" accept="image/*"></div><button class="btn primary" onclick="saveConfig()">Salvar</button></div><div class="card"><h2>Link do cliente</h2><p class="muted">Ative/desative o que aparece no link público.</p><div class="grid g2"><div class="field"><label>Fila no link</label><select id="linkFila"><option value="true" ${c.linkFilaAtiva!==false?'selected':''}>Ativa</option><option value="false" ${c.linkFilaAtiva===false?'selected':''}>Desativada</option></select></div><div class="field"><label>Agendamento no link</label><select id="linkAgenda"><option value="true" ${c.linkAgendaAtiva!==false?'selected':''}>Ativo</option><option value="false" ${c.linkAgendaAtiva===false?'selected':''}>Desativado</option></select></div></div><button class="btn primary" onclick="saveLinkPublico()">Salvar link público</button></div></div><div class="grid g2"><div class="card"><h2>Horários normais</h2><div class="grid g2"><div class="field"><label>Fila início</label><input id="hf1" type="time" value="${h.filaIni}"></div><div class="field"><label>Fila fim</label><input id="hf2" type="time" value="${h.filaFim}"></div><div class="field"><label>Agenda normal início</label><input id="ha1" type="time" value="${h.agendaIni}"></div><div class="field"><label>Agenda normal fim</label><input id="ha2" type="time" value="${h.agendaFim}"></div></div><button class="btn primary" onclick="saveHorarios()">Salvar horários normais</button></div><div class="card"><h2>Horários especiais</h2><p class="muted">Crie vários horários especiais com nomes diferentes. Quando estiver ativo, aparece no link do cliente e usa o valor/duração de horário especial.</p><div class="grid g3"><div class="field"><label>Nome</label><input id="heNome" placeholder="Ex: Especial feriado"></div><div class="field"><label>Início</label><input id="heIni" type="time" value="19:00"></div><div class="field"><label>Fim</label><input id="heFim" type="time" value="22:00"></div></div><button class="btn primary" onclick="addHorarioEspecial()"><i class="ti ti-plus"></i>Adicionar horário especial</button>${(state.horariosEspeciais||[]).map(x=>`<div class="item"><div class="grid g4"><div class="field"><label>Nome</label><input id="he_nome_${x.id}" value="${String(x.nome||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Início</label><input id="he_ini_${x.id}" type="time" value="${x.ini||''}"></div><div class="field"><label>Fim</label><input id="he_fim_${x.id}" type="time" value="${x.fim||''}"></div><div class="field"><label>Status</label><select id="he_ativo_${x.id}"><option value="true" ${x.ativo!==false?'selected':''}>Ativo no link</option><option value="false" ${x.ativo===false?'selected':''}>Desativado</option></select></div></div><div class="row"><button class="btn small blue" onclick="saveHorarioEspecial('${x.id}')">Salvar</button><button class="btn small ${x.ativo===false?'good':'bad'}" onclick="toggleHorarioEspecial('${x.id}')">${x.ativo===false?'Ativar':'Desativar'}</button><button class="btn small bad" onclick="deleteHorarioEspecial('${x.id}')">Excluir</button></div></div>`).join('')}</div></div><div class="card"><h2>Senhas dos profissionais</h2><p class="muted">As senhas ficam ocultas. Para visualizar, clique no olho e confirme a senha do admin.</p>${state.profissionais.length?state.profissionais.map(p=>`<div class="config-prof-pass"><div><b>${p.nome||'Sem nome'}</b><div class="muted">${p.ativo===false?'Desativado':'Ativo'} ${p.telefone?'• '+p.telefone:''}</div></div><div class="field" style="margin:0"><label>Senha</label><div class="pass-wrap"><input id="cfg_prof_senha_${p.id}" type="password" value="${String(p.senha||'1234').replace(/"/g,'&quot;')}"><button class="btn small blue eye-btn" onclick="requestShowProfSenha('${p.id}')" title="Visualizar com senha admin"><i class="ti ti-eye"></i></button></div></div><button class="btn small primary" onclick="saveProfPassFromConfig('${p.id}')">Salvar senha</button></div>`).join(''):'<div class="muted">Nenhum profissional cadastrado.</div>'}</div><div class="card"><h2>Manutenção</h2><button class="btn blue" onclick="syncNow(true)">Forçar salvar na nuvem</button> <button class="btn bad" onclick="if(confirm('Limpar dados locais?')){localStorage.removeItem('vz_state');location.reload()}">Limpar local</button></div>`}async function saveConfig(){state.config.nome=cfgNome.value;state.config.telefone=cfgTel.value;state.config.endereco=cfgEnd.value;state.config.adminSenha=cfgSenha.value||'1234';let l=await fileData(cfgLogo.files[0]);if(l)state.config.logo=l;markDirty()}function saveLinkPublico(){state.config.linkFilaAtiva=linkFila.value==='true';state.config.linkAgendaAtiva=linkAgenda.value==='true';markDirty();toast('Link público atualizado')}function saveHorarios(){Object.assign(state.horarios,{filaIni:hf1.value,filaFim:hf2.value,agendaIni:ha1.value,agendaFim:ha2.value});markDirty()}function addHorarioEspecial(){let nome=heNome.value.trim(),ini=heIni.value,fim=heFim.value;if(!nome||!ini||!fim)return toast('Preencha nome, início e fim');state.horariosEspeciais.push({id:uid(),nome,ini,fim,ativo:true});markDirty()}function saveHorarioEspecial(id){let x=state.horariosEspeciais.find(h=>String(h.id)===String(id));if(!x)return;x.nome=document.getElementById('he_nome_'+id).value.trim()||'Horário especial';x.ini=document.getElementById('he_ini_'+id).value;x.fim=document.getElementById('he_fim_'+id).value;x.ativo=document.getElementById('he_ativo_'+id).value==='true';markDirty();toast('Horário especial salvo')}function toggleHorarioEspecial(id){let x=state.horariosEspeciais.find(h=>String(h.id)===String(id));if(!x)return;x.ativo=x.ativo===false;markDirty()}function deleteHorarioEspecial(id){if(!confirm('Excluir este horário especial?'))return;state.horariosEspeciais=state.horariosEspeciais.filter(h=>String(h.id)!==String(id));markDirty()}function bindForms(){document.querySelectorAll('.selCliente').forEach(sel=>sel.onchange=()=>{let c=state.clientes.find(c=>String(c.id)===sel.value),box=sel.closest('.card');if(c&&box){box.querySelector('.nomeAt').value=c.nome;box.querySelector('.telAt').value=c.telefone||''}});document.querySelectorAll('.tipoAt,.horaAt,.servAt').forEach(el=>el.onchange=()=>updatePreview(el.closest('.card')));document.querySelectorAll('.card').forEach(updatePreview)}function updatePreview(box){if(!box)return;let s=state.servicos.find(s=>String(s.id)===box.querySelector('.servAt')?.value);let tipo=tipoPreco(box.querySelector('.tipoAt')?.value||'fila',box.querySelector('.horaAt')?.value||nowHH());let pv=box.querySelector('.pricePreview'),tm=box.querySelector('.tempoAt');if(s&&pv)pv.textContent=`Valor: ${brl(servicePrice(s,tipo))} • Duração: ${serviceDur(s,tipo)} min`;if(s&&tm&&!document.activeElement.isSameNode(tm))tm.value=serviceDur(s,tipo)||20}
function toMin(h){let [a,b]=(h||'00:00').split(':').map(Number);return a*60+b}function toHH(m){m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function addSlots(arr,ini,fim,step=15){let a=toMin(ini),b=toMin(fim);if(!ini||!fim||b<a)return arr;for(let m=a;m<=b;m+=step){let h=toHH(m);if(!arr.includes(h))arr.push(h)}return arr.sort()}function agendaSlots(){let h=state.horarios||{},slots=[];if(state.config.linkAgendaAtiva!==false)addSlots(slots,h.agendaIni,h.agendaFim,15);(state.horariosEspeciais||[]).filter(x=>x.ativo!==false).forEach(x=>addSlots(slots,x.ini,x.fim,15));return slots}function publicServiceLabel(s,mode,h=nowHH()){if(mode==='fila')return `${s.nome} — fila ${brl(s.precoFila)}`;let sp=specialInfo(h);return `${s.nome} — ${sp?sp.nome+' '+brl(s.precoPremium):'agenda '+brl(s.precoAgenda)}`}function renderClient(){document.body.classList.add('client-mode');let opts=[];if(state.config.linkFilaAtiva!==false)opts.push(`<button id="btnFila" class="btn primary" onclick="clientForm('fila')">Ordem de chegada</button>`);if(state.config.linkAgendaAtiva!==false)opts.push(`<button id="btnAgenda" class="btn blue" onclick="clientForm('agendamento')">Agendamento</button>`);clientWrap.innerHTML=`<div class="brand"><div class="logo">${state.config.logo?`<img src="${state.config.logo}">`:'V'}</div><b>${state.config.nome}</b><small>Escolha seu atendimento</small></div><div class="card client-choice"><div class="grid g2">${opts.join('')||'<div class="muted">Atendimento pelo link temporariamente desativado.</div>'}</div></div><div id="cf"></div>`;if(state.config.linkFilaAtiva!==false)clientForm('fila');else if(state.config.linkAgendaAtiva!==false)clientForm('agendamento')}
function clientForm(mode){let slots=agendaSlots(),h=slots.includes(nowHH())?nowHH():(slots[0]||nowHH());let filaAberta=state.config.linkFilaAtiva!==false&&inRange(nowHH(),state.horarios.filaIni,state.horarios.filaFim);let desc=mode==='fila'?(filaAberta?'Ordem de chegada aberta agora • espera estimada: '+waitMin()+' min':'Ordem de chegada fechada agora. Horário: '+state.horarios.filaIni+' até '+state.horarios.filaFim):'Escolha apenas horários liberados nas configurações. Horário especial aparece automaticamente quando estiver ativo.';cf.innerHTML=`<div class="client-form-grid"><div class="card"><h2>${mode==='fila'?'Entrar por ordem de chegada':'Agendar horário'}</h2><p class="muted">${desc}</p><div class="field"><label>Nome</label><input id="pubNome" autocomplete="name"></div><div class="field"><label>WhatsApp</label><input id="pubTel" autocomplete="tel"></div><div class="grid g2"><div class="field"><label>Data</label><input id="pubData" type="date" value="${today()}" onchange="clientRefreshOptions('${mode}')"></div>${mode==='fila'?`<div class="field"><label>Horário</label><input value="Agora (${nowHH()})" disabled></div>`:`<div class="field"><label>Horário disponível</label><select id="pubHora" onchange="clientRefreshOptions('${mode}')">${slots.length?slots.map(x=>`<option value="${x}" ${x===h?'selected':''}>${x}${specialInfo(x)?' • '+specialInfo(x).nome:''}</option>`).join(''):'<option value="">Sem horários</option>'}</select></div>`}</div></div><div class="card"><h2>Serviço e profissional</h2><div class="field"><label>Serviço</label><select id="pubServ" onchange="clientPrice('${mode}')">${servicosLink().map(s=>`<option value="${s.id}">${publicServiceLabel(s,mode,h)}</option>`).join('')}</select><div class="muted" id="pubPrice"></div></div><div class="field"><label>Profissional</label><select id="pubProf"></select><div class="muted" id="profMsg"></div></div><div class="field"><label>Voucher</label><input id="pubVoucher" placeholder="Código se tiver"></div><button class="btn primary" style="width:100%;justify-content:center" onclick="clientAdd('${mode}')">Confirmar atendimento</button></div></div>`;clientRefreshOptions(mode)}
function clientRefreshOptions(mode){
  let data=pubData?.value||today(),oldProf=pubProf?.value||'',oldServ=pubServ?.value||'';
  let servSel=document.getElementById('pubServ');
  let horaAtual=mode==='fila'?nowHH():(pubHora?.value||nowHH());

  if(servSel){
    servSel.innerHTML=servicosLink().map(s=>`<option value="${s.id}" ${String(s.id)===oldServ?'selected':''}>${publicServiceLabel(s,mode,horaAtual)}</option>`).join('');
    if(oldServ&&[...servSel.options].some(o=>o.value===oldServ))servSel.value=oldServ;
  }

  let servId=servSel?.value||'';
  let horaBase=mode==='fila'?nowHH():(pubHora?.value||'');
  let list=profsDisponiveis(data,horaBase||nowHH());

  if(pubProf){
    pubProf.innerHTML='<option value="">Qualquer profissional</option>'+list.map(p=>`<option value="${p.id}" ${String(p.id)===oldProf?'selected':''}>${p.nome}</option>`).join('');
    if(oldProf&&[...pubProf.options].some(o=>o.value===oldProf))pubProf.value=oldProf;
  }

  if(mode!=='fila'&&pubHora){
    let slots=freeSlotsFor(data,servId,pubProf?.value||'');
    pubHora.innerHTML=slots.length?slots.map(x=>`<option value="${x}">${x}${specialInfo(x)?' • '+specialInfo(x).nome:''}</option>`).join(''):'<option value="">Sem horários livres</option>';
    if(slots.includes(horaBase))pubHora.value=horaBase;
  }

  let qtdSlots=mode==='fila'?'':` • ${freeSlotsFor(data,servId,pubProf?.value||'').length} horário(s) livre(s)`;
  if(profMsg)profMsg.textContent=list.length?`${list.length} profissional(is) disponível(is)${qtdSlots}`:'Nenhum profissional disponível neste horário';
  clientPrice(mode);
}

function profModeAllowed(p,mode){
  if(!p||p.ativo===false)return false;
  if(mode==='fila')return p.atendeFila!==false;
  if(mode==='agendamento')return p.atendeAgenda!==false;
  if(mode==='especial')return p.atendeEspecial!==false;
  return true;
}
function profHorarioOk(p,hora){
  if(!p||!hora)return true;
  return inRange(hora,p.atendeIni||'08:00',p.atendeFim||'18:30');
}
function modalidadeDisponivel(mode,hora=nowHH(),data=today()){
  if(mode==='fila'&&state.config.linkFilaAtiva===false)return false;
  if((mode==='agendamento'||mode==='especial')&&state.config.linkAgendaAtiva===false)return false;
  if(mode==='especial'&&!specialInfo(hora))return (state.horariosEspeciais||[]).some(h=>h.ativo!==false);
  return state.profissionais.some(p=>profModeAllowed(p,mode)&&profHorarioOk(p,hora)&&!state.bloqueios.some(b=>String(b.profId)===String(p.id)&&b.data===data&&(!hora||inRange(hora,b.ini,b.fim))));
}

function agendaSlots(mode='todos'){

function pctAtendimento(a){
  let p=state.profissionais.find(p=>String(p.id)===String(a.profId));

  if(a.comissaoPctAtendimento!==undefined && a.comissaoPctAtendimento!==null && a.comissaoPctAtendimento!=='')return num(a.comissaoPctAtendimento);

function mesAtualKey(){ return today().slice(0,7); }
function dataMesKey(d){ return String(d || today()).slice(0,7); }
function sindicatoQtdUsadaMes(mes=mesAtualKey()){
  let filaQtd = (state.fila||[]).filter(a=>a.sindicato===true && dataMesKey(a.data)===mes).length;
  let histQtd = (state.historico||[]).filter(a=>a.sindicato===true && dataMesKey(a.data)===mes).length;
  let vendasQtd = (state.vendasProdutos||[]).filter(v=>v.tipoVenda==='sindicato' && dataMesKey(v.data)===mes).reduce((s,v)=>s+(num(v.qtd)||1),0);
  return filaQtd + histQtd + vendasQtd;
}
function sindicatoLimiteRestante(){

/* ===== V42: saldo único do benefício mensal =====
   Regra: produto, serviço comum, corte pelo sindicato e link do cliente consomem a mesma quantidade disponível. */
function beneficioMesKey(d){return (d||today()).slice(0,7)}
function beneficioQtdItem(a){return Math.max(1,num(a?.beneficioQtd||1)||1)}
function beneficioQtdVenda(v){return Math.max(1,num(v?.qtd)||1)}
function beneficioUsaSaldo(x){return !!(x && (x.beneficioUsado===true || x.sindicato===true || x.tipoVenda==='sindicato'))}
function beneficioQtdUsadaMes(mes=beneficioMesKey(today())){
  let atendimentos=[...(state.fila||[]),...(state.historico||[]),...(state.pendencias||[])];
  let qtdAt=atendimentos.filter(a=>beneficioUsaSaldo(a) && beneficioMesKey(a.data)===mes).reduce((s,a)=>s+beneficioQtdItem(a),0);
  let qtdProd=(state.vendasProdutos||[]).filter(v=>beneficioUsaSaldo(v) && beneficioMesKey(v.data)===mes).reduce((s,v)=>s+beneficioQtdVenda(v),0);
  return qtdAt+qtdProd;
}

sindicatoQtdUsadaMes = function(mes=beneficioMesKey(today())){return beneficioQtdUsadaMes(mes)};
sindicatoLimiteRestante = function(){let limite=num(state.config.sindicatoLimiteMensal||0); if(!limite)return 999999; return Math.max(0,limite-beneficioQtdUsadaMes())};

function beneficioPodeUsar(qtd=1){return sindicatoLimiteRestante()>=Math.max(1,num(qtd)||1)}
function marcarBeneficio(obj,qtd=1){obj.beneficioUsado=true; obj.beneficioQtd=Math.max(1,num(qtd)||1); return obj;}

/* ===== V48: exclusão real do extrato + recálculo imediato de comissão/saldo ===== */
function v48Js(v){return JSON.stringify(String(v||''));}
function v48Q(x){return Math.max(1,num(x?.beneficioQtd||x?.qtd)||1);}
function v48RecalcularLancamentoVenda(v){
  if(!v)return v;
  v.qtd=v48Q(v);
  v.precoUnit=num(v.precoUnit);
  v.total=num(v.total)||v.precoUnit*v.qtd;
  v.comissaoPct=num(v.comissaoPct);
  v.comissaoValor=num(v.comissaoValor)||v.total*v.comissaoPct/100;
  if(beneficioUsaSaldo(v))v.beneficioQtd=v.qtd;
  return v;
}
function v48PersistirRecalcular(msg){
  try{ normalize(); }catch(e){}
  (state.vendasProdutos||[]).forEach(v48RecalcularLancamentoVenda);
  state.updatedAt=Date.now();
  dirty=true;
  saveLocal();
  try{ renderAll(); }catch(e){ console.error('Erro ao redesenhar após exclusão',e); }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>syncNow(true),250);
  toast(msg||'Excluído e recalculado.');
}
function excluirAtendimentoFinalizado(id){
  if(!canAdmin())return;
  id=String(id||'');
  let antes=(state.historico||[]).length;
  let a=(state.historico||[]).find(x=>String(x.id)===id);
  if(!a)return toast('Atendimento finalizado não encontrado no extrato.');
  let msg=`Excluir este serviço finalizado do extrato?\n\nCliente: ${a.nome||''}\nServiço: ${a.servNome||''}\nProfissional: ${a.profNome||''}\nData: ${a.data||''}\n\nA comissão e o saldo do benefício serão recalculados na hora.`;
  if(!confirm(msg))return;

   Regra: somente consome/diminui quantidade do sindicato quando for:
   1) atendimento com serviço realmente vinculado ao sindicato;
   2) produto/lançamento do tipo sindicato;
   3) pedido feito pelo link usando serviço do sindicato.
   Serviços/produtos normais nunca reduzem o saldo do sindicato.

    try{
      if(String(id||'')===String(typeof SIND_ID!=='undefined'?SIND_ID:'__sindicato_corte__')) return true;
      return !!(state.servicos||[]).find(s=>String(s.id)===String(id) && s.isSindicato===true);
    }catch(e){ return false; }

          a.beneficioUsado=true;
          a.beneficioQtd=q(a);

          delete a.beneficioUsado;
          delete a.beneficioQtd;
          if(a.sindicato!==true) a.sindicato=false;

        const msg=typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite mensal do sindicato esgotado.';
        const el=document.getElementById('pubPrice');
        if(el) el.innerHTML=`<span style="color:var(--red);font-weight:700">${msg}</span>`;
        return toast(msg);
      }
      const antes=(state.fila||[]).length;
      _v42ClientAddBase(mode);
      if((state.fila||[]).length>antes){
        const a=state.fila[state.fila.length-1];
        if(atendimentoSindicato(a)) window.marcarBeneficio(a,1);
        else { delete a.beneficioUsado; delete a.beneficioQtd; a.sindicato=false; }
        try{ markDirty(); }catch(e){}
      }
    };
  }

  // Preview: aviso de limite só aparece ao selecionar sindicato.
  if(typeof _v42ClientPriceBase==='function'){
    window.clientPrice = clientPrice = function(mode){
      _v42ClientPriceBase(mode);
      const servId=document.getElementById('pubServ')?.value;
      const el=document.getElementById('pubPrice');
      if(el && servicoCadastradoComoSindicato(servId) && window.sindicatoLimiteRestante()<=0){
        el.innerHTML=`<span style="color:var(--red);font-weight:700">${typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite mensal do sindicato esgotado.'}</span>`;
      }
    };
  }
  if(typeof _v42UpdatePreviewBase==='function'){
    window.updatePreview = updatePreview = function(box){
      _v42UpdatePreviewBase(box);
      const servId=box?.querySelector?.('.servAt')?.value;
      const pv=box?.querySelector?.('.pricePreview');
      if(pv && servicoCadastradoComoSindicato(servId) && window.sindicatoLimiteRestante()<=0){
        pv.textContent=typeof sindicatoIndisponivelMsg==='function'?sindicatoIndisponivelMsg():'Limite mensal do sindicato esgotado.';
      }
    };
  }

  try{
    limparMarcasIndevidas();
    if(typeof saveLocal==='function') saveLocal();
    if(window.session && document.getElementById('app') && !document.getElementById('app').classList.contains('hidden') && typeof renderAll==='function') renderAll();
    console.log('V55 sindicato: contagem estrita aplicada.');
  }catch(e){ console.error('V55 init erro:', e); }
})();
// ===== FIM V55 =====




/* ===== V56: senha do extrato sem balão do navegador ===== */
(function(){
  const V56='vizzarty_v56_extrato_senha_modal_bonito';
  if(window[V56]) return;
  window[V56]=true;

  function senhaAdmin(){
    try{return String(state?.config?.adminSenha || '1234').trim();}catch(e){return '1234';}
  }
  function autorizado(chave){
    try{return sessionStorage.getItem(chave)==='1';}catch(e){return false;}
  }
  function autorizar(chave){
    try{sessionStorage.setItem(chave,'1');}catch(e){}
  }
  function renderizar(){
    try{ if(typeof renderAll==='function') renderAll(); }catch(e){}
  }
  function fecharModal(){
    const old=document.getElementById('vzModalSenhaBonita');
    if(old) old.remove();
  }
  function liberar(tipo){
    const input=document.getElementById('vzSenhaBonitaInput');
    const erro=document.getElementById('vzSenhaBonitaErro');
    const valor=String(input?.value||'').trim();
    if(valor!==senhaAdmin()){
      if(erro){erro.style.display='block';erro.textContent='Senha incorreta. Confira e tente novamente.';}
      if(input){input.focus();input.select();}
      return;
    }
    if(tipo==='extrato'){
      autorizar('vz_extrato_ok');
      if(window.vzSecure) window.vzSecure.extrato=true;
      current='extrato';
    }
    if(tipo==='painel'){
      autorizar('vz_painel_valores_ok');
      if(window.vzSecure) window.vzSecure.painel=true;
    }
    fecharModal();
    renderizar();
    try{document.getElementById('side')?.classList.remove('open');}catch(e){}
  }
  window.vzFecharSenhaBonita=fecharModal;
  window.vzLiberarSenhaBonita=liberar;
  window.vzToggleSenhaBonita=function(){
    const input=document.getElementById('vzSenhaBonitaInput');
    const icon=document.getElementById('vzSenhaBonitaIcon');
    if(!input) return;
    input.type=input.type==='password'?'text':'password';
    if(icon) icon.className=input.type==='password'?'ti ti-eye':'ti ti-eye-off';
  };

  window.vzAbrirSenhaBonita=function(tipo){
    tipo=tipo||'extrato';
    if(tipo==='extrato' && autorizado('vz_extrato_ok')){
      if(window.vzSecure) window.vzSecure.extrato=true;
      current='extrato';
      renderizar();
      return;
    }
    if(tipo==='painel' && autorizado('vz_painel_valores_ok')){
      if(window.vzSecure) window.vzSecure.painel=true;
      renderizar();
      return;
    }
    fecharModal();
    const titulo=tipo==='painel'?'Visualizar faturamento':'Liberar extrato';
    const texto=tipo==='painel'
      ? 'Digite a senha do administrador para mostrar os valores financeiros do painel.'
      : 'Digite a senha do administrador para abrir histórico, comissões, faturamento e correções.';
    const div=document.createElement('div');
    div.id='vzModalSenhaBonita';
    div.className='vz-modal-bg';
    div.innerHTML=`
      <div class="vz-modal" style="max-width:460px;border-color:#5a3b14;background:linear-gradient(180deg,#211812,#14100d);">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">
          <div style="width:48px;height:48px;border-radius:16px;background:#2a1c0c;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid #4b3211">
            <i class="ti ti-shield-lock"></i>
          </div>
          <div>
            <h2 style="margin:0;color:var(--gold)">${titulo}</h2>
            <div class="muted" style="font-size:12px">Área protegida da Vizzarty</div>
          </div>
        </div>
        <p>${texto}</p>
        <div class="field">
          <label>Senha do administrador</label>
          <div class="vz-pass-wrap">
            <input id="vzSenhaBonitaInput" type="password" placeholder="Digite a senha" autocomplete="current-password">
            <button type="button" onclick="vzToggleSenhaBonita()" title="Mostrar ou ocultar senha"><i id="vzSenhaBonitaIcon" class="ti ti-eye"></i></button>
          </div>
        </div>
        <div id="vzSenhaBonitaErro" class="vz-auth-error">Senha incorreta.</div>
        <div class="vz-modal-actions">
          <button class="btn" onclick="vzFecharSenhaBonita()"><i class="ti ti-x"></i> Cancelar</button>
          <button class="btn primary" onclick="vzLiberarSenhaBonita('${tipo}')"><i class="ti ti-lock-open"></i> Liberar</button>
        </div>
      </div>`;
    document.body.appendChild(div);
    setTimeout(()=>document.getElementById('vzSenhaBonitaInput')?.focus(),80);
  };

  window.v52AbrirExtratoSenha=function(){ window.vzAbrirSenhaBonita('extrato'); };
  window.v52DesbloquearPainelValores=function(){ window.vzAbrirSenhaBonita('painel'); };
  window.v52DesbloquearExtratoTela=function(){ window.vzAbrirSenhaBonita('extrato'); };
  window.vzAbrirExtrato=function(){ window.vzAbrirSenhaBonita('extrato'); };
  window.vzOpenSenhaModal=function(opts){
    opts=opts||{};
    window.vzAbrirSenhaBonita(opts.tipo==='painel'?'painel':'extrato');
  };

  const basePageHTML=window.pageHTML;
  if(typeof basePageHTML==='function'){
    window.pageHTML=function(p){
      if(p==='extrato' && !autorizado('vz_extrato_ok') && !(window.vzSecure&&window.vzSecure.extrato)){
        return `<div class="vz-lock-card" style="border-color:#5a3b14;background:linear-gradient(180deg,#211812,#14100d);box-shadow:0 18px 60px rgba(0,0,0,.28)">
          <div class="lock-icon"><i class="ti ti-shield-lock"></i></div>
          <h2>Extrato protegido</h2>
          <p class="muted">Comissões, faturamento e histórico financeiro ficam protegidos pela senha do administrador.</p>
          <button class="btn primary" onclick="vzAbrirSenhaBonita('extrato')"><i class="ti ti-eye"></i> Visualizar extrato</button>
        </div>`;
      }
      return basePageHTML(p);
    };
  }

  const baseSetPage=window.setPage;
  if(typeof baseSetPage==='function'){
    window.setPage=function(p){
      if(p==='extrato') return window.vzAbrirSenhaBonita('extrato');
      return baseSetPage(p);
    };
  }

  document.addEventListener('keydown',function(e){
    const modal=document.getElementById('vzModalSenhaBonita');
    if(!modal) return;
    if(e.key==='Escape') fecharModal();
    if(e.key==='Enter'){
      const tipo=(modal.innerHTML||'').includes('Visualizar faturamento')?'painel':'extrato';
      liberar(tipo);
    }
  });

  try{
    if(window.session && document.getElementById('app') && !document.getElementById('app').classList.contains('hidden') && typeof renderAll==='function') renderAll();
    console.log('V56: senha do extrato em modal bonito carregada.');
  }catch(e){console.error('V56 init erro:',e);}
})();
// ===== FIM V56 =====


/* ===== V57: extrato sem senha para profissional + resumo limpo de comissão ===== */
(function(){
  const V57='vizzarty_v57_extrato_profissional_sem_senha';
  if(window[V57]) return;
  window[V57]=true;

  function ehAdminLogado(){
    try{return typeof isAdmin==='function' && isAdmin();}catch(e){return false;}
  }
  function renderizar(){
    try{ if(typeof renderAll==='function') renderAll(); }catch(e){}
  }
  function fecharMenu(){
    try{document.getElementById('side')?.classList.remove('open');}catch(e){}
  }
  function listaProfissionalSemBruto(lista){
    if(!lista.length) return '<div class="muted">Nenhum atendimento.</div>';
    return lista.map(a=>{
      const comissao = (typeof calcComissaoAtendimento==='function') ? calcComissaoAtendimento(a) : 0;
      const sind = a.sindicato ? '<span class="badge b-blue">Sindicato</span>' : '';
      return `<div class="item"><div class="item-head"><div><b>${a.nome||'Cliente'}</b><div class="muted">${a.servNome||'Serviço'} • ${a.profNome||''} • ${a.data||''} ${a.hora||''}</div><div class="row" style="margin-top:7px"><span class="badge b-${a.tipo||'fila'}">${a.tipo||'atendimento'}</span>${sind}<span class="badge b-ok">Comissão: ${brl(comissao)}</span><span class="badge">${a.tempoMin||20} min</span></div></div></div></div>`;
    }).join('');
  }

  const baseExtratoHTML = window.extratoHTML;
  window.extratoHTML = function(){
    if(ehAdminLogado()){
      return (typeof baseExtratoHTML==='function') ? baseExtratoHTML() : '';
    }
    const profId = window.session?.profId;
    const atendimentos = (state.historico||[]).filter(a=>String(a.profId)===String(profId));
    const totalFinal = atendimentos.reduce((s,a)=>s+num(a.valorFinal),0);
    const comissaoAtend = atendimentos.reduce((s,a)=>s+((typeof calcComissaoAtendimento==='function')?calcComissaoAtendimento(a):0),0);
    return `<div class="statgrid"><div class="stat"><b>${atendimentos.length}</b><span>Atendimentos feitos</span></div><div class="stat"><b>${brl(totalFinal)}</b><span>Valor final dos atendimentos</span></div><div class="stat"><b>${brl(comissaoAtend)}</b><span>Comissão feita</span></div></div><div class="card"><h2>Meu extrato</h2><p class="muted">Aqui aparece somente o seu total final de atendimentos e a sua comissão. Valores da barbearia ficam apenas no painel do admin.</p>${listaProfissionalSemBruto(atendimentos.slice().reverse())}</div>`;
  };
  try{ extratoHTML = window.extratoHTML; }catch(e){}

  const basePageHTML_V57 = window.pageHTML;
  window.pageHTML = function(p){
    if(p==='extrato' && !ehAdminLogado()){
      return window.extratoHTML();
    }
    return (typeof basePageHTML_V57==='function') ? basePageHTML_V57(p) : '';
  };
  try{ pageHTML = window.pageHTML; }catch(e){}

  window.vzAbrirExtrato = function(){
    if(!ehAdminLogado()){
      current='extrato';
      renderizar();
      fecharMenu();
      return;
    }
    if(typeof window.vzAbrirSenhaBonita==='function') return window.vzAbrirSenhaBonita('extrato');
    current='extrato'; renderizar(); fecharMenu();
  };
  window.v52AbrirExtratoSenha = window.vzAbrirExtrato;

  const baseSetPage_V57 = window.setPage;
  window.setPage = function(p){
    if(p==='extrato') return window.vzAbrirExtrato();
    return (typeof baseSetPage_V57==='function') ? baseSetPage_V57(p) : undefined;
  };
  try{ setPage = window.setPage; }catch(e){}

  try{ if(window.session && typeof renderAll==='function') renderAll(); }catch(e){}
  console.log('V57: extrato do profissional sem senha e sem valores da casa carregado.');
})();
// ===== FIM V57 =====

</script>
</body>
</html>
