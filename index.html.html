<style>
:root{--bg:#0d0a08;--panel:#16110e;--card:#201812;--card2:#2a1f17;--line:#3a2b20;--txt:#f5eadc;--mut:#a08065;--gold:#d69224;--green:#3bc27d;--red:#ef5555;--blue:#5aa7ff;--purple:#b68cff;--r:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);background:#0e0b09;color:var(--txt);border-radius:10px;padding:11px;outline:none}label{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;display:block;margin-bottom:6px}.field{margin-bottom:10px}.app{display:flex;height:100vh}.side{width:245px;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto;transition:.2s}.brand{text-align:center;margin-bottom:15px}.logo{width:74px;height:74px;border-radius:50%;background:#fff;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#111;font-weight:900;font-size:34px}.logo img{width:100%;height:100%;object-fit:cover}.brand b{display:block;font-size:19px}.brand small{color:var(--mut)}.nav button{width:100%;border:0;background:transparent;color:var(--mut);padding:12px;border-radius:12px;text-align:left;margin:2px 0;cursor:pointer;display:flex;gap:9px;align-items:center}.nav button.active,.nav button:hover{background:#2a1c0c;color:var(--gold)}.nav small{margin-left:auto;background:#3a250b;color:var(--gold);padding:2px 7px;border-radius:99px}.main{flex:1;display:flex;flex-direction:column;overflow:hidden}.top{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.menu{display:none}.content{overflow:auto;padding:18px}.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}.card h2{margin:0 0 12px;font-size:18px}.muted{color:var(--mut);font-size:13px}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:var(--card2);color:var(--txt);display:inline-flex;align-items:center;gap:6px;text-decoration:none}.btn.primary{background:var(--gold);color:#130d08;font-weight:700}.btn.good{background:#123523;color:var(--green)}.btn.bad{background:#3a1212;color:var(--red)}.btn.blue{background:#10243a;color:var(--blue)}.btn.small{font-size:12px;padding:7px 9px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.stat b{font-size:24px;display:block;color:var(--gold)}.item{background:#100c09;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#2a1c0c;color:var(--gold);display:inline-flex}.b-fila{background:#2a1c0c;color:var(--gold)}.b-agendamento{background:#10243a;color:var(--blue)}.b-premium{background:#26143a;color:var(--purple)}.b-ok{background:#123523;color:var(--green)}.b-off{background:#3a1212;color:var(--red)}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:13px}th{color:var(--mut);font-size:12px;text-transform:uppercase}.toast{position:fixed;right:18px;bottom:18px;background:var(--card2);border:1px solid var(--line);padding:13px;border-radius:12px;z-index:10000}.client-mode .app{display:none}.client-page{display:none;min-height:100vh;overflow:auto;padding:18px;background:radial-gradient(circle at top,#241609,#0d0a08)}.client-mode .client-page{display:block}.client-wrap{max-width:470px;margin:auto}.sync{font-size:12px;color:var(--mut)}.danger-note{background:#2b1212;border:1px solid #5e2222;color:#ff8c8c;padding:10px;border-radius:10px}.prof-photo{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover}.login{max-width:420px;margin:7vh auto}.hidden{display:none!important}@media(max-width:800px){body{overflow:auto}.app{height:auto;min-height:100vh}.side{position:fixed;z-index:50;left:0;top:0;bottom:0;transform:translateX(-103%)}.side.open{transform:translateX(0)}.menu{display:inline-flex}.content{padding:12px}.g2,.g3,.g4,.statgrid{grid-template-columns:1fr}.top{position:sticky;top:0;z-index:20}.item-head{display:block}.row .btn{flex:1;justify-content:center}}
</style>

<body>
<div id="clientPage" class="client-page"><div class="client-wrap" id="clientWrap"></div></div>
<div id="loginBox" class="login card">
  <div class="brand"><div class="logo" id="loginLogo">V</div><b>Vizzarty System</b><small>Sistema de gestão</small></div>
  <div class="field"><label>Entrar como</label><select id="loginRole" onchange="renderLoginProfs()"><option value="admin">Administrador</option><option value="prof">Profissional</option></select></div>

</div>

  <aside class="side" id="side"><div class="brand"><div class="logo" id="logoBox">V</div><b id="brandName">Vizzarty</b><small>gestão online</small></div><div class="nav" id="nav"></div></aside>
  <main class="main"><div class="top"><div class="row"><button class="btn menu" onclick="side.classList.toggle('open')"><i class="ti ti-menu-2"></i></button><b id="pageTitle">Painel</b></div><div class="row"><span class="sync" id="syncStatus">offline</span><button class="btn small blue" onclick="syncNow(true)"><i class="ti ti-cloud-upload"></i>Sincronizar</button></div></div><div class="content" id="pages"></div></main>
</div>
<script>
const SUPABASE_URL='https://vtrqebzafhsqjsshvklx.supabase.co';
const SUPABASE_KEY='sb_publishable_KF5HCg_RbEchQ515dzU-uQ_Fnwrxc0s';
const REST=SUPABASE_URL+'/rest/v1/vizzarty_state?id=eq.1';
const DEFAULT={version:21,config:{nome:'Vizzarty Barbearia',telefone:'',endereco:'',adminSenha:'1234',logo:''},horarios:{filaIni:'08:00',filaFim:'18:30',agendaIni:'08:00',agendaFim:'18:30',premAlmocoIni:'11:30',premAlmocoFim:'13:30',premNoiteIni:'19:00',premNoiteFim:'22:00'},profissionais:[],servicos:[],clientes:[],fila:[],historico:[],vouchers:[],bloqueios:[],pendencias:[],updatedAt:0,seq:1};
let state=loadLocal()||structuredClone(DEFAULT), session=JSON.parse(localStorage.getItem('vz_session')||'{"role":"admin"}'), current='painel', dirty=false, editing=false, saveTimer=null, lastCloud=0;
function clone(o){return JSON.parse(JSON.stringify(o))}function uid(){state.seq=(state.seq||1)+1;return Date.now().toString(36)+state.seq.toString(36)}function today(){return new Date().toISOString().slice(0,10)}function nowHH(){return new Date().toTimeString().slice(0,5)}function num(v){return Number(v)||0}function brl(v){return 'R$ '+num(v).toFixed(2).replace('.',',')}function loadLocal(){try{return JSON.parse(localStorage.getItem('vz_state')||'null')}catch{return null}}function saveLocal(){localStorage.setItem('vz_state',JSON.stringify(state))}function normalize(){state={...clone(DEFAULT),...state};state.config={...DEFAULT.config,...(state.config||{})};state.horarios={...DEFAULT.horarios,...(state.horarios||{})};['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});state.profissionais=state.profissionais.map(p=>({id:uid(),nome:'',esp:'Barbeiro',telefone:'',foto:'',ativo:true,senha:'1234',comissao:60,...p,ativo:p.ativo!==false}));state.servicos=state.servicos.map(s=>({id:uid(),nome:'Serviço',precoFila:35,precoAgenda:40,precoPremium:50,durFila:20,durAgenda:30,durPremium:40,ativo:true,...s,ativo:s.ativo!==false}));state.clientes=state.clientes.map(c=>({id:uid(),nome:'',telefone:'',...c}));}
function hasRealData(s){return ['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias'].some(k=>Array.isArray(s?.[k])&&s[k].length>0)||!!s?.config?.logo}function toast(m){let d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
async function cloudGet(){const r=await fetch(REST,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw new Error(await r.text());const a=await r.json();return a[0]?.data||null}
async function cloudPut(){normalize();state.updatedAt=Date.now();saveLocal();const body={id:1,data:state,updated_at:new Date().toISOString()};let r=await fetch(REST,{method:'PATCH',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});if(!r.ok){r=await fetch(SUPABASE_URL+'/rest/v1/vizzarty_state',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text())}lastCloud=state.updatedAt;syncStatus.textContent='salvo na nuvem '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
async function syncNow(force=false){if(editing&&!force)return;if(dirty||force){try{await cloudPut();dirty=false;toast('Sincronizado')}catch(e){syncStatus.textContent='erro nuvem';toast('Erro de nuvem, salvo local')}}else{try{const c=await cloudGet();if(c&&num(c.updatedAt)>num(state.updatedAt)){state=c;normalize();saveLocal();renderAll()}syncStatus.textContent='nuvem ok'}catch(e){syncStatus.textContent='sem nuvem'}}}
function markDirty(){normalize();state.updatedAt=Date.now();dirty=true;saveLocal();renderAll();clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncNow(true),1200)}
setInterval(()=>{if(!dirty&&!editing)syncNow(false)},18000);
document.addEventListener('focusin',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))editing=true});document.addEventListener('focusout',()=>setTimeout(()=>editing=false,300));
function isClient(){return new URLSearchParams(location.search).has('cliente')}function isAdmin(){return session.role==='admin'}function currentProf(){return state.profissionais.find(p=>String(p.id)===String(session.profId))}function canAdmin(){if(!isAdmin()){toast('Somente admin');return false}return true}
function doLogin(){normalize();let role=loginRole.value,pass=loginPass.value;if(role==='admin'){if(pass===(state.config.adminSenha||'1234'))session={role:'admin'};else return toast('Senha incorreta')}else{let p=state.profissionais.find(p=>String(p.id)===loginProf.value);if(!p||p.ativo===false)return toast('Profissional inativo');if(pass!==(p.senha||'1234'))return toast('Senha incorreta');session={role:'prof',profId:p.id}}localStorage.setItem('vz_session',JSON.stringify(session));loginBox.classList.add('hidden');app.classList.remove('hidden');renderAll()}
function logout(){localStorage.removeItem('vz_session');location.reload()}function renderLoginProfs(){loginProfWrap.style.display=loginRole.value==='prof'?'block':'none';loginProf.innerHTML=state.profissionais.filter(p=>p.ativo!==false).map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}function initLogo(){let l=state.config.logo;if(l){logoBox.innerHTML=`<img src="${l}">`;loginLogo.innerHTML=`<img src="${l}">`}brandName.textContent=state.config.nome||'Vizzarty'}
function navItems(){let a=[['painel','ti-dashboard','Painel'],['fila','ti-users','Fila de espera'],['agendamentos','ti-calendar','Agendamentos'],['clientes','ti-address-book','Clientes'],['servicos','ti-list-details','Serviços'],['profissionais','ti-user-star','Profissionais'],['vouchers','ti-ticket','Vouchers'],['extrato','ti-receipt','Extrato'],['link','ti-link','Link cliente'],['config','ti-settings','Configurações']];if(!isAdmin())a=[['painel','ti-dashboard','Meu painel'],['fila','ti-users','Fila'],['agendamentos','ti-calendar','Agenda'],['extrato','ti-receipt','Minha comissão'],['link','ti-link','Link cliente']];return a}function setPage(p){current=p;renderAll();side.classList.remove('open')}function renderNav(){nav.innerHTML=navItems().map(([id,ic,t])=>`<button class="${current===id?'active':''}" onclick="setPage('${id}')"><i class="ti ${ic}"></i>${t}${id==='fila'?`<small>${state.fila.filter(a=>a.tipo==='fila'&&a.status!=='concluido').length}</small>`:''}</button>`).join('')+`<button onclick="logout()"><i class="ti ti-logout"></i>Sair</button>`}function renderAll(){normalize();initLogo();renderNav();pageTitle.textContent=(navItems().find(x=>x[0]===current)||[0,0,'Painel'])[2];pages.innerHTML=pageHTML(current);bindForms()}
function pageHTML(p){return ({painel:painelHTML,fila:filaHTML,agendamentos:agendaHTML,clientes:clientesHTML,servicos:servicosHTML,profissionais:profissionaisHTML,vouchers:vouchersHTML,extrato:extratoHTML,link:linkHTML,config:configHTML}[p]||painelHTML)()}
function inRange(h,a,b){if(!a||!b)return true;return h>=a&&h<=b}function isPremiumTime(h){let x=state.horarios;return inRange(h,x.premAlmocoIni,x.premAlmocoFim)||inRange(h,x.premNoiteIni,x.premNoiteFim)}function tipoPreco(mode,h){if(mode==='premium')return 'premium';if(mode==='agendamento'&&isPremiumTime(h))return 'premium';return mode==='agendamento'?'agendamento':'fila'}function servicePrice(s,t){return t==='premium'?num(s.precoPremium):t==='agendamento'?num(s.precoAgenda):num(s.precoFila)}function serviceDur(s,t){return t==='premium'?num(s.durPremium):t==='agendamento'?num(s.durAgenda):num(s.durFila)}function servicosAtivos(){return state.servicos.filter(s=>s.ativo!==false)}function profsDisponiveis(data=today(),hora=''){return state.profissionais.filter(p=>p.ativo!==false&&!state.bloqueios.some(b=>String(b.profId)===String(p.id)&&b.data===data&&(!hora||inRange(hora,b.ini,b.fim))))}function waitMin(){return state.fila.filter(a=>a.tipo==='fila'&&a.status!=='concluido').reduce((s,a)=>s+num(a.tempoMin||20),0)}function visibleA(){return isAdmin()?state.fila:state.fila.filter(a=>String(a.profId)===String(session.profId))}function openWhats(t='',m=''){let n=(t||'').replace(/\D/g,'');window.open(`https://wa.me/55${n}?text=${encodeURIComponent(m)}`,'_blank')}function validVoucher(c){let v=state.vouchers.find(v=>v.codigo===c&&!v.usado&&(!v.validade||v.validade>=today()));return v}
function painelHTML(){let ag=state.fila.filter(a=>a.status==='aguardando').length,agd=state.fila.filter(a=>a.tipo!=='fila'&&a.status!=='concluido').length,hoje=state.historico.filter(h=>h.data===today()).length,fat=state.historico.filter(h=>h.data===today()).reduce((s,a)=>s+num(a.valorFinal),0);return `<div class="statgrid"><div class="stat"><b>${ag}</b><span>Aguardando</span></div><div class="stat"><b>${agd}</b><span>Agendamentos</span></div><div class="stat"><b>${hoje}</b><span>Concluídos hoje</span></div><div class="stat"><b>${brl(fat)}</b><span>Faturamento hoje</span></div></div><div class="grid g2"><div class="card"><h2>Atendimento rápido</h2>${formAtendimento('fila')}</div><div class="card"><h2>Próximos</h2>${lista(visibleA().filter(a=>a.status!=='concluido').slice(0,8))}</div></div>`}
function formAtendimento(mode){return `<div class="grid g2"><div class="field"><label>Cliente salvo</label><select class="selCliente"><option value="novo">Novo cliente</option>${state.clientes.map(c=>`<option value="${c.id}">${c.nome} ${c.telefone?'— '+c.telefone:''}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select class="tipoAt"><option value="fila" ${mode==='fila'?'selected':''}>Ordem de chegada</option><option value="agendamento" ${mode==='agendamento'?'selected':''}>Agendamento normal</option><option value="premium" ${mode==='premium'?'selected':''}>Agenda premium</option></select></div></div><div class="grid g2"><div class="field"><label>Nome</label><input class="nomeAt"></div><div class="field"><label>Telefone</label><input class="telAt"></div></div><div class="grid g3"><div class="field"><label>Data</label><input type="date" class="dataAt" value="${today()}"></div><div class="field"><label>Hora</label><input type="time" class="horaAt" value="${nowHH()}"></div><div class="field"><label>Voucher</label><input class="voucherAt" placeholder="Código"></div></div><div class="grid g3"><div class="field"><label>Serviço</label><select class="servAt">${servicosAtivos().map(s=>`<option value="${s.id}">${s.nome}</option>`).join('')}</select><div class="muted pricePreview"></div></div><div class="field"><label>Profissional</label><select class="profAt"><option value="">Qualquer</option>${profsDisponiveis().map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Duração min.</label><input type="number" class="tempoAt" value="20" min="5"></div></div><button class="btn primary" onclick="addAt(this)"><i class="ti ti-plus"></i>Adicionar</button>`}
function addAt(btn){let box=btn.closest('.card'),tipo=box.querySelector('.tipoAt').value,data=box.querySelector('.dataAt').value||today(),hora=box.querySelector('.horaAt').value||nowHH(),cid=box.querySelector('.selCliente').value,nome=box.querySelector('.nomeAt').value.trim(),tel=box.querySelector('.telAt').value.trim();if(cid!=='novo'){let c=state.clientes.find(c=>String(c.id)===cid);if(c){nome=c.nome;tel=c.telefone}}if(!nome)return toast('Informe o cliente');let c=state.clientes.find(x=>tel&&x.telefone===tel)||state.clientes.find(x=>x.nome.toLowerCase()===nome.toLowerCase());if(!c){c={id:uid(),nome,telefone:tel};state.clientes.push(c)}else{c.nome=nome;c.telefone=tel||c.telefone}let s=state.servicos.find(s=>String(s.id)===box.querySelector('.servAt').value);if(!s)return toast('Cadastre serviço');let prof=state.profissionais.find(p=>String(p.id)===box.querySelector('.profAt').value);let tp=tipoPreco(tipo,hora),valor=servicePrice(s,tp),v=validVoucher(box.querySelector('.voucherAt').value.trim().toUpperCase());if(v){valor*=1-num(v.percentual)/100;v.usado=true;v.cliente=nome;v.usadoEm=new Date().toISOString()}let item={id:uid(),clienteId:c.id,nome,tel,tipo:tipo==='fila'?'fila':tp,data,hora,servId:s.id,servNome:s.nome,profId:prof?.id||'',profNome:prof?.nome||'Qualquer',tempoMin:num(box.querySelector('.tempoAt').value)||serviceDur(s,tp)||20,valorOriginal:servicePrice(s,tp),valorFinal:Math.max(0,valor),voucher:v?.codigo||'',status:'aguardando',origem:isAdmin()?'admin':'prof',createdAt:Date.now()};if(!isAdmin()){item.profId=session.profId;item.profNome=currentProf()?.nome||'';state.pendencias.push(item);toast('Enviado para aprovação')}else state.fila.push(item);markDirty()}
function filaHTML(){return `<div class="grid g2"><div class="card"><h2>Adicionar na fila</h2>${formAtendimento('fila')}</div><div class="card"><h2>Fila de espera</h2><p class="muted">Estimativa: ${waitMin()} min</p>${lista(visibleA().filter(a=>a.tipo==='fila'&&a.status!=='concluido'))}</div></div>`}function agendaHTML(){return `<div class="grid g2"><div class="card"><h2>Novo agendamento</h2>${formAtendimento('agendamento')}</div><div class="card"><h2>Agendamentos</h2>${lista(visibleA().filter(a=>a.tipo!=='fila'&&a.status!=='concluido').sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)))}</div></div>`}
function lista(l){if(!l.length)return '<div class="muted">Nenhum atendimento.</div>';return l.map(a=>`<div class="item"><div class="item-head"><div><b>${a.nome}</b><div class="muted">${a.servNome} • ${a.profNome||'Qualquer'} • ${a.data} ${a.hora}</div><div class="row" style="margin-top:7px"><span class="badge b-${a.tipo}">${a.tipo}</span><span class="badge">${brl(a.valorFinal)}</span><span class="badge">${a.tempoMin||20} min</span></div></div><div class="row"><button class="btn blue small" onclick="editTempo('${a.id}')">Tempo</button>${a.status==='aguardando'?`<button class="btn good small" onclick="startAt('${a.id}')">Iniciar</button>`:''}<button class="btn primary small" onclick="doneAt('${a.id}')">Finalizar</button><button class="btn bad small" onclick="delAt('${a.id}')">Remover</button></div></div></div>`).join('')}function editTempo(id){let a=state.fila.find(x=>String(x.id)===id);let v=prompt('Duração em minutos',a.tempoMin||20);if(v!==null){a.tempoMin=num(v)||20;markDirty()}}function startAt(id){let a=state.fila.find(x=>String(x.id)===id);if(a){a.status='em_atendimento';markDirty()}}function doneAt(id){let i=state.fila.findIndex(x=>String(x.id)===id);if(i>=0){let a=state.fila[i];a.status='concluido';a.horaFim=nowHH();state.historico.push(a);state.fila.splice(i,1);markDirty()}}function delAt(id){if(!confirm('Remover?'))return;state.fila=state.fila.filter(x=>String(x.id)!==id);markDirty()}
function clientesHTML(){return `<div class="grid g2"><div class="card"><h2>Novo cliente</h2><div class="field"><label>Nome</label><input id="clNome"></div><div class="field"><label>Telefone</label><input id="clTel"></div><button class="btn primary" onclick="addCliente()">Salvar cliente</button></div><div class="card"><h2>Adicionar serviço ao cliente</h2>${formAtendimento('fila')}</div></div><div class="card"><h2>Clientes</h2>${state.clientes.length?`<table><tr><th>Nome</th><th>Telefone</th><th>Ações</th></tr>${state.clientes.map(c=>`<tr><td>${c.nome}</td><td>${c.telefone||''}</td><td><button class="btn small blue" onclick="editCliente('${c.id}')">Editar</button> <button class="btn small good" onclick="openWhats('${c.telefone}','Olá ${c.nome}, tudo bem?')">WhatsApp</button></td></tr>`).join('')}</table>`:'<div class="muted">Nenhum cliente.</div>'}</div>`}function addCliente(){if(!clNome.value.trim())return toast('Nome obrigatório');state.clientes.push({id:uid(),nome:clNome.value.trim(),telefone:clTel.value.trim()});markDirty()}function editCliente(id){let c=state.clientes.find(c=>String(c.id)===id);let n=prompt('Nome',c.nome);if(n!==null)c.nome=n;let t=prompt('Telefone',c.telefone||'');if(t!==null)c.telefone=t;markDirty()}
function servicosHTML(){return `<div class="card"><h2>Serviços e valores</h2><div class="grid g4"><div class="field"><label>Serviço</label><input id="svNome"></div><div class="field"><label>Fila R$</label><input id="svFila" type="number" value="35"></div><div class="field"><label>Agendamento R$</label><input id="svAg" type="number" value="40"></div><div class="field"><label>Premium R$</label><input id="svPr" type="number" value="50"></div></div><div class="grid g3"><div class="field"><label>Duração fila</label><input id="duFila" type="number" value="20"></div><div class="field"><label>Duração agenda</label><input id="duAg" type="number" value="30"></div><div class="field"><label>Duração premium</label><input id="duPr" type="number" value="40"></div></div><button class="btn primary" onclick="addServico()">Adicionar serviço</button></div><div class="card"><h2>Lista</h2>${state.servicos.length?`<table><tr><th>Serviço</th><th>Valores</th><th>Duração</th><th>Ações</th></tr>${state.servicos.map(s=>`<tr><td>${s.nome} ${s.ativo===false?'<span class="badge b-off">inativo</span>':''}</td><td>${brl(s.precoFila)} / ${brl(s.precoAgenda)} / ${brl(s.precoPremium)}</td><td>${s.durFila}/${s.durAgenda}/${s.durPremium} min</td><td><button class="btn small blue" onclick="editServico('${s.id}')">Editar</button> <button class="btn small ${s.ativo===false?'good':'bad'}" onclick="toggleServico('${s.id}')">${s.ativo===false?'Ativar':'Desativar'}</button></td></tr>`).join('')}</table>`:'<div class="muted">Nenhum serviço.</div>'}</div>${pendenciasHTML()}`}function addServico(){let s={id:uid(),nome:svNome.value.trim(),precoFila:num(svFila.value),precoAgenda:num(svAg.value),precoPremium:num(svPr.value),durFila:num(duFila.value),durAgenda:num(duAg.value),durPremium:num(duPr.value),ativo:true};if(!s.nome)return toast('Nome obrigatório');if(!isAdmin()){state.pendencias.push({tipo:'servico',servico:s,profId:session.profId});toast('Serviço enviado para aprovação')}else state.servicos.push(s);markDirty()}function editServico(id){if(!canAdmin())return;let s=state.servicos.find(s=>String(s.id)===id);let fields=[['nome','Nome'],['precoFila','Preço fila'],['precoAgenda','Preço agenda'],['precoPremium','Preço premium'],['durFila','Duração fila'],['durAgenda','Duração agenda'],['durPremium','Duração premium']];fields.forEach(([k,l])=>{let v=prompt(l,s[k]);if(v!==null)s[k]=k==='nome'?v:num(v)});markDirty()}function toggleServico(id){if(!canAdmin())return;let s=state.servicos.find(s=>String(s.id)===id);s.ativo=s.ativo===false;markDirty()}
function profissionaisHTML(){return `<div class="card"><h2>Profissionais</h2><div class="grid g4"><div class="field"><label>Nome</label><input id="pfNome"></div><div class="field"><label>Telefone</label><input id="pfTel"></div><div class="field"><label>Comissão %</label><input id="pfCom" type="number" value="60"></div><div class="field"><label>Senha</label><input id="pfSenha" value="1234"></div></div><div class="field"><label>Foto</label><input id="pfFoto" type="file" accept="image/*"></div><button class="btn primary" onclick="addProf()">Adicionar profissional</button></div><div class="card"><h2>Lista</h2>${state.profissionais.length?state.profissionais.map(p=>`<div class="item"><div class="item-head"><div class="row">${p.foto?`<img class="prof-photo" src="${p.foto}">`:''}<div><b>${p.nome}</b><div class="muted">${p.telefone||''} • ${p.comissao}% comissão</div>${p.ativo===false?'<span class="badge b-off">desativado</span>':'<span class="badge b-ok">ativo</span>'}</div></div><div class="row"><button class="btn small blue" onclick="editProf('${p.id}')">Editar</button><button class="btn small ${p.ativo===false?'good':'bad'}" onclick="toggleProf('${p.id}')">${p.ativo===false?'Ativar':'Desativar'}</button>${p.telefone?`<button class="btn small good" onclick="openWhats('${p.telefone}','Olá ${p.nome}')">WhatsApp</button>`:''}</div></div></div>`).join('):'<div class="muted">Nenhum profissional cadastrado.</div>'}</div><div class="card"><h2>Bloquear profissional em data</h2><div class="grid g4"><div class="field"><label>Profissional</label><select id="blProf">${state.profissionais.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="blData" type="date" value="${today()}"></div><div class="field"><label>Início</label><input id="blIni" type="time" value="08:00"></div><div class="field"><label>Fim</label><input id="blFim" type="time" value="18:00"></div></div><button class="btn primary" onclick="addBloqueio()">Bloquear</button>${state.bloqueios.map((b,i)=>`<div class="item">${state.profissionais.find(p=>String(p.id)===String(b.profId))?.nome||''} • ${b.data} ${b.ini}-${b.fim} <button class="btn small bad" onclick="state.bloqueios.splice(${i},1);markDirty()">Remover</button></div>`).join('')}</div>`}async function fileData(f){if(!f)return '';return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}async function addProf(){if(!pfNome.value.trim())return toast('Nome obrigatório');state.profissionais.push({id:uid(),nome:pfNome.value.trim(),telefone:pfTel.value.trim(),comissao:num(pfCom.value)||60,senha:pfSenha.value||'1234',foto:await fileData(pfFoto.files[0]),ativo:true,esp:'Barbeiro'});markDirty()}async function editProf(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===id);let n=prompt('Nome',p.nome);if(n!==null)p.nome=n;let t=prompt('Telefone',p.telefone||'');if(t!==null)p.telefone=t;let c=prompt('Comissão %',p.comissao||60);if(c!==null)p.comissao=num(c);let s=prompt('Senha',p.senha||'1234');if(s!==null)p.senha=s;markDirty()}function toggleProf(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===id);p.ativo=!p.ativo;markDirty()}function addBloqueio(){state.bloqueios.push({profId:blProf.value,data:blData.value,ini:blIni.value,fim:blFim.value});markDirty()}
function pendenciasHTML(){if(!isAdmin()||!state.pendencias.length)return '';return `<div class="card"><h2>Aprovações pendentes</h2>${state.pendencias.map((p,i)=>`<div class="item"><b>${p.tipo==='servico'?'Serviço':'Atendimento'}</b><div class="muted">${p.servico?.nome||p.nome||''}</div><button class="btn small good" onclick="approve(${i})">Aprovar</button> <button class="btn small bad" onclick="reject(${i})">Recusar</button></div>`).join('')}</div>`}function approve(i){let p=state.pendencias[i];if(p.tipo==='servico')state.servicos.push(p.servico);else state.fila.push({...p,pendenteAdmin:false});state.pendencias.splice(i,1);markDirty()}function reject(i){state.pendencias.splice(i,1);markDirty()}
function vouchersHTML(){return `<div class="card"><h2>Vouchers</h2><div class="grid g3"><div class="field"><label>Quantidade</label><input id="vcQtd" type="number" value="1"></div><div class="field"><label>Desconto %</label><input id="vcPct" type="number" value="10"></div><div class="field"><label>Validade</label><input id="vcVal" type="date" value="${today()}"></div></div><button class="btn primary" onclick="gerarVouchers()">Gerar</button></div><div class="card"><h2>Lista</h2>${state.vouchers.map(v=>`<div class="item"><b>${v.codigo}</b> • ${v.percentual}% • validade ${v.validade} ${v.usado?'<span class="badge b-off">usado</span>':'<span class="badge b-ok">livre</span>'}<div class="row" style="margin-top:8px"><button class="btn small good" onclick="openWhats('', 'Você ganhou uma cortesia Vizzarty: use o voucher ${v.codigo} e ganhe ${v.percentual}% de desconto. Link: ${clientLink()}')">Enviar WhatsApp</button></div></div>`).join('')}</div>`}function gerarVouchers(){for(let i=0;i<(num(vcQtd.value)||1);i++)state.vouchers.push({id:uid(),codigo:'VIZ'+Math.random().toString(36).slice(2,8).toUpperCase(),percentual:num(vcPct.value)||10,validade:vcVal.value||today(),usado:false});markDirty()}
function extratoHTML(){let list=(isAdmin()?state.historico:state.historico.filter(a=>String(a.profId)===String(session.profId)));let total=list.reduce((s,a)=>s+num(a.valorFinal),0),com=list.reduce((s,a)=>{let p=state.profissionais.find(p=>String(p.id)===String(a.profId));return s+num(a.valorFinal)*(num(p?.comissao||0)/100)},0);return `<div class="statgrid"><div class="stat"><b>${list.length}</b><span>Atendimentos</span></div><div class="stat"><b>${brl(total)}</b><span>Total</span></div><div class="stat"><b>${brl(com)}</b><span>Comissão</span></div><div class="stat"><b>${brl(total-com)}</b><span>Casa</span></div></div><div class="card"><h2>Histórico</h2>${lista(list.slice().reverse())}</div>`}
function clientLink(){return location.origin+location.pathname+'?cliente=1'}function linkHTML(){return `<div class="card"><h2>Link único do cliente</h2><p class="muted">Cliente escolhe fila ou agendamento no mesmo link.</p><input value="${clientLink()}" readonly onclick="this.select()"><div class="row" style="margin-top:10px"><button class="btn primary" onclick="navigator.clipboard.writeText('${clientLink()}');toast('Copiado')">Copiar</button><button class="btn good" onclick="openWhats('', 'Agende ou entre na fila: ${clientLink()}')">Enviar WhatsApp</button></div></div>`}
function configHTML(){let h=state.horarios,c=state.config;return `<div class="grid g2"><div class="card"><h2>Dados da barbearia</h2><div class="field"><label>Nome</label><input id="cfgNome" value="${c.nome}"></div><div class="field"><label>Telefone</label><input id="cfgTel" value="${c.telefone||''}"></div><div class="field"><label>Endereço</label><input id="cfgEnd" value="${c.endereco||''}"></div><div class="field"><label>Senha admin</label><input id="cfgSenha" value="${c.adminSenha||'1234'}"></div><div class="field"><label>Logo</label><input id="cfgLogo" type="file" accept="image/*"></div><button class="btn primary" onclick="saveConfig()">Salvar</button></div><div class="card"><h2>Horários</h2><div class="grid g2"><div class="field"><label>Fila início</label><input id="hf1" type="time" value="${h.filaIni}"></div><div class="field"><label>Fila fim</label><input id="hf2" type="time" value="${h.filaFim}"></div><div class="field"><label>Agenda início</label><input id="ha1" type="time" value="${h.agendaIni}"></div><div class="field"><label>Agenda fim</label><input id="ha2" type="time" value="${h.agendaFim}"></div><div class="field"><label>Premium almoço início</label><input id="hp1" type="time" value="${h.premAlmocoIni}"></div><div class="field"><label>Premium almoço fim</label><input id="hp2" type="time" value="${h.premAlmocoFim}"></div><div class="field"><label>Premium noite início</label><input id="hp3" type="time" value="${h.premNoiteIni}"></div><div class="field"><label>Premium noite fim</label><input id="hp4" type="time" value="${h.premNoiteFim}"></div></div><button class="btn primary" onclick="saveHorarios()">Salvar horários</button></div></div><div class="card"><h2>Manutenção</h2><button class="btn blue" onclick="syncNow(true)">Forçar salvar na nuvem</button> <button class="btn bad" onclick="if(confirm('Limpar dados locais?')){localStorage.removeItem('vz_state');location.reload()}">Limpar local</button></div>`}async function saveConfig(){state.config.nome=cfgNome.value;state.config.telefone=cfgTel.value;state.config.endereco=cfgEnd.value;state.config.adminSenha=cfgSenha.value||'1234';let l=await fileData(cfgLogo.files[0]);if(l)state.config.logo=l;markDirty()}function saveHorarios(){Object.assign(state.horarios,{filaIni:hf1.value,filaFim:hf2.value,agendaIni:ha1.value,agendaFim:ha2.value,premAlmocoIni:hp1.value,premAlmocoFim:hp2.value,premNoiteIni:hp3.value,premNoiteFim:hp4.value});markDirty()}
function bindForms(){document.querySelectorAll('.selCliente').forEach(sel=>sel.onchange=()=>{let c=state.clientes.find(c=>String(c.id)===sel.value),box=sel.closest('.card');if(c&&box){box.querySelector('.nomeAt').value=c.nome;box.querySelector('.telAt').value=c.telefone||''}});document.querySelectorAll('.tipoAt,.horaAt,.servAt').forEach(el=>el.onchange=()=>updatePreview(el.closest('.card')));document.querySelectorAll('.card').forEach(updatePreview)}function updatePreview(box){if(!box)return;let s=state.servicos.find(s=>String(s.id)===box.querySelector('.servAt')?.value);let tipo=tipoPreco(box.querySelector('.tipoAt')?.value||'fila',box.querySelector('.horaAt')?.value||nowHH());let pv=box.querySelector('.pricePreview'),tm=box.querySelector('.tempoAt');if(s&&pv)pv.textContent=`Valor: ${brl(servicePrice(s,tipo))} • Duração: ${serviceDur(s,tipo)} min`;if(s&&tm&&!document.activeElement.isSameNode(tm))tm.value=serviceDur(s,tipo)||20}
function publicServiceLabel(s,mode,h=nowHH()){if(mode==='fila')return `${s.nome} — fila ${brl(s.precoFila)}`;let tp=tipoPreco('agendamento',h);return `${s.nome} — normal ${brl(s.precoAgenda)} / premium ${brl(s.precoPremium)}${tp==='premium'?' (premium agora)':''}`}function renderClient(){document.body.classList.add('client-mode');clientWrap.innerHTML=`<div class="brand"><div class="logo">${state.config.logo?`<img src="${state.config.logo}">`:'V'}</div><b>${state.config.nome}</b><small>Escolha seu atendimento</small></div><div class="card"><div class="grid g2"><button class="btn primary" onclick="clientForm('fila')">Fila de espera</button><button class="btn blue" onclick="clientForm('agendamento')">Agendamento</button></div></div><div id="cf"></div>`;clientForm('fila')}function clientForm(mode){let h=nowHH();cf.innerHTML=`<div class="card"><h2>${mode==='fila'?'Entrar na fila':'Agendar'}</h2><p class="muted">${mode==='fila'?'Espera estimada: '+waitMin()+' min':'Horários de almoço e após 19h podem ser premium.'}</p><div class="field"><label>Nome</label><input id="pubNome"></div><div class="field"><label>WhatsApp</label><input id="pubTel"></div><div class="grid g2"><div class="field"><label>Data</label><input id="pubData" type="date" value="${today()}"></div><div class="field"><label>Hora</label><input id="pubHora" type="time" value="${h}" onchange="clientForm('${mode}')"></div></div><div class="field"><label>Serviço</label><select id="pubServ" onchange="clientPrice('${mode}')">${servicosAtivos().map(s=>`<option value="${s.id}">${publicServiceLabel(s,mode,h)}</option>`).join('')}</select><div class="muted" id="pubPrice"></div></div><div class="field"><label>Profissional</label><select id="pubProf"><option value="">Qualquer</option>${profsDisponiveis(today(),h).map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Voucher</label><input id="pubVoucher"></div><button class="btn primary" onclick="clientAdd('${mode}')">Confirmar</button></div>`;clientPrice(mode)}function clientPrice(mode){let s=state.servicos.find(s=>String(s.id)===pubServ.value);if(!s)return;let tp=mode==='fila'?'fila':tipoPreco('agendamento',pubHora.value||nowHH());pubPrice.innerHTML=`Valor: <b>${brl(servicePrice(s,tp))}</b> • Duração: ${serviceDur(s,tp)} min`}
function clientAdd(mode){let data=pubData.value||today(),hora=pubHora.value||nowHH();if(mode==='fila'&&!inRange(nowHH(),state.horarios.filaIni,state.horarios.filaFim))return toast('Fila fora do horário');if(mode==='agendamento'&&!inRange(hora,state.horarios.agendaIni,state.horarios.agendaFim)&&!isPremiumTime(hora))return toast('Horário indisponível');let nome=pubNome.value.trim(),tel=pubTel.value.trim();if(!nome)return toast('Informe seu nome');let c=state.clientes.find(c=>tel&&c.telefone===tel);if(!c){c={id:uid(),nome,telefone:tel};state.clientes.push(c)}let s=state.servicos.find(s=>String(s.id)===pubServ.value),p=state.profissionais.find(p=>String(p.id)===pubProf.value),tp=mode==='fila'?'fila':tipoPreco('agendamento',hora),valor=servicePrice(s,tp),v=validVoucher(pubVoucher.value.trim().toUpperCase());if(v){valor*=1-num(v.percentual)/100;v.usado=true;v.cliente=nome;v.usadoEm=new Date().toISOString()}state.fila.push({id:uid(),clienteId:c.id,nome,tel,tipo:tp,data,hora,servId:s.id,servNome:s.nome,profId:p?.id||'',profNome:p?.nome||'Qualquer',tempoMin:serviceDur(s,tp)||20,valorOriginal:servicePrice(s,tp),valorFinal:Math.max(0,valor),voucher:v?.codigo||'',status:'aguardando',origem:'cliente',createdAt:Date.now()});markDirty();clientWrap.innerHTML=`<div class="card" style="margin-top:50px;text-align:center"><h1>Confirmado ✅</h1><p>${mode==='fila'?'Você entrou na fila. Espera estimada: '+waitMin()+' min':'Seu agendamento foi enviado.'}</p><b>${brl(valor)}</b></div>`}
(async function init(){normalize();saveLocal();try{let c=await cloudGet();if(c&&num(c.updatedAt)>=num(state.updatedAt)){state=c;normalize();saveLocal()}else if(hasRealData(state)){await cloudPut()}syncStatus.textContent='nuvem ok'}catch(e){syncStatus.textContent='modo local'}renderLoginProfs();initLogo();if(isClient()){renderClient();return}if(localStorage.getItem('vz_session')){loginBox.classList.add('hidden');app.classList.remove('hidden');renderAll()}})();
</script>
