us:var(--r);padding:16px;margin-bottom:12px}.card h2{margin:0 0 12px;font-size:18px}.muted{color:var(--mut);font-size:13px}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:var(--card2);color:var(--txt);display:inline-flex;align-items:center;gap:6px;text-decoration:none}.btn.primary{background:var(--gold);color:#130d08;font-weight:700}.btn.good{background:#123523;color:var(--green)}.btn.bad{background:#3a1212;color:var(--red)}.btn.blue{background:#10243a;color:var(--blue)}.btn.small{font-size:12px;padding:7px 9px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.stat b{font-size:24px;display:block;color:var(--gold)}.item{background:#100c09;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#2a1c0c;color:var(--gold);display:inline-flex}.b-fila{background:#2a1c0c;color:var(--gold)}.b-agendamento{background:#10243a;color:var(--blue)}.b-premium{background:#26143a;color:var(--purple)}.b-ok{background:#123523;color:var(--green)}.b-off{background:#3a1212;color:var(--red)}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:13px}th{color:var(--mut);font-size:12px;text-transform:uppercase}.toast{position:fixed;right:18px;bottom:18px;background:var(--card2);border:1px solid var(--line);padding:13px;border-radius:12px;z-index:10000}.client-mode .app{display:none}.client-page{display:none;min-height:100vh;overflow:auto;padding:18px;background:radial-gradient(circle at top,#241609,#0d0a08)}.client-mode .client-page{display:block}.client-wrap{max-width:470px;margin:auto}.sync{font-size:12px;color:var(--mut)}.danger-note{background:#2b1212;border:1px solid #5e2222;color:#ff8c8c;padding:10px;border-radius:10px}.prof-photo{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover}.login{max-width:420px;margin:7vh auto}.hidden{display:none!important}@media(max-width:800px){body{overflow:auto}.app{height:auto;min-height:100vh}.side{position:fixed;z-index:50;left:0;top:0;bottom:0;transform:translateX(-103%)}.side.open{transform:translateX(0)}.menu{display:inline-flex}.content{padding:12px}.g2,.g3,.g4,.statgrid{grid-template-columns:1fr}.top{position:sticky;top:0;z-index:20}.item-head{display:block}.row .btn{flex:1;justify-content:center}}

</div>
<script>
const SUPABASE_URL='https://vtrqebzafhsqjsshvklx.supabase.co';
const SUPABASE_KEY='sb_publishable_KF5HCg_RbEchQ515dzU-uQ_Fnwrxc0s';
const REST=SUPABASE_URL+'/rest/v1/vizzarty_state?id=eq.1';
const DEFAULT={version:31,config:{nome:'Vizzarty Barbearia',telefone:'',endereco:'',adminSenha:'1234',logo:'',linkFilaAtiva:true,linkAgendaAtiva:true},horarios:{filaIni:'08:00',filaFim:'18:30',agendaIni:'08:00',agendaFim:'18:30'},horariosEspeciais:[{id:'almoco',nome:'Horário especial almoço',ini:'11:30',fim:'13:30',ativo:true},{id:'noite',nome:'Horário especial noite',ini:'19:00',fim:'22:00',ativo:true}],profissionais:[],servicos:[],clientes:[],fila:[],historico:[],vouchers:[],bloqueios:[],pendencias:[],updatedAt:0,seq:1};
let state=loadLocal()||structuredClone(DEFAULT), session=JSON.parse(localStorage.getItem('vz_session')||'null'), current='painel', dirty=false, editing=false, saveTimer=null, lastCloud=0;
function clone(o){return JSON.parse(JSON.stringify(o))}function uid(){state.seq=(state.seq||1)+1;return Date.now().toString(36)+state.seq.toString(36)}function today(){return new Date().toISOString().slice(0,10)}function nowHH(){return new Date().toTimeString().slice(0,5)}function num(v){return Number(v)||0}function brl(v){return 'R$ '+num(v).toFixed(2).replace('.',',')}function loadLocal(){try{return JSON.parse(localStorage.getItem('vz_state')||'null')}catch{return null}}function saveLocal(){localStorage.setItem('vz_state',JSON.stringify(state))}function normalize(){state={...clone(DEFAULT),...state};state.config={...DEFAULT.config,...(state.config||{})};state.horarios={...DEFAULT.horarios,...(state.horarios||{})};['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias','horariosEspeciais'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});if(!state.horariosEspeciais.length&&(state.horarios.premAlmocoIni||state.horarios.premNoiteIni)){state.horariosEspeciais=[{id:'almoco',nome:'Horário especial almoço',ini:state.horarios.premAlmocoIni||'11:30',fim:state.horarios.premAlmocoFim||'13:30',ativo:true},{id:'noite',nome:'Horário especial noite',ini:state.horarios.premNoiteIni||'19:00',fim:state.horarios.premNoiteFim||'22:00',ativo:true}].filter(x=>x.ini&&x.fim)}state.horariosEspeciais=state.horariosEspeciais.map(h=>({id:uid(),nome:'Horário especial',ini:'19:00',fim:'22:00',ativo:true,...h,ativo:h.ativo!==false}));state.profissionais=state.profissionais.map(p=>({id:uid(),nome:'',esp:'Barbeiro',telefone:'',foto:'',ativo:true,senha:'1234',comissao:60,...p,ativo:p.ativo!==false}));state.servicos=state.servicos.map(s=>({id:uid(),nome:'Serviço',precoFila:35,precoAgenda:40,precoPremium:50,durFila:20,durAgenda:30,durPremium:40,ativo:true,linkAtivo:true,...s,ativo:s.ativo!==false,linkAtivo:s.linkAtivo!==false}));state.clientes=state.clientes.map(c=>({id:uid(),nome:'',telefone:'',...c}));}
function hasRealData(s){return ['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias'].some(k=>Array.isArray(s?.[k])&&s[k].length>0)||!!s?.config?.logo}function toast(m){let d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
async function cloudGet(){const r=await fetch(REST,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw new Error(await r.text());const a=await r.json();return a[0]?.data||null}
async function cloudPut(){normalize();state.updatedAt=Date.now();saveLocal();const body={id:1,data:state,updated_at:new Date().toISOString()};let r=await fetch(REST,{method:'PATCH',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});if(!r.ok){r=await fetch(SUPABASE_URL+'/rest/v1/vizzarty_state',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text())}lastCloud=state.updatedAt;syncStatus.textContent='salvo na nuvem '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
async function syncNow(force=false){if(editing&&!force)return;if(dirty||force){try{await cloudPut();dirty=false;toast('Sincronizado')}catch(e){syncStatus.textContent='erro nuvem';toast('Erro de nuvem, salvo local')}}else{try{const c=await cloudGet();if(c&&num(c.updatedAt)>num(state.updatedAt)){state=c;normalize();saveLocal();renderAll()}syncStatus.textContent='nuvem ok'}catch(e){syncStatus.textContent='sem nuvem'}}}
function markDirty(){normalize();state.updatedAt=Date.now();dirty=true;saveLocal();renderAll();clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncNow(true),1200)}
setInterval(()=>{if(!dirty&&!editing)syncNow(false)},18000);
document.addEventListener('focusin',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))editing=true});document.addEventListener('focusout',()=>setTimeout(()=>editing=false,300));
function isClient(){return new URLSearchParams(location.search).has('cliente')}function isAdmin(){return session&&session.role==='admin'}function currentProf(){return session?state.profissionais.find(p=>String(p.id)===String(session.profId)):null}function canAdmin(){if(!isAdmin()){toast('Somente admin');return false}return true}
function checkAdminPassword(){let s=prompt('Digite a senha do admin para visualizar a senha do colaborador:'); if(s===null)return false; if(s!==(state.config.adminSenha||'1234')){toast('Senha admin incorreta'); return false;} return true}
function requestShowProfSenha(id){if(!checkAdminPassword())return;let inp=document.getElementById('pf_senha_'+id)||document.getElementById('cfg_prof_senha_'+id);if(!inp)return;inp.type='text';toast('Senha liberada por 15 segundos');setTimeout(()=>{if(inp)inp.type='password'},15000)}
function saveProfPassFromConfig(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===String(id));let inp=document.getElementById('cfg_prof_senha_'+id);if(!p||!inp)return;p.senha=inp.value||'1234';markDirty();toast('Senha do profissional atualizada')}

function doLogin(){normalize();let role=loginRole.value,pass=loginPass.value;if(role==='admin'){if(pass===(state.config.adminSenha||'1234'))session={role:'admin'};else return toast('Senha incorreta')}else{let p=state.profissionais.find(p=>String(p.id)===loginProf.value);if(!p||p.ativo===false)return toast('Profissional inativo');if(pass!==(p.senha||'1234'))return toast('Senha incorreta');session={role:'prof',profId:p.id}}localStorage.setItem('vz_session',JSON.stringify(session));loginBox.classList.add('hidden');app.classList.remove('hidden');renderAll()}
function logout(){localStorage.removeItem('vz_session');location.reload()}function renderLoginProfs(){loginProfWrap.style.display=loginRole.value==='prof'?'block':'none';loginProf.innerHTML=state.profissionais.filter(p=>p.ativo!==false).map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}function initLogo(){let l=state.config.logo;if(l){logoBox.innerHTML=`<img src="${l}">`;loginLogo.innerHTML=`<img src="${l}">`}brandName.textContent=state.config.nome||'Vizzarty'}
function navItems(){let a=[['painel','ti-dashboard','Painel'],['fila','ti-users','Fila de espera'],['agendamentos','ti-calendar','Agendamentos'],['clientes','ti-address-book','Clientes'],['servicos','ti-list-details','Serviços'],['profissionais','ti-user-star','Profissionais'],['vouchers','ti-ticket','Vouchers'],['extrato','ti-receipt','Extrato'],['link','ti-link','Link cliente'],['config','ti-settings','Configurações']];if(!isAdmin())a=[['painel','ti-dashboard','Meu painel'],['fila','ti-users','Fila'],['agendamentos','ti-calendar','Agenda'],['extrato','ti-receipt','Minha comissão'],['link','ti-link','Link cliente']];return a}function setPage(p){current=p;renderAll();side.classList.remove('open')}function renderNav(){nav.innerHTML=navItems().map(([id,ic,t])=>`<button class="${current===id?'active':''}" onclick="setPage('${id}')"><i class="ti ${ic}"></i>${t}${id==='fila'?`<small>${state.fila.filter(a=>a.tipo==='fila'&&a.status!=='concluido').length}</small>`:''}</button>`).join('')+`<button onclick="logout()"><i class="ti ti-logout"></i>Sair</button>`}function renderAll(){normalize();initLogo();renderNav();pageTitle.textContent=(navItems().find(x=>x[0]===current)||[0,0,'Painel'])[2];pages.innerHTML=pageHTML(current);bindForms()}
function pageHTML(p){return ({painel:painelHTML,fila:filaHTML,agendamentos:agendaHTML,clientes:clientesHTML,servicos:servicosHTML,profissionais:profissionaisHTML,vouchers:vouchersHTML,extrato:extratoHTML,link:linkHTML,config:configHTML}[p]||painelHTML)()}
function inRange(h,a,b){if(!a||!b)return true;return h>=a&&h<=b}function specialInfo(h){return (state.horariosEspeciais||[]).find(x=>x.ativo!==false&&inRange(h,x.ini,x.fim))||null}function isSpecialTime(h){return !!specialInfo(h)}function isEspecialTime(h){return isSpecialTime(h)}function tipoPreco(mode,h){if(mode==='especial'||mode==='especial')return 'especial';if(mode==='agendamento'&&isSpecialTime(h))return 'especial';return mode==='agendamento'?'agendamento':'fila'}function servicePrice(s,t){return (t==='especial'||t==='especial')?num(s.precoPremium):t==='agendamento'?num(s.precoAgenda):num(s.precoFila)}function serviceDur(s,t){return (t==='especial'||t==='especial')?num(s.durPremium):t==='agendamento'?num(s.durAgenda):num(s.durFila)}function servicosAtivos(){return state.servicos.filter(s=>s.ativo!==false)}function servicosLink(){return servicosAtivos().filter(s=>s.linkAtivo!==false)}function profsDisponiveis(data=today(),hora=''){return state.profissionais.filter(p=>p.ativo!==false&&!state.bloqueios.some(b=>String(b.profId)===String(p.id)&&b.data===data&&(!hora||inRange(hora,b.ini,b.fim))))}function waitMin(){return state.fila.filter(a=>a.tipo==='fila'&&a.status!=='concluido').reduce((s,a)=>s+num(a.tempoMin||20),0)}function visibleA(){return isAdmin()?state.fila:state.fila.filter(a=>String(a.profId)===String(session.profId))}function openWhats(t='',m=''){let n=(t||'').replace(/\D/g,'');window.open(`https://wa.me/55${n}?text=${encodeURIComponent(m)}`,'_blank')}function validVoucher(c){let v=state.vouchers.find(v=>v.codigo===c&&!v.usado&&(!v.validade||v.validade>=today()));return v}
function painelHTML(){let ag=state.fila.filter(a=>a.status==='aguardando').length,agd=state.fila.filter(a=>a.tipo!=='fila'&&a.status!=='concluido').length,hoje=state.historico.filter(h=>h.data===today()).length,fat=state.historico.filter(h=>h.data===today()).reduce((s,a)=>s+num(a.valorFinal),0);return `<div class="statgrid"><div class="stat"><b>${ag}</b><span>Aguardando</span></div><div class="stat"><b>${agd}</b><span>Agendamentos</span></div><div class="stat"><b>${hoje}</b><span>Concluídos hoje</span></div><div class="stat"><b>${brl(fat)}</b><span>Faturamento hoje</span></div></div><div class="grid g2"><div class="card"><h2>Atendimento rápido</h2>${formAtendimento('fila')}</div><div class="card"><h2>Próximos</h2>${lista(visibleA().filter(a=>a.status!=='concluido').slice(0,8))}</div></div>`}
function formAtendimento(mode){return `<div class="grid g2"><div class="field"><label>Cliente salvo</label><select class="selCliente"><option value="novo">Novo cliente</option>${state.clientes.map(c=>`<option value="${c.id}">${c.nome} ${c.telefone?'— '+c.telefone:''}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select class="tipoAt"><option value="fila" ${mode==='fila'?'selected':''}>Ordem de chegada</option><option value="agendamento" ${mode==='agendamento'?'selected':''}>Agendamento normal</option><option value="especial" ${mode==='especial'?'selected':''}>Horário especial</option></select></div></div><div class="grid g2"><div class="field"><label>Nome</label><input class="nomeAt"></div><div class="field"><label>Telefone</label><input class="telAt"></div></div><div class="grid g3"><div class="field"><label>Data</label><input type="date" class="dataAt" value="${today()}"></div><div class="field"><label>Hora</label><input type="time" class="horaAt" value="${nowHH()}"></div><div class="field"><label>Voucher</label><input class="voucherAt" placeholder="Código"></div></div><div class="grid g3"><div class="field"><label>Serviço</label><select class="servAt">${servicosAtivos().map(s=>`<option value="${s.id}">${s.nome}</option>`).join('')}</select><div class="muted pricePreview"></div></div><div class="field"><label>Profissional</label><select class="profAt"><option value="">Qualquer</option>${profsDisponiveis().map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Duração min.</label><input type="number" class="tempoAt" value="20" min="5"></div></div><button class="btn primary" onclick="addAt(this)"><i class="ti ti-plus"></i>Adicionar</button>`}
function addAt(btn){let box=btn.closest('.card'),tipo=box.querySelector('.tipoAt').value,data=box.querySelector('.dataAt').value||today(),hora=box.querySelector('.horaAt').value||nowHH(),cid=box.querySelector('.selCliente').value,nome=box.querySelector('.nomeAt').value.trim(),tel=box.querySelector('.telAt').value.trim();if(cid!=='novo'){let c=state.clientes.find(c=>String(c.id)===cid);if(c){nome=c.nome;tel=c.telefone}}if(!nome)return toast('Informe o cliente');let c=state.clientes.find(x=>tel&&x.telefone===tel)||state.clientes.find(x=>x.nome.toLowerCase()===nome.toLowerCase());if(!c){c={id:uid(),nome,telefone:tel};state.clientes.push(c)}else{c.nome=nome;c.telefone=tel||c.telefone}let s=state.servicos.find(s=>String(s.id)===box.querySelector('.servAt').value);if(!s)return toast('Cadastre serviço');let prof=state.profissionais.find(p=>String(p.id)===box.querySelector('.profAt').value);let tp=tipoPreco(tipo,hora),valor=servicePrice(s,tp),v=validVoucher(box.querySelector('.voucherAt').value.trim().toUpperCase());if(v){valor*=1-num(v.percentual)/100;v.usado=true;v.cliente=nome;v.usadoEm=new Date().toISOString()}let item={id:uid(),clienteId:c.id,nome,tel,tipo:tipo==='fila'?'fila':tp,data,hora,servId:s.id,servNome:s.nome,profId:prof?.id||'',profNome:prof?.nome||'Qualquer',tempoMin:num(box.querySelector('.tempoAt').value)||serviceDur(s,tp)||20,valorOriginal:servicePrice(s,tp),valorFinal:Math.max(0,valor),voucher:v?.codigo||'',status:'aguardando',origem:isAdmin()?'admin':'prof',createdAt:Date.now()};if(!isAdmin()){item.profId=session.profId;item.profNome=currentProf()?.nome||'';state.pendencias.push(item);toast('Enviado para aprovação')}else state.fila.push(item);markDirty()}
function filaHTML(){return `<div class="grid g2"><div class="card"><h2>Adicionar na fila</h2>${formAtendimento('fila')}</div><div class="card"><h2>Fila de espera</h2><p class="muted">Estimativa: ${waitMin()} min</p>${lista(visibleA().filter(a=>a.tipo==='fila'&&a.status!=='concluido'))}</div></div>`}function agendaHTML(){return `<div class="grid g2"><div class="card"><h2>Novo agendamento</h2>${formAtendimento('agendamento')}</div><div class="card"><h2>Agendamentos</h2>${lista(visibleA().filter(a=>a.tipo!=='fila'&&a.status!=='concluido').sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)))}</div></div>`}
function lista(l){if(!l.length)return '<div class="muted">Nenhum atendimento.</div>';return l.map(a=>`<div class="item"><div class="item-head"><div><b>${a.nome}</b><div class="muted">${a.servNome} • ${a.profNome||'Qualquer'} • ${a.data} ${a.hora}</div><div class="row" style="margin-top:7px"><span class="badge b-${a.tipo}">${a.tipo}</span><span class="badge">${brl(a.valorFinal)}</span><span class="badge">${a.tempoMin||20} min</span></div></div><div class="row"><button class="btn blue small" onclick="editTempo('${a.id}')">Tempo</button>${a.status==='aguardando'?`<button class="btn good small" onclick="startAt('${a.id}')">Iniciar</button>`:''}<button class="btn primary small" onclick="doneAt('${a.id}')">Finalizar</button><button class="btn bad small" onclick="delAt('${a.id}')">Remover</button></div></div></div>`).join('')}function editTempo(id){let a=state.fila.find(x=>String(x.id)===id);let v=prompt('Duração em minutos',a.tempoMin||20);if(v!==null){a.tempoMin=num(v)||20;markDirty()}}function startAt(id){let a=state.fila.find(x=>String(x.id)===id);if(a){a.status='em_atendimento';markDirty()}}function doneAt(id){let i=state.fila.findIndex(x=>String(x.id)===id);if(i>=0){let a=state.fila[i];a.status='concluido';a.horaFim=nowHH();state.historico.push(a);state.fila.splice(i,1);markDirty()}}function delAt(id){if(!confirm('Remover?'))return;state.fila=state.fila.filter(x=>String(x.id)!==id);markDirty()}
function clientesHTML(){return `<div class="grid g2"><div class="card"><h2>Novo cliente</h2><div class="field"><label>Nome</label><input id="clNome"></div><div class="field"><label>Telefone</label><input id="clTel"></div><button class="btn primary" onclick="addCliente()">Salvar cliente</button></div><div class="card"><h2>Adicionar serviço ao cliente</h2>${formAtendimento('fila')}</div></div><div class="card"><h2>Clientes</h2>${state.clientes.length?`<table><tr><th>Nome</th><th>Telefone</th><th>Ações</th></tr>${state.clientes.map(c=>`<tr><td>${c.nome}</td><td>${c.telefone||''}</td><td><button class="btn small blue" onclick="editCliente('${c.id}')">Editar</button> <button class="btn small good" onclick="openWhats('${c.telefone}','Olá ${c.nome}, tudo bem?')">WhatsApp</button></td></tr>`).join('')}</table>`:'<div class="muted">Nenhum cliente.</div>'}</div>`}function addCliente(){if(!clNome.value.trim())return toast('Nome obrigatório');state.clientes.push({id:uid(),nome:clNome.value.trim(),telefone:clTel.value.trim()});markDirty()}function editCliente(id){let c=state.clientes.find(c=>String(c.id)===id);let n=prompt('Nome',c.nome);if(n!==null)c.nome=n;let t=prompt('Telefone',c.telefone||'');if(t!==null)c.telefone=t;markDirty()}
function servicosHTML(){
  return `<div class="card"><h2>Serviços e valores</h2><p class="muted">Cadastre valores diferentes para fila, agendamento normal e especial. A edição acontece direto nesta tela.</p><div class="grid g4"><div class="field"><label>Serviço</label><input id="svNome"></div><div class="field"><label>Fila R$</label><input id="svFila" type="number" value="35"></div><div class="field"><label>Agendamento R$</label><input id="svAg" type="number" value="40"></div><div class="field"><label>Horário especial R$</label><input id="svPr" type="number" value="50"></div></div><div class="grid g3"><div class="field"><label>Duração fila</label><input id="duFila" type="number" value="20"></div><div class="field"><label>Duração agenda</label><input id="duAg" type="number" value="30"></div><div class="field"><label>Duração horário especial</label><input id="duPr" type="number" value="40"></div></div><button class="btn primary" onclick="addServico()"><i class="ti ti-plus"></i>Adicionar serviço</button></div><div class="card"><h2>Lista de serviços</h2>${state.servicos.length?state.servicos.map(s=>`<div class="item"><div class="item-head"><div style="flex:1"><div class="grid g4"><div class="field"><label>Nome</label><input id="svc_nome_${s.id}" value="${String(s.nome||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Fila R$</label><input id="svc_fila_${s.id}" type="number" value="${num(s.precoFila)}"></div><div class="field"><label>Agenda R$</label><input id="svc_ag_${s.id}" type="number" value="${num(s.precoAgenda)}"></div><div class="field"><label>Horário especial R$</label><input id="svc_pr_${s.id}" type="number" value="${num(s.precoPremium)}"></div></div><div class="grid g3"><div class="field"><label>Duração fila</label><input id="svc_duf_${s.id}" type="number" value="${num(s.durFila)||20}"></div><div class="field"><label>Duração agenda</label><input id="svc_dua_${s.id}" type="number" value="${num(s.durAgenda)||30}"></div><div class="field"><label>Duração horário especial</label><input id="svc_dup_${s.id}" type="number" value="${num(s.durPremium)||40}"></div></div>${s.ativo===false?'<span class="badge b-off">desativado</span>':'<span class="badge b-ok">ativo</span>'} ${s.linkAtivo===false?'<span class="badge b-off">fora do link</span>':'<span class="badge b-ok">no link</span>'}</div><div class="row"><button class="btn small blue" onclick="saveServico('${s.id}')"><i class="ti ti-device-floppy"></i>Salvar</button><button class="btn small ${s.ativo===false?'good':'bad'}" onclick="toggleServico('${s.id}')">${s.ativo===false?'Ativar':'Desativar'}</button><button class="btn small ${s.linkAtivo===false?'good':'blue'}" onclick="toggleServicoLink('${s.id}')">${s.linkAtivo===false?'Mostrar no link':'Ocultar do link'}</button><button class="btn small bad" onclick="deleteServico('${s.id}')"><i class="ti ti-trash"></i>Excluir</button></div></div></div>`).join(''):'<div class="muted">Nenhum serviço.</div>'}</div>${pendenciasHTML()}`
}
function addServico(){let s={id:uid(),nome:svNome.value.trim(),precoFila:num(svFila.value),precoAgenda:num(svAg.value),precoPremium:num(svPr.value),durFila:num(duFila.value)||20,durAgenda:num(duAg.value)||30,durPremium:num(duPr.value)||40,ativo:true};if(!s.nome)return toast('Nome obrigatório');if(!isAdmin()){state.pendencias.push({tipo:'servico',servico:s,profId:session.profId});toast('Serviço enviado para aprovação')}else state.servicos.push(s);markDirty()}
function saveServico(id){if(!canAdmin())return;let s=state.servicos.find(s=>String(s.id)===String(id));if(!s)return;let nome=document.getElementById('svc_nome_'+id)?.value.trim();if(!nome)return toast('Nome obrigatório');Object.assign(s,{nome,precoFila:num(document.getElementById('svc_fila_'+id)?.value),precoAgenda:num(document.getElementById('svc_ag_'+id)?.value),precoPremium:num(document.getElementById('svc_pr_'+id)?.value),durFila:num(document.getElementById('svc_duf_'+id)?.value)||20,durAgenda:num(document.getElementById('svc_dua_'+id)?.value)||30,durPremium:num(document.getElementById('svc_dup_'+id)?.value)||40});markDirty();toast('Serviço salvo')}
function editServico(id){saveServico(id)}
function toggleServico(id){if(!canAdmin())return;let s=state.servicos.find(s=>String(s.id)===String(id));if(!s)return;s.ativo=s.ativo===false;markDirty()}
function deleteServico(id){if(!canAdmin())return;if(!confirm('Excluir este serviço? Histórico antigo continuará salvo pelo nome/valor do atendimento.'))return;state.servicos=state.servicos.filter(s=>String(s.id)!==String(id));markDirty()}
function profissionaisHTML(){
  return `<div class="card"><h2>Profissionais</h2><p class="muted">Edite, desative ou exclua direto no card. Desativado não aparece no link do cliente nem em novos atendimentos.</p><div class="grid g4"><div class="field"><label>Nome</label><input id="pfNome"></div><div class="field"><label>Telefone</label><input id="pfTel"></div><div class="field"><label>Comissão %</label><input id="pfCom" type="number" value="60"></div><div class="field"><label>Senha</label><input id="pfSenha" type="password" value="1234"></div></div><div class="field"><label>Foto</label><input id="pfFoto" type="file" accept="image/*"></div><button class="btn primary" onclick="addProf()"><i class="ti ti-plus"></i>Adicionar profissional</button></div><div class="card"><h2>Lista de profissionais</h2>${state.profissionais.length?state.profissionais.map(p=>`<div class="item"><div class="item-head"><div class="row">${p.foto?`<img class="prof-photo" src="${p.foto}">`:''}<div style="flex:1"><div class="grid g4"><div class="field"><label>Nome</label><input id="pf_nome_${p.id}" value="${String(p.nome||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Telefone</label><input id="pf_tel_${p.id}" value="${String(p.telefone||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Comissão %</label><input id="pf_com_${p.id}" type="number" value="${num(p.comissao)||60}"></div><div class="field"><label>Senha</label><div class="pass-wrap"><input id="pf_senha_${p.id}" type="password" value="${String(p.senha||'1234').replace(/"/g,'&quot;')}"><button class="btn small blue eye-btn" onclick="requestShowProfSenha('${p.id}')" title="Visualizar com senha admin"><i class="ti ti-eye"></i></button></div></div></div><div class="field"><label>Trocar foto</label><input id="pf_foto_${p.id}" type="file" accept="image/*"></div>${p.ativo===false?'<span class="badge b-off">desativado</span>':'<span class="badge b-ok">ativo</span>'}</div></div><div class="row"><button class="btn small blue" onclick="saveProf('${p.id}')"><i class="ti ti-device-floppy"></i>Salvar</button><button class="btn small ${p.ativo===false?'good':'bad'}" onclick="toggleProf('${p.id}')">${p.ativo===false?'Ativar':'Desativar'}</button><button class="btn small bad" onclick="deleteProf('${p.id}')"><i class="ti ti-trash"></i>Excluir</button>${p.telefone?`<button class="btn small good" onclick="openWhats('${p.telefone}','Olá ${p.nome}')">WhatsApp</button>`:''}</div></div></div>`).join(''):'<div class="muted">Nenhum profissional cadastrado.</div>'}</div><div class="card"><h2>Bloquear profissional em data</h2><div class="grid g4"><div class="field"><label>Profissional</label><select id="blProf">${state.profissionais.filter(p=>p.ativo!==false).map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="blData" type="date" value="${today()}"></div><div class="field"><label>Início</label><input id="blIni" type="time" value="08:00"></div><div class="field"><label>Fim</label><input id="blFim" type="time" value="18:00"></div></div><button class="btn primary" onclick="addBloqueio()">Bloquear</button>${state.bloqueios.map((b,i)=>`<div class="item">${state.profissionais.find(p=>String(p.id)===String(b.profId))?.nome||''} • ${b.data} ${b.ini}-${b.fim} <button class="btn small bad" onclick="state.bloqueios.splice(${i},1);markDirty()">Remover</button></div>`).join('')}</div>`
}
async function fileData(f){if(!f)return '';return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
async function addProf(){if(!pfNome.value.trim())return toast('Nome obrigatório');state.profissionais.push({id:uid(),nome:pfNome.value.trim(),telefone:pfTel.value.trim(),comissao:num(pfCom.value)||60,senha:pfSenha.value||'1234',foto:await fileData(pfFoto.files[0]),ativo:true,esp:'Barbeiro'});markDirty()}
async function saveProf(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===String(id));if(!p)return;let nome=document.getElementById('pf_nome_'+id)?.value.trim();if(!nome)return toast('Nome obrigatório');p.nome=nome;p.telefone=document.getElementById('pf_tel_'+id)?.value.trim()||'';p.comissao=num(document.getElementById('pf_com_'+id)?.value)||60;p.senha=document.getElementById('pf_senha_'+id)?.value||'1234';let foto=await fileData(document.getElementById('pf_foto_'+id)?.files?.[0]);if(foto)p.foto=foto;markDirty();toast('Profissional salvo')}
function editProf(id){saveProf(id)}
function toggleProf(id){if(!canAdmin())return;let p=state.profissionais.find(p=>String(p.id)===String(id));if(!p)return;p.ativo=!p.ativo;markDirty()}
function deleteProf(id){if(!canAdmin())return;if(!confirm('Excluir este profissional? Atendimentos antigos continuam no histórico com nome/valor já registrados.'))return;state.profissionais=state.profissionais.filter(p=>String(p.id)!==String(id));state.bloqueios=state.bloqueios.filter(b=>String(b.profId)!==String(id));markDirty()}
function addBloqueio(){if(!blProf.value)return toast('Selecione um profissional');state.bloqueios.push({profId:blProf.value,data:blData.value,ini:blIni.value,fim:blFim.value});markDirty()}
function pendenciasHTML(){if(!isAdmin()||!state.pendencias.length)return '';return `<div class="card"><h2>Aprovações pendentes</h2>${state.pendencias.map((p,i)=>`<div class="item"><b>${p.tipo==='servico'?'Serviço':'Atendimento'}</b><div class="muted">${p.servico?.nome||p.nome||''}</div><button class="btn small good" onclick="approve(${i})">Aprovar</button> <button class="btn small bad" onclick="reject(${i})">Recusar</button></div>`).join('')}</div>`}function approve(i){let p=state.pendencias[i];if(p.tipo==='servico')state.servicos.push(p.servico);else state.fila.push({...p,pendenteAdmin:false});state.pendencias.splice(i,1);markDirty()}function reject(i){state.pendencias.splice(i,1);markDirty()}
function vouchersHTML(){return `<div class="card"><h2>Vouchers</h2><div class="grid g3"><div class="field"><label>Quantidade</label><input id="vcQtd" type="number" value="1"></div><div class="field"><label>Desconto %</label><input id="vcPct" type="number" value="10"></div><div class="field"><label>Validade</label><input id="vcVal" type="date" value="${today()}"></div></div><button class="btn primary" onclick="gerarVouchers()">Gerar</button></div><div class="card"><h2>Lista</h2>${state.vouchers.map(v=>`<div class="item"><b>${v.codigo}</b> • ${v.percentual}% • validade ${v.validade} ${v.usado?'<span class="badge b-off">usado</span>':'<span class="badge b-ok">livre</span>'}<div class="row" style="margin-top:8px"><button class="btn small good" onclick="openWhats('', 'Você ganhou uma cortesia Vizzarty: use o voucher ${v.codigo} e ganhe ${v.percentual}% de desconto. Link: ${clientLink()}')">Enviar WhatsApp</button></div></div>`).join('')}</div>`}function gerarVouchers(){for(let i=0;i<(num(vcQtd.value)||1);i++)state.vouchers.push({id:uid(),codigo:'VIZ'+Math.random().toString(36).slice(2,8).toUpperCase(),percentual:num(vcPct.value)||10,validade:vcVal.value||today(),usado:false});markDirty()}
function extratoHTML(){let list=(isAdmin()?state.historico:state.historico.filter(a=>String(a.profId)===String(session.profId)));let total=list.reduce((s,a)=>s+num(a.valorFinal),0),com=list.reduce((s,a)=>{let p=state.profissionais.find(p=>String(p.id)===String(a.profId));return s+num(a.valorFinal)*(num(p?.comissao||0)/100)},0);return `<div class="statgrid"><div class="stat"><b>${list.length}</b><span>Atendimentos</span></div><div class="stat"><b>${brl(total)}</b><span>Total</span></div><div class="stat"><b>${brl(com)}</b><span>Comissão</span></div><div class="stat"><b>${brl(total-com)}</b><span>Casa</span></div></div><div class="card"><h2>Histórico</h2>${lista(list.slice().reverse())}</div>`}
function clientLink(){return location.origin+location.pathname+'?cliente=1'}function linkHTML(){return `<div class="card"><h2>Link único do cliente</h2><p class="muted">Cliente escolhe fila ou agendamento no mesmo link.</p><input value="${clientLink()}" readonly onclick="this.select()"><div class="row" style="margin-top:10px"><button class="btn primary" onclick="navigator.clipboard.writeText('${clientLink()}');toast('Copiado')">Copiar</button><button class="btn good" onclick="openWhats('', 'Agende ou entre na fila: ${clientLink()}')">Enviar WhatsApp</button></div></div>`}
function configHTML(){let h=state.horarios,c=state.config;return `<div class="grid g2"><div class="card"><h2>Dados da barbearia</h2><div class="field"><label>Nome</label><input id="cfgNome" value="${c.nome}"></div><div class="field"><label>Telefone</label><input id="cfgTel" value="${c.telefone||''}"></div><div class="field"><label>Endereço</label><input id="cfgEnd" value="${c.endereco||''}"></div><div class="field"><label>Senha admin</label><input id="cfgSenha" value="${c.adminSenha||'1234'}"></div><div class="field"><label>Logo</label><input id="cfgLogo" type="file" accept="image/*"></div><button class="btn primary" onclick="saveConfig()">Salvar</button></div><div class="card"><h2>Link do cliente</h2><p class="muted">Ative/desative o que aparece no link público.</p><div class="grid g2"><div class="field"><label>Fila no link</label><select id="linkFila"><option value="true" ${c.linkFilaAtiva!==false?'selected':''}>Ativa</option><option value="false" ${c.linkFilaAtiva===false?'selected':''}>Desativada</option></select></div><div class="field"><label>Agendamento no link</label><select id="linkAgenda"><option value="true" ${c.linkAgendaAtiva!==false?'selected':''}>Ativo</option><option value="false" ${c.linkAgendaAtiva===false?'selected':''}>Desativado</option></select></div></div><button class="btn primary" onclick="saveLinkPublico()">Salvar link público</button></div></div><div class="grid g2"><div class="card"><h2>Horários normais</h2><div class="grid g2"><div class="field"><label>Fila início</label><input id="hf1" type="time" value="${h.filaIni}"></div><div class="field"><label>Fila fim</label><input id="hf2" type="time" value="${h.filaFim}"></div><div class="field"><label>Agenda normal início</label><input id="ha1" type="time" value="${h.agendaIni}"></div><div class="field"><label>Agenda normal fim</label><input id="ha2" type="time" value="${h.agendaFim}"></div></div><button class="btn primary" onclick="saveHorarios()">Salvar horários normais</button></div><div class="card"><h2>Horários especiais</h2><p class="muted">Crie vários horários especiais com nomes diferentes. Quando estiver ativo, aparece no link do cliente e usa o valor/duração de horário especial.</p><div class="grid g3"><div class="field"><label>Nome</label><input id="heNome" placeholder="Ex: Especial feriado"></div><div class="field"><label>Início</label><input id="heIni" type="time" value="19:00"></div><div class="field"><label>Fim</label><input id="heFim" type="time" value="22:00"></div></div><button class="btn primary" onclick="addHorarioEspecial()"><i class="ti ti-plus"></i>Adicionar horário especial</button>${(state.horariosEspeciais||[]).map(x=>`<div class="item"><div class="grid g4"><div class="field"><label>Nome</label><input id="he_nome_${x.id}" value="${String(x.nome||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Início</label><input id="he_ini_${x.id}" type="time" value="${x.ini||''}"></div><div class="field"><label>Fim</label><input id="he_fim_${x.id}" type="time" value="${x.fim||''}"></div><div class="field"><label>Status</label><select id="he_ativo_${x.id}"><option value="true" ${x.ativo!==false?'selected':''}>Ativo no link</option><option value="false" ${x.ativo===false?'selected':''}>Desativado</option></select></div></div><div class="row"><button class="btn small blue" onclick="saveHorarioEspecial('${x.id}')">Salvar</button><button class="btn small ${x.ativo===false?'good':'bad'}" onclick="toggleHorarioEspecial('${x.id}')">${x.ativo===false?'Ativar':'Desativar'}</button><button class="btn small bad" onclick="deleteHorarioEspecial('${x.id}')">Excluir</button></div></div>`).join('')}</div></div><div class="card"><h2>Senhas dos profissionais</h2><p class="muted">As senhas ficam ocultas. Para visualizar, clique no olho e confirme a senha do admin.</p>${state.profissionais.length?state.profissionais.map(p=>`<div class="config-prof-pass"><div><b>${p.nome||'Sem nome'}</b><div class="muted">${p.ativo===false?'Desativado':'Ativo'} ${p.telefone?'• '+p.telefone:''}</div></div><div class="field" style="margin:0"><label>Senha</label><div class="pass-wrap"><input id="cfg_prof_senha_${p.id}" type="password" value="${String(p.senha||'1234').replace(/"/g,'&quot;')}"><button class="btn small blue eye-btn" onclick="requestShowProfSenha('${p.id}')" title="Visualizar com senha admin"><i class="ti ti-eye"></i></button></div></div><button class="btn small primary" onclick="saveProfPassFromConfig('${p.id}')">Salvar senha</button></div>`).join(''):'<div class="muted">Nenhum profissional cadastrado.</div>'}</div><div class="card"><h2>Manutenção</h2><button class="btn blue" onclick="syncNow(true)">Forçar salvar na nuvem</button> <button class="btn bad" onclick="if(confirm('Limpar dados locais?')){localStorage.removeItem('vz_state');location.reload()}">Limpar local</button></div>`}async function saveConfig(){state.config.nome=cfgNome.value;state.config.telefone=cfgTel.value;state.config.endereco=cfgEnd.value;state.config.adminSenha=cfgSenha.value||'1234';let l=await fileData(cfgLogo.files[0]);if(l)state.config.logo=l;markDirty()}function saveLinkPublico(){state.config.linkFilaAtiva=linkFila.value==='true';state.config.linkAgendaAtiva=linkAgenda.value==='true';markDirty();toast('Link público atualizado')}function saveHorarios(){Object.assign(state.horarios,{filaIni:hf1.value,filaFim:hf2.value,agendaIni:ha1.value,agendaFim:ha2.value});markDirty()}function addHorarioEspecial(){let nome=heNome.value.trim(),ini=heIni.value,fim=heFim.value;if(!nome||!ini||!fim)return toast('Preencha nome, início e fim');state.horariosEspeciais.push({id:uid(),nome,ini,fim,ativo:true});markDirty()}function saveHorarioEspecial(id){let x=state.horariosEspeciais.find(h=>String(h.id)===String(id));if(!x)return;x.nome=document.getElementById('he_nome_'+id).value.trim()||'Horário especial';x.ini=document.getElementById('he_ini_'+id).value;x.fim=document.getElementById('he_fim_'+id).value;x.ativo=document.getElementById('he_ativo_'+id).value==='true';markDirty();toast('Horário especial salvo')}function toggleHorarioEspecial(id){let x=state.horariosEspeciais.find(h=>String(h.id)===String(id));if(!x)return;x.ativo=x.ativo===false;markDirty()}function deleteHorarioEspecial(id){if(!confirm('Excluir este horário especial?'))return;state.horariosEspeciais=state.horariosEspeciais.filter(h=>String(h.id)!==String(id));markDirty()}function bindForms(){document.querySelectorAll('.selCliente').forEach(sel=>sel.onchange=()=>{let c=state.clientes.find(c=>String(c.id)===sel.value),box=sel.closest('.card');if(c&&box){box.querySelector('.nomeAt').value=c.nome;box.querySelector('.telAt').value=c.telefone||''}});document.querySelectorAll('.tipoAt,.horaAt,.servAt').forEach(el=>el.onchange=()=>updatePreview(el.closest('.card')));document.querySelectorAll('.card').forEach(updatePreview)}function updatePreview(box){if(!box)return;let s=state.servicos.find(s=>String(s.id)===box.querySelector('.servAt')?.value);let tipo=tipoPreco(box.querySelector('.tipoAt')?.value||'fila',box.querySelector('.horaAt')?.value||nowHH());let pv=box.querySelector('.pricePreview'),tm=box.querySelector('.tempoAt');if(s&&pv)pv.textContent=`Valor: ${brl(servicePrice(s,tipo))} • Duração: ${serviceDur(s,tipo)} min`;if(s&&tm&&!document.activeElement.isSameNode(tm))tm.value=serviceDur(s,tipo)||20}
function toMin(h){let [a,b]=(h||'00:00').split(':').map(Number);return a*60+b}function toHH(m){m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function addSlots(arr,ini,fim,step=15){let a=toMin(ini),b=toMin(fim);if(!ini||!fim||b<a)return arr;for(let m=a;m<=b;m+=step){let h=toHH(m);if(!arr.includes(h))arr.push(h)}return arr.sort()}function agendaSlots(){let h=state.horarios||{},slots=[];if(state.config.linkAgendaAtiva!==false)addSlots(slots,h.agendaIni,h.agendaFim,15);(state.horariosEspeciais||[]).filter(x=>x.ativo!==false).forEach(x=>addSlots(slots,x.ini,x.fim,15));return slots}function publicServiceLabel(s,mode,h=nowHH()){if(mode==='fila')return `${s.nome} — fila ${brl(s.precoFila)}`;let sp=specialInfo(h);return `${s.nome} — ${sp?sp.nome+' '+brl(s.precoPremium):'agenda '+brl(s.precoAgenda)}`}function renderClient(){document.body.classList.add('client-mode');let opts=[];if(state.config.linkFilaAtiva!==false)opts.push(`<button id="btnFila" class="btn primary" onclick="clientForm('fila')">Fila de espera</button>`);if(state.config.linkAgendaAtiva!==false)opts.push(`<button id="btnAgenda" class="btn blue" onclick="clientForm('agendamento')">Agendamento</button>`);clientWrap.innerHTML=`<div class="brand"><div class="logo">${state.config.logo?`<img src="${state.config.logo}">`:'V'}</div><b>${state.config.nome}</b><small>Escolha seu atendimento</small></div><div class="card client-choice"><div class="grid g2">${opts.join('')||'<div class="muted">Atendimento pelo link temporariamente desativado.</div>'}</div></div><div id="cf"></div>`;if(state.config.linkFilaAtiva!==false)clientForm('fila');else if(state.config.linkAgendaAtiva!==false)clientForm('agendamento')}
function clientForm(mode){let slots=agendaSlots(),h=slots.includes(nowHH())?nowHH():(slots[0]||nowHH());let filaAberta=state.config.linkFilaAtiva!==false&&inRange(nowHH(),state.horarios.filaIni,state.horarios.filaFim);let desc=mode==='fila'?(filaAberta?'Fila aberta agora • espera estimada: '+waitMin()+' min':'Fila fechada agora. Horário: '+state.horarios.filaIni+' até '+state.horarios.filaFim):'Escolha apenas horários liberados nas configurações. Horário especial aparece automaticamente quando estiver ativo.';cf.innerHTML=`<div class="client-form-grid"><div class="card"><h2>${mode==='fila'?'Entrar na fila':'Agendar horário'}</h2><p class="muted">${desc}</p><div class="field"><label>Nome</label><input id="pubNome" autocomplete="name"></div><div class="field"><label>WhatsApp</label><input id="pubTel" autocomplete="tel"></div><div class="grid g2"><div class="field"><label>Data</label><input id="pubData" type="date" value="${today()}" onchange="clientRefreshOptions('${mode}')"></div>${mode==='fila'?`<div class="field"><label>Horário</label><input value="Agora (${nowHH()})" disabled></div>`:`<div class="field"><label>Horário disponível</label><select id="pubHora" onchange="clientRefreshOptions('${mode}')">${slots.length?slots.map(x=>`<option value="${x}" ${x===h?'selected':''}>${x}${specialInfo(x)?' • '+specialInfo(x).nome:''}</option>`).join(''):'<option value="">Sem horários</option>'}</select></div>`}</div></div><div class="card"><h2>Serviço e profissional</h2><div class="field"><label>Serviço</label><select id="pubServ" onchange="clientPrice('${mode}')">${servicosLink().map(s=>`<option value="${s.id}">${publicServiceLabel(s,mode,h)}</option>`).join('')}</select><div class="muted" id="pubPrice"></div></div><div class="field"><label>Profissional</label><select id="pubProf"></select><div class="muted" id="profMsg"></div></div><div class="field"><label>Voucher</label><input id="pubVoucher" placeholder="Código se tiver"></div><button class="btn primary" style="width:100%;justify-content:center" onclick="clientAdd('${mode}')">Confirmar atendimento</button></div></div>`;clientRefreshOptions(mode)}
function clientRefreshOptions(mode){let data=pubData?.value||today(),hora=mode==='fila'?nowHH():(pubHora?.value||nowHH()),oldProf=pubProf?.value||'',oldServ=pubServ?.value||'';let servSel=document.getElementById('pubServ');if(servSel){servSel.innerHTML=servicosLink().map(s=>`<option value="${s.id}" ${String(s.id)===oldServ?'selected':''}>${publicServiceLabel(s,mode,hora)}</option>`).join('')}let list=profsDisponiveis(data,hora);if(pubProf){pubProf.innerHTML='<option value="">Qualquer profissional</option>'+list.map(p=>`<option value="${p.id}" ${String(p.id)===oldProf?'selected':''}>${p.nome}</option>`).join('')}if(profMsg)profMsg.textContent=list.length?`${list.length} profissional(is) disponível(is)`:'Nenhum profissional disponível neste horário';clientPrice(mode)}
function clientPrice(mode){let sel=document.getElementById('pubServ');if(!sel||!sel.value)return;let s=state.servicos.find(s=>String(s.id)===sel.value);if(!s)return;let hora=mode==='fila'?nowHH():(pubHora?.value||nowHH());let tp=mode==='fila'?'fila':tipoPreco('agendamento',hora),sp=specialInfo(hora);pubPrice.innerHTML=`Valor: <b>${brl(servicePrice(s,tp))}</b> • Duração: ${serviceDur(s,tp)} min ${tp==='especial'?'• '+(sp?.nome||'Horário especial'):''}`}
function clientAdd(mode){let data=pubData.value||today(),hora=mode==='fila'?nowHH():(pubHora.value||'');if(mode==='fila'&&state.config.linkFilaAtiva===false)return toast('Fila desativada no link');if(mode==='agendamento'&&state.config.linkAgendaAtiva===false)return toast('Agendamento desativado no link');if(mode==='fila'&&!inRange(nowHH(),state.horarios.filaIni,state.horarios.filaFim))return toast('Fila fora do horário de atendimento');if(mode==='agendamento'&&!hora)return toast('Escolha um horário disponível');if(mode==='agendamento'&&!agendaSlots().includes(hora))return toast('Horário indisponível');let nome=pubNome.value.trim(),tel=pubTel.value.trim();if(!nome)return toast('Informe seu nome');let disp=profsDisponiveis(data,hora);if(pubProf.value&&!disp.some(p=>String(p.id)===String(pubProf.value)))return toast('Profissional indisponível neste horário');let c=state.clientes.find(c=>tel&&c.telefone===tel);if(!c){c={id:uid(),nome,telefone:tel};state.clientes.push(c)}else{c.nome=nome;c.telefone=tel||c.telefone}let s=state.servicos.find(s=>String(s.id)===pubServ.value&&s.ativo!==false&&s.linkAtivo!==false);if(!s)return toast('Escolha um serviço disponível');let p=state.profissionais.find(p=>String(p.id)===pubProf.value),tp=mode==='fila'?'fila':tipoPreco('agendamento',hora),valor=servicePrice(s,tp),v=validVoucher((pubVoucher.value||'').trim().toUpperCase()),sp=specialInfo(hora);if(v){valor*=1-num(v.percentual)/100;v.usado=true;v.cliente=nome;v.usadoEm=new Date().toISOString()}state.fila.push({id:uid(),clienteId:c.id,nome,tel,tipo:tp,data,hora,servId:s.id,servNome:s.nome,profId:p?.id||'',profNome:p?.nome||'Qualquer',tempoMin:serviceDur(s,tp)||20,valorOriginal:servicePrice(s,tp),valorFinal:Math.max(0,valor),voucher:v?.codigo||'',especialNome:tp==='especial'?(sp?.nome||'Horário especial'):'',status:'aguardando',origem:'cliente',createdAt:Date.now()});markDirty();clientWrap.innerHTML=`<div class="card client-confirm" style="margin-top:50px;text-align:center"><h1>Confirmado ✅</h1><p>${mode==='fila'?'Você entrou na fila. Espera estimada: '+waitMin()+' min':'Seu agendamento foi enviado.'}</p><b>${brl(valor)}</b></div>`}
(async function init(){
  try{
    normalize();
    saveLocal();
    try{
      let c=await cloudGet();
      if(c&&num(c.updatedAt)>=num(state.updatedAt)){state=c;normalize();saveLocal()}
      else if(hasRealData(state)){await cloudPut()}
      syncStatus.textContent='nuvem ok';
    }catch(e){syncStatus.textContent='modo local'}
    renderLoginProfs();
    initLogo();
    if(isClient()){renderClient();return}
    if(session){loginBox.classList.add('hidden');app.classList.remove('hidden');renderAll()}
    else{loginBox.classList.remove('hidden');app.classList.add('hidden')}
  }catch(e){
    document.body.innerHTML='<div class="card login"><h2>Erro ao abrir sistema</h2><p class="muted">Atualize a página ou limpe o cache. Detalhe: '+String(e.message||e)+'</p></div>';
  }
})();
</script>
