  /* ── HTML da tabela de planos/clube ── */
  function tabelaPlanosHTML(planosF, admin){
    if(!planosF.length){
      return '<div class="card"><h2>Planos &amp; Clube</h2><p class="muted">Nenhum plano/clube vendido no período.</p></div>';
    }
    var rows=planosF.slice().reverse().map(function(h){
      var tipoLabel=String(h.tipo||'').toLowerCase();
      if(tipoLabel==='renovacao'||tipoLabel==='renovacao_rapida') tipoLabel='Renovação';
      else if(tipoLabel==='fechamento') tipoLabel='Venda';
      else tipoLabel=String(h.tipo||'Plano');
      return '<tr><td>'+esc(fmtData(itemData(h)))+'</td><td>'+esc(h.hora||'')+'</td>'+
        '<td>'+esc(h.clienteNome||'—')+'</td>'+
        '<td>'+esc(h.planoNome||'Plano/Clube')+'</td>'+
        '<td>'+esc(tipoLabel)+'</td>'+
        (admin?'<td>'+esc(itemProfNome(h)||'—')+'</td>':'')+
        '<td>'+money(valorPlano(h))+'</td></tr>';
    }).join('');
    var heads=admin
      ? ['Data','Hora','Cliente','Plano','Tipo','Profissional','Valor']
      : ['Data','Hora','Cliente','Plano','Tipo','Valor'];
    return '<div class="card"><h2>Planos &amp; Clube ('+planosF.length+')</h2>'+
      '<div style="overflow:auto"><table style="min-width:640px"><tr>'+
      heads.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>'+rows+'</table></div></div>';
  }

  /* ── resumo por profissional (apenas admin) ── */
  function resumoProfHTML(histF, vendasF, planosF){
    if(!isAdm()) return '';
    var mapa={};
    function get(item){
      var id=itemProfId(item), nome=itemProfNome(item)||'Sem profissional';
      var k=id||('nome:'+norm(nome));
      if(!mapa[k]) mapa[k]={nome:nome,atend:0,vendas:0,planos:0,faturamento:0,comissao:0};
      return mapa[k];
    }
    histF.forEach(function(a){ var e=get(a); e.atend++; e.faturamento+=valorAt(a); e.comissao+=comissaoAt(a); });
    vendasF.forEach(function(v){ var e=get(v); e.vendas++; e.faturamento+=valorVenda(v); e.comissao+=comissaoVenda(v); });
    planosF.forEach(function(h){ var e=get(h); e.planos++; e.faturamento+=valorPlano(h); });
    var rows=Object.keys(mapa).map(function(k){return mapa[k];})
      .sort(function(a,b){return b.faturamento-a.faturamento;})
      .map(function(e){
        return '<tr><td>'+esc(e.nome)+'</td><td>'+e.atend+'</td><td>'+e.vendas+'</td><td>'+e.planos+'</td>'+
          '<td>'+money(e.faturamento)+'</td><td>'+money(e.comissao)+'</td><td>'+money(e.faturamento-e.comissao)+'</td></tr>';
      }).join('');
    if(!rows) return '';
    return '<div class="card"><h2>Resumo por profissional</h2>'+
      '<div style="overflow:auto"><table style="min-width:720px"><tr>'+
      '<th>Profissional</th><th>Atend.</th><th>Produtos</th><th>Planos</th><th>Faturamento</th><th>Comissão</th><th>Casa</th>'+
      '</tr>'+rows+'</table></div></div>';
  }

  /* ── função principal que gera o HTML do extrato ── */
  function extratoV90HTML(){
    var admin=isAdm();

    /* Proteção de senha (mantém compatibilidade com V56/V60) */
    var bloqueado=false;
    try{
      if(admin){
        bloqueado = !(window.vzSecure&&window.vzSecure.extrato) && !sessionStorage.getItem('vz_extrato_ok');
      }
    }catch(e){}
    if(bloqueado){
      try{
        if(typeof vzBloqueioExtratoHTML==='function') return vzBloqueioExtratoHTML();
      }catch(e){}
      return '<div class="card vz-lock-card"><div class="lock-icon"><i class="ti ti-lock"></i></div>'+
        '<h2>Extrato protegido</h2><p class="muted">Acesso restrito ao administrador.</p>'+
        '<button class="btn primary" onclick="vzAbrirSenhaBonita&&vzAbrirSenhaBonita(\'extrato\')"><i class="ti ti-lock-open"></i> Abrir extrato</button></div>';
    }

    /* Coleta e filtra */
    var tudo=coletarTudo();
    var histF=tudo.hist.filter(filtrarItem);
    var vendasF=tudo.vendas.filter(filtrarItem);
    var planosF=tudo.planos.filter(filtrarItem);

    var totais=calcTotais(histF, vendasF, planosF);
    var nada=(histF.length+vendasF.length+planosF.length)===0;

    var html=filtroBarHTML();
    html+=statsHTML(totais, admin);
    if(nada){
      html+='<div class="card" style="text-align:center;padding:28px"><span class="muted" style="font-size:14px"><i class="ti ti-mood-empty"></i> Nenhum lançamento encontrado para este período.</span></div>';
    } else {
      html+=resumoProfHTML(histF,vendasF,planosF);
      html+=tabelaAtHTML(histF, admin);
      html+=tabelaVendasHTML(vendasF, admin);
      html+=tabelaPlanosHTML(planosF, admin);
    }
    return html;
  }

  /* ── ações globais ── */
  window.vz90SetPeriodo=function(p){
    window.vz90F.periodo=p;
    if(p==='custom'){
      var today=todayStr();
      if(!window.vz90F.dataIni) window.vz90F.dataIni=today;
      if(!window.vz90F.dataFim) window.vz90F.dataFim=today;
    }
    try{ if(typeof renderAll==='function') renderAll(); }catch(e){}
  };
  window.vz90Aplicar=function(){
    var bar=document.getElementById('vz90FilterBar');
    if(bar){
      var inputs=bar.querySelectorAll('input[type=date]');
      if(inputs[0]) window.vz90F.dataIni=inputs[0].value;
      if(inputs[1]) window.vz90F.dataFim=inputs[1].value;
    }
    try{ if(typeof renderAll==='function') renderAll(); }catch(e){}
  };

  /* ── substitui a função extratoHTML ── */
  window.extratoHTML = extratoV90HTML;
  try{ extratoHTML = extratoV90HTML; }catch(e){}

  /* estilo adicional */
  (function(){
    if(document.getElementById('vz90Style')) return;
    var s=document.createElement('style');
    s.id='vz90Style';
    s.textContent=
      '#vz90FilterBar .btn{font-size:12px}'+
      '.vz90-none{text-align:center;padding:24px;color:var(--mut)}'+
      '@media(max-width:760px){#vz90FilterBar .row{gap:4px}#vz90FilterBar .btn.small{padding:6px 8px;font-size:11px}}';
    document.head.appendChild(s);
  })();

  try{
    if(window.session && typeof renderAll==='function' && document.getElementById('pages')) renderAll();
    console.log('V90: Central de Extrato & Relatórios carregada.');
  }catch(e){ console.error('V90 erro:',e); }
})();
</script>

<script id="vz91-audit-fixes">
/* ===== V91: Correções de auditoria — isolamento, integridade e comissões ===== */
(function(){
  var FLAG='vizzarty_v91_audit_fixes_v1';
  if(window[FLAG]) return;
  window[FLAG]=true;

  function n(v){ try{return (typeof num==="function")?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function isAdm(){ try{return typeof isAdmin==="function"&&isAdmin();}catch(e){return false;} }
  function myProfId(){ try{var s=window.session||(typeof session!=="undefined"?session:null);return String(s&&s.profId||"").trim();}catch(e){return "";} }

  /* CORREÇÃO 1: doneAt — proteção contra dupla finalização */
  var baseDoneAt91=window.doneAt||(typeof doneAt==="function"?doneAt:null);
  if(typeof baseDoneAt91==="function"){
    window.doneAt=function(id){
      try{
        var jaNoHistorico=(state.historico||[]).some(function(h){return String(h.id)===String(id);});
        if(jaNoHistorico){try{if(typeof toast==="function")toast("Este atendimento já foi finalizado.");}catch(e){}return;}
      }catch(e){}
      return baseDoneAt91.apply(this,arguments);
    };
    try{doneAt=window.doneAt;}catch(e){}
  }

  /* CORREÇÃO 2: normalize — deduplicar historico e vendasProdutos por id */
  var baseNorm91=window.normalize||(typeof normalize==="function"?normalize:null);
  if(typeof baseNorm91==="function"){
    window.normalize=function(){
      var r=baseNorm91.apply(this,arguments);
      try{
        var vistos={};
        state.historico=(state.historico||[]).filter(function(a){
          if(!a.id||vistos[String(a.id)])return false;
          vistos[String(a.id)]=true;
          return true;
        });
        var vistosV={};
        state.vendasProdutos=(state.vendasProdutos||[]).filter(function(v){
          if(!v.id||vistosV[String(v.id)])return false;
          vistosV[String(v.id)]=true;
          return true;
        });
      }catch(e){console.error("V91 normalize dedup erro:",e);}
      return r;
    };
    try{normalize=window.normalize;}catch(e){}
  }

  /* CORREÇÃO 3: registrarVendaProduto — garantir profId do logado quando não é admin */
  var baseRegVenda91=window.registrarVendaProduto||(typeof registrarVendaProduto==="function"?registrarVendaProduto:null);
  if(typeof baseRegVenda91==="function"){
    window.registrarVendaProduto=function(){
      var antes=(state.vendasProdutos||[]).length;
      var r=baseRegVenda91.apply(this,arguments);
      if(!isAdm()){
        var pid=myProfId();
        if(pid&&(state.vendasProdutos||[]).length>antes){
          var v=state.vendasProdutos[state.vendasProdutos.length-1];
          if(v&&!v.profId)v.profId=pid;
        }
      }
      return r;
    };
    try{registrarVendaProduto=window.registrarVendaProduto;}catch(e){}
  }

  /* CORREÇÃO 4: addAt do profissional — garantir profId no item pendente */
  var baseAddAt91=window.addAt||(typeof addAt==="function"?addAt:null);
  if(typeof baseAddAt91==="function"){
    window.addAt=function(btn){
      var result=baseAddAt91.apply(this,arguments);
      if(!isAdm()){
        var pid=myProfId();
        if(pid){
          try{
            var pends=state.pendencias||[];
            if(pends.length){var last=pends[pends.length-1];if(!last.profId)last.profId=pid;}
          }catch(e){}
        }
      }
      return result;
    };
    try{addAt=window.addAt;}catch(e){}
  }

  try{
    if(window.session&&typeof normalize==="function")normalize();
    console.log("V91: correções de auditoria aplicadas (anti-dupla, dedup, profId garantido).");
  }catch(e){console.error("V91 erro:",e);}
})();
</script>


<script id="vz92-extrato-exclusao">
/* ===== V92: Exclusão de lançamentos diretamente no Extrato =====
   Adiciona botão Excluir nas tabelas de Serviços, Produtos e Planos/Clube.
   Usa modal próprio (sem confirm() nativo — compatível com Android).
   Ao excluir plano/clube: remove creditHistory, recalcula saldo da conta e registra auditoria.
*/
(function(){
  var FLAG='vizzarty_v92_extrato_exclusao_v1';
  if(window[FLAG]) return;
  window[FLAG]=true;

  /* ── helpers ── */
  function n(v){ try{return (typeof num==='function')?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function isAdm(){ try{return typeof isAdmin==='function'&&isAdmin();}catch(e){return false;} }
  function salvar(msg){
    try{
      if(typeof markDirty==='function') markDirty();
      if(typeof save==='function') save();
      if(typeof renderAll==='function') renderAll();
      if(typeof toast==='function') toast(msg||'Lançamento removido.');
    }catch(e){ console.error('V92 salvar erro:',e); }
  }
  function registrarAuditoria(tipo, item){
    try{
      if(!Array.isArray(state.exclusoesCorrigidas)) state.exclusoesCorrigidas=[];
      var admin='';
      try{admin=window.session&&window.session.nome?window.session.nome:'Admin';}catch(e){}
      state.exclusoesCorrigidas.push({
        data: (typeof today==='function'?today():new Date().toISOString().slice(0,10)),
        hora: (typeof nowHH==='function'?nowHH():new Date().toTimeString().slice(0,5)),
        tipo: tipo,
        item: item,
        admin: admin
      });
    }catch(e){ console.error('V92 auditoria erro:',e); }
  }

  /* ── modal de confirmação ── */
  function vzConfirmarModal(titulo, linhas, onConfirm){
    var existing=document.getElementById('vz92ModalExclusao');
    if(existing) existing.remove();

    var linhasHtml=linhas.map(function(l){
      return '<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--bdr,#eee)">'+
        '<span style="color:var(--mut,#888);min-width:90px;font-size:12px">'+esc(l[0])+'</span>'+
        '<span style="font-size:13px;font-weight:500">'+esc(l[1])+'</span></div>';
    }).join('');

    var div=document.createElement('div');
    div.id='vz92ModalExclusao';
    div.innerHTML=
      '<div onclick="document.getElementById(\'vz92ModalExclusao\').remove()" '+
        'style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px">'+
        '<div onclick="event.stopPropagation()" '+
          'style="background:var(--card,#fff);border-radius:12px;padding:20px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.25)">'+
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'+
            '<i class="ti ti-trash" style="font-size:20px;color:#e74c3c"></i>'+
            '<h3 style="margin:0;font-size:16px">'+esc(titulo)+'</h3>'+
          '</div>'+
          '<div style="margin-bottom:14px">'+linhasHtml+'</div>'+
          '<p style="font-size:12px;color:var(--mut,#888);margin:0 0 16px">Esta ação remove o lançamento do extrato e recalcula comissões/saldos.</p>'+
          '<div style="display:flex;gap:8px;justify-content:flex-end">'+
            '<button class="btn" onclick="document.getElementById(\'vz92ModalExclusao\').remove()" style="min-width:90px">Cancelar</button>'+
            '<button class="btn bad" id="vz92BtnConfirmarExclusao" style="min-width:90px"><i class="ti ti-trash"></i> Excluir</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);
    document.getElementById('vz92BtnConfirmarExclusao').onclick=function(){
      div.remove();
      try{ onConfirm(); }catch(e){ console.error('V92 onConfirm erro:',e); }
    };
  }

  /* ══════════════════════════════════════════
     EXCLUSÃO 1: Serviço finalizado (historico)
  ══════════════════════════════════════════ */
  window.v92ExcluirServico=function(id){
    if(!isAdm()){ try{toast('Somente admin.');}catch(e){}return; }
    id=String(id||'');
    var a=(state.historico||[]).find(function(x){return String(x.id)===id;});
    if(!a){ try{toast('Lançamento não encontrado.');}catch(e){}return; }
    vzConfirmarModal('Excluir serviço do extrato',[
      ['Cliente', a.nome||a.clienteNome||'—'],
      ['Serviço', a.servNome||'—'],
      ['Profissional', a.profNome||'—'],
      ['Data', a.data||'—'],
      ['Valor', (typeof brl==='function'?brl(n(a.valorFinal)):('R$ '+n(a.valorFinal).toFixed(2)))]
    ],function(){
      registrarAuditoria('servico_extrato', a);
      state.historico=(state.historico||[]).filter(function(x){return String(x.id)!==id;});
      /* se consumiu crédito clube: devolver */
      if(a.pagamentoCredito && a.creditAccountId){
        var acc=(state.creditAccounts||[]).find(function(c){return String(c.id)===String(a.creditAccountId);});
        if(acc){
          acc.saldo=n(acc.saldo)+n(a.creditosConsumidos||1);
          /* remover o uso correspondente do creditHistory */
          state.creditHistory=(state.creditHistory||[]).filter(function(h){
            return !(h.tipo==='uso' && String(h.id)===id);
          });
        }
      }
      salvar('Serviço removido. Comissão recalculada.');
    });
  };

  /* ══════════════════════════════════════════
     EXCLUSÃO 2: Produto/benefício (vendasProdutos)
  ══════════════════════════════════════════ */
  window.v92ExcluirProduto=function(id){
    if(!isAdm()){ try{toast('Somente admin.');}catch(e){}return; }
    id=String(id||'');
    var v=(state.vendasProdutos||[]).find(function(x){return String(x.id)===id;});
    if(!v){ try{toast('Lançamento não encontrado.');}catch(e){}return; }
    vzConfirmarModal('Excluir produto/benefício do extrato',[
      ['Item', v.produtoNome||v.nome||'—'],
      ['Qtd', String(v.qtd||1)],
      ['Vendedor', v.profNome||'—'],
      ['Data', v.data||'—'],
      ['Total', (typeof brl==='function'?brl(n(v.total)):('R$ '+n(v.total).toFixed(2)))]
    ],function(){
      registrarAuditoria('produto_extrato', v);
      /* devolver estoque se não for sindicato */
      var ehSind=!!(v.sindicato===true||v.beneficioUsado===true||String(v.tipoVenda||'').toLowerCase()==='sindicato');
      if(!ehSind){
        var prod=(state.produtos||[]).find(function(p){return String(p.id)===String(v.produtoId);});
        if(prod) prod.estoque=n(prod.estoque)+n(v.qtd||1);
      }
      state.vendasProdutos=(state.vendasProdutos||[]).filter(function(x){return String(x.id)!==id;});
      salvar('Produto removido. Estoque e comissão recalculados.');
    });
  };

  /* ══════════════════════════════════════════
     EXCLUSÃO 3: Plano/Clube (creditHistory)
  ══════════════════════════════════════════ */
  window.v92ExcluirPlano=function(id){
    if(!isAdm()){ try{toast('Somente admin.');}catch(e){}return; }
    id=String(id||'');
    var h=(state.creditHistory||[]).find(function(x){return String(x.id)===id;});
    if(!h){ try{toast('Lançamento não encontrado.');}catch(e){}return; }
    var tipoLabel=String(h.tipo||'').toLowerCase();
    if(tipoLabel==='renovacao'||tipoLabel==='renovacao_rapida') tipoLabel='Renovação';
    else if(tipoLabel==='fechamento') tipoLabel='Venda';
    else tipoLabel=String(h.tipo||'Plano');
    vzConfirmarModal('Excluir plano/clube do extrato',[
      ['Cliente', h.clienteNome||'—'],
      ['Plano', h.planoNome||'—'],
      ['Tipo', tipoLabel],
      ['Data', h.data||'—'],
      ['Valor', (typeof brl==='function'?brl(n(h.valorTotal)):('R$ '+n(h.valorTotal).toFixed(2)))]
    ],function(){
      registrarAuditoria('plano_extrato', h);
      /* remover do creditHistory */
      state.creditHistory=(state.creditHistory||[]).filter(function(x){return String(x.id)!==id;});
      /* reverter créditos na conta do cliente */
      var acc=(state.creditAccounts||[]).find(function(c){return String(c.id)===String(h.accountId);});
      if(acc){
        var creditos=n(h.creditos||0);
        if(creditos>0){
          acc.saldo=Math.max(0,n(acc.saldo)-creditos);
          /* remover das renovacoes também se existir */
          if(Array.isArray(acc.renovacoes)){
            acc.renovacoes=acc.renovacoes.filter(function(r){return String(r.id)!==id;});
          }
        }
      }
      /* remover do creditRenewals se existir */
      if(Array.isArray(state.creditRenewals)){
        state.creditRenewals=state.creditRenewals.filter(function(r){return String(r.id)!==id;});
      }
      salvar('Plano removido. Saldo do cliente recalculado.');
    });
  };

  /* ══════════════════════════════════════════
     Patch nas tabelas do V90
  ══════════════════════════════════════════ */
  var _baseExtratoV90=window.extratoHTML||(typeof extratoHTML==='function'?extratoHTML:null);
  if(typeof _baseExtratoV90!=='function'){ console.warn('V92: extratoHTML não encontrado.'); return; }

  /* Aguarda V90 estar pronto (pode ser sobrescrito por módulos anteriores) */
  function patchTabelas(){
    var baseHTML=window.extratoHTML;
    window.extratoHTML=function(){
      var html=baseHTML.call(this);
      if(!isAdm()) return html;

      /* ── patch tabela Serviços ── */
      html=html.replace(
        /(<th>Comissão<\/th><\/tr>)([\s\S]*?)(<\/table><\/div><\/div>)/,
        function(match, thead, tbody, tfoot){
          var newThead=thead.replace('<th>Comissão</th></tr>','<th>Comissão</th><th></th></tr>');
          var newTbody=tbody.replace(/<\/tr>/g, function(tr, offset){
            /* injeta td com botão antes de cada </tr> */
            return '</tr>';
          });
          /* abordagem mais robusta: adicionar coluna via replace de cada <tr> de dados */
          newTbody=tbody.replace(/<tr><td>/g,'<tr v92at><td>');
          /* não dá pra parsear ID do HTML gerado facilmente, então usamos outra abordagem abaixo */
          return match; /* fallback — a abordagem de patch inline é mais confiável */
        }
      );

      /* Abordagem confiável: adicionar seção de exclusão separada abaixo das tabelas */
      var adminHtml=v92CorrecaoExtratoHTML();
      return html+adminHtml;
    };
    try{ extratoHTML=window.extratoHTML; }catch(e){}
  }

  /* Seção de correções separada no extrato */
  function v92CorrecaoExtratoHTML(){
    if(!isAdm()) return '';

    var hist=(state.historico||[]).slice().reverse();
    var vendas=(state.vendasProdutos||[]).slice().reverse();
    var planos=(state.creditHistory||[]).filter(function(h){
      var t=String(h.tipo||'').toLowerCase();
      return t==='fechamento'||t==='renovacao'||t==='renovacao_rapida';
    }).slice().reverse();

    function money(v){ return typeof brl==='function'?brl(n(v)):('R$ '+n(v).toFixed(2).replace('.',',')); }

    var rowsH=hist.length?hist.map(function(a){
      return '<tr><td>'+esc(a.data||'')+'</td><td>'+esc(a.nome||a.clienteNome||'')+'</td>'+
        '<td>'+esc(a.servNome||'')+'</td><td>'+esc(a.profNome||'')+'</td>'+
        '<td>'+money(a.valorFinal||0)+'</td>'+
        '<td><button class="btn small bad" onclick="v92ExcluirServico(\''+esc(a.id)+'\')">'+
          '<i class="ti ti-trash"></i> Excluir</button></td></tr>';
    }).join(''):'<tr><td colspan="6" class="muted">Nenhum serviço.</td></tr>';

    var rowsV=vendas.length?vendas.map(function(v){
      return '<tr><td>'+esc(v.data||'')+'</td><td>'+esc(v.produtoNome||v.nome||'Produto')+'</td>'+
        '<td>'+n(v.qtd||1)+'</td><td>'+esc(v.profNome||'')+'</td>'+
        '<td>'+money(v.total||0)+'</td>'+
        '<td><button class="btn small bad" onclick="v92ExcluirProduto(\''+esc(v.id)+'\')">'+
          '<i class="ti ti-trash"></i> Excluir</button></td></tr>';
    }).join(''):'<tr><td colspan="6" class="muted">Nenhum produto/benefício.</td></tr>';

    var rowsP=planos.length?planos.map(function(h){
      var tipoLabel=String(h.tipo||'').toLowerCase();
      if(tipoLabel==='renovacao'||tipoLabel==='renovacao_rapida') tipoLabel='Renovação';
      else if(tipoLabel==='fechamento') tipoLabel='Venda';
      return '<tr><td>'+esc(h.data||'')+'</td><td>'+esc(h.clienteNome||'')+'</td>'+
        '<td>'+esc(h.planoNome||'')+'</td><td>'+esc(tipoLabel)+'</td>'+
        '<td>'+money(h.valorTotal||0)+'</td>'+
        '<td><button class="btn small bad" onclick="v92ExcluirPlano(\''+esc(h.id)+'\')">'+
          '<i class="ti ti-trash"></i> Excluir</button></td></tr>';
    }).join(''):'<tr><td colspan="6" class="muted">Nenhum plano/clube.</td></tr>';

    var exc=(state.exclusoesCorrigidas||[]).slice().reverse().slice(0,15);
    var rowsE=exc.length?exc.map(function(e){
      return '<tr><td>'+esc((e.data||'')+' '+(e.hora||''))+'</td><td>'+esc(e.tipo||'')+'</td>'+
        '<td>'+esc((e.item&&(e.item.servNome||e.item.produtoNome||e.item.planoNome||e.item.nome))||'')+'</td>'+
        '<td>'+esc(e.admin||'')+'</td></tr>';
    }).join(''):'<tr><td colspan="4" class="muted">Nenhuma exclusão registrada.</td></tr>';

    return '<div class="card" style="margin-top:16px">'+
      '<h2 style="color:#e74c3c"><i class="ti ti-trash" style="margin-right:6px"></i>Corrigir lançamento errado</h2>'+
      '<p class="muted" style="font-size:13px;margin-bottom:16px">Remove o lançamento do extrato e recalcula comissões, estoque e saldo de créditos automaticamente.</p>'+

      '<h3 style="font-size:14px;margin:0 0 8px">Serviços finalizados</h3>'+
      '<div style="overflow:auto"><table style="min-width:640px"><tr>'+
        '<th>Data</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Valor</th><th></th>'+
      '</tr>'+rowsH+'</table></div>'+

      '<h3 style="font-size:14px;margin:18px 0 8px">Produtos / Benefícios</h3>'+
      '<div style="overflow:auto"><table style="min-width:620px"><tr>'+
        '<th>Data</th><th>Item</th><th>Qtd</th><th>Vendedor</th><th>Total</th><th></th>'+
      '</tr>'+rowsV+'</table></div>'+

      '<h3 style="font-size:14px;margin:18px 0 8px">Planos &amp; Clube de Créditos</h3>'+
      '<div style="overflow:auto"><table style="min-width:600px"><tr>'+
        '<th>Data</th><th>Cliente</th><th>Plano</th><th>Tipo</th><th>Valor</th><th></th>'+
      '</tr>'+rowsP+'</table></div>'+

      '<h3 style="font-size:14px;margin:18px 0 8px">Histórico de exclusões</h3>'+
      '<div style="overflow:auto"><table style="min-width:480px"><tr>'+
        '<th>Quando</th><th>Tipo</th><th>Item</th><th>Admin</th>'+
      '</tr>'+rowsE+'</table></div>'+
    '</div>';
  }

  /* expor para uso externo se necessário */
  window.v92CorrecaoExtratoHTML=v92CorrecaoExtratoHTML;

  patchTabelas();

  try{
    if(window.session&&typeof renderAll==='function'&&document.getElementById('pages')) renderAll();
    console.log('V92: exclusão de lançamentos no extrato carregada.');
  }catch(e){ console.error('V92 erro:',e); }
})();
</script>


<script id="vz93-pendentes-no-extrato-profissional">
/* ===== V93: pendências do profissional visíveis no extrato até o admin aprovar ===== */
(function(){
  var FLAG='vizzarty_v93_pendentes_extrato_profissional';
  if(window[FLAG]) return;
  window[FLAG]=true;

  function n(v){ try{return typeof num==='function'?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function money(v){ try{return typeof brl==='function'?brl(n(v)):('R$ '+n(v).toFixed(2).replace('.',','));}catch(e){return 'R$ '+n(v).toFixed(2).replace('.',',');} }
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function isAdm(){ try{return typeof isAdmin==='function'&&isAdmin();}catch(e){return false;} }
  function meuProfId(){ try{return (window.session||session||{}).profId||'';}catch(e){return '';} }

  /* Retorna pendências do profissional logado, de todos os tipos relevantes */
  function minhasPendencias(){
    var pid=meuProfId();
    if(!pid) return [];
    return (state.pendencias||[]).filter(function(p){
      return String(p.profId)===String(pid);
    });
  }

  /* Tipos de pendência e como calcular comissão de cada um */
  function comissaoPendencia(p){
    if(p.tipo==='venda_produto'){
      var v=p.venda||{};
      return n(v.comissaoValor!=null?v.comissaoValor:n(v.total)*n(v.comissaoPct)/100);
    }
    if(p.tipo==='produto'){
      return 0; /* cadastro de produto, sem comissão direta */
    }
    if(p.tipo==='servico'){
      return 0; /* cadastro de serviço, sem comissão direta */
    }
    /* atendimento / fila */
    var prof=(state.profissionais||[]).find(function(x){return String(x.id)===String(p.profId);});
    var pct=n(p.comissaoPctAtendimento!=null?p.comissaoPctAtendimento:(prof?.comissao||0));
    return n(p.valorFinal)*pct/100;
  }

  function tituloPendencia(p){
    if(p.tipo==='venda_produto') return '<i class="ti ti-shopping-cart"></i> '+esc(p.venda?.produtoNome||p.resumo||'Venda de produto');
    if(p.tipo==='produto')       return '<i class="ti ti-box"></i> '+esc(p.produto?.nome||p.resumo||'Novo produto');
    if(p.tipo==='servico')       return '<i class="ti ti-scissors"></i> '+esc(p.servico?.nome||p.resumo||'Novo serviço');
    /* atendimento (vai para fila após aprovação) */
    return '<i class="ti ti-clock"></i> '+esc(p.servNome||p.nome||'Atendimento');
  }

  function detalhePendencia(p){
    if(p.tipo==='venda_produto'){
      var v=p.venda||{};
      return (v.clienteNome?'Cliente: '+esc(v.clienteNome)+' • ':'')+'Qtd: '+(v.qtd||1)+' • Total: '+money(v.total)+' • Comissão: '+money(n(v.comissaoValor))+(v.data?' • '+esc(v.data):'');
    }
    if(p.tipo==='produto'){
      var pd=p.produto||{};
      return 'Preço: '+money(pd.preco)+' • Estoque: '+(pd.estoque||0)+' • Comissão: '+(pd.comissaoPct||0)+'%';
    }
    if(p.tipo==='servico'){
      var s=p.servico||{};
      return 'Fila: '+money(s.precoFila)+' • Agenda: '+money(s.precoAgenda)+' • Especial: '+money(s.precoPremium);
    }
    /* atendimento */
    return (p.nome?'Cliente: '+esc(p.nome)+' • ':'')+esc(p.tipo||'')+(p.data?' • '+esc(p.data):'')+(p.hora?' '+esc(p.hora):'')+' • Valor: '+money(p.valorFinal)+' • Comissão aprox.: '+money(comissaoPendencia(p));
  }

  /* Gera o card de pendências para o profissional logado */
  function cardPendentesHTML(){
    var lista=minhasPendencias();
    if(!lista.length) return '';
    var totalCom=lista.reduce(function(s,p){ return s+comissaoPendencia(p); },0);
    var rows=lista.map(function(p){
      return '<div class="item" style="border-left:3px solid var(--amber,#e8a800);padding-left:10px">'+
        '<div class="item-head">'+
          '<div>'+
            '<span class="badge b-fila" style="background:#252535;color:#e8a800;border-color:#3a3a50"><i class="ti ti-hourglass"></i> Aguardando aprovação</span> '+
            '<b>'+tituloPendencia(p)+'</b>'+
            '<div class="muted" style="font-size:12px;margin-top:3px">'+detalhePendencia(p)+'</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div class="card" style="border-color:rgba(45,179,106,.4);background:linear-gradient(180deg,#edf8f1,#f5f7f2)">'+
      '<h2 style="color:#e8a800;display:flex;align-items:center;gap:8px">'+
        '<i class="ti ti-hourglass" style="font-size:20px"></i> Meus lançamentos pendentes ('+lista.length+')'+
      '</h2>'+
      '<p class="muted" style="font-size:12px;margin:-4px 0 12px">Esses itens já foram enviados. Quando o admin aprovar, entram automaticamente no seu extrato.</p>'+
      (totalCom>0?'<div class="statgrid" style="margin-bottom:12px"><div class="stat"><b>'+lista.length+'</b><span>Aguardando</span></div><div class="stat"><b>'+money(totalCom)+'</b><span>Comissão potencial</span></div></div>':'')+
      rows+
    '</div>';
  }

  /* ── 1. Injeta no extrato do profissional (wrap extratoHTML) ── */
  var _baseExtratoV93=window.extratoHTML||(typeof extratoHTML==='function'?extratoHTML:null);
  if(typeof _baseExtratoV93==='function'){
    window.extratoHTML=function(){
      var html=_baseExtratoV93.apply(this,arguments);
      if(isAdm()) return html; /* admin não precisa */
      return cardPendentesHTML()+html;
    };
    try{ extratoHTML=window.extratoHTML; }catch(e){}
  }

  /* ── 2. Injeta também no painel do profissional (wrap painelHTML) ── */
  var _basePainelV93=window.painelHTML||(typeof painelHTML==='function'?painelHTML:null);
  if(typeof _basePainelV93==='function'){
    window.painelHTML=function(){
      var html=_basePainelV93.apply(this,arguments);
      if(isAdm()) return html;
      var card=cardPendentesHTML();
      if(!card) return html;
      /* insere antes do primeiro <div class="grid g2"> para aparecer no topo do painel */
      var pos=html.indexOf('<div class="grid g2">');
      if(pos<0) return card+html;
      return html.slice(0,pos)+card+html.slice(pos);
    };
    try{ painelHTML=window.painelHTML; }catch(e){}
  }

  /* ── 3. Badge no nav "Minha comissão" com contagem de pendentes ── */
  var _baseNavV93=window.navItems||(typeof navItems==='function'?navItems:null);
  if(typeof _baseNavV93==='function'){
    window.navItems=function(){
      var items=_baseNavV93.apply(this,arguments);
      try{
        if(!isAdm()){
          var qtd=minhasPendencias().length;
          if(qtd>0){
            items=items.map(function(x){
              if(x[0]==='extrato') return [x[0],x[1],x[2],qtd];
              return x;
            });
          }
        }
      }catch(e){}
      return items;
    };
    try{ navItems=window.navItems; }catch(e){}
  }

  try{
    if(window.session && typeof renderAll==='function' && document.getElementById('pages')) renderAll();
    console.log('V93: pendentes do profissional visíveis no extrato carregado.');
  }catch(e){ console.error('V93 erro:',e); }
})();
</script>


<script id="vz95-custos-operacionais">
/* ===== V95: Custos Operacionais no painel do admin ===== */
(function(){
  var FLAG='vizzarty_v95_custos_operacionais';
  if(window[FLAG]) return;
  window[FLAG]=true;

  /* ── Utilitários ── */
  function n(v){ try{return typeof num==='function'?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function money(v){ try{return typeof brl==='function'?brl(n(v)):('R$ '+n(v).toFixed(2).replace('.',','));}catch(e){return 'R$ '+n(v).toFixed(2).replace('.',',');} }
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function isAdm(){ try{return typeof isAdmin==='function'&&isAdmin();}catch(e){return false;} }
  function save95(){ try{if(typeof markDirty==='function')markDirty();}catch(e){} }
  function toast95(m){ try{if(typeof toast==='function')toast(m);}catch(e){} }
  function uid95(){ try{return typeof uid==='function'?uid():Date.now().toString(36)+Math.random().toString(36).slice(2);}catch(e){return Date.now().toString(36);} }
  function mesAtual(){ return new Date().toISOString().slice(0,7); } /* YYYY-MM */
  function mesLabel(ym){ /* "2025-06" → "Jun/2025" */
    try{
      var p=ym.split('-'); var meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      return meses[parseInt(p[1],10)-1]+'/'+p[0];
    }catch(e){return ym;}
  }

  /* ── Garante array de custos no state ── */
  function ensureCustos(){
    if(!Array.isArray(state.custosOperacionais)) state.custosOperacionais = [];
  }

  /* ── Frequências e cálculo mensal ── */
  var FREQ_LABELS = {mensal:'Mensal', semanal:'Semanal', quinzenal:'Quinzenal', anual:'Anual', unico:'Único (este mês)'};

  function valorMensalCusto(c, mes){
    var v = n(c.valor);
    if(c.frequencia === 'mensal')    return v;
    if(c.frequencia === 'quinzenal') return v * 2;
    if(c.frequencia === 'semanal')   return v * 4.33;
    if(c.frequencia === 'anual')     return parseFloat((v / 12).toFixed(2));
    if(c.frequencia === 'unico'){
      /* só conta no mês em que foi criado */
      var criado = (c.criadoEm||'').slice(0,7);
      return criado === mes ? v : 0;
    }
    return v;
  }

  function totalCustosMes(mes){
    ensureCustos();
    return state.custosOperacionais
      .filter(function(c){ return c.ativo !== false; })
      .reduce(function(s,c){ return s + valorMensalCusto(c, mes); }, 0);
  }

  /* ── Faturamento do mês ── */
  function faturamentoMes(mes){
    var hist = state.historico || [];
    var vendas = state.vendasProdutos || [];
    var fat = hist.filter(function(h){ return (h.data||'').slice(0,7) === mes; })
                  .reduce(function(s,h){ return s + n(h.valorFinal); }, 0);
    var vat = vendas.filter(function(v){ return (v.data||'').slice(0,7) === mes && v.tipoVenda !== 'sindicato'; })
                    .reduce(function(s,v){ return s + n(v.total); }, 0);
    return fat + vat;
  }

  /* ── HTML principal do módulo ── */
  function custosHTML(){
    if(!isAdm()) return '';
    ensureCustos();

    var mes = mesAtual();
    var custos = state.custosOperacionais;
    var totalMes = totalCustosMes(mes);
    var fat = faturamentoMes(mes);
    var lucro = fat - totalMes;
    var pct = fat > 0 ? ((totalMes / fat) * 100).toFixed(1) : '—';

    /* ── Linha de cada custo ── */
    var rows = custos.length ? custos.map(function(c, i){
      var vm = valorMensalCusto(c, mes);
      var ativo = c.ativo !== false;
      return '<div class="item vz95-custo-item" style="border-left:3px solid '+(ativo?'var(--red,#e86060)':'var(--line,#2e2e3a)')+';padding-left:10px;opacity:'+(ativo?1:0.5)+'">'+
        '<div class="item-head">'+
          '<div style="flex:1">'+
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
              '<b>'+esc(c.nome)+'</b>'+
              '<span class="badge" style="background:#3a1212;color:#e86060;font-size:10px">'+esc(FREQ_LABELS[c.frequencia]||c.frequencia)+'</span>'+
              (c.categoria?'<span class="badge" style="font-size:10px">'+esc(c.categoria)+'</span>':'')+
              (!ativo?'<span class="badge b-off" style="font-size:10px">pausado</span>':'')+
            '</div>'+
            '<div class="muted" style="font-size:12px;margin-top:3px">'+
              'Valor: <b style="color:var(--txt)">'+money(c.valor)+'</b>'+
              (c.frequencia!=='mensal'?' → <b style="color:var(--red,#e86060)">'+money(vm)+'/mês</b>':'')+
              (c.descricao?' • '+esc(c.descricao):'')+
            '</div>'+
          '</div>'+
          '<div class="row" style="gap:6px;flex-shrink:0">'+
            '<button class="btn small '+(ativo?'blue':'good')+'" onclick="v95ToggleCusto(\''+c.id+'\')">'+
              (ativo?'<i class="ti ti-pause"></i>Pausar':'<i class="ti ti-play"></i>Ativar')+
            '</button>'+
            '<button class="btn small bad" onclick="v95DelCusto(\''+c.id+'\')"><i class="ti ti-trash"></i></button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('') : '<div class="muted" style="padding:8px 0">Nenhum custo cadastrado ainda.</div>';

    /* ── Categorias sugeridas para o select ── */
    var cats = ['Aluguel','Energia','Internet','Água','Material','Software','Equipamento','Marketing','Funcionário','Impostos','Outros'];
    var catsExistentes = custos.map(function(c){return c.categoria;}).filter(Boolean);
    cats = cats.concat(catsExistentes.filter(function(c){return cats.indexOf(c)<0;}));

    return (
      /* ── Card de resumo ── */
      '<div class="card" style="border-color:rgba(232,96,96,.35);background:linear-gradient(180deg,#fff0f2,#f5f7f2)">'+
        '<h2 style="color:#e86060;display:flex;align-items:center;gap:8px"><i class="ti ti-report-money"></i>Custos Operacionais — '+mesLabel(mes)+'</h2>'+
        '<div class="statgrid" style="margin-bottom:14px">'+
          '<div class="stat">'+
            '<b style="color:#e86060">'+money(totalMes)+'</b>'+
            '<span>Total de custos/mês</span>'+
          '</div>'+
          '<div class="stat">'+
            '<b style="color:var(--gold)">'+money(fat)+'</b>'+
            '<span>Faturamento '+mesLabel(mes)+'</span>'+
          '</div>'+
          '<div class="stat">'+
            '<b style="color:'+(lucro>=0?'var(--green,#4ecb8c)':'#e86060')+'">'+money(lucro)+'</b>'+
            '<span>'+(lucro>=0?'Resultado estimado':'Resultado negativo')+'</span>'+
          '</div>'+
          '<div class="stat">'+
            '<b style="color:var(--mut)">'+(fat>0?pct+'%':'—')+'</b>'+
            '<span>Custos / faturamento</span>'+
          '</div>'+
        '</div>'+

        /* ── Lista de custos ── */
        '<h3 style="font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">Custos cadastrados</h3>'+
        rows+

        /* ── Formulário de novo custo ── */
        '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">'+
          '<h3 style="font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">Adicionar custo</h3>'+
          '<div class="grid g4" style="margin-bottom:10px">'+
            '<div class="field"><label>Nome do custo</label><input id="v95Nome" placeholder="Ex: Aluguel"></div>'+
            '<div class="field"><label>Valor R$</label><input id="v95Valor" type="number" step="0.01" value="0" min="0"></div>'+
            '<div class="field"><label>Frequência</label>'+
              '<select id="v95Freq">'+
                '<option value="mensal">Mensal</option>'+
                '<option value="semanal">Semanal</option>'+
                '<option value="quinzenal">Quinzenal</option>'+
                '<option value="anual">Anual (÷12)</option>'+
                '<option value="unico">Único (mês atual)</option>'+
              '</select>'+
            '</div>'+
            '<div class="field"><label>Categoria</label>'+
              '<select id="v95Cat">'+
                cats.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('')+
              '</select>'+
            '</div>'+
          '</div>'+
          '<div class="field" style="margin-bottom:10px"><label>Descrição (opcional)</label><input id="v95Desc" placeholder="Ex: Contrato de aluguel do espaço"></div>'+
          '<button class="btn primary" onclick="v95AddCusto()"><i class="ti ti-plus"></i>Adicionar custo</button>'+
        '</div>'+
      '</div>'
    );
  }

  /* ── Ações globais ── */
  window.v95AddCusto = function(){
    if(!isAdm()) return;
    ensureCustos();
    var nome = (document.getElementById('v95Nome')?.value||'').trim();
    if(!nome) return toast95('Informe o nome do custo.');
    var valor = n(document.getElementById('v95Valor')?.value);
    if(valor <= 0) return toast95('Informe um valor maior que zero.');
    var freq = document.getElementById('v95Freq')?.value || 'mensal';
    var cat  = document.getElementById('v95Cat')?.value  || 'Outros';
    var desc = (document.getElementById('v95Desc')?.value||'').trim();
    state.custosOperacionais.push({
      id: uid95(),
      nome: nome,
      valor: valor,
      frequencia: freq,
      categoria: cat,
      descricao: desc,
      ativo: true,
      criadoEm: new Date().toISOString()
    });
    /* Limpa campos */
    ['v95Nome','v95Desc'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
    var vEl=document.getElementById('v95Valor'); if(vEl) vEl.value='0';
    save95();
    toast95('Custo adicionado.');
  };

  window.v95DelCusto = function(id){
    if(!isAdm()) return;
    ensureCustos();
    /* Usa modal nativo seguro — no futuro pode ser substituído por modal customizado */
    var c = state.custosOperacionais.find(function(x){return String(x.id)===String(id);});
    if(!c) return;
    if(!confirm('Excluir o custo "'+c.nome+'"?')) return;
    state.custosOperacionais = state.custosOperacionais.filter(function(x){return String(x.id)!==String(id);});
    save95();
  };

  window.v95ToggleCusto = function(id){
    if(!isAdm()) return;
    ensureCustos();
    var c = state.custosOperacionais.find(function(x){return String(x.id)===String(id);});
    if(!c) return;
    c.ativo = c.ativo === false ? true : false;
    save95();
  };

  /* ── Injeta no painelHTML do admin ── */
  var _basePainel95 = window.painelHTML || (typeof painelHTML==='function'?painelHTML:null);
  if(typeof _basePainel95==='function'){
    window.painelHTML = function(){
      var html = _basePainel95.apply(this,arguments);
      if(!isAdm()) return html;
      /* Acrescenta o card de custos ao final do painel do admin */
      return html + custosHTML();
    };
    try{ painelHTML = window.painelHTML; }catch(e){}
  }

  /* ── Normaliza array no state para não quebrar em nada ── */
  var _baseNorm95 = window.normalize || (typeof normalize==='function'?normalize:null);
  if(typeof _baseNorm95==='function'){
    window.normalize = function(){
      _baseNorm95.apply(this,arguments);
      if(!Array.isArray(state.custosOperacionais)) state.custosOperacionais = [];
      state.custosOperacionais = state.custosOperacionais.map(function(c){
        return Object.assign({id:uid95(),nome:'Custo',valor:0,frequencia:'mensal',categoria:'Outros',descricao:'',ativo:true,criadoEm:new Date().toISOString()}, c, {ativo:c.ativo!==false});
      });
    };
    try{ normalize = window.normalize; }catch(e){}
  }

  /* ── Estilos ── */
  (function(){
    if(document.getElementById('vz95Style')) return;
    var s = document.createElement('style');
    s.id = 'vz95Style';
    s.textContent = '.vz95-custo-item{transition:opacity .2s}';
    document.head.appendChild(s);
  })();

  try{
    if(window.session && typeof renderAll==='function' && document.getElementById('pages')) renderAll();
    console.log('V95: custos operacionais carregados.');
  }catch(e){ console.error('V95 erro:',e); }
})();

/* ===== V96: aprovação admin para lançamentos do sindicato feitos pelo profissional ===== */
(function(){
  const V96='vizzarty_v96_aprovacao_sindicato_profissional';
  if(window[V96]) return;
  window[V96]=true;

  function n96(v){
    try{ return typeof num==='function' ? num(v) : (Number(v)||0); }catch(e){ return Number(v)||0; }
  }
  function brl96(v){
    try{ return typeof brl==='function' ? brl(v) : ('R$ '+n96(v).toFixed(2).replace('.',',')); }catch(e){ return 'R$ '+n96(v).toFixed(2).replace('.',','); }
  }
  function uid96(){
    try{ return typeof uid==='function' ? uid() : ('v96_'+Date.now().toString(36)+Math.random().toString(36).slice(2)); }catch(e){ return 'v96_'+Date.now().toString(36)+Math.random().toString(36).slice(2); }
  }
  function today96(){
    try{ return typeof today==='function' ? today() : new Date().toISOString().slice(0,10); }catch(e){ return new Date().toISOString().slice(0,10); }
  }
  function now96(){
    try{ return typeof nowHH==='function' ? nowHH() : new Date().toTimeString().slice(0,5); }catch(e){ return new Date().toTimeString().slice(0,5); }
  }
  function isAdm96(){
    try{ return typeof isAdmin==='function' ? isAdmin() : (window.session && session.role==='admin'); }catch(e){ return false; }
  }
  function toast96(msg){
    try{ if(typeof toast==='function') return toast(msg); }catch(e){}
    alert(msg);
  }
  function save96(render=true){
    try{ if(typeof normalize==='function') normalize(); }catch(e){}
    try{ state.updatedAt=Date.now(); }catch(e){}
    try{ window.dirty=true; }catch(e){}
    try{ if(typeof saveLocal==='function') saveLocal(); else localStorage.setItem('vz_state',JSON.stringify(state)); }catch(e){}
    if(render){ try{ if(typeof renderAll==='function') renderAll(); }catch(e){} }
    try{ clearTimeout(window.v96SyncTimer); window.v96SyncTimer=setTimeout(function(){ try{ if(typeof syncNow==='function') syncNow(true); }catch(e){} },500); }catch(e){}
  }
  function profAtual96(){
    try{ return typeof currentProf==='function' ? currentProf() : null; }catch(e){ return null; }
  }
  function produtoSindicato96(){
    try{ if(typeof sindicatoProdutoVirtual==='function') return sindicatoProdutoVirtual(); }catch(e){}
    return {
      id:(typeof SIND_ID!=='undefined'?SIND_ID:'__sindicato_corte__'),
      nome:(state?.config?.sindicatoNome||'Corte de cabelo pelo sindicato'),
      preco:n96(state?.config?.sindicatoPreco||25),
      comissaoPct:n96(state?.config?.sindicatoComissaoPct||60)
    };
  }
  function beneficioPode96(qtd){
    try{ return typeof beneficioPodeUsar==='function' ? beneficioPodeUsar(qtd) : true; }catch(e){ return true; }
  }
  function msgLimite96(){
    try{ return typeof sindicatoIndisponivelMsg==='function' ? sindicatoIndisponivelMsg() : 'Limite do sindicato esgotado.'; }catch(e){ return 'Limite do sindicato esgotado.'; }
  }
  function pendencias96(){
    state.pendencias = Array.isArray(state.pendencias) ? state.pendencias : [];
    return state.pendencias;
  }
  function montarVendaSindicato96(p){
    const qtd=Math.max(1,n96(p.qtd)||1);
    const preco=n96(p.precoUnit);
    const pct=n96(p.comissaoPct);
    const total=preco*qtd;
    return {
      id:uid96(),
      tipoVenda:'sindicato',
      produtoId:(typeof SIND_ID!=='undefined'?SIND_ID:'__sindicato_corte__'),
      produtoNome:p.produtoNome||p.nome||'Corte de cabelo pelo sindicato',
      profId:p.profId||'',
      profNome:p.profNome||'',
      clienteNome:'',
      qtd:qtd,
      precoUnit:preco,
      total:total,
      comissaoPct:pct,
      comissaoValor:total*pct/100,
      data:p.data||today96(),
      hora:p.hora||now96(),
      obs:p.obs||'',
      createdAt:Date.now(),
      aprovadoAdmin:true,
      pendenciaOrigemId:p.id||''
    };
  }

  const baseRegistrarSind96 = window.registrarCortesSindicato || (typeof registrarCortesSindicato==='function'?registrarCortesSindicato:null);
  window.registrarCortesSindicato = function(){
    if(isAdm96()){
      return typeof baseRegistrarSind96==='function' ? baseRegistrarSind96.apply(this,arguments) : undefined;
    }

    const prof=profAtual96();
    if(!prof) return toast96('Profissional não encontrado. Faça login novamente.');
    if(prof.ativo===false) return toast96('Profissional desativado pelo administrador.');

    const qtd=Math.max(1,n96(document.getElementById('csQtd')?.value)||1);
    if(!beneficioPode96(qtd)) return toast96(msgLimite96());

    const sind=produtoSindicato96();
    const preco=n96(document.getElementById('csPreco')?.value || sind.preco || state?.config?.sindicatoPreco || 0);
    const pct=n96(document.getElementById('csPct')?.value || sind.comissaoPct || state?.config?.sindicatoComissaoPct || 0);
    const data=document.getElementById('csData')?.value || today96();
    const obs=document.getElementById('csObs')?.value || '';
    const total=preco*qtd;

    pendencias96().push({
      id:uid96(),
      tipo:'sindicato_qtd',
      nome:'Corte(s) do sindicato',
      produtoNome:sind.nome||'Corte de cabelo pelo sindicato',
      profId:prof.id,
      profNome:prof.nome,
      qtd:qtd,
      precoUnit:preco,
      total:total,
      comissaoPct:pct,
      comissaoValor:total*pct/100,
      data:data,
      hora:now96(),
      obs:obs,
      origem:'prof',
      status:'pendente_admin',
      criadoEm:Date.now()
    });
    save96(true);
    toast96('Lançamento do sindicato enviado para aprovação do administrador.');
  };
  try{ registrarCortesSindicato=window.registrarCortesSindicato; }catch(e){}

  const baseApprove96 = window.approve || (typeof approve==='function'?approve:null);
  window.approve = function(i){
    const p=(state.pendencias||[])[i];
    if(!p || p.tipo!=='sindicato_qtd'){
      return typeof baseApprove96==='function' ? baseApprove96.apply(this,arguments) : undefined;
    }
    if(!isAdm96()) return toast96('Somente o administrador pode aprovar.');
    const qtd=Math.max(1,n96(p.qtd)||1);
    if(!beneficioPode96(qtd)) return toast96(msgLimite96());
    const venda=montarVendaSindicato96(p);
    state.vendasProdutos = Array.isArray(state.vendasProdutos) ? state.vendasProdutos : [];
    state.vendasProdutos.push(venda);
    try{ if(typeof marcarBeneficio==='function') marcarBeneficio(venda,qtd); }catch(e){}
    state.pendencias.splice(i,1);
    save96(true);
    toast96('Lançamento do sindicato aprovado e registrado no extrato.');
  };
  try{ approve=window.approve; }catch(e){}

  const basePend96 = window.pendenciasHTML || (typeof pendenciasHTML==='function'?pendenciasHTML:null);
  window.pendenciasHTML = function(){
    if(!isAdm96() || !(state.pendencias||[]).length) return '';
    return `<div class="card"><h2>Aprovações pendentes</h2>${(state.pendencias||[]).map(function(p,i){
      if(p.tipo==='sindicato_qtd'){
        return `<div class="item"><div class="item-head"><div><b>Sindicato aguardando aprovação</b><div class="muted">${p.profNome||'Profissional'} • ${p.qtd||1} corte(s) • ${p.data||''} ${p.hora||''} • Total interno ${brl96(p.total||0)} • Comissão ${brl96(p.comissaoValor||0)}</div>${p.obs?`<div class="muted">Obs: ${String(p.obs).replace(/</g,'&lt;')}</div>`:''}<div class="row" style="margin-top:7px"><span class="badge b-off">pendente</span><span class="badge">aprovação admin</span></div></div><div class="row"><button class="btn small good" onclick="approve(${i})">Aprovar</button><button class="btn small bad" onclick="reject(${i})">Recusar</button></div></div></div>`;
      }
      if(typeof basePend96==='function'){
        let titulo=p.tipo==='servico'?'Serviço':'Atendimento';
        return `<div class="item"><b>${titulo}</b><div class="muted">${p.servico?.nome||p.nome||''}</div><button class="btn small good" onclick="approve(${i})">Aprovar</button> <button class="btn small bad" onclick="reject(${i})">Recusar</button></div>`;
      }
      return '';
    }).join('')}</div>`;
  };
  try{ pendenciasHTML=window.pendenciasHTML; }catch(e){}

  function blocoPendenciasAdmin96(){
    try{ return isAdm96() ? (window.pendenciasHTML ? window.pendenciasHTML() : '') : ''; }catch(e){ return ''; }
  }

  const basePainel96 = window.painelHTML || (typeof painelHTML==='function'?painelHTML:null);
  if(typeof basePainel96==='function'){
    window.painelHTML=function(){
      const html=basePainel96.apply(this,arguments);
      const pend=blocoPendenciasAdmin96();
      return pend ? pend+html : html;
    };
    try{ painelHTML=window.painelHTML; }catch(e){}
  }

  const baseProdutos96 = window.produtosHTML || (typeof produtosHTML==='function'?produtosHTML:null);
  if(typeof baseProdutos96==='function'){
    window.produtosHTML=function(){
      const html=baseProdutos96.apply(this,arguments);
      const pend=blocoPendenciasAdmin96();
      return pend && !html.includes('Sindicato aguardando aprovação') ? pend+html : html;
    };
    try{ produtosHTML=window.produtosHTML; }catch(e){}
  }

  try{
    if(window.session && typeof renderAll==='function' && document.getElementById('pages')) renderAll();
    console.log('V96: aprovação admin para sindicato do profissional carregada.');
  }catch(e){ console.error('V96 erro:',e); }
})();

</script>



<script id="vz99-restaura-extrato-original-comissao-segura">
/* ===== V99: restaura o extrato original V90/V92 e corrige apenas a exposição de valores =====
   Mantém: filtros por dia/período, resumo por profissional, tabelas de atendimentos, produtos e planos.
   Profissional: pendências mostram somente comissão possível, sem total/valor vendido.
   Admin: mantém total da venda e mostra comissão do profissional na frente. */
(function(){
  var FLAG='vizzarty_v99_extrato_original_comissao_segura';
  if(window[FLAG]) return;
  window[FLAG]=true;

  function n(v){ try{return typeof num==='function'?num(v):(Number(v)||0);}catch(e){return Number(v)||0;} }
  function money(v){ try{return typeof brl==='function'?brl(n(v)):('R$ '+n(v).toFixed(2).replace('.',','));}catch(e){return 'R$ '+n(v).toFixed(2).replace('.',',');} }
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}
  function isAdm(){ try{return typeof isAdmin==='function'&&isAdmin();}catch(e){return false;} }
  function meuProfId(){ try{return String((window.session||session||{}).profId||'');}catch(e){return '';} }
  function profById(id){ return (state.profissionais||[]).find(function(p){return String(p.id)===String(id);}); }
  function pctProf(id){ var p=profById(id); return n(p&&p.comissao); }
  function ehSind(x){
    try{ if(typeof window.v55AtendimentoSindicato==='function') return !!window.v55AtendimentoSindicato(x); }catch(e){}
    try{ if(typeof beneficioUsaSaldo==='function'&&beneficioUsaSaldo(x)) return true; }catch(e){}
    var nome=String((x&&x.servNome)||(x&&x.produtoNome)||'').toLowerCase();
    return !!(x&&(x.sindicato===true||x.beneficioUsado===true||String(x.tipoVenda||'').toLowerCase()==='sindicato'||String(x.tipo||'').toLowerCase()==='sindicato_qtd'||String(x.produtoId||'')==='__sindicato_corte__'||String(x.servId||'')==='__sindicato_corte__'||nome.indexOf('sindicato')>=0));
  }
  function valorAt(a){ return n((a&&a.valorFinal)!==undefined?a.valorFinal:(a&&a.total)!==undefined?a.total:0); }
  function comAt(a){
    try{ if(typeof calcComissaoAtendimento==='function') return n(calcComissaoAtendimento(a)); }catch(e){}
    var pct=(a&&a.comissaoPctAtendimento!==undefined)?n(a.comissaoPctAtendimento):(ehSind(a)?n(state&&state.config&&state.config.sindicatoComissaoPct):pctProf(a&&a.profId));
    return valorAt(a)*pct/100;
  }
  function valorVenda(v){ return n((v&&v.total)!==undefined?v.total:(v&&v.valorFinal)!==undefined?v.valorFinal:0); }
  function comVenda(v){
    try{ if(typeof calcComissaoVenda==='function') return n(calcComissaoVenda(v)); }catch(e){}
    if(v&&v.comissaoValor!==undefined&&v.comissaoValor!==null) return n(v.comissaoValor);
    return valorVenda(v)*n(v&&v.comissaoPct)/100;
  }
  function comPendencia(p){
    if(!p) return 0;
    if(p.tipo==='sindicato_qtd') return n(p.comissaoValor);
    if(p.tipo==='venda_produto') return comVenda(p.venda||p);
    if(p.tipo==='produto'||p.tipo==='servico') return 0;
    return comAt(p);
  }
  function tipoPendencia(p){
    if(!p) return 'Lançamento';
    if(p.tipo==='sindicato_qtd'||ehSind(p)) return 'Corte do sindicato';
    if(p.tipo==='venda_produto') return 'Venda de produto';
    if(p.tipo==='produto') return 'Cadastro de produto';
    if(p.tipo==='servico') return 'Cadastro de serviço';
    return 'Serviço';
  }
  function nomePendencia(p){
    if(!p) return 'Aguardando aprovação';
    if(p.tipo==='venda_produto') return (p.venda&&p.venda.produtoNome)||p.resumo||'Produto aguardando aprovação';
    if(p.tipo==='produto') return (p.produto&&p.produto.nome)||p.resumo||'Novo produto';
    if(p.tipo==='servico') return (p.servico&&p.servico.nome)||p.resumo||'Novo serviço';
    if(p.tipo==='sindicato_qtd'||ehSind(p)) return p.resumo||'Corte do sindicato';
    return p.servNome||p.nome||'Serviço aguardando aprovação';
  }
  function dataPendencia(p){
    var v=p&&p.venda?p.venda:{};
    return [p&&p.data||v.data||'', p&&p.hora||v.hora||''].filter(Boolean).join(' ');
  }
  function minhasPendenciasSeguras(){
    var pid=meuProfId();
    if(!pid) return [];
    return (state.pendencias||[]).filter(function(p){return String(p.profId)===String(pid);});
  }
  function cardPendenciasProfSeguro(){
    var lista=minhasPendenciasSeguras();
    if(!lista.length) return '';
    var totalCom=lista.reduce(function(s,p){return s+comPendencia(p);},0);
    var rows=lista.map(function(p){
      var com=comPendencia(p);
      return '<div class="item" style="border-left:3px solid var(--gold);padding-left:10px">'+
        '<div class="item-head"><div style="flex:1">'+
          '<span class="badge b-fila" style="background:#252535;color:#e8a800"><i class="ti ti-hourglass"></i> Aguardando aprovação</span> '+
          '<b>'+esc(nomePendencia(p))+'</b>'+
          '<div class="muted" style="font-size:12px;margin-top:4px">'+esc(tipoPendencia(p))+(dataPendencia(p)?' • '+esc(dataPendencia(p)):'')+'</div>'+ 
          '<div class="row" style="margin-top:7px"><span class="badge b-ok">Comissão possível: '+money(com)+'</span></div>'+ 
        '</div></div></div>';
    }).join('');
    return '<div class="card vz99-pend-card" style="border-color:rgba(45,179,106,.4);background:linear-gradient(180deg,#edf8f1,#f5f7f2)">'+
      '<h2 style="color:var(--gold);display:flex;align-items:center;gap:8px"><i class="ti ti-hourglass"></i> Meus lançamentos pendentes ('+lista.length+')</h2>'+ 
      '<p class="muted" style="font-size:12px;margin:-4px 0 12px">Mostra somente a comissão possível. O valor total da venda fica oculto para o profissional.</p>'+ 
      '<div class="statgrid" style="margin-bottom:12px"><div class="stat"><b>'+lista.length+'</b><span>Aguardando</span></div><div class="stat"><b>'+money(totalCom)+'</b><span>Comissão possível</span></div></div>'+rows+'</div>';
  }
  window.vz99CardPendenciasProfSeguro=cardPendenciasProfSeguro;

  function limparCardAntigoProf(html){
    if(isAdm()) return html;
    try{
      var wrap=document.createElement('div');
      wrap.innerHTML=String(html||'');
      Array.prototype.slice.call(wrap.querySelectorAll('.card')).forEach(function(card){
        var txt=(card.textContent||'').toLowerCase();
        if(txt.indexOf('meus lançamentos pendentes')>=0 || txt.indexOf('meus lançamentos aguardando aprovação')>=0){
          card.remove();
        }
      });
      return wrap.innerHTML;
    }catch(e){
      return String(html||'').replace(/<div class="card" style="border-color:rgba\(214,146,36,.4\);background:linear-gradient\(180deg,#1a1200,#100c09\)">[\s\S]*?<\/div>\s*<div class="statgrid"/,'<div class="statgrid"');
    }
  }
  function ajustarAdminHeaders(html){
    if(!isAdm()) return html;
    var out=String(html||'');
    out=out.replace(/<th>Valor<\/th><th>Comissão<\/th>/g,'<th>Total venda</th><th>Comissão profissional</th>');
    out=out.replace(/<th>Faturamento<\/th><th>Comissão<\/th>/g,'<th>Total vendido</th><th>Comissão profissional</th>');
    out=out.replace(/<span>Faturamento total<\/span>/g,'<span>Total de vendas</span>');
    return out;
  }

  var baseExtrato=window.extratoHTML||(typeof extratoHTML==='function'?extratoHTML:null);
  if(typeof baseExtrato==='function'){
    window.extratoHTML=function(){
      var html=baseExtrato.apply(this,arguments);
      html=limparCardAntigoProf(html);
      html=ajustarAdminHeaders(html);
      if(!isAdm()) html=cardPendenciasProfSeguro()+html;
      return html;
    };
    try{ extratoHTML=window.extratoHTML; }catch(e){}
  }

  var basePainel=window.painelHTML||(typeof painelHTML==='function'?painelHTML:null);
  if(typeof basePainel==='function'){
    window.painelHTML=function(){
      var html=basePainel.apply(this,arguments);
      if(isAdm()) return ajustarAdminHeaders(html);
      html=limparCardAntigoProf(html);
      return cardPendenciasProfSeguro()+html;
    };
    try{ painelHTML=window.painelHTML; }catch(e){}
  }

  var basePend=window.pendenciasHTML||(typeof pendenciasHTML==='function'?pendenciasHTML:null);
  window.pendenciasHTML=function(){
    if(!isAdm() || !(state.pendencias||[]).length) return '';
    var rows=(state.pendencias||[]).map(function(p,i){
      var prof=(p.profNome)||((profById(p.profId)||{}).nome)||'Profissional';
      var total=0, com=comPendencia(p);
      if(p.tipo==='sindicato_qtd') total=n(p.total);
      else if(p.tipo==='venda_produto') total=valorVenda(p.venda||p);
      else total=valorAt(p);
      var titulo=nomePendencia(p);
      return '<div class="item"><div class="item-head"><div style="flex:1"><b>'+esc(titulo)+'</b>'+ 
        '<div class="muted">Solicitado por: '+esc(prof)+' • Tipo: '+esc(tipoPendencia(p))+(dataPendencia(p)?' • '+esc(dataPendencia(p)):'')+' • Total venda: '+money(total)+' • Comissão profissional: '+money(com)+'</div>'+ 
        '</div><div class="row"><button class="btn small good" onclick="approve('+i+')">Aprovar</button><button class="btn small bad" onclick="reject('+i+')">Recusar</button></div></div></div>';
    }).join('');
    return '<div class="card"><h2>Aprovações pendentes</h2><p class="muted">Área do administrador: aqui aparece total da venda e comissão do profissional.</p>'+rows+'</div>';
  };
  try{ pendenciasHTML=window.pendenciasHTML; }catch(e){}

  window.vz99AutoTeste=function(){
    var profCard=cardPendenciasProfSeguro().toLowerCase();
    var extratoAdm='';
    try{ var old=isAdmin; window.isAdmin=function(){return true;}; extratoAdm=String(window.extratoHTML()).toLowerCase(); window.isAdmin=old; }catch(e){}
    return {
      pendencia_profissional_oculta_total: !(/total:|valor:|total venda|valor total|total vendido/.test(profCard)),
      pendencia_profissional_mostra_comissao: /comiss/.test(profCard),
      admin_tem_total_venda_e_comissao: /total venda|total vendido/.test(extratoAdm) && /comissão profissional|comiss/.test(extratoAdm),
      extrato_v90_preservado: /resumo por profissional|atendimentos|produtos|planos|período|periodo/.test(String(window.extratoHTML()).toLowerCase())
    };
  };

  try{ if(window.session && typeof renderAll==='function' && document.getElementById('pages')) renderAll(); }catch(e){}
  console.log('V99: extrato original preservado; profissional só comissão; admin total venda + comissão.');
})();
</script>
