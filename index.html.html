<style>
:root{--bg:#0e0a08;--bg2:#15100d;--card:#1d1410;--card2:#261a13;--border:#39271c;--text:#fff3e4;--muted:#a88972;--gold:#d99122;--gold2:#f5b84a;--green:#42d18a;--red:#ff6c6c;--blue:#75a7ff;--purple:#c09cff;--shadow:0 16px 50px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}button,input,select,textarea{font-family:inherit}button{cursor:pointer}.app{display:flex;height:100vh}.side{width:238px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:.25s}.brand{padding:20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}.logo{width:58px;height:58px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:contain}.brand h1{font:700 20px 'Playfair Display',serif;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.nav{padding:10px;overflow:auto;flex:1}.nav button{width:100%;border:0;background:transparent;color:var(--muted);display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;margin:2px 0;font-weight:600;text-align:left}.nav button.active,.nav button:hover{background:#2b1d14;color:var(--gold2)}.nav small{margin-left:auto;background:#2d1e10;color:var(--gold2);padding:2px 7px;border-radius:99px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:62px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top-left{display:flex;align-items:center;gap:10px}.menu{display:none;width:42px;height:42px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--border)}.title{font:700 20px 'Playfair Display',serif}.session{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{border:1px solid var(--border);background:var(--card);color:var(--muted);padding:7px 10px;border-radius:999px;font-size:12px}.content{padding:18px;overflow:auto}.page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.card h2{font:700 18px 'Playfair Display',serif;margin:0 0 12px}.card h3{font:700 15px 'DM Sans';margin:0 0 10px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}input,select,textarea{width:100%;background:#110c0a;border:1px solid var(--border);border-radius:12px;color:var(--text);padding:11px 12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--gold)}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--gold);color:#140c04}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn.good{background:#0f2b1e;color:var(--green);border:1px solid #1f6042}.btn.bad{background:#2b1111;color:var(--red);border:1px solid #5c2424}.btn.blue{background:#111a2b;color:var(--blue);border:1px solid #263f73}.btn.small{padding:7px 10px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}.stat b{display:block;font:700 26px 'Playfair Display',serif}.stat span{font-size:12px;color:var(--muted)}.item{background:#120d0a;border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:8px}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{font-size:11px;border-radius:999px;padding:4px 8px;font-weight:800;display:inline-flex;gap:4px;align-items:center}.b-wait{background:#2b1c09;color:var(--gold2)}.b-in{background:#101a2e;color:var(--blue)}.b-done{background:#0c261a;color:var(--green)}.b-premium{background:#241536;color:var(--purple)}.b-off{background:#2b1111;color:var(--red)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.avatar{width:62px;height:62px;border-radius:18px;overflow:hidden;background:#2b1d14;display:grid;place-items:center;color:var(--gold2);font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:99999;display:grid;gap:8px}.toast{background:#201611;border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}.toast.ok{color:var(--green);border-color:#276245}.toast.err{color:var(--red);border-color:#7a2828}.float{position:fixed;right:16px;top:78px;display:grid;gap:8px;z-index:1000}.float button{width:46px;height:46px;border-radius:16px}.public{display:none;min-height:100vh;background:radial-gradient(circle at top,#2d190a,#0e0a08 58%);padding:16px;overflow:auto}.public .wrap{max-width:460px;margin:auto}.public-logo{width:82px;height:82px;border-radius:25px;background:#fff;display:grid;place-items:center;margin:20px auto 12px;overflow:hidden}.public-logo img{width:100%;height:100%;object-fit:contain}.public h1{text-align:center;font:700 28px 'Playfair Display',serif;margin:0}.public p{text-align:center;color:var(--muted)}body.client-mode{overflow:auto}body.client-mode .app,body.client-mode .float{display:none}body.client-mode .public{display:block}.muted{color:var(--muted)}.danger-text{color:var(--red)}.ok-text{color:var(--green)}
@media(max-width:820px){body{overflow:auto}.app{height:auto;min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;z-index:9999;transform:translateX(-105%)}.side.open{transform:translateX(0)}.menu{display:block}.content{padding:12px}.grid2,.grid3,.grid4,.stats{grid-template-columns:1fr}.top{position:sticky;top:0;z-index:900}.session{display:none}.item-head{display:block}.float{top:auto;bottom:16px}.float button{box-shadow:var(--shadow)}}

<div class="app">

<script>
const SUPABASE_URL='https://vtrqebzafhsqjsshvklx.supabase.co';
const SUPABASE_KEY='sb_publishable_KF5HCg_RbEchQ515dzU-uQ_Fnwrxc0s';
const LS='vizzarty_clean_state_v1';
const CLOUD_TABLE='vizzarty_state';
const DEFAULT={
  config:{nome:'Vizzarty Barbearia',telefone:'',endereco:'',adminSenha:'1234',logo:''},
  horarios:{filaIni:'08:00',filaFim:'18:30',agendaIni:'08:00',agendaFim:'18:30',premAlmocoIni:'11:30',premAlmocoFim:'13:30',premNoiteIni:'19:00',premNoiteFim:'22:00',intervaloAgenda:30},
  profissionais:[],servicos:[],clientes:[],fila:[],historico:[],vouchers:[],bloqueios:[],pendencias:[],updatedAt:0,seq:1
};
let state=loadLocal() || structuredClone(DEFAULT); let currentPage='painel'; let session=JSON.parse(localStorage.getItem('vizzarty_session')||'{"role":"admin"}'); let dirty=false; let saving=false; let lastCloudAt=0;
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
function clone(x){return JSON.parse(JSON.stringify(x||{}))} function uid(){state.seq=(state.seq||1)+1;return Date.now()+''+state.seq} function today(){return new Date().toISOString().slice(0,10)} function nowHH(){return new Date().toTimeString().slice(0,5)} function brl(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',')} function num(v){return Number(v||0)}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS))}catch{return null}} function saveLocal(){localStorage.setItem(LS,JSON.stringify(state));}
function normalize(){ state={...structuredClone(DEFAULT),...state}; state.config={...DEFAULT.config,...state.config}; state.horarios={...DEFAULT.horarios,...state.horarios}; ['profissionais','servicos','clientes','fila','historico','vouchers','bloqueios','pendencias'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]}); state.profissionais=state.profissionais.map(p=>({id:uid(),nome:'',esp:'Barbeiro',telefone:'',foto:'',ativo:true,senha:'1234',comissao:60,...p,ativo:p.ativo!==false})); state.servicos=state.servicos.map(s=>({id:uid(),nome:'Serviço',precoFila:35,precoAgenda:40,precoPremium:50,durFila:20,durAgenda:30,durPremium:40,ativo:true,...s,ativo:s.ativo!==false})); state.clientes=state.clientes.map(c=>({id:uid(),nome:'',telefone:'',...c})); }
normalize();
function markDirty(){state.updatedAt=Date.now(); dirty=true; saveLocal(); renderAllDebounced(); clearTimeout(window._saveTimer); window._saveTimer=setTimeout(saveCloud,600)}
async function loadCloud(force=false){ if(!sb)return; if(isUserEditing() && !force){setCloud('☁️ aguardando digitação'); return;} try{setCloud('☁️ buscando...'); const {data,error}=await sb.from(CLOUD_TABLE).select('data,updated_at').eq('id',1).single(); if(error)throw error; const remote=data?.data; if(remote && typeof remote==='object'){ const rAt=Number(remote.updatedAt||0); if(force || (!dirty && rAt>=Number(state.updatedAt||0))){ if(isUserEditing() && !force){setCloud('☁️ aguardando digitação'); return;} state={...structuredClone(DEFAULT),...remote}; normalize(); saveLocal(); lastCloudAt=rAt; dirty=false; if(document.body.classList.contains('client-mode')){renderPublic();}else{renderAll();} setCloud('☁️ sincronizado'); } else setCloud('☁️ local mais novo'); } }catch(e){console.error(e);setCloud('🔴 erro nuvem');}}
async function saveCloud(){ if(!sb||saving)return; saving=true; normalize(); state.updatedAt=Date.now(); saveLocal(); try{setCloud('☁️ salvando...'); const {error}=await sb.from(CLOUD_TABLE).upsert({id:1,data:state,updated_at:new Date().toISOString()}); if(error)throw error; dirty=false; lastCloudAt=state.updatedAt; setCloud('☁️ salvo'); }catch(e){console.error(e);setCloud('🔴 não salvou'); toast('Não foi possível salvar na nuvem','err')} finally{saving=false} }
function syncNow(){saveCloud().then(()=>{if(!isUserEditing())loadCloud(true)});toast('Sincronização solicitada','ok')} setInterval(()=>{if(!dirty && !isUserEditing())loadCloud(false)},12000); loadCloud(true);
function setCloud(t){const el=document.getElementById('cloudStatus'); if(el)el.textContent=t}
function isUserEditing(){const el=document.activeElement; return !!(el && ['INPUT','TEXTAREA','SELECT'].includes(el.tagName) && !el.readOnly);}
function toast(msg,type='ok'){const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;toastWrap.appendChild(d);setTimeout(()=>d.remove(),3500)}
function toggleMenu(){side.classList.toggle('open')} function closeMenu(){side.classList.remove('open')}
function isAdmin(){return session.role==='admin'} function currentProf(){return state.profissionais.find(p=>String(p.id)===String(session.profId))}
function canAdmin(){if(isAdmin())return true; const p=prompt('Senha do admin para autorizar:'); return p===state.config.adminSenha}
function setPage(p){currentPage=p;renderAll();closeMenu()}
function showLogin(){ const opts=state.profissionais.filter(p=>p.ativo).map(p=>`${p.id}|${p.nome}`).join('\n'); const tipo=prompt('Digite:\nadmin = entrar como administrador\nou o nome do profissional\n\nProfissionais:\n'+(opts||'Nenhum')); if(!tipo)return; if(tipo.toLowerCase()==='admin'){const s=prompt('Senha admin:'); if(s===state.config.adminSenha){session={role:'admin'};localStorage.setItem('vizzarty_session',JSON.stringify(session));renderAll();toast('Admin logado','ok')}else toast('Senha incorreta','err');return;} const p=state.profissionais.find(x=>x.ativo && x.nome.toLowerCase().includes(tipo.toLowerCase())); if(!p){toast('Profissional não encontrado','err');return} const s=prompt('Senha do profissional:'); if(s===p.senha){session={role:'prof',profId:p.id};localStorage.setItem('vizzarty_session',JSON.stringify(session));renderAll();toast('Profissional logado','ok')}else toast('Senha incorreta','err') }
function logout(){session={role:'visit'};localStorage.setItem('vizzarty_session',JSON.stringify(session));renderAll()}
function navItems(){let base=[['painel','ti-dashboard','Painel'],['fila','ti-users','Fila de espera'],['agendamentos','ti-calendar','Agendamentos'],['clientes','ti-address-book','Clientes'],['servicos','ti-list-details','Serviços'],['profissionais','ti-user-star','Profissionais'],['vouchers','ti-ticket','Vouchers'],['extrato','ti-receipt','Extrato'],['link','ti-link','Link cliente'],['config','ti-settings','Configurações']]; if(session.role==='prof')base=[['painel','ti-dashboard','Meu painel'],['fila','ti-users','Fila'],['agendamentos','ti-calendar','Agenda'],['extrato','ti-receipt','Minha comissão'],['link','ti-link','Link cliente']]; return base}
function renderNav(){nav.innerHTML=navItems().map(([id,ic,tx])=>`<button class="${currentPage===id?'active':''}" onclick="setPage('${id}')"><i class="ti ${ic}"></i>${tx}${id==='fila'?`<small>${state.fila.filter(a=>a.tipo==='fila'&&a.status!=='concluido').length}</small>`:''}</button>`).join('')+`<button onclick="logout()"><i class="ti ti-logout"></i>Sair</button>`}
function renderAll(){normalize(); renderNav(); userChip.textContent=isAdmin()?'Admin':(currentProf()?.nome||'Visitante'); pageTitle.textContent=(navItems().find(x=>x[0]===currentPage)||['','','Painel'])[2]; pages.innerHTML=pageHTML(currentPage); bindAfterRender(); }
let rd; function renderAllDebounced(){clearTimeout(rd); rd=setTimeout(renderAll,80)}
function pageHTML(p){ if(p==='painel')return painelHTML(); if(p==='fila')return filaHTML(); if(p==='agendamentos')return agendaHTML(); if(p==='clientes')return clientesHTML(); if(p==='servicos')return servicosHTML(); if(p==='profissionais')return profissionaisHTML(); if(p==='vouchers')return vouchersHTML(); if(p==='extrato')return extratoHTML(); if(p==='link')return linkHTML(); if(p==='config')return configHTML(); return painelHTML()}
function visibleAtendimentos(){ if(isAdmin())return state.fila; return state.fila.filter(a=>String(a.profId)===String(session.profId)) }
function atendimentoProfOk(a){return isAdmin()||String(a.profId)===String(session.profId)}
function inRange(h,ini,fim){if(!h||!ini||!fim)return false; return h>=ini && h<=fim}
function isPremiumTime(h){return inRange(h,state.horarios.premAlmocoIni,state.horarios.premAlmocoFim)||inRange(h,state.horarios.premNoiteIni,state.horarios.premNoiteFim)}
function tipoPreco(mode,h){ if(mode==='premium')return 'premium'; if(mode==='agendamento' && isPremiumTime(h))return 'premium'; return mode==='agendamento'?'agendamento':'fila'}
function servicePrice(s,t){return t==='premium'?num(s.precoPremium):t==='agendamento'?num(s.precoAgenda):num(s.precoFila)} function serviceDur(s,t){return t==='premium'?num(s.durPremium):t==='agendamento'?num(s.durAgenda):num(s.durFila)}
function estimateWait(profId=''){let list=state.fila.filter(a=>a.tipo==='fila'&&['aguardando','em_atendimento'].includes(a.status)); if(profId)list=list.filter(a=>!a.profId||String(a.profId)===String(profId)); return list.reduce((sum,a)=>sum+num(a.tempoMin||20),0)}
function profissionaisDisponiveis(data=today(), hora='', mode='fila'){return state.profissionais.filter(p=>p.ativo && !state.bloqueios.some(b=>String(b.profId)===String(p.id)&&b.data===data && (!hora || !b.ini || inRange(hora,b.ini,b.fim))))}
function servicosAtivos(){return state.servicos.filter(s=>s.ativo)}
function painelHTML(){let aguard=state.fila.filter(a=>a.status==='aguardando').length, ag=state.fila.filter(a=>a.tipo!=='fila'&&a.status!=='concluido').length, hoje=state.historico.filter(h=>h.data===today()).length, fat=state.historico.filter(h=>h.data===today()).reduce((s,a)=>s+num(a.valorFinal),0);return `<div class="stats"><div class="stat"><b>${aguard}</b><span>Aguardando</span></div><div class="stat"><b>${ag}</b><span>Agendados</span></div><div class="stat"><b>${hoje}</b><span>Concluídos hoje</span></div><div class="stat"><b>${brl(fat)}</b><span>Faturamento hoje</span></div></div><div class="grid grid2"><div class="card"><h2>Atendimento rápido</h2>${formAtendimentoHTML('fila')}</div><div class="card"><h2>Próximos</h2>${listaAtendimentos(state.fila.filter(a=>a.status!=='concluido').slice(0,8))}</div></div>`}
function clientOptionsHTML(){return `<option value="novo">Novo cliente</option>`+state.clientes.map(c=>`<option value="${c.id}">${c.nome} ${c.telefone?'— '+c.telefone:''}</option>`).join('')}
function formAtendimentoHTML(defaultMode='fila'){return `<div class="grid grid2"><div class="field"><label>Usar cliente salvo</label><select class="selCliente"><option value="novo">Novo cliente</option>${state.clientes.map(c=>`<option value="${c.id}">${c.nome} ${c.telefone?'— '+c.telefone:''}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select class="tipoAt"><option value="fila" ${defaultMode==='fila'?'selected':''}>Ordem de chegada</option><option value="agendamento" ${defaultMode==='agendamento'?'selected':''}>Agendamento normal</option><option value="premium" ${defaultMode==='premium'?'selected':''}>Agenda premium</option></select></div></div><div class="grid grid2"><div class="field"><label>Nome</label><input class="nomeAt" placeholder="Nome do cliente"></div><div class="field"><label>Telefone</label><input class="telAt" placeholder="WhatsApp"></div></div><div class="grid grid3"><div class="field"><label>Data</label><input type="date" class="dataAt" value="${today()}"></div><div class="field"><label>Hora</label><input type="time" class="horaAt" value="${nowHH()}"></div><div class="field"><label>Voucher</label><input class="voucherAt" placeholder="Código opcional"></div></div><div class="grid grid3"><div class="field"><label>Serviço</label><select class="servAt">${servicosAtivos().map(s=>`<option value="${s.id}">${publicServiceLabel(s, publicMode)}</option>`).join('')}</select></div><div class="field"><label>Profissional</label><select class="profAt"><option value="">Qualquer</option>${profissionaisDisponiveis().map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Tempo min.</label><input type="number" class="tempoAt" value="20" min="5"></div></div><button class="btn primary" onclick="addAtendimentoFromForm(this)"><i class="ti ti-plus"></i>Adicionar</button><div class="muted" style="margin-top:8px;font-size:12px">Agendamento em horário premium usa valor premium automaticamente.</div>`}
function addAtendimentoFromForm(btn){const card=btn.closest('.card')||btn.parentElement; const tipo=card.querySelector('.tipoAt').value; const data=card.querySelector('.dataAt').value||today(); const hora=card.querySelector('.horaAt').value||nowHH(); const clienteId=card.querySelector('.selCliente').value; let nome=card.querySelector('.nomeAt').value.trim(), tel=card.querySelector('.telAt').value.trim(); if(clienteId!=='novo'){const c=state.clientes.find(x=>String(x.id)===clienteId); if(c){nome=c.nome;tel=c.telefone}} if(!nome)return toast('Informe o cliente','err'); let c=state.clientes.find(x=>x.telefone&&tel&&x.telefone===tel) || state.clientes.find(x=>x.nome.toLowerCase()===nome.toLowerCase()); if(!c){c={id:uid(),nome,telefone:tel};state.clientes.push(c)} else {c.nome=nome;c.telefone=tel||c.telefone} const s=state.servicos.find(x=>String(x.id)===card.querySelector('.servAt').value); if(!s)return toast('Cadastre um serviço','err'); const profId=card.querySelector('.profAt').value; const prof=state.profissionais.find(p=>String(p.id)===profId); const tp=tipoPreco(tipo,hora); let valor=servicePrice(s,tp); const vcode=card.querySelector('.voucherAt').value.trim().toUpperCase(); const voucher=validVoucher(vcode); if(voucher){valor=valor*(1-num(voucher.percentual)/100); voucher.usado=true; voucher.usadoEm=new Date().toISOString(); voucher.cliente=nome;} const item={id:uid(),clienteId:c.id,nome,tel,tipo:tipo==='fila'?'fila':tp,data,hora,servId:s.id,servNome:s.nome,profId:prof?.id||'',profNome:prof?.nome||'Qualquer',tempoMin:num(card.querySelector('.tempoAt').value)||serviceDur(s,tp)||20,valorOriginal:servicePrice(s,tp),valorFinal:Math.max(0,valor),voucher:voucher?.codigo||'',status:'aguardando',createdAt:Date.now(),origem:isAdmin()?'admin':'prof'}; if(!isAdmin() && session.role==='prof'){item.profId=session.profId; item.profNome=currentProf()?.nome||''; item.pendenteAdmin=true; state.pendencias.push(item); toast('Atendimento enviado para aprovação do admin','ok')} else state.fila.push(item); markDirty(); toast('Atendimento salvo','ok')}
function validVoucher(code){if(!code)return null;return state.vouchers.find(v=>v.codigo===code&&!v.usado&&new Date(v.validade||'2999-01-01')>=new Date(today()))}
function filaHTML(){return `<div class="grid grid2"><div class="card"><h2>Adicionar na fila</h2>${formAtendimentoHTML('fila')}</div><div class="card"><h2>Fila de espera</h2><p class="muted">Estimativa atual: ${estimateWait()} min</p>${listaAtendimentos(visibleAtendimentos().filter(a=>a.tipo==='fila'&&a.status!=='concluido'))}</div></div>`}
function agendaHTML(){return `<div class="grid grid2"><div class="card"><h2>Novo agendamento</h2>${formAtendimentoHTML('agendamento')}</div><div class="card"><h2>Agendamentos</h2>${listaAtendimentos(visibleAtendimentos().filter(a=>a.tipo!=='fila'&&a.status!=='concluido').sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)))}</div></div>`}
function listaAtendimentos(list){if(!list.length)return `<div class="muted">Nenhum atendimento.</div>`; return list.map(a=>`<div class="item"><div class="item-head"><div><b>${a.nome}</b><div class="muted">${a.servNome} • ${a.profNome||'Qualquer'} • ${a.data} ${a.hora}</div><div class="row" style="margin-top:7px"><span class="badge ${a.tipo==='premium'?'b-premium':a.status==='em_atendimento'?'b-in':'b-wait'}">${a.tipo==='fila'?'Fila':a.tipo==='premium'?'Premium':'Agenda'}</span><span class="badge b-wait">${a.tempoMin||20} min</span>${a.voucher?`<span class="badge b-done">Voucher ${a.voucher}</span>`:''}</div></div><div><b>${brl(a.valorFinal)}</b></div></div><div class="row" style="margin-top:10px">${a.status==='aguardando'?`<button class="btn blue small" onclick="startAt('${a.id}')">Iniciar</button>`:''}<button class="btn good small" onclick="doneAt('${a.id}')">Concluir</button><button class="btn secondary small" onclick="editTempo('${a.id}')">Tempo</button><button class="btn secondary small" onclick="editAt('${a.id}')">Editar</button><button class="btn bad small" onclick="removeAt('${a.id}')">Remover</button>${a.tel?`<button class="btn good small" onclick="openWhats('${a.tel}','Olá ${a.nome}, tudo certo?')"><i class="ti ti-brand-whatsapp"></i></button>`:''}</div></div>`).join('')}
function findAt(id){return state.fila.find(a=>String(a.id)===String(id))} function startAt(id){const a=findAt(id);if(!a||!atendimentoProfOk(a))return; a.status='em_atendimento';markDirty()} function doneAt(id){const a=findAt(id);if(!a||!atendimentoProfOk(a))return; a.status='concluido';a.fim=nowHH();state.historico.push(clone(a));state.fila=state.fila.filter(x=>String(x.id)!==String(id)); const p=state.profissionais.find(p=>String(p.id)===String(a.profId)); if(p){p.atendimentos=num(p.atendimentos)+1;p.faturado=num(p.faturado)+num(a.valorFinal)} markDirty();toast('Concluído','ok')} function editTempo(id){const a=findAt(id);if(!a||(!atendimentoProfOk(a)&&!canAdmin()))return;const t=prompt('Tempo de atendimento em minutos:',a.tempoMin||20);if(t!==null){a.tempoMin=Math.max(5,num(t)||20);markDirty()}} function editAt(id){const a=findAt(id);if(!a||!canAdmin())return;const v=prompt('Valor final:',a.valorFinal);if(v!==null)a.valorFinal=num(v);const h=prompt('Horário:',a.hora);if(h!==null)a.hora=h;markDirty()} function removeAt(id){if(!canAdmin())return;if(confirm('Remover atendimento?')){state.fila=state.fila.filter(a=>String(a.id)!==String(id));markDirty()}}
function clientesHTML(){return `<div class="card"><h2>Clientes salvos</h2><div class="grid grid3"><div class="field"><label>Nome</label><input id="clNome"></div><div class="field"><label>Telefone</label><input id="clTel"></div><div class="field"><label>&nbsp;</label><button class="btn primary" onclick="addCliente()">Salvar cliente</button></div></div><table class="table"><tr><th>Nome</th><th>Telefone</th><th>Ações</th></tr>${state.clientes.map(c=>`<tr><td>${c.nome}</td><td>${c.telefone||''}</td><td><button class="btn secondary small" onclick="editCliente('${c.id}')">Editar</button></td></tr>`).join('')}</table></div>`}
function addCliente(){const nome=clNome.value.trim(),tel=clTel.value.trim(); if(!nome)return; state.clientes.push({id:uid(),nome,telefone:tel}); markDirty()} function editCliente(id){const c=state.clientes.find(c=>String(c.id)===String(id));if(!c)return;const n=prompt('Nome:',c.nome);if(n===null)return;const t=prompt('Telefone:',c.telefone||'');if(t===null)return;c.nome=n;c.telefone=t;markDirty()}
function servicosHTML(){return `<div class="card"><h2>Serviços e valores</h2><div class="grid grid4"><div class="field"><label>Serviço</label><input id="svNome"></div><div class="field"><label>Ordem R$</label><input id="svFila" type="number" value="35"></div><div class="field"><label>Agenda R$</label><input id="svAgenda" type="number" value="40"></div><div class="field"><label>Premium R$</label><input id="svPremium" type="number" value="50"></div><div class="field"><label>Duração fila</label><input id="durFila" type="number" value="20"></div><div class="field"><label>Duração agenda</label><input id="durAgenda" type="number" value="30"></div><div class="field"><label>Duração premium</label><input id="durPremium" type="number" value="40"></div><div class="field"><label>&nbsp;</label><button class="btn primary" onclick="addServico()">Adicionar serviço</button></div></div><table class="table"><tr><th>Serviço</th><th>Fila</th><th>Agenda</th><th>Premium</th><th>Durações</th><th>Ações</th></tr>${state.servicos.map(s=>`<tr><td>${s.nome} ${s.ativo?'':'<span class="badge b-off">Off</span>'}</td><td>${brl(s.precoFila)}</td><td>${brl(s.precoAgenda)}</td><td>${brl(s.precoPremium)}</td><td>${s.durFila}/${s.durAgenda}/${s.durPremium} min</td><td><button class="btn secondary small" onclick="editServico('${s.id}')">Editar</button> <button class="btn ${s.ativo?'bad':'good'} small" onclick="toggleServico('${s.id}')">${s.ativo?'Desativar':'Ativar'}</button></td></tr>`).join('')}</table></div>${pendenciasHTML()}`}
function addServico(){const s={id:uid(),nome:svNome.value.trim(),precoFila:num(svFila.value),precoAgenda:num(svAgenda.value),precoPremium:num(svPremium.value),durFila:num(durFila.value),durAgenda:num(durAgenda.value),durPremium:num(durPremium.value),ativo:true}; if(!s.nome)return toast('Nome do serviço','err'); if(!isAdmin()&&session.role==='prof'){state.pendencias.push({tipo:'servico',profId:session.profId,servico:s});toast('Serviço enviado para aprovação','ok')}else state.servicos.push(s); markDirty()} function editServico(id){if(!canAdmin())return;const s=state.servicos.find(s=>String(s.id)===String(id));if(!s)return;['nome','precoFila','precoAgenda','precoPremium','durFila','durAgenda','durPremium'].forEach(k=>{const v=prompt(k,s[k]); if(v!==null)s[k]=k==='nome'?v:num(v)});markDirty()} function toggleServico(id){if(!canAdmin())return;const s=state.servicos.find(s=>String(s.id)===String(id));if(s){s.ativo=!s.ativo;markDirty()}}
function pendenciasHTML(){if(!isAdmin()||!state.pendencias.length)return '';return `<div class="card" style="margin-top:14px"><h2>Aprovações pendentes</h2>${state.pendencias.map((p,i)=>`<div class="item"><b>${p.tipo==='servico'?'Novo serviço':'Atendimento'}</b><div class="muted">${p.servico?.nome||p.nome||''}</div><div class="row" style="margin-top:8px"><button class="btn good small" onclick="approvePend(${i})">Aprovar</button><button class="btn bad small" onclick="rejectPend(${i})">Recusar</button></div></div>`).join('')}</div>`} function approvePend(i){const p=state.pendencias[i]; if(p.tipo==='servico')state.servicos.push(p.servico); else {p.pendenteAdmin=false; state.fila.push(p)} state.pendencias.splice(i,1); markDirty()} function rejectPend(i){state.pendencias.splice(i,1);markDirty()}
function profissionaisHTML(){return `<div class="card"><h2>Profissionais</h2><div class="grid grid4"><div class="field"><label>Nome</label><input id="pfNome"></div><div class="field"><label>Telefone</label><input id="pfTel"></div><div class="field"><label>Comissão %</label><input id="pfCom" type="number" value="60"></div><div class="field"><label>Senha 4 dígitos</label><input id="pfSenha" maxlength="4" value="1234"></div><div class="field"><label>Foto</label><input id="pfFoto" type="file" accept="image/*"></div><div class="field"><label>&nbsp;</label><button class="btn primary" onclick="addProfissional()">Adicionar</button></div></div><div class="grid grid3">${state.profissionais.map(p=>profCard(p)).join('')}</div></div><div class="card" style="margin-top:14px"><h2>Bloquear colaborador por dia</h2><div class="grid grid4"><div class="field"><label>Profissional</label><select id="bloqProf">${state.profissionais.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="bloqData" type="date" value="${today()}"></div><div class="field"><label>De</label><input id="bloqIni" type="time" value="08:00"></div><div class="field"><label>Até</label><input id="bloqFim" type="time" value="23:00"></div></div><button class="btn primary" onclick="addBloqueio()">Bloquear</button><table class="table"><tr><th>Profissional</th><th>Data</th><th>Horário</th><th></th></tr>${state.bloqueios.map((b,i)=>`<tr><td>${state.profissionais.find(p=>String(p.id)===String(b.profId))?.nome||''}</td><td>${b.data}</td><td>${b.ini||'dia todo'} - ${b.fim||''}</td><td><button class="btn bad small" onclick="state.bloqueios.splice(${i},1);markDirty()">Remover</button></td></tr>`).join('')}</table></div>`}
function profCard(p){return `<div class="item"><div class="row"><div class="avatar">${p.foto?`<img src="${p.foto}">`:p.nome.slice(0,2).toUpperCase()}</div><div><b>${p.nome}</b><div class="muted">${p.telefone||'sem telefone'}</div><span class="badge ${p.ativo?'b-done':'b-off'}">${p.ativo?'Ativo':'Desativado'}</span></div></div><div class="row" style="margin-top:10px"><button class="btn secondary small" onclick="editProfissional('${p.id}')">Editar</button><button class="btn ${p.ativo?'bad':'good'} small" onclick="toggleProf('${p.id}')">${p.ativo?'Desativar':'Ativar'}</button>${p.telefone?`<button class="btn good small" onclick="openWhats('${p.telefone}','Olá ${p.nome}')"><i class="ti ti-brand-whatsapp"></i></button>`:''}</div></div>`}
async function fileData(file){return new Promise(res=>{if(!file)return res('');const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})} async function addProfissional(){if(!isAdmin())return toast('Só admin','err');const nome=pfNome.value.trim(); if(!nome)return; const foto=await fileData(pfFoto.files[0]); state.profissionais.push({id:uid(),nome,esp:'Barbeiro',telefone:pfTel.value.trim(),comissao:num(pfCom.value),senha:pfSenha.value||'1234',foto,ativo:true,atendimentos:0,faturado:0}); markDirty()} function editProfissional(id){if(!canAdmin())return;const p=state.profissionais.find(p=>String(p.id)===String(id));if(!p)return;['nome','telefone','comissao','senha'].forEach(k=>{const v=prompt(k,p[k]||''); if(v!==null)p[k]=k==='comissao'?num(v):v}); markDirty()} function toggleProf(id){if(!canAdmin())return;const p=state.profissionais.find(p=>String(p.id)===String(id));if(p){p.ativo=!p.ativo;markDirty()}} function addBloqueio(){state.bloqueios.push({profId:bloqProf.value,data:bloqData.value,ini:bloqIni.value,fim:bloqFim.value});markDirty()}
function vouchersHTML(){return `<div class="card"><h2>Vouchers de cortesia</h2><div class="grid grid4"><div class="field"><label>Desconto %</label><input id="vcPct" type="number" value="10"></div><div class="field"><label>Quantidade</label><input id="vcQtd" type="number" value="5"></div><div class="field"><label>Validade</label><input id="vcVal" type="date" value="${today()}"></div><div class="field"><label>&nbsp;</label><button class="btn primary" onclick="gerarVouchers()">Gerar</button></div></div><table class="table"><tr><th>Código</th><th>%</th><th>Status</th><th>Ação</th></tr>${state.vouchers.slice().reverse().map(v=>`<tr><td><b>${v.codigo}</b></td><td>${v.percentual}%</td><td>${v.usado?'Usado':'Livre'}</td><td><button class="btn good small" onclick="shareVoucher('${v.codigo}')"><i class="ti ti-brand-whatsapp"></i> Enviar</button></td></tr>`).join('')}</table></div>`}
function gerarVouchers(){const qtd=num(vcQtd.value)||1,pct=num(vcPct.value)||10,val=vcVal.value||today();for(let i=0;i<qtd;i++){state.vouchers.push({id:uid(),codigo:'VIZ'+Math.random().toString(36).slice(2,7).toUpperCase(),percentual:pct,validade:val,usado:false})}markDirty();toast('Vouchers gerados','ok')} function shareVoucher(codigo){const v=state.vouchers.find(v=>v.codigo===codigo);openWhats('',`Você ganhou uma cortesia da Vizzarty: use o voucher ${codigo} e ganhe ${v.percentual}% de desconto. Agende pelo link: ${clientLink()}`)}
function extratoHTML(){let hist=isAdmin()?state.historico:state.historico.filter(a=>String(a.profId)===String(session.profId));let total=hist.reduce((s,a)=>s+num(a.valorFinal),0);let com=hist.reduce((s,a)=>{const p=state.profissionais.find(p=>String(p.id)===String(a.profId));return s+num(a.valorFinal)*num(p?.comissao||0)/100},0);return `<div class="stats"><div class="stat"><b>${hist.length}</b><span>Atendimentos</span></div><div class="stat"><b>${brl(total)}</b><span>Total</span></div><div class="stat"><b>${brl(com)}</b><span>Comissão</span></div><div class="stat"><b>${brl(total-com)}</b><span>Barbearia</span></div></div><div class="card"><h2>Histórico</h2><table class="table"><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Valor</th></tr>${hist.slice().reverse().map(a=>`<tr><td>${a.data} ${a.hora}</td><td>${a.nome}</td><td>${a.servNome}</td><td>${a.profNome}</td><td>${brl(a.valorFinal)}</td></tr>`).join('')}</table></div>`}
function linkHTML(){return `<div class="card"><h2>Link único do cliente</h2><p class="muted">O cliente escolhe fila de espera ou agendamento no mesmo link.</p><input value="${clientLink()}" readonly onclick="this.select()"><div class="row" style="margin-top:10px"><button class="btn primary" onclick="navigator.clipboard.writeText('${clientLink()}');toast('Link copiado','ok')">Copiar link</button><button class="btn good" onclick="openWhats('', 'Agende ou entre na fila da Vizzarty: ${clientLink()}')"><i class="ti ti-brand-whatsapp"></i> Enviar</button></div></div>`}
function configHTML(){const h=state.horarios,c=state.config;return `<div class="grid grid2"><div class="card"><h2>Dados</h2><div class="field"><label>Nome</label><input id="cfgNome" value="${c.nome}"></div><div class="field"><label>Telefone</label><input id="cfgTel" value="${c.telefone||''}"></div><div class="field"><label>Senha admin</label><input id="cfgSenha" value="${c.adminSenha}"></div><div class="field"><label>Logo</label><input id="cfgLogo" type="file" accept="image/*"></div><button class="btn primary" onclick="saveConfig()">Salvar</button></div><div class="card"><h2>Horários disponíveis</h2><div class="grid grid2"><div class="field"><label>Fila início</label><input id="hf1" type="time" value="${h.filaIni}"></div><div class="field"><label>Fila fim</label><input id="hf2" type="time" value="${h.filaFim}"></div><div class="field"><label>Agenda início</label><input id="ha1" type="time" value="${h.agendaIni}"></div><div class="field"><label>Agenda fim</label><input id="ha2" type="time" value="${h.agendaFim}"></div><div class="field"><label>Premium almoço início</label><input id="hp1" type="time" value="${h.premAlmocoIni}"></div><div class="field"><label>Premium almoço fim</label><input id="hp2" type="time" value="${h.premAlmocoFim}"></div><div class="field"><label>Premium noite início</label><input id="hp3" type="time" value="${h.premNoiteIni}"></div><div class="field"><label>Premium noite fim</label><input id="hp4" type="time" value="${h.premNoiteFim}"></div></div><button class="btn primary" onclick="saveHorarios()">Salvar horários</button></div></div>`}
async function saveConfig(){state.config.nome=cfgNome.value;state.config.telefone=cfgTel.value;state.config.adminSenha=cfgSenha.value||'1234';const logo=await fileData(cfgLogo.files[0]);if(logo)state.config.logo=logo;markDirty();toast('Config salvo','ok')} function saveHorarios(){Object.assign(state.horarios,{filaIni:hf1.value,filaFim:hf2.value,agendaIni:ha1.value,agendaFim:ha2.value,premAlmocoIni:hp1.value,premAlmocoFim:hp2.value,premNoiteIni:hp3.value,premNoiteFim:hp4.value});markDirty()}
function bindAfterRender(){if(state.config.logo)logoBox.innerHTML=`<img src="${state.config.logo}">`; document.querySelectorAll('.selCliente').forEach(sel=>sel.onchange=e=>{const box=sel.closest('.card')||sel.parentElement.parentElement; const c=state.clientes.find(c=>String(c.id)===sel.value); if(c){box.querySelector('.nomeAt').value=c.nome;box.querySelector('.telAt').value=c.telefone||''}}); document.querySelectorAll('.tipoAt,.horaAt,.servAt').forEach(el=>el.onchange=e=>{const box=el.closest('.card'); const s=state.servicos.find(s=>String(s.id)===box.querySelector('.servAt')?.value); const tipo=tipoPreco(box.querySelector('.tipoAt').value,box.querySelector('.horaAt').value); const tempo=box.querySelector('.tempoAt'); if(s&&tempo)tempo.value=serviceDur(s,tipo)||20;});}
function openWhats(t,msg){let phone=(t||'').replace(/\D/g,'');let url='https://wa.me/'+(phone||'')+'?text='+encodeURIComponent(msg||'');window.open(url,'_blank')} function openWhatsAppBarber(){openWhats(state.config.telefone,'Olá, vim pelo sistema Vizzarty.')} function clientLink(){return location.origin+location.pathname.replace(/index\.html$/,'')+'?cliente=1'}
function publicHTML(){return `<div class="public-logo">${state.config.logo?`<img src="${state.config.logo}">`:'<b style="color:#222;font-size:36px">V</b>'}</div><h1>${state.config.nome}</h1><p>Escolha como quer ser atendido</p><div class="card"><div class="grid grid2"><button class="btn primary" onclick="publicMode='fila';renderPublic()">Fila de espera</button><button class="btn secondary" onclick="publicMode='agendamento';renderPublic()">Agendamento</button></div></div><div id="publicForm"></div>`}
let publicMode='fila'; function renderPublic(){document.body.classList.add('client-mode'); publicWrap.innerHTML=publicHTML(); const div=document.getElementById('publicForm'); const premium=publicMode==='agendamento'; div.innerHTML=`<div class="card" style="margin-top:12px"><h2>${publicMode==='fila'?'Entrar na fila':'Agendar horário'}</h2><p class="muted">${publicMode==='fila'?'Espera estimada: '+estimateWait()+' min':'Horários premium têm valor diferenciado.'}</p><div class="field"><label>Nome</label><input id="pubNome"></div><div class="field"><label>WhatsApp</label><input id="pubTel"></div><div class="grid grid2"><div class="field"><label>Data</label><input id="pubData" type="date" value="${today()}"></div><div class="field"><label>Hora</label><input id="pubHora" type="time" value="${nowHH()}" onchange="updatePublicPrice()"></div></div><div class="field"><label>Serviço</label><select id="pubServ" onchange="updatePublicPrice()">${servicosAtivos().map(s=>`<option value="${s.id}">${publicServiceLabel(s, publicMode)}</option>`).join('')}</select><div id="pubPriceBox" class="muted" style="margin-top:6px;font-size:13px"></div></div><div class="field"><label>Profissional</label><select id="pubProf"><option value="">Qualquer</option>${profissionaisDisponiveis().map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div><div class="field"><label>Voucher</label><input id="pubVoucher" placeholder="Código de desconto"></div><button class="btn primary" onclick="publicAdd()">Confirmar</button></div>`; setTimeout(updatePublicPrice,50)} 
function updatePublicPrice(){
  const sel=document.getElementById('pubServ');
  const box=document.getElementById('pubPriceBox');
  const hora=document.getElementById('pubHora')?.value||nowHH();
  const s=state.servicos.find(x=>String(x.id)===String(sel?.value));
  if(!box||!s)return;
  if(publicMode==='fila'){
    box.innerHTML=`Valor ordem de chegada: <b>${brl(s.precoFila||0)}</b>`;
  }else{
    const premium=isPremiumTime(hora);
    box.innerHTML=`Agendamento normal: <b>${brl(s.precoAgenda||0)}</b> • Premium: <b>${brl(s.precoPremium||0)}</b>${premium?' <span class="badge b-premium">horário premium</span>':''}`;
  }
}
 function publicAdd(){const wrap=document.getElementById('publicForm'); const box=wrap.querySelector('.card'); box.classList.add('card'); // reuse logic manually
const tipo=publicMode==='fila'?'fila':'agendamento', data=pubData.value||today(), hora=pubHora.value||nowHH(); if(tipo==='fila'&&!inRange(nowHH(),state.horarios.filaIni,state.horarios.filaFim))return toast('Fila fora do horário disponível','err'); if(tipo==='agendamento'&&!inRange(hora,state.horarios.agendaIni,state.horarios.agendaFim)&&!isPremiumTime(hora))return toast('Horário indisponível','err'); const nome=pubNome.value.trim(),tel=pubTel.value.trim(); if(!nome)return toast('Informe seu nome','err'); let c=state.clientes.find(c=>tel&&c.telefone===tel)||{id:uid(),nome,telefone:tel}; if(!state.clientes.some(x=>x.id===c.id))state.clientes.push(c); const s=state.servicos.find(s=>String(s.id)===pubServ.value); const p=state.profissionais.find(p=>String(p.id)===pubProf.value); const tp=tipoPreco(tipo,hora); let valor=servicePrice(s,tp); const v=validVoucher(pubVoucher.value.trim().toUpperCase()); if(v){valor*=1-num(v.percentual)/100;v.usado=true;v.usadoEm=new Date().toISOString();v.cliente=nome} state.fila.push({id:uid(),clienteId:c.id,nome,tel,tipo:tipo==='fila'?'fila':tp,data,hora,servId:s.id,servNome:s.nome,profId:p?.id||'',profNome:p?.nome||'Qualquer',tempoMin:serviceDur(s,tp)||20,valorOriginal:servicePrice(s,tp),valorFinal:Math.max(0,valor),voucher:v?.codigo||'',status:'aguardando',origem:'cliente',createdAt:Date.now()}); markDirty(); publicWrap.innerHTML=`<div class="card" style="margin-top:60px;text-align:center"><h1>Confirmado ✅</h1><p>${tipo==='fila'?'Você entrou na fila. Espera estimada: '+estimateWait()+' min':'Seu agendamento foi enviado.'}</p><b>${brl(valor)}</b></div>`}
if(new URLSearchParams(location.search).get('cliente')){loadCloud(true).then(()=>renderPublic());}else renderAll();
</script>
